<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="No Second Shot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080611">
<title>NO SECOND SHOT — PLAYZONE 005</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#080611;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  body { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }
  #volver {
    position:absolute; z-index:2;
    top:calc(12px + env(safe-area-inset-top)); left:calc(12px + env(safe-area-inset-left));
    padding:9px 15px 9px 12px; border-radius:999px;
    border:1px solid rgba(255,255,255,.16); background:rgba(12,9,26,.62);
    color:#d4cfe6; text-decoration:none;
    font:700 11.5px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing:.14em;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="volver" href="../../index.html">‹ &nbsp;PLAYZONE</a>
<script>
"use strict";

// ════════════════════════════════════════════════════════════
//  NO SECOND SHOT — PLAYZONE 005
//  Tienes UNA bala. Limpia la sala con ella.
//
//  AJUSTES — cambia los números, guarda y recarga.
// ════════════════════════════════════════════════════════════
const CONFIG = {
  velocidadBala:   1560,  // px/s
  rebotesMaximos:  14,    // pasados, la bala se apaga
  radioBala:       7,
  radioObjetivo:   21,
  radioTirador:    16,
  largoMira:       190,   // cuánto se ve de la mira (no enseña los rebotes)
  sonido:          true,
};

const COLOR = {
  fondo:      "#080611",
  sala:       "#12102a",
  muro:       "#3b3766",
  muroLuz:    "#6f66c4",
  cristal:    "#57d6ff",
  absorbente: "#ff2e6a",
  tirador:    "#c77dff",
  bala:       "#fff3b0",
  estela:     "#ffd166",
  objetivo:   "#ff4d6d",
  objetivoLuz:"#ff9db1",
  texto:      "#ffffff",
  ok:         "#00ff9d",
};

// ════════════════════════════════════════════════════════════
//  LAS SALAS
//  La sala mide 1000×700 y siempre tiene sus cuatro paredes.
//    t = tirador [x,y]
//    o = objetivos [[x,y], …]
//    m = muros que rebotan [x,y,ancho,alto]
//    c = cristales: se rompen y NO rebotan
//    a = absorbentes: se comen la bala, fin de la tirada
//    par = rebotes de referencia. Igualarlo o bajarlo es DISPARO PERFECTO.
// ════════════════════════════════════════════════════════════
const SALAS = [
  { t:[500,620], o:[[500,140]], m:[], par:0 },
  { t:[500,620], o:[[220,140],[780,140]], m:[[470,300,60,200]], par:4 },
  { t:[500,620], o:[[500,120],[160,380]], m:[[300,240,400,40]], par:2 },
  { t:[160,620], o:[[840,140],[840,560]], m:[[420,120,40,300]], par:4 },
  { t:[500,640], o:[[140,120],[860,120],[500,300]], m:[[240,420,520,40]], par:3 },
  { t:[500,620], o:[[500,110]], m:[[380,260,240,40],[120,420,180,40],[700,420,180,40]], par:2 },
  { t:[140,360], o:[[860,360]], m:[[480,60,40,240],[480,420,40,240]], par:0 },
  { t:[500,630], o:[[180,180],[820,180]], m:[[300,300,400,60]], c:[[470,120,60,120]], par:2 },
  { t:[500,630], o:[[500,120],[200,120],[800,120]], m:[[330,260,60,220],[610,260,60,220]], par:3 },
  { t:[120,620], o:[[880,120],[120,120],[880,620]], m:[[400,260,200,200]], par:7 },
  { t:[500,620], o:[[500,140],[140,400],[860,400]], m:[[300,300,400,50]], a:[[470,470,60,60]], par:5 },
  { t:[500,650], o:[[160,120],[840,120],[160,560],[840,560]], m:[[440,240,120,240]], par:8 },
  { t:[500,620], o:[[500,110],[280,240],[720,240]], m:[[120,340,300,40],[580,340,300,40]], par:3 },
  { t:[180,180], o:[[820,180],[820,620],[180,620]], m:[[420,300,180,120]], a:[[480,120,60,60]], par:5 },
  { t:[500,640], o:[[500,120],[120,340],[880,340]], c:[[300,280,60,160],[640,280,60,160]], m:[], par:2 },
  { t:[500,620], o:[[140,140],[860,140],[500,380]], m:[[280,240,80,240],[640,240,80,240],[400,120,200,40]], par:7 },
  { t:[120,360], o:[[880,140],[880,580],[480,360]], m:[[300,240,60,240]], a:[[700,320,80,80]], par:4 },
  { t:[500,650], o:[[160,140],[840,140],[160,430],[840,430]], m:[[430,300,140,140]], par:6 },
  { t:[500,630], o:[[140,140],[860,140],[140,470],[860,470]], m:[[300,280,120,120],[580,280,120,120]], par:7 },
  { t:[500,600], o:[[130,130],[870,130],[130,430],[870,430]], m:[[460,250,80,80]], par:6 },
];

const SALA_ANCHO = 1000, SALA_ALTO = 700, GROSOR = 26;

// ════════════════════════════════════════════════════════════
//  A partir de aquí es la maquinaria.
// ════════════════════════════════════════════════════════════

const c = document.getElementById("c");
const ctx = c.getContext("2d");
const botonVolver = document.getElementById("volver");
const F = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
let W = 0, H = 0, esc = 1, offX = 0, offY = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  c.style.width = W + "px"; c.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  esc = Math.min(W / SALA_ANCHO, (H - 190) / SALA_ALTO);
  offX = (W - SALA_ANCHO * esc) / 2;
  offY = margenArriba() + 96 + ((H - margenArriba() - 96 - 60) - SALA_ALTO * esc) / 2;
}
const medidor = document.createElement("div");
medidor.style.cssText = "position:absolute;top:0;left:0;width:0;height:0;"
                      + "padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none";
document.body.appendChild(medidor);
function margenArriba() { return parseFloat(getComputedStyle(medidor).paddingTop) || 0; }
window.addEventListener("resize", resize);
resize();

const aPantallaX = x => offX + x * esc;
const aPantallaY = y => offY + y * esc;
const aSalaX = x => (x - offX) / esc;
const aSalaY = y => (y - offY) / esc;

// ── Sonido ────────────────────────────────────────────────
let audio = null;
function despertarAudio() {
  if (!CONFIG.sonido || audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) audio = new AC();
}
function pitido(f1, f2, dur, tipo, vol) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f1, audio.currentTime);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, audio.currentTime + dur);
  g.gain.setValueAtTime(vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
  o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
}
const sonDisparo = () => pitido(320, 120, 0.1, "square", 0.07);
const sonRebote  = (n) => pitido(440 + n * 55, 620 + n * 55, 0.05, "square", 0.045);
const sonBaja    = (n) => pitido(700 + n * 120, 1200 + n * 120, 0.12, "triangle", 0.09);
const sonGana    = () => { pitido(660, 990, 0.16, "triangle", 0.1); setTimeout(() => pitido(990, 1480, 0.2, "triangle", 0.1), 120); };
const sonFalla   = () => pitido(200, 70, 0.35, "sawtooth", 0.12);

// ── Guardado ──────────────────────────────────────────────
const CLAVE = "pz_nss_";
function leer(k, d) { try { const v = localStorage.getItem(CLAVE+k); return v===null?d:JSON.parse(v); } catch(_) { return d; } }
function guardar(k, v) { try { localStorage.setItem(CLAVE+k, JSON.stringify(v)); } catch(_) {} }

let salaMax   = leer("sala", 0);        // hasta dónde ha llegado
let perfectos = leer("perfectos", []);  // índices con DISPARO PERFECTO
let recordSinFallo = leer("racha", 0);

// ── Estado ────────────────────────────────────────────────
let estado = "menu";    // menu · apunta · vuela · gana · falla
let salaIdx = 0, sala, objetivos, bala = null, rebotes = 0, racha = 0;
let estela = [], chispas = [];   // usados por actualizar() ya en el primer cuadro
let anguloMira = -Math.PI / 2, apuntando = false, resultadoT = 0, aviso = "", avisoT = 0;

function murosDe(s) {
  // Las cuatro paredes de la sala, más los muros propios.
  const m = [
    { x:-GROSOR, y:-GROSOR, w:SALA_ANCHO+GROSOR*2, h:GROSOR, tipo:"muro" },
    { x:-GROSOR, y:SALA_ALTO, w:SALA_ANCHO+GROSOR*2, h:GROSOR, tipo:"muro" },
    { x:-GROSOR, y:0, w:GROSOR, h:SALA_ALTO, tipo:"muro" },
    { x:SALA_ANCHO, y:0, w:GROSOR, h:SALA_ALTO, tipo:"muro" },
  ];
  (s.m||[]).forEach(r => m.push({ x:r[0], y:r[1], w:r[2], h:r[3], tipo:"muro" }));
  (s.c||[]).forEach(r => m.push({ x:r[0], y:r[1], w:r[2], h:r[3], tipo:"cristal", roto:false }));
  (s.a||[]).forEach(r => m.push({ x:r[0], y:r[1], w:r[2], h:r[3], tipo:"absorbente" }));
  return m;
}

function cargarSala(i) {
  salaIdx = ((i % SALAS.length) + SALAS.length) % SALAS.length;
  sala = SALAS[salaIdx];
  sala.muros = murosDe(sala);
  objetivos = sala.o.map(p => ({ x:p[0], y:p[1], vivo:true }));
  bala = null; estela = []; chispas = []; rebotes = 0;
  anguloMira = Math.atan2(200, 0) - Math.PI / 2;
  estado = "apunta";
  botonVolver.style.display = "";
}

function disparar(ang) {
  bala = { x: sala.t[0], y: sala.t[1], vx: Math.cos(ang) * CONFIG.velocidadBala,
           vy: Math.sin(ang) * CONFIG.velocidadBala, viva:true };
  rebotes = 0; estela = [];
  estado = "vuela";
  botonVolver.style.display = "none";
  sonDisparo();
}

// ── Física de la bala ─────────────────────────────────────
// Paso fijo y pequeño: determinista, y no se cuela por las esquinas.
function pasoBala(b, muros, objs, alRebotar, alMatar) {
  const PASO = 1 / 600;
  const nx = b.x + b.vx * PASO, ny = b.y + b.vy * PASO;
  const r = CONFIG.radioBala;

  // objetivos
  for (const o of objs) {
    if (!o.vivo) continue;
    if (Math.hypot(o.x - nx, o.y - ny) < CONFIG.radioObjetivo + r) {
      o.vivo = false;
      if (alMatar) alMatar(o);
    }
  }

  // muros
  let choqueX = false, choqueY = false, absorbida = false;
  for (const m of muros) {
    if (m.tipo === "cristal" && m.roto) continue;
    const dentroY = ny + r > m.y && ny - r < m.y + m.h;
    const dentroX = nx + r > m.x && nx - r < m.x + m.w;
    if (!(dentroX && dentroY)) continue;

    if (m.tipo === "absorbente") { absorbida = true; break; }
    if (m.tipo === "cristal")    { m.roto = true; continue; }

    // ¿por qué lado ha entrado?
    const yaDentroY = b.y + r > m.y && b.y - r < m.y + m.h;
    const yaDentroX = b.x + r > m.x && b.x - r < m.x + m.w;
    if (yaDentroY && !yaDentroX) choqueX = true;
    else if (yaDentroX && !yaDentroY) choqueY = true;
    else { if (Math.abs(b.vx) > Math.abs(b.vy)) choqueX = true; else choqueY = true; }
  }

  if (absorbida) { b.viva = false; return "absorbida"; }
  if (choqueX || choqueY) {
    if (choqueX) b.vx = -b.vx;
    if (choqueY) b.vy = -b.vy;
    if (alRebotar) alRebotar();
    return "rebote";
  }
  b.x = nx; b.y = ny;
  return "sigue";
}

// Simula una tirada entera sin dibujar nada. La usa el juego para nada,
// pero el test la usa para comprobar que TODAS las salas tienen solución.
function simular(indiceSala, ang) {
  const s = SALAS[indiceSala];
  const muros = murosDe(s);
  const objs = s.o.map(p => ({ x:p[0], y:p[1], vivo:true }));
  const b = { x:s.t[0], y:s.t[1], vx:Math.cos(ang)*CONFIG.velocidadBala,
              vy:Math.sin(ang)*CONFIG.velocidadBala, viva:true };
  let reb = 0;
  for (let i = 0; i < 60000; i++) {
    const r = pasoBala(b, muros, objs);
    if (r === "rebote") { reb++; if (reb > CONFIG.rebotesMaximos) return { gana:false, rebotes:reb }; }
    if (r === "absorbida") return { gana:false, rebotes:reb };
    if (objs.every(o => !o.vivo)) return { gana:true, rebotes:reb };
  }
  return { gana:false, rebotes:reb };
}
window.simular = simular;
window.SALAS = SALAS;

// ── Control ───────────────────────────────────────────────
function anguloHacia(px, py) {
  return Math.atan2(aSalaY(py) - sala.t[1], aSalaX(px) - sala.t[0]);
}
function alPulsar(e) {
  e.preventDefault(); despertarAudio();
  if (estado === "menu") { cargarSala(salaMax); return; }
  if (estado === "gana") { if (resultadoT > 0.35) cargarSala(salaIdx + 1); return; }
  if (estado === "falla") { if (resultadoT > 0.35) cargarSala(salaIdx); return; }
  if (estado === "apunta") { apuntando = true; anguloMira = anguloHacia(e.clientX, e.clientY); }
}
function alMover(e) { if (apuntando && estado === "apunta") anguloMira = anguloHacia(e.clientX, e.clientY); }
function alSoltar(e) {
  if (estado === "apunta" && apuntando) { apuntando = false; disparar(anguloMira); }
}
c.addEventListener("pointerdown", alPulsar, { passive:false });
c.addEventListener("pointermove", alMover,  { passive:false });
c.addEventListener("pointerup", alSoltar);
c.addEventListener("pointercancel", () => { apuntando = false; });

// ── Actualizar ────────────────────────────────────────────
function chispa(x, y, color) {
  const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 220;
  chispas.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:0, vida:0.3+Math.random()*0.4, color });
}

function ganar() {
  estado = "gana"; resultadoT = 0; sonGana();
  racha++;
  if (racha > recordSinFallo) { recordSinFallo = racha; guardar("racha", recordSinFallo); }
  if (rebotes <= sala.par && !perfectos.includes(salaIdx)) {
    perfectos.push(salaIdx); guardar("perfectos", perfectos);
  }
  if (salaIdx + 1 > salaMax) { salaMax = Math.min(SALAS.length - 1, salaIdx + 1); guardar("sala", salaMax); }
  botonVolver.style.display = "";
}
function fallar() {
  estado = "falla"; resultadoT = 0; sonFalla(); racha = 0;
  botonVolver.style.display = "";
}

function actualizar(dt) {
  if (avisoT > 0) avisoT -= dt;
  for (let i = chispas.length - 1; i >= 0; i--) {
    const p = chispas[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;
    if (p.t >= p.vida) chispas.splice(i, 1);
  }
  if (estado === "gana" || estado === "falla") { resultadoT += dt; return; }
  if (estado !== "vuela" || !bala) return;

  const pasos = Math.min(700, Math.round(dt * 600));
  for (let i = 0; i < pasos; i++) {
    const r = pasoBala(bala, sala.muros, objetivos,
      () => { rebotes++; sonRebote(Math.min(8, rebotes)); chispa(bala.x, bala.y, COLOR.muroLuz); },
      (o) => { for (let k = 0; k < 16; k++) chispa(o.x, o.y, COLOR.objetivoLuz);
               sonBaja(objetivos.filter(q => !q.vivo).length);
               aviso = objetivos.filter(q => !q.vivo).length + " / " + objetivos.length; avisoT = 0.7; });

    estela.push({ x:bala.x, y:bala.y });
    if (estela.length > 90) estela.shift();

    if (objetivos.every(o => !o.vivo)) { ganar(); return; }
    if (r === "absorbida") { fallar(); return; }
    if (rebotes > CONFIG.rebotesMaximos) { bala.viva = false; fallar(); return; }
  }
}

// ── Dibujo ────────────────────────────────────────────────
function rect(m) {
  ctx.fillRect(aPantallaX(m.x), aPantallaY(m.y), m.w * esc, m.h * esc);
}
function texto(t, x, y, tam, peso, color, alfa, alin) {
  ctx.globalAlpha = alfa === undefined ? 1 : alfa;
  ctx.fillStyle = color || COLOR.texto;
  ctx.font = peso + " " + tam + "px " + F;
  ctx.textAlign = alin || "center"; ctx.textBaseline = "middle";
  ctx.fillText(t, x, y);
  ctx.globalAlpha = 1;
}

function dibujarSala() {
  ctx.fillStyle = COLOR.sala;
  ctx.fillRect(aPantallaX(0), aPantallaY(0), SALA_ANCHO * esc, SALA_ALTO * esc);

  sala.muros.forEach(m => {
    if (m.tipo === "muro") {
      ctx.fillStyle = COLOR.muro; rect(m);
      ctx.fillStyle = COLOR.muroLuz; ctx.globalAlpha = 0.5;
      ctx.fillRect(aPantallaX(m.x), aPantallaY(m.y), m.w * esc, 3);
      ctx.globalAlpha = 1;
    } else if (m.tipo === "cristal") {
      ctx.globalAlpha = m.roto ? 0.12 : 0.5;
      ctx.fillStyle = COLOR.cristal; rect(m);
      ctx.globalAlpha = 1;
      if (!m.roto) {
        ctx.strokeStyle = COLOR.cristal; ctx.lineWidth = 1.5;
        ctx.strokeRect(aPantallaX(m.x), aPantallaY(m.y), m.w * esc, m.h * esc);
      }
    } else {
      ctx.fillStyle = COLOR.absorbente; ctx.globalAlpha = 0.28; rect(m); ctx.globalAlpha = 1;
      ctx.strokeStyle = COLOR.absorbente; ctx.lineWidth = 2;
      ctx.setLineDash([7, 6]);
      ctx.strokeRect(aPantallaX(m.x), aPantallaY(m.y), m.w * esc, m.h * esc);
      ctx.setLineDash([]);
    }
  });

  objetivos.forEach(o => {
    if (!o.vivo) return;
    const px = aPantallaX(o.x), py = aPantallaY(o.y), r = CONFIG.radioObjetivo * esc;
    ctx.fillStyle = COLOR.objetivo; ctx.shadowColor = COLOR.objetivo; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = COLOR.objetivoLuz; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, r * 0.55, 0, Math.PI*2); ctx.stroke();
  });

  // tirador
  const tx = aPantallaX(sala.t[0]), ty = aPantallaY(sala.t[1]);
  ctx.fillStyle = COLOR.tirador; ctx.shadowColor = COLOR.tirador; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(tx, ty, CONFIG.radioTirador * esc, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // mira: solo un tramo corto. Los rebotes los calculas tú.
  if (estado === "apunta") {
    ctx.strokeStyle = COLOR.bala; ctx.globalAlpha = 0.65; ctx.lineWidth = 2;
    ctx.setLineDash([9, 8]);
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.lineTo(tx + Math.cos(anguloMira) * CONFIG.largoMira * esc,
               ty + Math.sin(anguloMira) * CONFIG.largoMira * esc);
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  // estela y bala
  if (estela.length > 1) {
    ctx.strokeStyle = COLOR.estela; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    estela.forEach((p, i) => {
      const px = aPantallaX(p.x), py = aPantallaY(p.y);
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    });
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (bala && bala.viva && estado === "vuela") {
    ctx.fillStyle = COLOR.bala; ctx.shadowColor = COLOR.bala; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(aPantallaX(bala.x), aPantallaY(bala.y), CONFIG.radioBala * esc, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  chispas.forEach(p => {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.vida);
    ctx.fillStyle = p.color;
    ctx.fillRect(aPantallaX(p.x) - 2, aPantallaY(p.y) - 2, 4, 4);
  });
  ctx.globalAlpha = 1;
}

function hud() {
  const y0 = margenArriba();
  texto("SALA " + (salaIdx + 1) + " / " + SALAS.length, W/2, y0 + 36, Math.min(24, W*0.06), "900");
  const vivos = objetivos.filter(o => o.vivo).length;
  texto(vivos + " objetivo" + (vivos === 1 ? "" : "s"), W/2, y0 + 62, 12.5, "700", "#9aa1cc");
  texto("REBOTES  " + rebotes + "  ·  PAR " + sala.par, W/2, y0 + 82, 11.5, "700",
        rebotes > sala.par ? "#ff8fa3" : COLOR.ok);
  if (racha > 0) texto("RACHA  " + racha, W/2, H - 26, 11.5, "800", COLOR.ok);
  if (avisoT > 0) texto(aviso, W/2, H * 0.5, Math.min(40, W*0.1), "900", COLOR.objetivoLuz, Math.min(1, avisoT*2));
}

function pantallaMenu() {
  ctx.fillStyle = "rgba(8,6,17,.82)"; ctx.fillRect(0, 0, W, H);
  texto("NO SECOND SHOT", W/2, H*0.31, Math.min(40, W*0.1), "900");
  texto("Una bala. Todos los objetivos.", W/2, H*0.31 + 40, 14.5, "600", "#c0b9d6");
  texto("Arrastra para apuntar, suelta para disparar.", W/2, H*0.52, 13.5, "600", "#9aa1cc");
  texto("La mira solo enseña el primer tramo:", W/2, H*0.52 + 22, 13.5, "600", "#9aa1cc");
  texto("los rebotes los calculas tú.", W/2, H*0.52 + 42, 13.5, "600", "#9aa1cc");
  texto("SALAS  " + (salaMax + 1) + "/" + SALAS.length + "   ·   PERFECTOS  " + perfectos.length,
        W/2, H*0.66, 12.5, "700", "#7d84b4");
  if (recordSinFallo > 0) texto("MEJOR RACHA  " + recordSinFallo, W/2, H*0.66 + 20, 12.5, "700", COLOR.ok);
  const pulso = 0.55 + Math.sin(Date.now()/320)*0.25;
  texto("TOCA PARA EMPEZAR", W/2, H*0.79, 15, "800", "#fff", pulso);
}

function pantallaResultado() {
  const gana = estado === "gana";
  ctx.fillStyle = gana ? "rgba(8,6,17,.7)" : "rgba(20,4,12,.72)"; ctx.fillRect(0, 0, W, H);
  const perfecto = gana && rebotes <= sala.par;
  texto(gana ? (perfecto ? "DISPARO PERFECTO" : "SALA LIMPIA") : "FALLASTE",
        W/2, H*0.38, Math.min(34, W*0.085), "900", gana ? (perfecto ? COLOR.ok : "#fff") : "#ff8fa3");
  if (gana) texto(rebotes + " rebote" + (rebotes === 1 ? "" : "s") + "  ·  par " + sala.par,
                  W/2, H*0.38 + 40, 13.5, "700", "#c0b9d6");
  else texto(objetivos.filter(o => o.vivo).length + " objetivos siguen en pie",
             W/2, H*0.38 + 40, 13.5, "700", "#c0b9d6");
  if (resultadoT > 0.35) {
    const pulso = 0.55 + Math.sin(Date.now()/320)*0.25;
    texto(gana ? "SIGUIENTE" : "OTRA", W/2, H*0.62, 16, "800", "#fff", pulso);
  }
}

function dibujar() {
  ctx.fillStyle = COLOR.fondo; ctx.fillRect(0, 0, W, H);
  if (estado === "menu") {
    if (!sala) { sala = SALAS[0]; sala.muros = murosDe(sala); objetivos = sala.o.map(p=>({x:p[0],y:p[1],vivo:true})); estela=[]; chispas=[]; }
    dibujarSala(); pantallaMenu(); return;
  }
  dibujarSala(); hud();
  if (estado === "gana" || estado === "falla") pantallaResultado();
}

// ── Bucle ─────────────────────────────────────────────────
let anterior = performance.now();
function bucle(ahora) {
  const dt = Math.min(0.033, (ahora - anterior) / 1000);
  anterior = ahora;
  actualizar(dt);
  dibujar();
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);
</script>
</body>
</html>
