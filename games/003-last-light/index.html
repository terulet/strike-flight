<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LAST LIGHT</title>
<!-- viewport-fit=cover + user-scalable=no: pantalla completa real en iPhone,
     sin zoom accidental al usar dos pulgares sobre los joysticks. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Disparar te permite ver. Prototipo de mecánica.">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    /* Sin rebote, sin selección, sin menú contextual: esto es un juego. */
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #game {
    display: block;
    width: 100vw; height: 100vh;
    /* touch-action:none es obligatorio o Safari se queda los gestos. */
    touch-action: none;
  }

  /* ── panel de parámetros (F2) ─────────────────────────────────────── */
  #ll-debug-panel {
    position: fixed; top: 0; right: 0; z-index: 10;
    width: min(340px, 92vw); max-height: 100vh;
    display: flex; flex-direction: column;
    background: rgba(8, 12, 18, 0.94);
    border-left: 1px solid rgba(120, 200, 255, 0.18);
    color: #cfe4ff; font-size: 11px;
    padding-top: env(safe-area-inset-top);
  }
  .ll-dbg-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; gap: 8px;
    border-bottom: 1px solid rgba(120, 200, 255, 0.14);
    font-size: 12px; letter-spacing: 0.04em;
  }
  .ll-dbg-head button {
    background: rgba(120, 200, 255, 0.1);
    border: 1px solid rgba(120, 200, 255, 0.22);
    color: #cfe4ff; font: inherit; font-size: 10px;
    padding: 3px 8px; margin-left: 4px; border-radius: 3px; cursor: pointer;
  }
  .ll-dbg-head button:active { background: rgba(120, 200, 255, 0.26); }
  .ll-dbg-body { overflow-y: auto; padding: 6px 12px 22px; -webkit-overflow-scrolling: touch; }
  .ll-dbg-sec {
    margin: 12px 0 6px; padding-bottom: 3px;
    color: #7fe0b0; font-size: 10px; letter-spacing: 0.12em;
    border-bottom: 1px solid rgba(127, 224, 176, 0.16);
  }
  .ll-dbg-row {
    display: grid; grid-template-columns: 104px 1fr 46px;
    align-items: center; gap: 6px; padding: 2px 0;
  }
  .ll-dbg-row span { color: rgba(207, 228, 255, 0.66); overflow: hidden; text-overflow: ellipsis; }
  .ll-dbg-row em { color: #ffc84a; font-style: normal; text-align: right; }
  .ll-dbg-row input[type=range] { width: 100%; accent-color: #7fe0b0; height: 18px; }
</style>
</head>
<body>
<!-- Vuelta al catálogo. Añadido al integrar el juego en PLAYZONE: no toca
     nada de la lógica del juego, solo pone la puerta de salida. -->
<style>
  #pzVolver {
    position:fixed; z-index:99999;
    top:calc(12px + env(safe-area-inset-top)); left:calc(12px + env(safe-area-inset-left));
    padding:9px 15px 9px 12px; border-radius:999px;
    border:1px solid rgba(255,255,255,.18); background:rgba(8,8,16,.66);
    color:#d4cfe6; text-decoration:none; backdrop-filter:blur(6px);
    font:700 11.5px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing:.14em;
  }
  #pzVolver:active { transform:scale(.96); }
</style>
<a id="pzVolver" href="../../index.html">‹ &nbsp;PLAYZONE</a>

  <canvas id="game"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
