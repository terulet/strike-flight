//  FORMACIONES — posiciones de spawn para oleadas diseñadas

const FORMACIONES = {
  linea(n) {
    const sep = W / (n + 1);
    return Array.from({length: n}, (_, i) => ({ x: sep * (i + 1), y: -52, d: i * 0.14 }));
  },
  V(n) {
    const cx = W / 2, sep = Math.min(50, W * 0.08);
    return Array.from({length: n}, (_, i) => {
      const p = i - Math.floor(n / 2);
      return { x: clamp(cx + p * sep, 40, W - 40), y: -52 - Math.abs(p) * 36, d: Math.abs(p) * 0.16 };
    });
  },
  pinza(n) {
    const half = Math.ceil(n / 2);
    return Array.from({length: n}, (_, i) => ({
      x: i < half ? rand(W * 0.06, W * 0.36) : rand(W * 0.64, W * 0.94),
      y: -52, d: i * 0.12,
    }));
  },
  zigzag(n) {
    const sep = W / (n + 1);
    return Array.from({length: n}, (_, i) => ({ x: sep * (i + 1), y: -52 - (i % 2) * 88, d: i * 0.1 }));
  },
  ola(n) {
    const sep = W / (n + 1);
    return Array.from({length: n}, (_, i) => ({
      x: sep * (i + 1),
      y: -52 - Math.sin(i / Math.max(n - 1, 1) * Math.PI) * 68,
      d: i * 0.11,
    }));
  },
};

const c = document.getElementById("c");
const ctx = c.getContext("2d");
let SAFE_TOP = 0, SAFE_BOTTOM = 0;
const fileInput = document.getElementById("file");
let W = 0, H = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  // Leer safe-area-insets para apartar el HUD de la muesca/home bar
  const cs = getComputedStyle(document.documentElement);
  SAFE_TOP    = parseInt(cs.getPropertyValue("--sat") || "0") || 0;
  SAFE_BOTTOM = parseInt(cs.getPropertyValue("--sab") || "0") || 0;
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  c.style.width = W + "px"; c.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Tocar canvas.width reinicia TODO el estado del contexto, así que la
  // calidad de filtrado hay que volver a ponerla aquí. Si no, las naves
  // se reducen con el filtro malo y pierden detalle en cada fotograma.
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;

// Mezcla dos colores "#rrggbb". Sirve para sacar la luz y la sombra de un
// color base sin tener que declarar tres tonos por cada cosa.
function mezcla(a, b, t) {
  const exp = h => h.length === 4 ? "#" + h[1]+h[1]+h[2]+h[2]+h[3]+h[3] : h;
  const n = h => { const e = exp(h); return [parseInt(e.slice(1,3),16), parseInt(e.slice(3,5),16), parseInt(e.slice(5,7),16)]; };
  const [r1, g1, b1] = n(a), [r2, g2, b2] = n(b);
  return "rgb(" + Math.round(r1 + (r2 - r1) * t) + "," +
                  Math.round(g1 + (g2 - g1) * t) + "," +
                  Math.round(b1 + (b2 - b1) * t) + ")";
}

// ── Tratamiento de imagen ─────────────────────────────────
//  Quita el fondo si es de un color plano (magenta, blanco, verde…),
//  recorta lo que sobra y reduce a 256 px. Todo en el navegador.
const MAX_SPRITE = 512;

// Reducir de golpe de 1024 a 512 pierde detalle aunque el filtro sea bueno.
// Bajando de mitad en mitad se conserva mucho más.
function reducir(img, destW, destH) {
  let cur = img;
  let cw = img.naturalWidth || img.width, ch = img.naturalHeight || img.height;
  while (cw > destW * 2 && ch > destH * 2) {
    const nw = Math.max(destW, cw >> 1), nh = Math.max(destH, ch >> 1);
    const t = document.createElement("canvas");
    t.width = nw; t.height = nh;
    const tx = t.getContext("2d");
    tx.imageSmoothingEnabled = true; tx.imageSmoothingQuality = "high";
    tx.drawImage(cur, 0, 0, nw, nh);
    cur = t; cw = nw; ch = nh;
  }
  return cur;
}

// Relleno por inundación DESDE LOS BORDES. Solo se va el fondo que toca
// el marco: un blanco del interior de la nave, rodeado de contorno, no se
// toca. Con el método anterior (comparar toda la imagen contra el color de
// fondo) una nave blanca sobre fondo blanco se quedaba sin la mitad.
function quitarFondo(cx, w, h) {
  let d;
  try { d = cx.getImageData(0, 0, w, h); } catch (_) { return null; }
  const px = d.data;
  const at = (x, y) => (y * w + x) * 4;

  const esq = [at(1, 1), at(w - 2, 1), at(1, h - 2), at(w - 2, h - 2)]
    .map(i => [px[i], px[i + 1], px[i + 2], px[i + 3]]);
  const cerca = (a, b) => Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]) < 40;
  if (!esq.every(q => q[3] > 200 && cerca(q, esq[0]))) return px;   // ya tiene transparencia

  const bgc = esq[0];
  const TOL = 100, SUAVE = 90;
  const visto = new Uint8Array(w * h);
  const pila = [];
  for (let x = 0; x < w; x++) pila.push(x, 0, x, h - 1);
  for (let y = 0; y < h; y++) pila.push(0, y, w - 1, y);

  while (pila.length) {
    const y = pila.pop(), x = pila.pop();
    if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const k = y * w + x;
    if (visto[k]) continue;
    const i = k * 4;
    const dist = Math.abs(px[i]-bgc[0]) + Math.abs(px[i+1]-bgc[1]) + Math.abs(px[i+2]-bgc[2]);
    if (dist > TOL + SUAVE) continue;
    visto[k] = 1;
    px[i + 3] = dist <= TOL ? 0 : Math.round(px[i + 3] * (dist - TOL) / SUAVE);
    pila.push(x + 1, y, x - 1, y, x, y + 1, x, y - 1);
  }
  cx.putImageData(d, 0, 0);
  return px;
}

function prepararSprite(img) {
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  if (!w0 || !h0) return null;

  const esc = Math.min(1, MAX_SPRITE / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * esc)), h = Math.max(1, Math.round(h0 * esc));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = "high";
  cx.drawImage(reducir(img, w, h), 0, 0, w, h);

  // Al abrir con file:// el navegador no deja leer los píxeles de una imagen
  // de disco. En ese caso la usamos tal cual: se verá con su fondo, pero
  // no se rompe nada. Con el botón + sí se puede leer siempre.
  const px = quitarFondo(cx, w, h);
  if (!px) return cv;

  const at = (x, y) => (y * w + x) * 4;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (px[at(x, y) + 3] > 12) {
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
        if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return cv;
  x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1);
  x1 = Math.min(w - 1, x1 + 1); y1 = Math.min(h - 1, y1 + 1);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  if (cw === w && ch === h) return cv;

  const cv2 = document.createElement("canvas");
  cv2.width = cw; cv2.height = ch;
  cv2.getContext("2d").drawImage(cv, x0, y0, cw, ch, 0, 0, cw, ch);
  return cv2;
}

const SPRITES = {};
// Prueba las rutas una tras otra y se queda con la primera que cargue.
// Si no está en ninguna, esa pieza se dibuja por código y no pasa nada.
function cargarSprite(id, rutas) {
  const cola = Array.isArray(rutas) ? rutas.slice() : [rutas];
  (function siguiente() {
    const src = cola.shift();
    if (!src) return;
    const img = new Image();
    img.onload = () => { const s = prepararSprite(img); if (s) SPRITES[id] = s; else siguiente(); };
    img.onerror = siguiente;
    img.src = src;
  })();
}

// Igual, pero tal cual viene: ni recorte de fondo ni recorte al contenido.
// Para imágenes que YA son el fondo.
function cargarImagen(id, rutas) {
  const cola = Array.isArray(rutas) ? rutas.slice() : [rutas];
  (function siguiente() {
    const src = cola.shift();
    if (!src) return;
    const img = new Image();
    img.onload = () => { SPRITES[id] = img; };
    img.onerror = siguiente;
    img.src = src;
  })();
}
for (const n of NAVES) if (n.src) cargarSprite(n.id, n.src);

const MAX_CUSTOM = 4;
function leerCustom() {
  try { return JSON.parse(localStorage.getItem("sf_naves") || "[]"); } catch (_) { return []; }
}
function aplicarCustom() {
  for (let i = NAVES.length - 1; i >= 0; i--) if (!NAVES[i].fija) NAVES.splice(i, 1);
  leerCustom().forEach((n, i) => {
    const id = "custom" + i;
    NAVES.push({ id, nombre: n.nombre, src: null, fija: false, indice: i });

function guardarCustom(nombre, dataURL) {
  const lista = leerCustom();
  lista.push({ nombre, data: dataURL });
  while (lista.length > MAX_CUSTOM) lista.shift();
  try { localStorage.setItem("sf_naves", JSON.stringify(lista)); }
  catch (_) {
    lista.shift();
    try { localStorage.setItem("sf_naves", JSON.stringify(lista)); } catch (__) { return false; }
  }
  aplicarCustom();
  return true;
}
function borrarCustom(indice) {

// ── Sonido generado, cero archivos ────────────────────────
let audio = null;
function unlockAudio() {
  if (audio || !CONFIG.sonido) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio = new AC();
  if (audio.state === "suspended") audio.resume();
}
function beep(f, dur, type, vol, f2) {
  if (!audio || audio.state !== "running") return;
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
  o.type = type || "square";
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f2 || f * 0.5, 20), t + dur);
  g.gain.setValueAtTime(vol || 0.04, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + dur);
}
function ruido(dur, vol) {
  if (!audio || audio.state !== "running") return;
  const n = Math.floor(audio.sampleRate * dur);
  const buf = audio.createBuffer(1, n, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = audio.createBufferSource(), g = audio.createGain();
  s.buffer = buf; g.gain.value = vol || 0.08;
  s.connect(g).connect(audio.destination); s.start();
}

//  PATRONES DE DISPARO
//  Reutilizables. Los usan los enemigos y, cuando lleguen, los
//  bosses. Añadir un patrón aquí lo pone a disposición de todos.
// ════════════════════════════════════════════════════════════
const haciaJugador = (e) => Math.atan2(player.y - e.y, player.x - e.x);

const PATRONES = {
  // n disparos abiertos alrededor de un ángulo
  abanico(x, y, ang, vel, n, apertura, r) {
    for (let i = 0; i < n; i++) {
      const a = ang + (n === 1 ? 0 : (i - (n - 1) / 2) * apertura);
      eBullets.push({ x, y, vx: Math.cos(a) * vel, vy: Math.sin(a) * vel, r: r || 5 });
    }
  },
  // n disparos repartidos por toda la circunferencia
  circulo(x, y, vel, n, fase, r) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + (fase || 0);
      eBullets.push({ x, y, vx: Math.cos(a) * vel, vy: Math.sin(a) * vel, r: r || 5 });
    }
  },
};

//    grande         true = explosión y sonido de peso pesado

// Solo trazan el contorno: de rellenarlo y perfilarlo se encarga
// dibujarEnemigo(), para que todos compartan el mismo acabado.
const FORMAS = {
  circulo(e) { ctx.arc(0, 0, e.r, 0, TAU); },

  rombo(e) {
    ctx.rotate(e.giro);
    ctx.moveTo(0, -e.r); ctx.lineTo(e.r * 0.7, 0);
    ctx.lineTo(0, e.r); ctx.lineTo(-e.r * 0.7, 0);
    ctx.closePath();
  },

  hexagono(e) {
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + e.giro * 0.4;
      ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * e.r, Math.sin(a) * e.r);
    }
    ctx.closePath();
  },

  // Los pods laterales van dentro del MISMO trazo que el casco. Si fueran
  // rectángulos aparte, el contorno perfilaría cada pieza y se vería como
  // tres cosas pegadas en vez de una nave.
  acorazado(e) {
    const r = e.r;
    ctx.moveTo(0, -r);
    ctx.lineTo(r * 0.95, -r * 0.3);
    ctx.lineTo(r * 1.38, -r * 0.28); ctx.lineTo(r * 1.38, r * 0.44);
    ctx.lineTo(r * 0.9, r * 0.44);
    ctx.lineTo(r * 0.7, r * 0.55);
    ctx.lineTo(0, r * 0.88);
    ctx.lineTo(-r * 0.7, r * 0.55);
    ctx.lineTo(-r * 0.9, r * 0.44);
    ctx.lineTo(-r * 1.38, r * 0.44); ctx.lineTo(-r * 1.38, -r * 0.28);
    ctx.lineTo(-r * 0.95, -r * 0.3);
    ctx.closePath();
  },

  // Punta hacia abajo: se ve de un vistazo que viene a por ti
  punta(e) {
    ctx.rotate(e.giro || 0);
    const r = e.r;
    ctx.moveTo(0, r * 1.2);
    ctx.lineTo(r * 0.9, -r * 0.55);
    ctx.lineTo(0, -r * 0.2);
    ctx.lineTo(-r * 0.9, -r * 0.55);
    ctx.closePath();
  },
};

    const s = JSON.parse(raw);
    if (!s || typeof s !== "object") return {};
    if (s.v !== SAVE_VERSION) return {};   // versión antigua → reset limpio

}

}

function procesarEvento(ev) {
  if (ev.fn === "ola") {
    spawnFormacion(ev.tipo, ev.n, ev.patron || "linea");
  } else if (ev.fn === "reward") {
    soltarPremio(W / 2 + rand(-80, 80), -30, elegirPremioAleatorio());
  } else if (ev.fn === "miniboss") {
    spawnMiniboss(ev.tipo);
  }
}

function spawnMiniboss(tipo) {
  const d = MINIBOSSES[tipo];
  miniboss = { tipo, r: d.r, hp: d.hpMax, hpMax: d.hpMax,
    x: W / 2, y: -d.r - 30, fase: 1, faseT: 0, flash: 0,
    cd1: 2.5, cd2: Infinity, targetY: H * 0.22 };
  if (d.init) d.init(miniboss);
  texto(W / 2, H * 0.4, d.nombre, "#ff2f6e");
  beep(80, 0.9, "sawtooth", 0.1, 160); shake(16, 0.7); flash = 0.4;
}

function actualizarMiniboss(dt) {
  if (!miniboss) return;
  const d = MINIBOSSES[miniboss.tipo];
  if (miniboss.flash > 0) miniboss.flash -= dt;
  d.mover(miniboss, dt);

  // Transición de fase al 50% de HP
  if (miniboss.fase === 1 && miniboss.hp < miniboss.hpMax * 0.5) {
    miniboss.fase = 2; miniboss.cd1 = 1.5; miniboss.cd2 = 3.5;
    shake(14, 0.6); texto(miniboss.x, miniboss.y - 70, "¡FASE 2!", "#ff2f6e");
    beep(90, 0.6, "sawtooth", 0.09, 180);
  }

  miniboss.cd1 -= dt;
  if (miniboss.cd1 <= 0) {
    d.ataque1(miniboss);
    miniboss.cd1 = (miniboss.fase === 2 ? 1.6 : 2.6) * (0.85 + Math.random() * 0.3);
  }
  if (miniboss.fase === 2 && isFinite(miniboss.cd2)) {
    miniboss.cd2 -= dt;
    if (miniboss.cd2 <= 0) { d.ataque2(miniboss); miniboss.cd2 = 3.5 * (0.85 + Math.random() * 0.3); }
  }

  // Impactos de balas del jugador
  for (let j = bullets.length - 1; j >= 0; j--) {
    const b = bullets[j], dx = b.x - miniboss.x, dy = b.y - miniboss.y;
    if (dx * dx + dy * dy < (b.r + miniboss.r) ** 2) {
      bullets.splice(j, 1); miniboss.hp--; miniboss.flash = 0.08;
      boom(b.x, b.y, "#fff", 4, 0.6);
      if (miniboss.hp <= 0) { matarMiniboss(); return; }
      break;
    }
  }

  // Colisión con el jugador
  if (miniboss) {
    const dx = player.x - miniboss.x, dy = player.y - miniboss.y;
    if (dx * dx + dy * dy < (player.r * 0.7 + miniboss.r) ** 2) golpe();
  }
}

function matarMiniboss() {
  const d = MINIBOSSES[miniboss.tipo];
  // Explosión en oleadas con retraso visual
  boom(miniboss.x, miniboss.y, d.color(T), 90, 2.8);
  boom(miniboss.x + rand(-30,30), miniboss.y + rand(-20,20), "#ffffff", 40, 1.8);
  shake(22, 0.9); ruido(0.7, 0.15);
  onda(miniboss.x, miniboss.y, d.color(T), miniboss.r * 14, 1.0);
  onda(miniboss.x, miniboss.y, "#ffffff", miniboss.r * 8, 0.6);
  flash = 0.7;
  score += d.puntos; maxCombo = Math.max(maxCombo, combo); combo = 0; comboT = 0;
  texto(miniboss.x, miniboss.y - 50, "+" + d.puntos + " BOSS!", T.bala);
  beep(80, 0.9, "sawtooth", 0.12, 160);
  for (const tipo of d.drops) soltarPremio(miniboss.x + rand(-40, 40), miniboss.y + rand(-20, 20), tipo);
  // Limpiar proyectiles del boss al morir
  eBullets.length = 0;
  miniboss = null;
}

function dibujarMiniboss() {
  if (!miniboss) return;
  const d = MINIBOSSES[miniboss.tipo];
  const col = d.color(T);
  ctx.save(); ctx.translate(miniboss.x, miniboss.y);
  ctx.beginPath();
  FORMAS.acorazado({ r: miniboss.r, giro: miniboss.faseT * 0.04 });
  const lw = Math.max(3, miniboss.r * 0.12);
  ctx.lineJoin = "round";
  ctx.strokeStyle = mezcla(col, "#ffffff", 0.55); ctx.lineWidth = lw + 8; ctx.stroke();
  ctx.strokeStyle = TINTA; ctx.lineWidth = lw + 3; ctx.stroke();
  const g = ctx.createLinearGradient(0, -miniboss.r, 0, miniboss.r);
  g.addColorStop(0, mezcla(col, "#fff", 0.42));
  g.addColorStop(0.5, col);
  g.addColorStop(1, mezcla(col, TINTA, 0.5));
  ctx.fillStyle = miniboss.flash > 0 ? "#ffffff" : g; ctx.fill();
  if (miniboss.fase === 2) {
    const glow = 0.4 + 0.3 * Math.sin(performance.now() / 150);
    ctx.globalAlpha = glow; ctx.fillStyle = "#ff2f6e";
    ctx.beginPath(); ctx.arc(0, 0, miniboss.r * 0.3, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // Barra de HP del jefe en la parte inferior
  const bW = W * 0.65, bH = 10, bX = (W - bW) / 2, bY = H - 34;
  ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(bX - 4, bY - 20, bW + 8, bH + 28);
  ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.fillRect(bX, bY, bW, bH);
  const fill = Math.max(0, miniboss.hp / miniboss.hpMax);
  ctx.fillStyle = fill > 0.5 ? "#ff2f6e" : fill > 0.25 ? "#ff8a1f" : "#ffffff";
  ctx.fillRect(bX, bY, bW * fill, bH);
  ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.85;
  ctx.font = "700 10px " + F; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(d.nombre + "  —  FASE " + miniboss.fase, W / 2, bY - 9);
  ctx.globalAlpha = 1;
}

// El menú también anima, así que todo esto tiene que existir ya
bullets = []; eBullets = []; enemies = []; premios = []; particles = []; flotantes = []; ondas = [];
spawnQueue = []; miniboss = null; misionCompletaT = 0;
player = { x: W / 2, y: H * 0.78, r: 16, px: W / 2 };
targetX = player.x; targetY = player.y;
score = 0; lives = 0; elapsed = 0; level = 1; spawnAcc = 0; shootAcc = 0; invulnT = 0;
arma = 1; escudo = 0; turbo = 0; combo = 0; comboT = 0;
shakeT = 0; shakeMag = 0; flash = 0; bank = 0;
crearFondo();

// ── Entrada ───────────────────────────────────────────────
function pos(e) { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function aim(e) { const p = pos(e); targetX = p.x; targetY = p.y - CONFIG.offsetDedo; }
const dentro = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

c.addEventListener("pointerdown", (e) => {
  unlockAudio();
  if (state === "menu") {
    const p = pos(e);

    for (const r of naveRects) {
      if (!dentro(p, r)) continue;
      // La x de borrar, solo en las naves cargadas por ella
      if (r.borrar && p.x > r.x + r.w - 22 && p.y < r.y + 22) {
        borrarCustom(r.indice);
        naveSel = Math.min(naveSel, NAVES.length - 1);
        guardarSave({ naveId: NAVES[naveSel].id });
        beep(200, 0.12, "square", 0.04);
        return;
      }
      naveSel = r.i;
      guardarSave({ naveId: NAVES[naveSel].id });
      beep(760, 0.1, "triangle", 0.045, 1200);
      return;
    }

    if (dentro(p, masRect)) { fileInput.click(); return; }

    for (const m of modoRects || []) {
      if (dentro(p, m)) {
        modo = m.id; beep(660, 0.1, "triangle", 0.04, 1100); return;
      }
    }

    // Campaña: clic en misión
    for (const m of misionRects || []) {
      if (dentro(p, m) && m.idx <= misionIdx) {
        misionIdx = m.idx;
        beep(760, 0.12, "triangle", 0.05, 1400);
        iniciarMision(misionIdx);
        return;
      }
    }

    // Supervivencia: clic en mundo
    for (const m of menuRects) {
      if (dentro(p, m)) {
        T = m.tema;
        guardarSave({ temaId: T.id });
        beep(660, 0.12, "triangle", 0.05, 1320);
        reset();
        return;
      }
    }
    return;
  }
  if (state === "over") {
    if (performance.now() - overAt > 700) state = "menu";
    return;
  }
  if (paused) { paused = false; unlockAudio(); return; }
  dragging = true; aim(e);
  if (c.setPointerCapture) { try { c.setPointerCapture(e.pointerId); } catch (_) {} }
});
c.addEventListener("pointermove", (e) => { if (dragging && state === "play") aim(e); });
window.addEventListener("pointerup", () => { dragging = false; });
window.addEventListener("pointercancel", () => { dragging = false; });

// Teclado: WASD/flechas para mover, Escape para pausar, Ctrl+Shift+D para debug
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Escape" && state === "play") {
    paused = !paused;
    if (!paused) unlockAudio();
  }
  if (e.ctrlKey && e.shiftKey && e.code === "KeyD") showDebug = !showDebug;
  if (e.code === "Escape" && state === "over") state = "menu";
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// ── Efectos ───────────────────────────────────────────────
function boom(x, y, color, n, fuerza) {
  const f = fuerza || 1;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(50, 300) * f;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.25, 0.65), t: 0, color, r: rand(1.5, 4) * f });
  }
}
function shake(mag, dur) { shakeMag = Math.max(shakeMag, mag); shakeT = Math.max(shakeT, dur); }
// Anillo de choque. Solo para lo que pesa: acorazados, bombas y la nave.
// Si sale en cada muerte deja de significar nada.
function onda(x, y, color, rMax, dur) {
  ondas.push({ x, y, color, rMax, t: 0, life: dur || 0.45 });
}
function texto(x, y, txt, color) {
  flotantes.push({ x, y: y - flotantes.length * 20, txt, color, t: 0, life: 0.9 });
}

// ── Enemigos ──────────────────────────────────────────────
// Modo supervivencia: elige al azar según el nivel. La campaña por
// niveles llamará a spawnEnemy() con el tipo y la posición concretos.
function elegirTipo() {
  const r = Math.random();
  if (level >= 2 && r < Math.min(0.13 + level * 0.035, 0.36)) return "veloz";
  if (level >= 4 && r > 0.90) return "kamikaze";
  if (level >= 3 && r > 0.84 && r <= 0.90) return "torreta";
  if (level >= 5 && r > 0.78 && r <= 0.84) return "tanque";
  return "normal";
}

function spawnEnemy(tipo, x) {
  const k = tipo || elegirTipo();
  const d = ENEMIGOS[k];
  const e = {
    tipo: k, r: d.r, hp: d.hp, hpMax: d.hp,
    x: x != null ? clamp(x, d.r, W - d.r) : rand(d.r + 10, W - d.r - 10),
    y: -d.r - 12,
    vy: CONFIG.velocidadEnemigo * (1 + (level - 1) * 0.13) * d.vel,
    fase: rand(0, TAU), giro: rand(0, TAU),
    cd: d.recarga ? d.recarga() : 0, flash: 0,
  };
  if (d.init) d.init(e);
  enemies.push(e);
  return e;
}

function soltarPremio(x, y, tipo) { premios.push({ x, y, vy: 95, r: 15, tipo, f: rand(0, TAU) }); }

function matar(e, i) {
  const d = ENEMIGOS[e.tipo];
  combo++; comboT = 2.6; enemiesKilled++;
  maxCombo = Math.max(maxCombo, combo);
  const mult = 1 + Math.floor(combo / 8);
  score += d.puntos * mult;
  boom(e.x, e.y, d.color(T), d.grande ? 42 : 18, d.grande ? 1.6 : 1);
  beep(d.grande ? 120 : 300, d.grande ? 0.32 : 0.12, "square", 0.055);
  if (d.grande) { shake(11, 0.35); ruido(0.3, 0.1); onda(e.x, e.y, d.color(T), e.r * 6); }
  if (mult > 1) texto(e.x, e.y, "x" + mult, T.bala);

  const p = CONFIG.probPremio * (d.premio || 1);
  if (Math.random() < p) {
    const r = Math.random();
    let tipo = "arma";
    if (r > 0.92) tipo = "vida";
    else if (r > 0.76) tipo = "bomba";
    else if (r > 0.56) tipo = "escudo";
    else if (r > 0.40) tipo = "rapido";
    soltarPremio(e.x, e.y, tipo);
  }
  enemies.splice(i, 1);
}

function cogerPremio(p) {
  beep(880, 0.16, "triangle", 0.06, 1760);
  boom(p.x, p.y, PREMIOS[p.tipo].color, 14);
  texto(p.x, p.y - 10, PREMIOS[p.tipo].nombre, PREMIOS[p.tipo].color);
  if (p.tipo === "arma") arma = Math.min(arma + 1, ARMA_MAX);
  else if (p.tipo === "escudo") escudo = 1;
  else if (p.tipo === "vida") lives = Math.min(lives + 1, 6);
  else if (p.tipo === "rapido") turbo = 8;
  else if (p.tipo === "bomba") {
    flash = 1; shake(16, 0.5); ruido(0.5, 0.14);
    onda(player.x, player.y, "#ffffff", Math.max(W, H) * 1.1, 0.7);
    for (let i = enemies.length - 1; i >= 0; i--) {
      score += 15; boom(enemies[i].x, enemies[i].y, T.enemigoB, 14);
      enemies.splice(i, 1);
    }
    eBullets.length = 0;
  }
}

function golpe() {
  if (invulnT > 0) return;
  if (escudo > 0) {
    escudo = 0; invulnT = 0.9;
    boom(player.x, player.y, "#5ce1ff", 30, 1.3);
    beep(500, 0.3, "sine", 0.07, 120); shake(9, 0.3);
    texto(player.x, player.y - 30, "ESCUDO ROTO", "#5ce1ff");
    return;
  }
  lives--; invulnT = CONFIG.invulnerable;
  arma = Math.max(1, arma - 1); combo = 0;
  boom(player.x, player.y, T.nave, 34, 1.4);
  onda(player.x, player.y, T.nave, player.r * 9);
  beep(150, 0.35, "sawtooth", 0.08); ruido(0.25, 0.1); shake(14, 0.4);
  if (lives <= 0) {
    state = "over"; overAt = performance.now();
    boom(player.x, player.y, T.motor, 60, 2); shake(20, 0.7);
    onda(player.x, player.y, T.motor, player.r * 20, 0.9);
    if (score > best) { best = score; guardarSave({ record: best }); }
    // Limpiar campo para que el overlay quede limpio
    enemies.length = 0; eBullets.length = 0; bullets.length = 0;
    premios.length = 0; spawnQueue.length = 0; miniboss = null;
  }
}

function disparar() {
  const y = player.y - 18;
  const add = (dx, vx) => bullets.push({ x: player.x + dx, y, vx: vx || 0, r: 3.6 });
  let bAntes = bullets.length;
  if (arma === 1) add(0, 0);
  else if (arma === 2) { add(-9, 0); add(9, 0); }
  else if (arma === 3) { add(0, 0); add(-12, -80); add(12, 80); }
  else if (arma === 4) { add(-8, 0); add(8, 0); add(-16, -150); add(16, 150); }
  else if (arma === 5) { add(0, 0); add(-10, -90); add(10, 90); add(-18, -210); add(18, 210); }
  else { add(-6, 0); add(6, 0); add(-14, -110); add(14, 110); add(-22, -260); add(22, 260); }
  bulletsFiredo += bullets.length - bAntes;
  beep(1050 + arma * 40, 0.045, "square", 0.02);
}

// ── Actualizar ────────────────────────────────────────────
function update(dt) {
  // Background: siempre anima (menú, pausa, over)
  fondoY += 42 * dt;
  for (const s of bg) {
    s.y += (T.bg === "rejilla" ? 120 : 34 + s.z * 78) * dt;
    if (T.bg === "burbujas") s.x += Math.sin(s.f += dt * 2) * 14 * dt;
    if (s.y > H + 10) { s.y = -10; s.x = rand(0, W); }
  }
  // VFX: se ejecutan incluso en pause=false pero sí en over (explosión de muerte)
  if (!paused) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93;
    }
    for (let i = flotantes.length - 1; i >= 0; i--) {
      const f = flotantes[i]; f.t += dt; f.y -= 34 * dt;
      if (f.t >= f.life) flotantes.splice(i, 1);
    }
    for (let i = ondas.length - 1; i >= 0; i--) {
      const o = ondas[i]; o.t += dt;
      if (o.t >= o.life) ondas.splice(i, 1);
    }
    if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeMag = 0; }
    if (flash > 0) flash = Math.max(0, flash - dt * 2.4);
    if (avisoT > 0) avisoT -= dt;
    if (warningT > 0) warningT -= dt;
  }
  if (state !== "play" || paused) return;

  elapsed += dt;
  if (invulnT > 0) invulnT -= dt;
  if (turbo > 0) turbo -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

  // Teclado: aplica desplazamiento al destino para fusionarse con el táctil
  const kbSpeed = 340 * dt;
  if (keys["ArrowLeft"]  || keys["KeyA"]) targetX = Math.max(player.r, targetX - kbSpeed);
  if (keys["ArrowRight"] || keys["KeyD"]) targetX = Math.min(W - player.r, targetX + kbSpeed);
  if (keys["ArrowUp"]    || keys["KeyW"]) targetY = Math.max(player.r + 40, targetY - kbSpeed);
  if (keys["ArrowDown"]  || keys["KeyS"]) targetY = Math.min(H - player.r, targetY + kbSpeed);

  const k = 1 - Math.exp(-CONFIG.velocidadNave * dt);
  player.px = player.x;
  player.x += (clamp(targetX, player.r, W - player.r) - player.x) * k;
  player.y += (clamp(targetY, player.r + 40, H - player.r) - player.y) * k;
  bank += (clamp((player.x - player.px) * 0.045, -0.45, 0.45) - bank) * (1 - Math.exp(-9 * dt));

  if (Math.random() < 0.9) {
    particles.push({ x: player.x + rand(-5, 5), y: player.y + 16, vx: rand(-18, 18), vy: rand(90, 190),
      life: rand(0.18, 0.36), t: 0, color: T.motor, r: rand(1.2, 2.8) });
  }

  const cad = CONFIG.cadenciaDisparo * (turbo > 0 ? 0.55 : 1);
  shootAcc += dt * 1000;
  while (shootAcc >= cad) { shootAcc -= cad; disparar(); }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= CONFIG.velocidadBala * dt; b.x += (b.vx || 0) * dt;
    if (b.y < -24 || b.x < -24 || b.x > W + 24) bullets.splice(i, 1);
  }
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 24 || b.x < -24 || b.x > W + 24) { eBullets.splice(i, 1); continue; }
    const dx = b.x - player.x, dy = b.y - player.y;
    if (dx * dx + dy * dy < (b.r + player.r * 0.66) ** 2) { eBullets.splice(i, 1); golpe(); }
  }

  // Spawn: campaña vs supervivencia
  if (modo === "campana") {
    // Cola de spawn con retraso (formaciones)
    for (let i = spawnQueue.length - 1; i >= 0; i--) {
      const q = spawnQueue[i];
      if (elapsed >= q.at) {
        const e = spawnEnemy(q.tipo, q.x);
        if (q.y !== undefined) e.y = q.y;
        spawnQueue.splice(i, 1);
      }
    }
    // Procesar eventos de la misión
    const mision = MISIONES[misionIdx];
    // Aviso de boss 5 segundos antes
    if (!miniboss && eventoIdx < mision.eventos.length) {
      const siguiente = mision.eventos[eventoIdx];
      if (siguiente.fn === "miniboss" && elapsed >= siguiente.t - 3 && warningT <= 0) {
        warningT = 3;
        texto(W / 2, H * 0.3, "¡JEFE ENTRANTE!", "#ff4444");
        beep(180, 0.5, "sawtooth", 0.07, 360);
      }
    }
    while (eventoIdx < mision.eventos.length) {
      const ev = mision.eventos[eventoIdx];
      if (elapsed < ev.t) break;
      procesarEvento(ev); eventoIdx++;
    }
    // Detección de misión completa
    if (misionCompletaT <= 0 && eventoIdx >= mision.eventos.length &&
        !miniboss && enemies.length === 0 && spawnQueue.length === 0) {
      misionCompletaT = 5;
      beep(880, 0.6, "triangle", 0.08, 1760);
      texto(W / 2, H * 0.4, "¡MISIÓN COMPLETA!", T.bala);
    }
    if (misionCompletaT > 0) {
      misionCompletaT -= dt;
      if (misionCompletaT <= 0) {
        misionIdx = Math.min(misionIdx + 1, MISIONES.length - 1);
        guardarSave({ misionIdx: misionIdx });
        state = "menu"; menuModo = "misiones";
      }
    }
  } else {
    // Supervivencia: dificultad escalada por tiempo
    const nl = 1 + Math.floor(elapsed / CONFIG.subeDificultadCada);
    if (nl > level) { level = nl; beep(700, 0.2, "triangle", 0.05, 1400); texto(W / 2, H * 0.42, "NIVEL " + level, T.bala); }
    spawnAcc += dt;
    const ritmo = 1 / (CONFIG.enemigosPorSegundo * (1 + (level - 1) * 0.2));
    while (spawnAcc >= ritmo) { spawnAcc -= ritmo; spawnEnemy(); }
  }

  // Miniboss
  actualizarMiniboss(dt);

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i], d = ENEMIGOS[e.tipo];
    if (e.flash > 0) e.flash -= dt;
    e.giro += dt * 1.6;
    d.mover(e, dt);
    if (e.y - e.r > H + 20) { enemies.splice(i, 1); continue; }

    if (d.atacar) {
      e.cd -= dt;
      if (e.cd <= 0 && e.y > 30) { e.cd = d.recarga(); d.atacar(e); }
    }

    let muerto = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j], bx = b.x - e.x, by = b.y - e.y;
      if (bx * bx + by * by < (b.r + e.r) ** 2) {
        bullets.splice(j, 1); e.hp--; e.flash = 0.08; bulletsHit++;
        if (e.hp <= 0) { matar(e, i); muerto = true; }
        else { boom(b.x, b.y, "#ffffff", 3, 0.6); beep(700, 0.03, "square", 0.015); }
        break;
      }
    }
    if (muerto) continue;

    const px = player.x - e.x, py = player.y - e.y;
    if (px * px + py * py < (player.r * 0.7 + e.r) ** 2) {
      boom(e.x, e.y, d.color(T), 16);
      if (!d.embiste) enemies.splice(i, 1);
      golpe();
    }
  }

  for (let i = premios.length - 1; i >= 0; i--) {
    const p = premios[i];
    p.f += dt * 4;
    const dx = player.x - p.x, dy = player.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 150) { p.x += (dx / d) * 240 * dt; p.y += (dy / d) * 240 * dt; }
    else p.y += p.vy * dt;
    if (p.y > H + 30) { premios.splice(i, 1); continue; }
    if (d < player.r + p.r) { cogerPremio(p); premios.splice(i, 1); }
  }
}

// ── Dibujo ────────────────────────────────────────────────
function fondo() {
  // Si hay imagen de fondo para este mundo, manda ella: se ajusta al ancho
  // y se repite hacia arriba, así que basta con que enlace por arriba y por
  // abajo para que el desplazamiento sea infinito y sin costura.
  const img = SPRITES["f_" + T.id];
  let iw = 0, ih = 0;
  if (img) { iw = img.naturalWidth || img.width; ih = img.naturalHeight || img.height; }
  if (iw && ih) {
    const alto = W * ih / iw;
    for (let y = -(fondoY % alto); y < H; y += alto) ctx.drawImage(img, 0, y, W, alto);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, T.fondoA); g.addColorStop(1, T.fondoB);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // Con imagen detrás, el polvo de siempre se queda como capa de parallax
  // por encima: da sensación de velocidad sin taparla.
  const cap = (iw && ih) ? 0.4 : 1;
  ctx.fillStyle = T.bgColor; ctx.strokeStyle = T.bgColor;
  if (T.bg === "rejilla") {
    ctx.lineWidth = 1;
    for (const s of bg) {
      ctx.globalAlpha = (0.10 + s.z * 0.16) * cap;
      ctx.beginPath(); ctx.moveTo(0, s.y); ctx.lineTo(W, s.y); ctx.stroke();
    }
    ctx.globalAlpha = 0.07 * cap;
    for (let i = 0; i <= 10; i++) {
      const x = (i / 10) * W;
      ctx.beginPath(); ctx.moveTo(W / 2 + (x - W / 2) * 0.15, H * 0.1); ctx.lineTo(x, H); ctx.stroke();
    }
  } else if (T.bg === "burbujas") {
    for (const s of bg) {
      ctx.globalAlpha = (0.12 + s.z * 0.26) * cap;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 2.2, 0, TAU); ctx.stroke();
    }
  } else if (T.bg === "brasas") {
    for (const s of bg) {
      ctx.globalAlpha = (0.2 + s.z * 0.45) * cap;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.1, 0, TAU); ctx.fill();
    }
  } else {
    for (const s of bg) {
      ctx.globalAlpha = (0.25 + s.z * 0.55) * cap;
      ctx.fillRect(s.x, s.y, s.r, s.r * 2.6);
    }
  }
  ctx.globalAlpha = 1;

  // Viñeta: apaga los bordes para que la acción del centro respire y la
  // nave sea lo más claro de la pantalla. Es lo que impide que el fondo
  // compita con un dibujo de contorno grueso.
  const v = ctx.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.2,
                                     W / 2, H * 0.46, Math.max(W, H) * 0.76);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(0.6, "rgba(0,0,0,0.14)");
  v.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function naveVector(r) {
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(2, r * 0.15);
  ctx.strokeStyle = TINTA;

  const cuerpo = (col, arriba) => {
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, mezcla(col, "#ffffff", arriba));
    g.addColorStop(1, mezcla(col, TINTA, 0.35));
    ctx.fillStyle = g;
    ctx.fill(); ctx.stroke();
  };

  ctx.beginPath();
  ctx.moveTo(0, -r * 0.35);
  ctx.lineTo(r * 1.5, r * 0.5); ctx.lineTo(r * 1.05, r * 0.72);
  ctx.lineTo(0, r * 0.3);
  ctx.lineTo(-r * 1.05, r * 0.72); ctx.lineTo(-r * 1.5, r * 0.5);
  ctx.closePath(); cuerpo(T.naveAla, 0.3);

  ctx.beginPath();
  ctx.moveTo(0, -r * 1.25);
  ctx.lineTo(r * 0.42, r * 0.15); ctx.lineTo(r * 0.5, r * 0.72);
  ctx.lineTo(0, r * 0.55);
  ctx.lineTo(-r * 0.5, r * 0.72); ctx.lineTo(-r * 0.42, r * 0.15);
  ctx.closePath(); cuerpo(T.nave, 0.45);

  ctx.fillStyle = T.cabina;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.35, r * 0.2, r * 0.42, 0, 0, TAU);
  ctx.fill(); ctx.lineWidth = Math.max(1.5, r * 0.1); ctx.stroke();
}

// Dibuja el sprite encajado en un ancho dado, manteniendo proporción
function pintarSprite(s, ancho) {
  const w = s.width || s.naturalWidth, h = s.height || s.naturalHeight;
  if (!w || !h) return false;
  const esc = ancho / w;
  ctx.drawImage(s, -ancho / 2, -h * esc / 2, ancho, h * esc);
  return true;
}

function dibujarNave(x, y, r, ang) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);

  // Medidas del sprite, si hay. Las llamas se ajustan a ellas.
  const sp = SPRITES[NAVES[naveSel] && NAVES[naveSel].id];
  let ws = 0, hs = 0;
  if (sp) {
    const iw = sp.width || sp.naturalWidth, ih = sp.height || sp.naturalHeight;
    if (iw && ih) { ws = r * CONFIG.tamanoNave; hs = ws * ih / iw; }
  }

  const llama = 1 + Math.random() * 0.7;
  const sep    = ws ? ws * 0.16 : 7;
  const yMotor = ws ? hs * 0.40 : r * 0.5;
  const largo  = ws ? ws * 0.32 : 22;
  const grosor = ws ? ws * 0.075 : 4;
  // Si la nave trae las llamas ya dibujadas, se apagan las del juego
  for (const sx of (CONFIG.llamasMotor || !ws) ? [-sep, sep] : []) {
    const g = ctx.createLinearGradient(0, yMotor, 0, yMotor + largo * llama);
    g.addColorStop(0, T.motor); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(sx - grosor, yMotor); ctx.lineTo(sx + grosor, yMotor);
    ctx.lineTo(sx, yMotor + largo * llama); ctx.closePath(); ctx.fill();
  }

  if (ws) {
    // Sombra oscura, no de color: despega la nave del fondo sin pelearse
    // con la paleta del mundo, sea cual sea la nave que haya cargado.
    ctx.shadowColor = "rgba(0,0,0,0.65)"; ctx.shadowBlur = 10;
    ctx.drawImage(sp, -ws / 2, -hs / 2, ws, hs);
    ctx.shadowBlur = 0;
  } else {
    ctx.shadowColor = "rgba(0,0,0,0.65)"; ctx.shadowBlur = 10;
    naveVector(r);
    ctx.shadowBlur = 0;
    ctx.fillStyle = T.bala;
    for (let i = 0; i < Math.min(arma, 3); i++) {
      const px = r * (0.95 + i * 0.22);
      ctx.beginPath(); ctx.arc(px, r * 0.55, 2.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-px, r * 0.55, 2.4, 0, TAU); ctx.fill();
    }
  }

  if (escudo > 0) {
    ctx.strokeStyle = "#5ce1ff"; ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.5 + Math.sin(performance.now() / 140) * 0.25;
    ctx.shadowColor = "#5ce1ff"; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(0, 0, r * 2, 0, TAU); ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function dibujarEnemigo(e) {
  const d = ENEMIGOS[e.tipo];
  ctx.save();
  ctx.translate(e.x, e.y);

  const sp = SPRITES["e_" + e.tipo];
  if (sp) {
    // Sombra propia: despega el dibujo del fondo sin teñirlo
    ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 9;
    pintarSprite(sp, e.r * 2.4);
    ctx.shadowBlur = 0;
    if (e.flash > 0) {   // fogonazo blanco recortado por el propio dibujo
      ctx.globalCompositeOperation = "source-atop";
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.fillRect(-e.r * 2, -e.r * 2, e.r * 4, e.r * 4);
      ctx.globalCompositeOperation = "source-over";
    }
  } else {
    const col = d.color(T);
    ctx.beginPath();
    (FORMAS[d.forma] || FORMAS.circulo)(e);

    // Volumen: luz arriba, sombra abajo. Lo que separa un cuerpo de
    // una mancha de color, y lo que hace que peguen con las naves.
    // Un contorno negro sobre fondo casi negro no separa nada: en las
    // imágenes de las naves funciona porque están dibujadas sobre blanco.
    // Así que primero un filo claro que despegue del fondo, y el negro
    // por dentro. Se traza antes de rellenar para que el relleno tape la
    // mitad interior de ambos.
    const lw = Math.max(2, e.r * 0.17);
    ctx.lineJoin = "round";
    ctx.strokeStyle = mezcla(col, "#ffffff", 0.6);
    ctx.lineWidth = lw + 6;
    ctx.stroke();
    ctx.strokeStyle = TINTA;
    ctx.lineWidth = lw + 2;
    ctx.stroke();

    const g = ctx.createLinearGradient(0, -e.r, 0, e.r);
    g.addColorStop(0, mezcla(col, "#ffffff", 0.42));
    g.addColorStop(0.5, col);
    g.addColorStop(1, mezcla(col, TINTA, 0.5));
    ctx.fillStyle = e.flash > 0 ? "#ffffff" : g;
    ctx.fill();

    if (DETALLES[d.forma]) DETALLES[d.forma](e);
    if (d.dibujarExtra) d.dibujarExtra(e);

    // Brillo especular, como el de las chapas de las naves
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.beginPath();
    ctx.ellipse(-e.r * 0.22, -e.r * 0.34, e.r * 0.34, e.r * 0.17, -0.5, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  if (e.hpMax > 3 && e.hp < e.hpMax) {
    const w = e.r * 2;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w, 4);
    ctx.fillStyle = T.bala;
    ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w * (e.hp / e.hpMax), 4);
  }
}

function dibujarPremio(p) {
  const s = 1 + Math.sin(p.f) * 0.12;
  const d = PREMIOS[p.tipo];
  ctx.save();
  ctx.translate(p.x, p.y); ctx.scale(s, s);
  // CHAPA CUADRADA, no un círculo. El círculo ya significa "bala enemiga",
  // y un premio redondo del mismo color se coge por error o se esquiva por
  // error. En el juego no hay ningún otro cuadrado.
  const l = p.r * 1.05;
  const chapa = (m) => {
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(-l - m, -l - m, (l + m) * 2, (l + m) * 2, 5 + m)
                  : ctx.rect(-l - m, -l - m, (l + m) * 2, (l + m) * 2);
  };
  chapa(3.5); ctx.fillStyle = mezcla(d.color, "#ffffff", 0.7); ctx.fill();
  chapa(2);   ctx.fillStyle = TINTA; ctx.fill();
  const g = ctx.createLinearGradient(0, -l, 0, l);
  g.addColorStop(0, mezcla(d.color, "#ffffff", 0.55));
  g.addColorStop(1, mezcla(d.color, TINTA, 0.14));
  chapa(0); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = "rgba(10,7,20,0.85)";
  ctx.font = "900 16px -apple-system, system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(d.letra, 0, 1);
  ctx.restore();
}

function corazon(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 16, s / 16);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 5);
  ctx.bezierCurveTo(-9, -3, -5, -10, 0, -5);
  ctx.bezierCurveTo(5, -10, 9, -3, 0, 5);
  ctx.fill(); ctx.restore();
}

const F = "-apple-system, system-ui, Segoe UI, Roboto, sans-serif";

function hud() {
  const top = 14;
  const g = ctx.createLinearGradient(0, 0, 0, 132);
  g.addColorStop(0, "rgba(0,0,0,0.55)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 132);

  // Todo el HUD con sombra dura: tiene que leerse igual sobre un fondo
  // negro que sobre una explosión blanca.
  ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 5;
  ctx.textBaseline = "top";
  ctx.font = "700 12px " + F;
  ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.6;
  ctx.textAlign = "left";
  if (modo === "campana") {
    ctx.fillText("M" + (misionIdx + 1) + " " + MISIONES[misionIdx].nombre, 16, top + 2);
  } else {
    ctx.fillText("NIVEL " + level, 16, top + 2);
  }
  ctx.textAlign = "right"; ctx.fillText("RÉCORD " + best, W - 16, top + 2);
  ctx.globalAlpha = 1;

  ctx.textAlign = "center";
  ctx.font = "800 32px " + F;
  ctx.fillText(String(score), W / 2, top + 18);

  for (let i = 0; i < lives; i++) corazon(26 + i * 25, top + 78, 20, "#ff5d8f");

  ctx.textAlign = "right";
  ctx.font = "700 11px " + F;
  ctx.globalAlpha = 0.55; ctx.fillStyle = "#fff";
  ctx.fillText("ARMA", W - 16, top + 56); ctx.globalAlpha = 1;
  for (let i = 0; i < ARMA_MAX; i++) {
    ctx.fillStyle = i < arma ? T.bala : "rgba(255,255,255,0.16)";
    ctx.fillRect(W - 16 - (ARMA_MAX - i) * 11, top + 72, 8, 8);
  }
  if (turbo > 0) {
    ctx.fillStyle = "#8affd1"; ctx.globalAlpha = 0.9;
    ctx.font = "800 11px " + F;
    ctx.fillText("TURBO " + turbo.toFixed(1), W - 16, top + 88);
    ctx.globalAlpha = 1;
  }
  if (combo >= 8) {
    ctx.textAlign = "center"; ctx.fillStyle = T.bala;
    ctx.globalAlpha = clamp(comboT, 0, 1);
    ctx.font = "800 18px " + F;
    ctx.fillText("COMBO x" + (1 + Math.floor(combo / 8)), W / 2, top + 76);
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = 0;
}

function miniNave(x, y, tam, tema) {
  ctx.save(); ctx.translate(x, y); ctx.scale(tam / 46, tam / 46);
  ctx.fillStyle = tema.naveAla;
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.lineTo(24, 8); ctx.lineTo(17, 12);
  ctx.lineTo(0, 5); ctx.lineTo(-17, 12); ctx.lineTo(-24, 8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = tema.nave;
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(7, 2); ctx.lineTo(8, 12);
  ctx.lineTo(0, 9); ctx.lineTo(-8, 12); ctx.lineTo(-7, 2);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function dibujarNaves(yBase) {
  naveRects = []; masRect = null;
  const total = NAVES.length + 1;
  const porFila = total <= 6 ? total : Math.ceil(total / 2);
  const filas = Math.ceil(total / porFila);
  const hueco = 8;
  const slot = Math.min(70, (W - 32 - hueco * (porFila - 1)) / porFila);
  const anchoFila = porFila * slot + hueco * (porFila - 1);

  ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff"; ctx.font = "700 11px " + F;
  ctx.fillText("TU NAVE", W / 2, yBase - 12); ctx.globalAlpha = 1;

  for (let i = 0; i < total; i++) {
    const fila = Math.floor(i / porFila), col = i % porFila;
    const enFila = Math.min(porFila, total - fila * porFila);
    const ancho = enFila * slot + hueco * (enFila - 1);
    const x = (W - (enFila === porFila ? anchoFila : ancho)) / 2 + col * (slot + hueco);
    const y = yBase + fila * (slot + hueco);
    const esMas = i === NAVES.length;
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, slot, slot, 12) : ctx.rect(x, y, slot, slot);
    ctx.fill();
    if (esMas) {
      masRect = { x, y, w: slot, h: slot };
      ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.font = "300 30px " + F;
      ctx.fillText("+", x + slot / 2, y + slot / 2 - 5);
      ctx.font = "700 9px " + F; ctx.globalAlpha = 0.6;
      ctx.fillText("CARGAR", x + slot / 2, y + slot - 13); ctx.globalAlpha = 1;
      continue;
    }
    const n = NAVES[i];
    naveRects.push({ x, y, w: slot, h: slot, i, borrar: !n.fija, indice: n.indice });
    const sel = i === naveSel;
    ctx.strokeStyle = sel ? T.nave : "rgba(255,255,255,0.12)"; ctx.lineWidth = sel ? 2.5 : 1;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, slot, slot, 12) : ctx.rect(x, y, slot, slot);
    ctx.stroke();
    const sp = SPRITES[n.id];
    if (sp) {
      ctx.save(); ctx.translate(x + slot / 2, y + slot / 2 - 4); pintarSprite(sp, slot * 0.66); ctx.restore();
    } else if (n.src) {
      ctx.globalAlpha = 0.28; ctx.fillStyle = "#fff"; ctx.font = "700 9px " + F;
      ctx.fillText("falta", x + slot / 2, y + slot / 2 - 4);
      ctx.fillText("el PNG", x + slot / 2, y + slot / 2 + 6); ctx.globalAlpha = 1;
    } else { miniNave(x + slot / 2, y + slot / 2 - 4, slot * 0.6, T); }
    ctx.fillStyle = sel ? T.nave : "rgba(255,255,255,0.55)"; ctx.font = "800 9px " + F;
    ctx.fillText(n.nombre, x + slot / 2, y + slot - 11, slot - 8);
    if (!n.fija) {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.beginPath(); ctx.arc(x + slot - 11, y + 11, 8.5, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.font = "700 11px " + F;
      ctx.fillText("×", x + slot - 11, y + 11);
    }
  }
  return yBase + filas * (slot + hueco);
}

function menu() {
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
  ctx.font = "800 " + Math.min(40, W * 0.098) + "px " + F;
  ctx.fillText("STRIKE FLIGHT", W / 2, 54);
  ctx.globalAlpha = 0.5; ctx.font = "600 12px " + F;
  ctx.fillText(best > 0 ? "RÉCORD  " + best : "elige modo para jugar", W / 2, 80);
  ctx.globalAlpha = 1;

  const yNaves = dibujarNaves(114);

  // ── Selector de modo ──
  modoRects = [];
  const yModo = yNaves + 18;
  const bw = Math.min((W - 48) / 2, 160), bh = 36;
  const bx1 = W / 2 - bw - 6, bx2 = W / 2 + 6;
  ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff"; ctx.font = "700 11px " + F;
  ctx.fillText("MODO DE JUEGO", W / 2, yModo - 10); ctx.globalAlpha = 1;

  const modos = [{ id:"campana", label:"CAMPAÑA" }, { id:"supervivencia", label:"SUPERVIVENCIA" }];
  const bxs = [bx1, bx2];
  for (let i = 0; i < 2; i++) {
    const sel = modo === modos[i].id;
    const bx = bxs[i], by = yModo;
    modoRects.push({ x: bx, y: by, w: bw, h: bh, id: modos[i].id });
    ctx.fillStyle = sel ? T.nave : "rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, 8) : ctx.rect(bx, by, bw, bh);
    ctx.fill();
    ctx.strokeStyle = sel ? T.nave : "rgba(255,255,255,0.18)"; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = sel ? "#05060f" : "#fff"; ctx.font = "800 12px " + F;
    ctx.fillText(modos[i].label, bx + bw / 2, by + bh / 2);
  }

  const yContenido = yModo + bh + 22;
  const wCard = Math.min(W - 32, 400);

  if (modo === "campana") {
    // ── Lista de misiones ──
    misionRects = []; menuRects = [];
    ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff"; ctx.font = "700 11px " + F;
    ctx.fillText("SELECCIONA MISIÓN", W / 2, yContenido - 10); ctx.globalAlpha = 1;

    const disp = H - yContenido - 16;
    const altoCard = clamp((disp - 4 * 8) / 5, 38, 54);
    let yc = yContenido;

    for (let i = 0; i < MISIONES.length; i++) {
      const m = MISIONES[i];
      const temaM = TEMAS.find(t => t.id === m.temaId) || TEMAS[0];
      const cx = (W - wCard) / 2;
      misionRects.push({ x: cx, y: yc, w: wCard, h: altoCard, idx: i });

      const bloqueada = i > misionIdx;
      const actual = i === misionIdx;
      ctx.fillStyle = bloqueada ? "rgba(255,255,255,0.03)" : "rgba(255,255,255,0.07)";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cx, yc, wCard, altoCard, 10) : ctx.rect(cx, yc, wCard, altoCard);
      ctx.fill();
      ctx.strokeStyle = actual ? temaM.nave : bloqueada ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.14)";
      ctx.lineWidth = actual ? 2 : 1; ctx.stroke();

      ctx.textAlign = "left"; ctx.fillStyle = bloqueada ? "rgba(255,255,255,0.25)" : "#fff";
      ctx.font = "800 12px " + F;
      ctx.fillText("M" + (i + 1) + "  " + m.nombre, cx + 16, yc + altoCard * 0.38);
      ctx.font = "600 10px " + F; ctx.globalAlpha = bloqueada ? 0.15 : 0.5;
      ctx.fillText(bloqueada ? "bloqueada" : m.desc, cx + 16, yc + altoCard * 0.72, wCard - 60);
      ctx.globalAlpha = 1; ctx.textAlign = "center";

      if (actual) {
        ctx.fillStyle = temaM.nave; ctx.font = "700 11px " + F;
        ctx.fillText("▶", cx + wCard - 22, yc + altoCard / 2);
      }
      yc += altoCard + 8;
    }

  } else {
    // ── Mundos (supervivencia) ──
    menuRects = []; misionRects = [];
    ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff"; ctx.font = "700 11px " + F;
    ctx.fillText("ELIGE MUNDO", W / 2, yContenido - 10); ctx.globalAlpha = 1;

    const disp = H - yContenido - 16;
    const alto = clamp((disp - 3 * 10) / 4, 44, 68);
    const bloque = 4 * alto + 3 * 10;
    let y = yContenido + Math.max(0, (disp - bloque) * 0.35);

    for (const t of TEMAS) {
      const x = (W - wCard) / 2;
      menuRects.push({ x, y, w: wCard, h: alto, tema: t });
      const g = ctx.createLinearGradient(x, y, x + wCard, y + alto);
      g.addColorStop(0, t.fondoA); g.addColorStop(1, t.fondoB);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, wCard, alto, 12) : ctx.rect(x, y, wCard, alto);
      ctx.fill();
      ctx.strokeStyle = t.id === T.id ? t.nave : "rgba(255,255,255,0.13)";
      ctx.lineWidth = t.id === T.id ? 2.5 : 1; ctx.stroke();
      ctx.fillStyle = t.nave; ctx.font = "800 22px " + F; ctx.textAlign = "left";
      ctx.fillText(t.icono, x + 20, y + alto / 2);
      ctx.fillStyle = "#fff"; ctx.font = "700 14px " + F;
      ctx.fillText(t.nombre, x + 50, y + alto / 2); ctx.textAlign = "center";
      const sp = SPRITES[NAVES[naveSel] && NAVES[naveSel].id];
      ctx.save(); ctx.translate(x + wCard - 38, y + alto / 2);
      if (sp) pintarSprite(sp, 40); else miniNave(0, 0, 40, t);
      ctx.restore();
      y += alto + 10;
    }
  }

  if (avisoT > 0) {
    ctx.globalAlpha = clamp(avisoT, 0, 1) * 0.75; ctx.fillStyle = "#000";
    ctx.fillRect(0, H / 2 - 26, W, 52);
    ctx.globalAlpha = clamp(avisoT, 0, 1); ctx.fillStyle = "#fff"; ctx.font = "800 16px " + F;
    ctx.fillText(aviso, W / 2, H / 2); ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.save();
  if (shakeT > 0) {
    const m = shakeMag * (shakeT / 0.4);
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  fondo();

  // Los anillos van DEBAJO de los restos, para que la explosión los tape
  for (const o of ondas) {
    const k = o.t / o.life;
    ctx.globalAlpha = (1 - k) * 0.85;
    ctx.strokeStyle = o.color;
    ctx.lineWidth = Math.max(1, 8 * (1 - k));
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.rMax * (1 - Math.pow(1 - k, 2.2)), 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (state !== "menu") {
    // Las balas se distinguen por FORMA antes que por color, porque el color
    // depende del mundo y de la nave, y la forma no. Tuyas: alargadas, con
    // núcleo blanco. Suyas: redondas, con anillo. Aunque cambie la paleta
    // entera, esto se sigue leyendo.
    const caja = (x, y, w, h, r) => {
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
    };
    ctx.lineJoin = "round";
    for (const b of bullets) {
      caja(b.x - b.r - 1.5, b.y - 12.5, (b.r + 1.5) * 2, 25, b.r + 1.5);
      ctx.fillStyle = TINTA; ctx.fill();
      caja(b.x - b.r, b.y - 11, b.r * 2, 22, b.r);
      ctx.fillStyle = TIRO_TUYO; ctx.fill();
      caja(b.x - b.r * 0.4, b.y - 7.5, b.r * 0.8, 15, b.r * 0.4);
      ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.fill();
    }
    for (const b of eBullets) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3.5, 0, TAU);
      ctx.fillStyle = "rgba(255,47,110,0.3)"; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1.8, 0, TAU);
      ctx.fillStyle = TINTA; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fillStyle = TIRO_SUYO; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.16, b.y - b.r * 0.16, b.r * 0.44, 0, TAU);
      ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.fill();
    }

    for (const e of enemies) dibujarEnemigo(e);
    dibujarMiniboss();
    for (const p of premios) dibujarPremio(p);

    if (state === "play" && !(invulnT > 0 && Math.floor(invulnT * 15) % 2 === 0)) {
      dibujarNave(player.x, player.y, player.r, bank);
    }
  }

  ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 4;
  for (const f of flotantes) {
    ctx.globalAlpha = 1 - f.t / f.life;
    ctx.fillStyle = f.color;
    ctx.font = "800 16px " + F;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = "rgba(255,255,255," + (flash * 0.75) + ")"; ctx.fillRect(0, 0, W, H); }

  if (state === "menu") menu();
  else hud();

  // Pantalla de resultados (game over)
  if (state === "over") {
    ctx.fillStyle = "rgba(5,6,15,0.88)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const cx = W / 2, cy = H / 2;
    const isRecord = score >= best && score > 0;

    ctx.font = "800 " + Math.min(28, W * 0.07) + "px " + F;
    ctx.fillStyle = "#ff4444"; ctx.globalAlpha = 0.9;
    ctx.fillText("GAME OVER", cx, cy - 160);

    ctx.font = "800 " + Math.min(64, W * 0.16) + "px " + F;
    ctx.fillStyle = isRecord ? "#ffd700" : "#ffffff";
    ctx.globalAlpha = 1;
    ctx.fillText(String(score), cx, cy - 90);

    if (isRecord) {
      ctx.font = "700 13px " + F; ctx.fillStyle = "#ffd700"; ctx.globalAlpha = 0.9;
      ctx.fillText("★ NUEVO RÉCORD ★", cx, cy - 44);
    } else {
      ctx.font = "700 13px " + F; ctx.fillStyle = "#aaa"; ctx.globalAlpha = 0.7;
      ctx.fillText("RÉCORD  " + best, cx, cy - 44);
    }

    // Stats grid
    const stats = [
      ["ENEMIGOS DERRIBADOS", enemiesKilled],
      ["COMBO MÁX.", maxCombo],
      ["PRECISIÓN", bulletsFiredo > 0 ? Math.round(bulletsHit / bulletsFiredo * 100) + "%" : "—"],
      ["TIEMPO", Math.floor(elapsed / 60) + ":" + String(Math.floor(elapsed % 60)).padStart(2, "0")],
    ];
    ctx.font = "600 12px " + F; ctx.globalAlpha = 0.85;
    stats.forEach(([label, val], i) => {
      const row = cy - 10 + i * 28;
      ctx.fillStyle = "#888"; ctx.textAlign = "left";
      ctx.fillText(label, cx - 120, row);
      ctx.fillStyle = "#fff"; ctx.textAlign = "right";
      ctx.fillText(String(val), cx + 120, row);
    });
    ctx.textAlign = "center";

    if (modo === "campana") {
      ctx.font = "700 11px " + F; ctx.fillStyle = "#aaa"; ctx.globalAlpha = 0.6;
      ctx.fillText("MISIÓN " + (misionIdx + 1) + " — " + MISIONES[misionIdx].nombre, cx, cy + 110);
    }
    ctx.globalAlpha = 0.9; ctx.font = "700 14px " + F; ctx.fillStyle = "#fff";
    ctx.fillText("Toca para volver", cx, cy + 140);
    ctx.globalAlpha = 1;
  }

  // Overlay de misión completa (campaña)
  if (state === "play" && misionCompletaT > 0) {
    const a = Math.min(1, misionCompletaT, 5 - misionCompletaT) * 0.8;
    ctx.fillStyle = "rgba(5,6,15," + a + ")"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = T.bala; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 " + Math.min(36, W * 0.088) + "px " + F;
    ctx.fillText("¡MISIÓN COMPLETA!", W / 2, H / 2 - 24);
    ctx.font = "700 14px " + F; ctx.globalAlpha = 0.75;
    ctx.fillStyle = "#fff";
    const sig = misionIdx + 1 < MISIONES.length ? "Siguiente: " + MISIONES[misionIdx + 1].nombre : "¡Campaña superada!";
    ctx.fillText(sig, W / 2, H / 2 + 18);
    // Stats rápidas al completar misión
    const mins = Math.floor(elapsed / 60), secs = Math.floor(elapsed % 60);
    ctx.fillText(enemiesKilled + " derribados · " + mins + ":" + String(secs).padStart(2,"0"), W/2, H/2+44);
    ctx.globalAlpha = 1;
  }

  // Banner WARNING de boss
  if (state === "play" && warningT > 0) {
    const pulse = Math.sin(performance.now() / 80) * 0.5 + 0.5;
    const fade = Math.min(1, warningT * 2);
    ctx.globalAlpha = fade;
    ctx.fillStyle = "rgba(220,20,20," + (0.75 + pulse * 0.25) + ")";
    ctx.fillRect(0, H * 0.17, W, 42);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 17px " + F;
    ctx.fillText("!! JEFE ENTRANTE !!", W / 2, H * 0.17 + 21);
    ctx.globalAlpha = 1;
  }

  // Overlay de pausa
  if (state === "play" && paused) {
    ctx.fillStyle = "rgba(5,6,15,0.75)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 " + Math.min(40, W * 0.1) + "px " + F;
    ctx.fillText("PAUSA", W / 2, H / 2 - 20);
    ctx.font = "700 13px " + F; ctx.globalAlpha = 0.6;
    ctx.fillText("Esc o toca para continuar", W / 2, H / 2 + 24);
    ctx.globalAlpha = 1;
  }

  // Debug overlay
  if (showDebug && state === "play") {
    const dy = 134;
    ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0, dy, 172, 90);
    ctx.fillStyle = "#0f0"; ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "11px monospace";
    const lines = [
      "FPS " + fps.toFixed(1) + "  t:" + elapsed.toFixed(1) + "s ev:" + eventoIdx,
      "ENE:" + enemies.length + " EBUL:" + eBullets.length + " BULS:" + bullets.length,
      "PART:" + particles.length + " premios:" + premios.length,
      "score:" + score + " combo:" + combo + " boss:" + (miniboss ? "Y" : "N"),
      "spawns:" + spawnQueue.length + (paused ? " [PAUSE]" : ""),
    ];
    lines.forEach((l, i) => ctx.fillText(l, 4, dy + 4 + i * 16));
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  // FPS suavizado
  fpsFrames++; fpsAcc += dt;
  if (fpsAcc >= 0.5) { fps = fpsFrames / fpsAcc; fpsFrames = 0; fpsAcc = 0; }

  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
