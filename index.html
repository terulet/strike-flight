      let origen = { x: player.x, y: player.y - 30 };
      const visitados = new Set();
      for (let i = 0; i < 3; i++) {
        let o = null, md = 260 * 260;
        for (const e of enemies) {
          if (visitados.has(e) || e.hp <= 0) continue;
          const dx = e.x - origen.x, dy = e.y - origen.y, d = dx * dx + dy * dy;
          if (d < md) { md = d; o = e; }
        }
        if (!o) break;
        o.hp -= 8; o.flash = 0.1;
        rayos.push({ x1: origen.x, y1: origen.y, x2: o.x, y2: o.y, col: "#ffd700", t: 0, life: 0.15 });
        impacto(o.x, o.y, "ligero", "#ffd700");
        origen = { x: o.x, y: o.y }; visitados.add(o);
      }
    }
  }
  if (evoluciones.gravity_aegis) {
    evoPulsoT += dt;
    if (evoPulsoT >= 6) {
      evoPulsoT = 0;
      danioArea(player.x, player.y, 130, 6, null);
      onda(player.x, player.y, "#5ce1ff", 140, 0.5);
      sfx("escudo_on", { vol: 0.5 });
    }
  }
}

// ── Efectos pasivos (SHIELD REACTOR, MISSILE SWARM) ────────
//  Los dos necesitan un reloj propio: no pasan por ningún chokepoint
//  que ya exista, así que viven en su propia función de tick.
let shieldReactorT = 0, missileSwarmT = 0;
function dispararMissileSwarm() {
  const a = ARMAS.misil;   // reutiliza el arma de misiles entera: guiado, área, sonido, sprite
  // STRIKE FLEET (6H): el enjambre crece de 6 a 10.
  const n = evoluciones.strike_fleet ? 10 : 6;
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (i - (n - 1) / 2) * 0.16;
    bullets.push(nuevaBala(player.x, player.y - player.r, Math.cos(ang) * a.vel * 0.4, Math.sin(ang) * a.vel, a));
  }
  bulletsFiredo += n;
  sfx(a.snd, { vol: 0.6 });
}
function actualizarUpgradesPasivos(dt) {
  if (state !== "play" || paused || upgradesOfrecidos) return;
  if (upgradesJugador.shield_reactor && escudo <= 0) {
    shieldReactorT += dt;
    // Nivel 2: regenera más rápido. GRAVITY AEGIS (6H) lo acelera aparte.
    let umbral = 19 - upgradesJugador.shield_reactor * 4;
    if (evoluciones.gravity_aegis) umbral *= 0.5;
    if (shieldReactorT >= umbral) {
      escudo = 1; shieldReactorT = 0;
      texto(player.x, player.y - 40, "ESCUDO REGENERADO", "#5ce1ff", 12);
      sfx("escudo_on");
    }
  } else shieldReactorT = 0;

  if (upgradesJugador.missile_swarm) {
    missileSwarmT += dt;
    let intervalo = 8 - (upgradesJugador.missile_swarm - 1) * 2;   // nivel 2: cada 6s
    if (evoluciones.strike_fleet) intervalo *= 0.7;                 // 6H: más seguido, además de más grande
    if (missileSwarmT >= intervalo) { missileSwarmT = 0; dispararMissileSwarm(); }
  }
}
function actualizarOverdrive(dt) {
  if (state !== "play" || paused || overdriveActivo <= 0) return;
  overdriveActivo = Math.max(0, overdriveActivo - dt);
  if (overdriveActivo === 0) {
    texto(player.x, player.y - 40, "overdrive apagada", "#8a8a9a", 11);
    sfx("ui_no", { vol: 0.4 });
  }
}
function barraOverdrive() {
  if (state !== "play") return;
  const bW = Math.min(W - 60, 200), bH = 8;
  const bX = (W - bW) / 2, bY = H - SAFE_BOTTOM - 34;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(bX - 2, bY - 2, bW + 4, bH + 4);
  ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(bX, bY, bW, bH);
  if (overdriveActivo > 0) {
    ctx.fillStyle = "#ff2fbd";
    ctx.fillRect(bX, bY, bW * (overdriveActivo / overdriveDuracionActual), bH);
  } else {
    const lleno = overdrive >= OVERDRIVE_MAX;
    ctx.fillStyle = lleno ? "#ffd700" : "#ff2fbd";
    ctx.globalAlpha = lleno ? (0.7 + 0.3 * Math.sin(performance.now() / 160)) : 1;
    ctx.fillRect(bX, bY, bW * (overdrive / OVERDRIVE_MAX), bH);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = "center"; ctx.font = "800 8px " + F; ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.7;
  letras(overdriveActivo > 0 ? "OVERDRIVE" : (overdrive >= OVERDRIVE_MAX ? "OVERDRIVE LISTA — TOCA AQUÍ" : "OVERDRIVE"), W / 2, bY - 9, 1.6, "center");
  ctx.globalAlpha = 1;
  ctx.restore();
  if (overdrive >= OVERDRIVE_MAX && overdriveActivo <= 0) {
    botones.push({ x: bX - 10, y: bY - 20, w: bW + 20, h: bH + 30, fn: activarOverdrive });
  }
}

// Las familias de arma que suelta cada misión son parte de su identidad:
// en el cinturón de asteroides caen misiles, en la fisura helada cae crio.
// Salir de M2 con un arma distinta a la de M5 es lo que hace que la
// campaña no sepa toda igual.
function armasDeMision() {
  const m = modo === "campana" && MISIONES[misionIdx];
  return (m && m.armas) || ["plasma", "laser"];
}
function elegirPremioBase() {
  const r = Math.random();
  if (r > 0.945) return "vida";
  if (r > 0.855) return "bomba";
  if (r > 0.715) return "escudo";
  if (r > 0.635) return "rapido";
  if (r > 0.615) return "x2";
  if (r > 0.595) return "iman";
  if (r > 0.435) {
    const fam = armasDeMision();
    return fam[(Math.random() * fam.length) | 0];
  }
  return "arma";
}
// Envoltorio de dificultad: en MEDIUM `defensiveDropMul` vale 1 y esta
// función es un simple paso a través de `elegirPremioBase()`, byte a
// byte igual que antes de este bloque. En FÁCIL empuja SUAVEMENTE hacia
// escudo/vida; en DIFÍCIL, al revés. No se toca la escalera de
// probabilidades base — eso rompería el ajuste fino que ya tiene.
function elegirPremioAleatorio() {
  const t = elegirPremioBase();
  const mul = DIF.defensiveDropMul;
  if (mul === 1) return t;
  const defensivo = t === "vida" || t === "escudo";
  if (!defensivo && mul > 1 && Math.random() < (mul - 1) * 0.4) {
    return Math.random() < 0.5 ? "escudo" : "vida";
  }
  if (defensivo && mul < 1 && Math.random() < (1 - mul) * 0.4) {
    return elegirPremioBase();
  }
  return t;
}

function procesarEvento(ev) {
  if (ev.fn === "ola") {
    spawnFormacion(ev.tipo, ev.n, ev.patron || "linea", null, abrirOla(ev.n));
    // La nave de mando es la mecánica firma de M6: si aparece sin que
    // suene nada, la jugadora se entera cuando ya la tiene encima.
    if (ev.tipo === "comando") sfx("alarma_flota");
  } else if (ev.fn === "reward") {
    soltarPremio(W / 2 + rand(-80, 80), -30, elegirPremioAleatorio());
  } else if (ev.fn === "miniboss") {
    spawnMiniboss(ev.tipo, ev.mult);
  } else if (ev.fn === "hazardOn") {
    hazardEnabled = true;
    if (ev.subtipo) hazardTipo = ev.subtipo;
  } else if (ev.fn === "hazardOff") {
    hazardEnabled = false;
  } else if (ev.fn === "defensa") {
    spawnDefensas(ev.tipo || "torreta", ev.n || 3);
  } else if (ev.fn === "zonaOn") {
    zonaEnabled = true;
  } else if (ev.fn === "zonaOff") {
    zonaEnabled = false;
  } else if (ev.fn === "pozo") {
    spawnPozo(clamp(ev.x != null ? ev.x : rand(W * 0.25, W * 0.75), 90, W - 90), H * (ev.y || 0.46), ev.r || 150, ev.fuerza || 120, ev.vida || 3.2);
  } else if (ev.fn === "carril") {
    spawnCarril(H * (ev.y || 0.5), ev.h || 74, ev.vida || 2.0);
  } else if (ev.fn === "sistemas") {
    spawnSistemas();
  } else if (ev.fn === "bonus") {
    iniciarBonusEvento(ev.tipo, ev);
  } else if (ev.fn === "descansoOn") {
    descansoDeliberado = true;
  } else if (ev.fn === "descansoOff") {
    descansoDeliberado = false;
  } else if (ev.fn === "zonaCol") {
    venomZona(ev.col != null ? ev.col : (Math.random() * 3) | 0);
  } else if (ev.fn === "columna") {
    spawnColumna(ev.x != null ? ev.x : rand(W * 0.2, W * 0.8), ev.w, ev.vida, ev.estilo);
  } else if (ev.fn === "oscuridad") {
    oscurecer(ev.nivel, ev.dur);
  } else if (ev.fn === "ruptura") {
    spawnRuptura(ev.x != null ? ev.x : W / 2, H * (ev.y || 0.34), ev.r, ev.dur);
  }
}

// ── Puesta en escena ──────────────────────────────────────
//  El jefe existe desde el AVISO, no desde que se le puede disparar.
//  Ese par de segundos de pausa dramática es lo que separa "aparece un
//  enemigo grande" de "llega alguien".
function spawnMiniboss(tipo, mult) {
  const d = JEFES[tipo];
  if (!d) return;
  asegurarSpriteJefe(tipo);
  // El mismo jefe cuatro misiones seguidas se agota. Escalarlo por misión
  // no lo arregla del todo — eso lo arreglan M6-M10 con jefes propios —
  // pero al menos el Guardián de la M4 no cae igual que el de la M1.
  const hpm = Math.round(d.hpMax * (mult || 1));
  miniboss = {
    tipo, r: d.r, hp: hpm, hpMax: hpm,
    x: W / 2, y: -d.r - 60, baseY: H * 0.2 + d.r * 0.35,
    est: "aviso", estT: 0, fase: 0, faseT: 0, flash: 0, recoil: 0,
    cds: [], muerteT: 0, invul: true, sacudida: 0,
  };
  warningT = 2.6;
  eBullets.length = 0;
  sfx("boss_llega");
  sacudir("medium");
  RHYTHM.marcar();
  sinDanioBoss = true;
  // OMEGA SOVEREIGN y AXIOMA tienen pista propia de jefe épico
  // ("jefe_final"/"final2" — distintas entre sí, ver `pistaJefe` de
  // JEFES.axioma). Los cuatro jefes completos de la expansión
  // (KRYOS/VÉRTICE/NÝX/VULCANO) comparten "jefe2" entre ellos, igual
  // que los nueve de la campaña base comparten "jefe" — bloque 5I.
  musica(d.epico ? "jefe_final" : "jefe", d.pistaJefe);
  // Entra sentada atrás y sube en la fase final. Ver cambiarFase().
  if (typeof MUSICA !== "undefined") { try { MUSICA.intensidad(0, 1.5); } catch (_) {} }
  // Estado propio del jefe (nodos, orbitadores...). Vive en el propio mb,
  // así que desaparece solo con él: nada que limpiar aparte.
  if (d.onSpawn) d.onSpawn(miniboss);
  // Si el jugador llega al jefe sin haber tocado ALPHA/BETA/GAMMA (M9,
  // M10), esos nodos se quedan flotando arriba y se pelean con el
  // nombre del jefe por el mismo sitio de la pantalla. El jefe manda.
  for (const s of sistemas) s.vivo = false;
}

function cambiarFase(mb, n) {
  const d = JEFES[mb.tipo];
  const f = d.fases[n];
  if (!f) return;
  mb.fase = n; mb.faseT = 0;
  mb.cds = f.ataques.map(a => rand(a.cd[0], a.cd[1]) * 0.6 * DIF.enemyCadenceMul);
  mb.avisados = null;
  RHYTHM.marcar();
  if (f.alEntrar) f.alEntrar(mb);
  // Subida de intensidad de la música por fase. Las pistas son mezclas
  // planas y no traen capas sueltas, así que la subida se hace abriendo
  // el filtro y ganando 1 dB: la música entra del todo justo cuando el
  // jefe se pone serio. Un solo sitio para los diez jefes.
  if (typeof MUSICA !== "undefined") {
    const ultima = f.final || n >= d.fases.length - 1;
    try { MUSICA.intensidad(ultima ? 1 : n * 0.45, ultima ? 0.9 : 1.4); } catch (_) {}
  }
  if (n > 0) {
    // TRANSICIÓN. Un pulso que barre los proyectiles, cambia el color de
    // los ojos y da al jugador un respiro de medio segundo. Sin ella, la
    // fase 2 solo se nota en que te matan más rápido.
    mb.invul = true; mb.estT = 0; mb.est = "transicion";
    eBullets.length = 0;
    telegrafos.length = 0;
    vfx("emp", mb.x, mb.y, Math.max(W, H) * 1.1, 0.7, { crece: 1.6, desde: 0.15 });
    vfx("fase", mb.x, mb.y, mb.r * 6, 0.6);
    // El fogonazo pasa por el puente para que la calidad BAJA lo baje a
    // la mitad: es accesibilidad, no adorno.
    VFX.puente.flash(0.4);
    sacudir(f.final ? "boss" : "heavy"); hitstop(0.08);
    sfx("fase");
    // Coreografía del cambio de fase: anillos, corona de partículas y
    // arcos según el estilo del jefe. La fase FINAL se nota más, pero por
    // el pulso y el color, no llenando la pantalla.
    VFX.bossFase({ x: mb.x, y: mb.y, r: mb.r, color: f.ojo || d.color(T),
                   tipo: mb.tipo, final: !!f.final });
    texto(W / 2, H * 0.36, f.final ? "FASE FINAL" : "FASE " + (n + 1), f.ojo, 26);
  }
}

function actualizarMiniboss(dt) {
  if (!miniboss) return;
  const mb = miniboss, d = JEFES[mb.tipo];
  if (mb.flash > 0) mb.flash -= dt;
  if (mb.recoil > 0) mb.recoil = Math.max(0, mb.recoil - dt * 45);
  mb.estT += dt;

  // ── AVISO: el jefe todavía no está, pero ya se le siente ──
  //  Antes aquí no pasaba NADA visualmente: 2,6 segundos de banner y una
  //  pantalla igual que siempre. Ahora la energía se junta arriba, por
  //  donde va a entrar, y el escenario se aparta un poco. Es lo que
  //  convierte "va a salir un jefe" en "algo está llegando".
  if (mb.est === "aviso") {
    const col = d.color(T);
    const yEntrada = SAFE_TOP + H * 0.12;
    // Partículas convergiendo hacia el punto de entrada.
    if (Math.random() < 0.55) {
      const a = rand(0, TAU), dd = rand(90, 230);
      VFX.part({
        x: mb.x + Math.cos(a) * dd, y: yEntrada + Math.sin(a) * dd * 0.6,
        vx: -Math.cos(a) * dd / 0.5, vy: -Math.sin(a) * dd * 0.6 / 0.5,
        life: 0.5, color: Math.random() < 0.35 ? "#ffffff" : col,
        r: rand(1.4, 3), fam: "bossAura", capa: VFX.FONDO, roce: 1,
      });
    }
    // Tres pulsos, uno por segundo: cuenta atrás sin números.
    const pulso = Math.floor((2.6 - mb.estT) * 1.15);
    if (pulso !== mb.ultPulso) {
      mb.ultPulso = pulso;
      if (pulso >= 0 && pulso < 3) {
        onda(mb.x, yEntrada, col, 120 + pulso * 40, 0.5, 2);
        sacudir("tiny");
      }
    }
    if (mb.estT > 2.6) { mb.est = "entrada"; mb.estT = 0; }
    return;
  }

  // ── ENTRADA: baja frenando, con los motores encendidos ──
  if (mb.est === "entrada") {
    const k = Math.min(1, mb.estT / 1.9);
    mb.y = (-d.r - 60) + (mb.baseY + d.r - (-d.r - 60)) * (1 - Math.pow(1 - k, 3));
    for (let i = 0; i < VFX.limites().escala * 3; i++) {
      part(mb.x + rand(-mb.r, mb.r), mb.y + mb.r * 0.7, rand(-60, 60), rand(120, 300),
        rand(0.2, 0.45), i % 3 ? d.color(T) : "#ffffff", rand(1.5, 3.6));
    }
    if (d.onEntrada) d.onEntrada(mb, dt, k);
    if (k >= 1) {
      mb.est = "combate"; mb.estT = 0; mb.invul = false;
      mb.baseY = mb.y;
      cambiarFase(mb, 0);
      sacudir(d.epico ? "boss" : "heavy");
      // Llegada: onda doble y el aura arrancando. El anillo fino se lee
      // como el golpe y el ancho como el peso.
      onda(mb.x, mb.y, "#ffffff", mb.r * 5, 0.4, 3, true);
      onda(mb.x, mb.y, d.color(T), mb.r * (d.epico ? 11 : 7), 0.65, 6, true);
      vfx("anillo", mb.x, mb.y, mb.r * 6, 0.5);
      VFX.bossFase({ x: mb.x, y: mb.y, r: mb.r, color: d.color(T),
                     tipo: mb.tipo, final: false });
    }
    return;
  }

  // ── TRANSICIÓN entre fases ──
  if (mb.est === "transicion") {
    mb.faseT += dt;
    d.fases[mb.fase].mover(mb, dt);
    if (mb.estT > 1.1) { mb.est = "combate"; mb.estT = 0; mb.invul = false; }
    return;
  }

  // ── MUERTE CINEMÁTICA ──
  //  d.epico (solo el jefe final) alarga los tres tramos: más fallos
  //  internos, más silencio antes de la victoria. Es la única muerte del
  //  juego que se toma su tiempo de verdad.
  if (mb.est === "muriendo") {
    const t1 = d.epico ? 2.8 : 1.9, t1f = d.epico ? 2.3 : 1.5, t3 = d.epico ? 4.6 : 3.1;
    mb.muerteT += dt;
    mb.x += Math.sin(mb.muerteT * 22) * 90 * dt;
    mb.y += 16 * dt;
    // 1 · Fallos internos en cadena.
    //     Los suelta el GUION de VFX, repartidos por el cuerpo y por el
    //     tiempo, en vez del sorteo por fotograma que había antes: así
    //     se lee como una nave enorme rompiéndose por partes.
    if (mb.muerteT < t1) {
      // Resplandor previo MUY contenido. Era 0.5 y se comió la
      // legibilidad: un velo blanco a toda pantalla durante cuatro
      // décimas lava el rosa de las balas enemigas aunque estén
      // pintadas por encima de todo. Medido: con 0.5 desaparecían 6 de
      // 40 balas de la detección; con 0.22 no desaparece ninguna.
      //
      // Y ya no hace falta más: el aviso de que viene la detonación lo
      // dan ahora ocho explosiones repartidas por el casco, que es
      // información de verdad y no un velo.
      if (mb.muerteT > t1f) VFX.puente.flash((mb.muerteT - t1f) / 0.4 * 0.22);
    }
    // 2 · Detonación principal
    else if (!mb.detonado) {
      mb.detonado = true;
      // Antes era 0.9 a pantalla completa. Se baja a 0.62 y pasa por el
      // puente, que lo escala con la calidad: en BAJO se queda en la
      // mitad. Un fogonazo blanco enorme no hace la explosión más
      // grande, solo ciega un momento.
      VFX.puente.flash(0.62);
      hitstop(d.epico ? 0.24 : 0.16);
      sacudir("boss");
      sfx("exp_boss");
      vfx("exp_boss", mb.x, mb.y, mb.r * 11, d.epico ? 1.9 : 1.4, { crece: 1.6, desde: 0.3 });
      vfx("ultimate", mb.x, mb.y, mb.r * 7, 1.0);
      onda(mb.x, mb.y, "#ffffff", Math.max(W, H) * 1.2, 0.9, 8, true);
      onda(mb.x, mb.y, d.color(T), mb.r * 14, 1.1, 7, true);
      // El grueso de partículas de la detonación lo pone el guion, con
      // su tope por fotograma. Aquí queda lo justo para el golpe.
      boom(mb.x, mb.y, d.color(T), d.epico ? 60 : 40, 3);
      restos(mb.x, mb.y, "#ffcf5c", d.epico ? 40 : 26, 2.4);
      eBullets.length = 0; telegrafos.length = 0;
      if (d.onDetonar) d.onDetonar(mb);
    }
    // 3 · Silencio breve y VICTORIA
    else if (mb.muerteT > t3) {
      score += d.puntos;
      texto(W / 2, H * 0.42, "+" + d.puntos.toLocaleString("es"), "#ffd700", 30);
      texto(W / 2, H * 0.48, d.nombre + " DESTRUIDO", "#ffffff", 18);
      // El jefe final de la campaña no cierra con la misma fanfarria que
      // los otros nueve. `finale` estaba fabricado y no lo llamaba nadie.
      sfx(d.epico ? "finale" : "victoria");
      for (const tipo of d.drops) soltarPremio(W / 2 + rand(-W * 0.3, W * 0.3), H * 0.3 + rand(-40, 40), tipo);
      if (hayGuardado) SAVE.sumar("perfil.jefesDerrotados", 1);
      miniboss = null;
      // Muerto el jefe se vuelve al combate SIEMPRE —también tras el
      // último, porque la misión aún no ha terminado y quedarse con el
      // tema del jefe sonando sobre una pantalla vacía se nota—, y el
      // corte de victoria va por encima.
      musica("victoria");
      musica("combate");
    }
    return;
  }

  // ── COMBATE ──
  mb.faseT += dt;
  const f = d.fases[mb.fase];
  f.mover(mb, dt);

  // Aura. La intensidad sale de la FASE y de la vida que le queda, así
  // que sube sola conforme el combate avanza. Un solo sitio para los
  // diez jefes; el estilo lo pone la tabla de VFX.
  const esFinal = f.final || mb.fase >= d.fases.length - 1;
  mb.inten = clamp(
    (mb.fase / Math.max(1, d.fases.length - 1)) * 0.7 +
    (1 - mb.hp / mb.hpMax) * 0.3 + (esFinal ? 0.2 : 0), 0, 1);
  VFX.bossAura({ x: mb.x, y: mb.y, r: mb.r, color: f.ojo || d.color(T),
                 tipo: mb.tipo, inten: mb.inten, dt });

  // Cambio de fase por umbral de vida
  const ratio = mb.hp / mb.hpMax;
  if (mb.fase + 1 < d.fases.length && ratio <= d.fases[mb.fase + 1].umbral) {
    cambiarFase(mb, mb.fase + 1);
    return;
  }

  for (let i = 0; i < f.ataques.length; i++) {
    const a = f.ataques[i];
    mb.cds[i] -= dt;
    if (a.avisa && !mb.avisados) mb.avisados = {};
    if (a.avisa && mb.cds[i] <= a.avisa * DIF.telegraphMul && !mb.avisados[i]) { mb.avisados[i] = 1; a.telegrafo(mb); }
    if (mb.cds[i] <= 0) {
      a.fn(mb);
      mb.cds[i] = rand(a.cd[0], a.cd[1]) * DIF.enemyCadenceMul;
      if (mb.avisados) mb.avisados[i] = 0;
    }
  }

  // Impactos de balas del jugador
  //
  // `d.coreExpuesto(mb)`, si el jefe lo define, puede apagar ESTE punto
  // de impacto central sin tocar `mb.invul` (que ya usan aviso/entrada/
  // transición y no se puede reutilizar aquí sin desactivar también
  // esas tres cosas). Por defecto no existe y el núcleo está expuesto
  // siempre, como en los quince jefes de antes: añadir el hook no les
  // cambia nada. Solo NÝX (5G) lo define, para el rato en que se
  // divide en dos mitades y el golpe real pasa por
  // `actualizarMitadesNyx`, no por aquí.
  const coreExpuesto = !d.coreExpuesto || d.coreExpuesto(mb);
  if (!mb.invul && coreExpuesto) {
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const dx = b.x - mb.x, dy = b.y - mb.y;
      if (dx * dx + dy * dy >= (b.r + mb.r * 0.84) ** 2) continue;
      mb.hp -= b.dmg * (d.reduccionDano ? d.reduccionDano(mb) : 1);
      mb.flash = 0.07; bulletsHit++;
      // Chispas en el punto de impacto, CON FRENO. Un jefe recibe
      // decenas de balas por segundo: sin el freno esto sería el sistema
      // entero dedicado a los impactos del jefe y encima lo taparía. Y
      // no se sacude la pantalla por cada bala, solo por lo que pesa.
      VFX.bossImpacto({
        x: b.x, y: b.y, dmg: b.dmg, tipo: mb.tipo, color: d.color(T),
        ang: Math.atan2(b.y - mb.y, b.x - mb.x),
      });
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (mb.hp <= 0) { matarMiniboss(); return; }
      if (gastada) break;
    }
    const dx = player.x - mb.x, dy = player.y - mb.y;
    if (dx * dx + dy * dy < (hitR() + mb.r * 0.78) ** 2) { golpe(mb.x, mb.y); if (state !== "play") return; }
  }
}

function matarMiniboss() {
  const mb = miniboss, d = JEFES[mb.tipo];
  mb.hp = 0; mb.est = "muriendo"; mb.estT = 0; mb.muerteT = 0;
  mb.invul = true; mb.detonado = false;
  maxCombo = Math.max(maxCombo, combo);
  telegrafos.length = 0;
  hitstop(0.1);
  sacudir("heavy");
  lluviaShards(mb.x, mb.y, d.epico ? "boss" : "miniboss");
  if (sinDanioBoss) skillEvent("sin_golpe", mb.x, mb.y);
  // El primer estallido del jefe. Era exp_grande, que es lo mismo que
  // suena al morir cualquier enemigo pesado: el golpe que abre la muerte
  // del jefe no puede ser el sonido más repetido de la misión.
  sfx("exp_miniboss");
  // Limpieza INMEDIATA y genérica de todo lo ambiental de la segunda
  // mitad de la campaña: ningún jefe tiene que acordarse de esto. Lo
  // específico de cada uno (nodos, orbitadores, subsistemas) sigue
  // yendo por d.onMuerte.
  pozos.length = 0; carriles.length = 0;
  // Las primitivas del bloque 5D entran en la misma limpieza genérica:
  // un jefe nuevo no tiene que acordarse de apagar la luz que encendió.
  columnas.length = 0; rupturas.length = 0;
  oscuro.obj = 0; oscuro.dur = 0;
  for (const s of sistemas) s.vivo = false;
  if (d.onMuerte) d.onMuerte(mb);

  // La coreografía entera, apuntada de una vez y soltada por el reloj de
  // VFX a lo largo de los tres segundos que el juego ya reservaba para
  // esto. No cambia NI UN timing: llena lo que antes estaba medio vacío
  // con un `Math.random() < 0.55` por fotograma.
  //
  // La posición se pasa como FUNCIÓN porque el jefe se sigue moviendo
  // mientras se muere: las explosiones tienen que salir de donde está el
  // casco en ese instante, no de donde estaba al empezar.
  const vent = d.epico ? 2.8 : 1.9, cola = d.epico ? 1.8 : 1.2;
  VFX.bossMuerte({
    x: () => (miniboss ? miniboss.x : mb.x),
    y: () => (miniboss ? miniboss.y : mb.y),
    r: mb.r, color: d.color(T), tipo: mb.tipo, epico: !!d.epico,
    ventana: vent, cola,
    puntos: puntosCuerpo(mb),
  });
}

// ── Dibujo del jefe ───────────────────────────────────────
function dibujarMiniboss() {
  if (!miniboss) return;
  const mb = miniboss, d = JEFES[mb.tipo];
  const col = d.color(T);
  const f = d.fases[mb.fase] || d.fases[0];
  if (mb.est === "aviso") return;

  const sp = SPRITES[d.sp];
  ctx.save();
  ctx.translate(mb.x, mb.y - mb.recoil * 0.6);
  if (mb.est === "muriendo") ctx.rotate(Math.sin(mb.muerteT * 9) * 0.06);

  // Aura de fase. Es la señal grande de que algo ha cambiado, visible
  // desde el otro lado de la pantalla.
  if (mb.est !== "entrada") {
    const est = VFX.estilo(mb.tipo);
    const inten = mb.inten || 0;
    // El latido lo marca el ESTILO del jefe, y se acelera con la
    // intensidad. Un reactor respira rápido; un blindado, despacio.
    const periodo = est.pulso * 1000 / (1 + inten * 1.4);
    const p = 0.5 + 0.5 * Math.sin(performance.now() / periodo);
    ctx.globalCompositeOperation = "lighter";
    // Techo bajo a propósito: el aura es un halo, no una mancha. Si sube
    // más, el casco del jefe deja de leerse y las balas de delante
    // también. La intensidad se nota en el RITMO, no en la opacidad.
    ctx.globalAlpha = (f.furia ? 0.24 : 0.13) + p * (0.10 + inten * 0.10);
    const rad = mb.r * (1.9 + inten * 0.5);
    const g = ctx.createRadialGradient(0, 0, mb.r * 0.5, 0, 0, rad);
    g.addColorStop(0, f.ojo); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, rad, 0, TAU); ctx.fill();
    // Fase final: un anillo fino, roto, que gira. Es el "está al
    // límite" — y cuesta dos arcos, sin desenfoques.
    if (inten > 0.85) {
      const gira = performance.now() / 520;
      ctx.globalAlpha = 0.22 + p * 0.28;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.6;
      for (let i = 0; i < 3; i++) {
        const a0 = gira + i * TAU / 3;
        ctx.beginPath();
        ctx.arc(0, 0, mb.r * 1.55, a0, a0 + 0.7);
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  if (sp) {
    // `d.alfaCasco(mb)`, si el jefe lo define, atenúa SOLO el casco
    // base — no el aura ni el ojo, que siguen a su alpha de siempre.
    // Por defecto no existe y el casco se pinta entero, como en los
    // veinte jefes de antes. Lo usa NÝX (5G) para que el cuerpo
    // principal se apague mientras dura la escisión en dos mitades
    // (`dibujarExtra` pinta esas dos aparte) y no se vean tres cuerpos
    // superpuestos.
    if (d.alfaCasco) ctx.globalAlpha = d.alfaCasco(mb);
    if (Q.sombras) { ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 18; }
    pintarSprite(sp, mb.r * 2.5);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    const enc = mb.flash > 0 ? Math.min(1, mb.flash * 10)
      : mb.est === "transicion" ? 0.35 + 0.25 * Math.sin(performance.now() / 70) : 0;
    if (enc > 0) {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = enc;
      pintarSprite(sp, mb.r * 2.5);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }
    // El casco se APAGA mientras se muere. Sin esto, el jefe llegaba a
    // su detonación con el mismo aspecto reluciente que al entrar: las
    // explosiones salían de un sprite intacto, y eso se lee como
    // "explosiones alrededor de un jefe" y no como "una nave enorme
    // rompiéndose". Se oscurece con `destination-in` sobre el propio
    // dibujo, así que respeta la silueta y no pinta un cuadrado.
    if (mb.est === "muriendo") {
      const k = clamp(mb.muerteT / (JEFES[mb.tipo].epico ? 2.8 : 1.9), 0, 1);
      // Se REPINTA el sprite en `multiply`, y no se rellena un
      // rectángulo. Es la trampa que este proyecto ya tiene documentada:
      // con `source-atop` el destino es el lienzo entero —que es
      // opaco— y sale un cuadrado gris alrededor del jefe. En
      // `multiply`, los píxeles transparentes del sprite dejan el fondo
      // intacto, así que se oscurece exactamente la silueta.
      ctx.globalCompositeOperation = "multiply";
      ctx.globalAlpha = k * 0.7;
      pintarSprite(sp, mb.r * 2.5);
      // Y brasas: dos o tres puntos al rojo que parpadean por dentro.
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 3; i++) {
        const fa = Math.sin(performance.now() / (90 + i * 37) + i * 2.1);
        if (fa < 0.3) continue;
        ctx.globalAlpha = k * fa * 0.7;
        const bx = Math.cos(i * 2.3) * mb.r * 0.55, by = Math.sin(i * 1.7) * mb.r * 0.45;
        const gb = ctx.createRadialGradient(bx, by, 0, bx, by, mb.r * 0.45);
        gb.addColorStop(0, "#fff3c4");
        gb.addColorStop(0.45, "#ff6a1f");
        gb.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = gb;
        ctx.beginPath(); ctx.arc(bx, by, mb.r * 0.45, 0, TAU); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.beginPath();
    FORMAS.acorazado({ r: mb.r, giro: mb.faseT * 0.04 });
    const lw = Math.max(3, mb.r * 0.12);
    ctx.lineJoin = "round";
    ctx.strokeStyle = mezcla(col, "#ffffff", 0.55); ctx.lineWidth = lw + 8; ctx.stroke();
    ctx.strokeStyle = TINTA; ctx.lineWidth = lw + 3; ctx.stroke();
    const g = ctx.createLinearGradient(0, -mb.r, 0, mb.r);
    g.addColorStop(0, mezcla(col, "#fff", 0.42));
    g.addColorStop(0.5, col);
    g.addColorStop(1, mezcla(col, TINTA, 0.5));
    ctx.fillStyle = mb.flash > 0 ? "#ffffff" : g; ctx.fill();
  }

  // Ojo/núcleo: cambia de color con la fase. Es el indicador más barato
  // y más legible de "esto ya no es lo de antes".
  if (mb.est !== "entrada") {
    const p = 0.55 + 0.45 * Math.sin(performance.now() / (f.furia ? 110 : 230));
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = p * 0.9;
    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, mb.r * 0.5);
    g2.addColorStop(0, "#ffffff"); g2.addColorStop(0.35, f.ojo);
    g2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0, 0, mb.r * 0.5, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // Extras en espacio de mundo (nodos, orbitadores): fuera del save/rotate
  // del casco, porque no tienen que rotar con la muerte cinemática.
  if (d.dibujarExtra) d.dibujarExtra(mb, f);
}

// La barra va aparte del jefe: es HUD, no mundo, y no debe temblar con
// la sacudida de cámara ni quedar tapada por una explosión.
// Banner + barra de tiempo del bonus event activo. Mismo lenguaje visual
// que barraJefe() pero más pequeño y más arriba: los dos no van a la vez
// -no hay bonus events durante un jefe- así que no compiten por sitio.
function barraBonus() {
  if (!bonusEvento || bonusEvento.estado !== "activo") return;
  const bW = Math.min(W - 60, 320), bH = 6;
  const bX = (W - bW) / 2, bY = SAFE_TOP + 118;
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 " + Math.round(clamp(W * 0.04, 13, 16)) + "px " + F;
  ctx.fillStyle = bonusEvento.color;
  ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 5;
  const marcador = bonusEvento.objetivo > 1 ? "  " + bonusEvento.progreso + "/" + bonusEvento.objetivo : "";
  letras(bonusEvento.nombre + marcador, W / 2, bY - 14, 2, "center");
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(bX - 2, bY - 2, bW + 4, bH + 4);
  ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(bX, bY, bW, bH);
  const k = clamp(1 - bonusEvento.t / bonusEvento.duracion, 0, 1);
  ctx.fillStyle = bonusEvento.color;
  ctx.fillRect(bX, bY, bW * k, bH);
  ctx.restore();
}

function barraJefe() {
  if (!miniboss || miniboss.est === "aviso") return;
  const mb = miniboss, d = JEFES[mb.tipo];
  const f = d.fases[mb.fase] || d.fases[0];
  // Debajo del bloque de marcador, no encima: el nombre del jefe pisando
  // los puntos hace ilegibles las dos cosas.
  const bW = Math.min(W - 40, 460), bH = 9;
  const bX = (W - bW) / 2, bY = SAFE_TOP + 128;
  const ent = mb.est === "entrada" ? Math.min(1, mb.estT / 0.6) : 1;
  ctx.save();
  ctx.globalAlpha = ent;
  ctx.textBaseline = "middle";

  ctx.textAlign = "center";
  ctx.font = "800 " + Math.round(clamp(W * 0.05, 16, 22)) + "px " + F;
  ctx.fillStyle = "#fff";
  ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 6;
  letras(d.nombre, W / 2, bY - 26, 3, "center");
  ctx.font = "700 9px " + F; ctx.fillStyle = f.ojo; ctx.globalAlpha = ent * 0.8;
  letras(d.titulo, W / 2, bY - 10, 1.8, "center");
  ctx.globalAlpha = ent;

  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(bX - 2, bY - 2, bW + 4, bH + 4);
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  ctx.fillRect(bX, bY, bW, bH);
  const fill = Math.max(0, mb.hp / mb.hpMax);
  const g = ctx.createLinearGradient(bX, 0, bX + bW, 0);
  g.addColorStop(0, mezcla(f.ojo, "#ffffff", 0.4));
  g.addColorStop(1, f.ojo);
  ctx.fillStyle = mb.flash > 0 ? "#ffffff" : g;
  ctx.fillRect(bX, bY, bW * fill, bH);
  // Marcas de umbral: se ve cuánto falta para el siguiente cambio.
  for (let i = 1; i < d.fases.length; i++) {
    const u = d.fases[i].umbral;
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(bX + bW * u - 1, bY - 2, 2, bH + 4);
  }
  ctx.shadowBlur = 0;
  ctx.restore();
  ctx.globalAlpha = 1;
}

// El menú también anima, así que todo esto tiene que existir ya
bullets = []; eBullets = []; enemies = []; premios = []; flotantes = [];
spawnQueue = []; miniboss = null; misionCompletaT = 0;
player = { x: W / 2, y: H * 0.78, r: 16, px: W / 2 };
targetX = player.x; targetY = player.y;
score = 0; lives = 0; elapsed = 0; level = 1; spawnAcc = 0; shootAcc = 0; invulnT = 0;
arma = 1; escudo = 0; turbo = 0; combo = 0; comboT = 0;
flash = 0; bank = 0;
crearFondo();

// ── Entrada ───────────────────────────────────────────────
// El dedo llega en coordenadas de ventana y el juego piensa en coordenadas
// de campo. El marco lateral se descuenta aquí y en ningún sitio más.
function pos(e) { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left - PX, y: e.clientY - r.top }; }
function aim(e) { const p = pos(e); targetX = p.x; targetY = p.y - CONFIG.offsetDedo; }
const dentro = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

c.addEventListener("pointerdown", (e) => {
  unlockAudio();
  if (state === "menu") {
    const p = pos(e);

    // La × de borrar, solo en las naves cargadas por ella, y antes que
    // nada: cae dentro del botón de selección y tiene que ganarle.
    for (const r of naveRects) {
      if (!dentro(p, r) || !r.borrar) continue;
      if (p.x > r.x + r.w - 24 && p.y < r.y + 24) {
        borrarCustom(r.indice);
        naveSel = Math.min(naveSel, NAVES.length - 1);
        guardarNave();
        sfx("ui_atras");
        return;
      }
    }
    // Al revés: lo último dibujado está encima y decide.
    for (let i = botones.length - 1; i >= 0; i--) {
      const b = botones[i];
      if (!dentro(p, b) || !b.fn) continue;
      // Se marca ANTES de ejecutar: si la acción lanza una transición,
      // el botón se ve hundido durante el barrido.
      UI.pulsar(b);
      sfx("ui_sel");
      b.fn();
      return;
    }
    return;
  }
  // Fin de partida y pausa comparten los botones del menú: se recogen en
  // botones[] al dibujarlos y se resuelven aquí igual que en la portada.
  if (state === "over" || paused) {
    const p = pos(e);
    for (let i = botones.length - 1; i >= 0; i--) {
      const b = botones[i];
      if (!dentro(p, b) || !b.fn) continue;
      UI.pulsar(b); sfx("ui_ok"); b.fn(); return;
    }
    return;
  }
  if (state === "play") {
    const p = pos(e);
    if (dentro(p, hudRects.pausa)) { paused = true; sfx("ui_pausa"); return; }
    if (dentro(p, hudRects.bomba)) { usarBomba(); return; }
  }
  dragging = true; aim(e);
  if (c.setPointerCapture) { try { c.setPointerCapture(e.pointerId); } catch (_) {} }
});
c.addEventListener("pointermove", (e) => { if (dragging && state === "play") aim(e); });
window.addEventListener("pointerup", () => { dragging = false; UI.soltar(); });
window.addEventListener("pointercancel", () => { dragging = false; UI.soltar(); });

// ── Desbloqueo de audio ───────────────────────────────────
//  En fase de CAPTURA y sobre window, no sobre el canvas: así corre
//  antes que la lógica del juego y también si el toque cae en cualquier
//  otro sitio. Se escuchan tres eventos porque iOS no siempre entrega
//  los mismos: pointerdown es el normal, touchend es el que Safari
//  cuenta como gesto en las versiones viejas, y click es la red.
//  unlockAudio() sale por la primera línea cuando ya está corriendo,
//  así que dejarlos puestos para siempre no cuesta nada.
for (const ev of ["pointerdown", "touchend", "click", "keydown"]) {
  window.addEventListener(ev, unlockAudio, { capture: true, passive: true });
}

// Cambiar de app, bloquear la pantalla o volver a la pestaña deja el
// contexto en "suspended" o en "interrupted" (este último solo iOS).
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) reanudarAudio();
});
window.addEventListener("pageshow", reanudarAudio);
window.addEventListener("focus", reanudarAudio);

// Teclado: WASD/flechas para mover, Escape para pausar, Ctrl+Shift+D para debug
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Escape" && state === "play") {
    paused = !paused;
    if (!paused) unlockAudio();
  }
  if (e.ctrlKey && e.shiftKey && e.code === "KeyD") showDebug = !showDebug;
  if (e.code === "Escape" && state === "over") state = "menu";
  if ((e.code === "Space" || e.code === "KeyB") && state === "play") { e.preventDefault(); usarBomba(); }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// ════════════════════════════════════════════════════════════
//  EFECTOS
// ════════════════════════════════════════════════════════════
//  La reserva, el presupuesto, las capas y la sacudida viven en
//  js/vfx.js. Aquí solo quedan los ATAJOS con los que el juego lleva
//  llamando desde siempre, para no tener que tocar los veinte sitios
//  —casi todos dentro de los jefes— que crean partículas.
//
//  El reparto por familias importa y no es decorativo: cada una tiene
//  su tope propio, así que una explosión de jefe no puede dejar sin
//  chispas a los disparos justo cuando más está pasando.

// Partículas ambientales de los jefes: humo, al FONDO. Es el destino
// correcto para todas las llamadas sueltas que había.
function part(x, y, vx, vy, life, color, r, tipo) {
  if (tipo === 1) {
    return VFX.part({ x, y, vx, vy, life, color, r, fam: "debris",
      capa: VFX.MEDIO, estira: 1, roce: 0.985, grav: 320 });
  }
  return VFX.part({ x, y, vx, vy, life, color, r, fam: "humo", capa: VFX.FONDO });
}

// El estallido de una muerte: chispas brillantes, en la capa media.
function boom(x, y, color, n, fuerza) {
  VFX.chispas(x, y, Math.max(1, n), color, fuerza || 1);
}

// Restos: fragmentos que salen despedidos y caen. Lo que separa "ha
// desaparecido" de "se ha roto". En calidad BAJA no existen.
function restos(x, y, color, n, fuerza) {
  VFX.debris(x, y, n, color, fuerza || 1);
}

// ── Efectos de sprite ─────────────────────────────────────
//  Un PNG luminoso escalando y apagándose. Es lo que hace que una
//  explosión parezca una explosión y no cuarenta puntos de colores.
let efectos = [];
const libresFx = [];
function vfx(id, x, y, tam, dur, o) {
  const sp = SPRITES["vfx_" + id] || SPRITES["imp_" + id];
  if (!sp) return;
  o = o || {};
  if (efectos.length > 60) return;
  const f = libresFx.pop() || {};
  f.sp = sp; f.x = x; f.y = y; f.tam = tam; f.t = 0; f.life = dur;
  f.rot = o.rot != null ? o.rot : rand(0, TAU);
  f.spin = o.spin || 0;
  f.crece = o.crece != null ? o.crece : 1.35;
  f.desde = o.desde != null ? o.desde : 0.55;
  f.alpha = o.alpha != null ? o.alpha : 1;
  f.aditivo = o.aditivo !== false;
  f.vx = o.vx || 0; f.vy = o.vy || 0;
  efectos.push(f);
}
function actualizarEfectos(dt) {
  for (let i = efectos.length - 1; i >= 0; i--) {
    const f = efectos[i];
    f.t += dt;
    f.rot += f.spin * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.t >= f.life) { libresFx.push(f); efectos.splice(i, 1); }
  }
}
function dibujarEfectos() {
  if (!efectos.length) return;
  for (const f of efectos) {
    const k = f.t / f.life;
    ctx.globalCompositeOperation = f.aditivo ? "lighter" : "source-over";
    // Sube rápido y se apaga despacio: al revés parece un parpadeo.
    ctx.globalAlpha = f.alpha * (k < 0.12 ? k / 0.12 : Math.pow(1 - (k - 0.12) / 0.88, 1.6));
    const s = f.tam * (f.desde + (f.crece - f.desde) * Math.pow(k, 0.45));
    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    const w = f.sp.width || f.sp.naturalWidth, h = f.sp.height || f.sp.naturalHeight;
    const esc = s / Math.max(w, h);
    ctx.drawImage(f.sp, -w * esc / 2, -h * esc / 2, w * esc, h * esc);
    ctx.restore();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}

// ── Muertes ───────────────────────────────────────────────
//  La misma explosión para todo hace que matar un caza y matar un
//  acorazado se sientan igual, que es exactamente lo que no queremos.
const MUERTES = {
  basica:   { vfx:"exp_basica",   tam:120, dur:0.42, part:16, fuerza:1.0, sac:"tiny",   snd:"exp_peq",    onda:0 },
  rapida:   { vfx:"chispa",       tam:100, dur:0.3,  part:12, fuerza:1.2, sac:"tiny",   snd:"exp_peq",    onda:0 },
  media:    { vfx:"exp_media",    tam:170, dur:0.5,  part:26, fuerza:1.3, sac:"small",  snd:"exp_med",    onda:0 },
  pesada:   { vfx:"exp_pesada",   tam:250, dur:0.62, part:44, fuerza:1.7, sac:"medium", snd:"exp_grande", onda:7, stop:0.045 },
  kamikaze: { vfx:"exp_kamikaze", tam:190, dur:0.5,  part:30, fuerza:1.5, sac:"small",  snd:"exp_med",    onda:4 },
  defensa:  { vfx:"defensa",      tam:200, dur:0.55, part:28, fuerza:1.4, sac:"small",  snd:"exp_med",    onda:5 },
  miniboss: { vfx:"exp_boss",     tam:420, dur:1.1,  part:80, fuerza:2.4, sac:"boss",   snd:"exp_miniboss", onda:14, stop:0.12 },
  // La nave del jugador tiene su propia muerte. Antes usaba "media" y
  // "pesada", o sea: perder una vida sonaba idéntico a matar un enemigo
  // mediano, y morir del todo, idéntico a matar uno grande. El único
  // momento que de verdad importa era el que no se distinguía.
  jugador:  { vfx:"exp_media",    tam:210, dur:0.55, part:34, fuerza:1.6, sac:"medium", snd:"jug_golpe",  onda:6 },
  jugador_final:{ vfx:"exp_pesada", tam:300, dur:0.8, part:60, fuerza:2.1, sac:"boss",  snd:"jug_muerte", onda:11, stop:0.06 },
};
function muerte(x, y, color, tipo) {
  const d = MUERTES[tipo] || MUERTES.basica;
  vfx(d.vfx, x, y, d.tam, d.dur, { spin: rand(-1, 1) });
  boom(x, y, color, d.part, d.fuerza);
  restos(x, y, mezcla(color, "#ffffff", 0.4), d.part * 0.35, d.fuerza);
  if (d.onda) onda(x, y, color, d.onda * 22, 0.55);
  sacudir(d.sac);
  sfx(d.snd);
  if (d.stop) hitstop(d.stop);
}

// ── Impactos ──────────────────────────────────────────────
//  Cada golpe tiene que sentirse pegado al disparo que lo causó. Un
//  proyectil que entra en un enemigo sin que pase nada es un proyectil
//  que el jugador cree que ha fallado.
const IMPACTOS = {
  ligero: { vfx:"ligero", tam:44, dur:0.2, part:3, snd:"imp_ligero" },
  medio:  { vfx:"medio",  tam:76, dur:0.26, part:7, snd:"imp_medio", sac:"tiny" },
  pesado: { vfx:"pesado", tam:130, dur:0.36, part:14, snd:"imp_pesado", sac:"small", stop:0.03 },
  escudo: { vfx:"escudo", tam:96, dur:0.3,  part:6, snd:"imp_escudo" },
  // FALTABA. El juego pedía "rotura" desde dos sitios —el escudo del
  // jugador y el de los enemigos con escudo— y como la clave no estaba,
  // caía al impacto ligero: perder el escudo sonaba a china contra el
  // casco. Es el fallo de audio más caro que había, porque le quitaba el
  // peso al único aviso de que te has quedado sin protección.
  // Estaba declarada DOS veces seguidas. La primera era código muerto:
  // en un objeto, la segunda gana. Se borra la muerta y se conserva
  // EXACTAMENTE la que venía sonando, para no cambiar ningún sonido.
  rotura: { vfx:"escudo_roto", tam:170, dur:0.5, part:20, snd:"emp", sac:"small" },
};
function impacto(x, y, peso, color) {
  const d = IMPACTOS[peso] || IMPACTOS.ligero;
  vfx(d.vfx, x, y, d.tam, d.dur, { aditivo: true });
  if (d.part) boom(x, y, color || "#ffffff", d.part, 0.6);
  if (d.sac) sacudir(d.sac);
  if (d.stop) hitstop(d.stop);
  sfx(d.snd);
}

// ── Sacudida de cámara ────────────────────────────────────
//  Cinco intensidades y ninguna continua. Una sacudida que no para deja
//  de comunicar nada y solo marea, sobre todo en una tablet a 30 cm.
//
//  El sistema está en VFX: intensidad, duración, PRIORIDAD y caída
//  propia por sacudida, con tope de simultáneas y techo de
//  desplazamiento. La prioridad es lo que hace que la muerte de un
//  jefe no la pise la chispa de un impacto que llega 20 ms después.
//
//  Y es SOLO cámara. No escribe en la posición de nada.
const SACUDIDAS = {
  tiny:   [3,  0.10, 1],
  small:  [6,  0.18, 2],
  medium: [11, 0.28, 3],
  heavy:  [17, 0.42, 4],
  boss:   [26, 0.70, 5],
};
function shake(mag, dur, prio) { VFX.sacudir(mag, dur, prio || 1); }

// El puente que VFX necesita para orquestar la muerte de un jefe: los
// sprites de efecto, el sonido y la sacudida viven aquí, no allí.
VFX.puente.vfx = (id, x, y, tam, dur, o) => vfx(id, x, y, tam, dur, o);
VFX.puente.sfx = (id, o) => sfx(id, o);
VFX.puente.sacudir = (nivel) => sacudir(nivel);
VFX.puente.flash = (v) => { flash = Math.max(flash, v * VFX.limites().flash); };

// Los puntos del CUERPO del jefe donde repartir las explosiones. Se leen
// del estado que el jefe YA tiene —nodos de AEGIS, pods de VESPER, subs
// de OMEGA— y si no tiene nada, se reparte por el casco. No se crea
// ninguna hitbox ni ninguna mecánica: solo se mira dónde están las
// piezas que ya estaban.
function puntosCuerpo(mb) {
  const piezas = mb.nodos || mb.subs || (mb.pods && [mb.pods.izq, mb.pods.der]);
  if (piezas && piezas.length) {
    return piezas.map(p => [p.ox / mb.r, p.oy / mb.r])
      .concat([[0, -0.55], [0, 0.5], [-0.5, 0.1], [0.5, 0.1]]);
  }
  return null;
}
function sacudir(nivel) {
  const s = SACUDIDAS[nivel];
  if (s) VFX.sacudir(s[0], s[1], s[2]);
}

// ── Congelado de impacto ──────────────────────────────────
//  Milisegundos, y solo en lo que pesa. Es lo que hace que un golpe
//  fuerte se sienta fuerte; usado a diario, hace que el juego vaya a
//  tirones.
let hitStop = 0;
function hitstop(s) { hitStop = Math.max(hitStop, s * OPCIONES.hitstop); }

// Anillo de choque. Solo para lo que pesa: acorazados, bombas y la nave.
// Si sale en cada muerte deja de significar nada.
function onda(x, y, color, rMax, dur, grosor) {
  VFX.onda(x, y, color, rMax, dur, grosor);
}
// ── Score flotante ──────────────────────────────────────────
//  Antes: `flotantes.push()` sin pool ni tope. Con una limpieza de
//  pantalla entera, eso son cientos de objetos nuevos en un fotograma
//  y —porque el desplazamiento vertical crecía con `flotantes.length`
//  sin límite— textos naciendo fuera de la pantalla.
//
//  Ahora: reciclados (nunca se tira uno al `splice`, vuelve a la cola
//  de libres), con tope duro, y los números CERCANOS EN ESPACIO Y
//  TIEMPO se funden en uno solo. Ocho "+50" seguidos de la misma
//  limpieza no se leen mejor que un "+400"; un "COMBO ×25" nunca se
//  funde con nada, es el que manda.
const FLOTANTES_MAX = 40;
const FUSION_RADIO = 46, FUSION_VENTANA = 0.12;
let flotantesLibres = [];
const esNumerico = (txt) => /^[+-]?\d/.test(txt);

function texto(x, y, txt, color, tam, opciones) {
  const prioridad = (opciones && opciones.prioridad) || 0;
  const numerico = esNumerico(txt);
  // Fusión: solo números recién nacidos, del mismo color, a un golpe de
  // vista. Fundir un nombre ("JACKPOT", "COMBO ×25") sería basura.
  if (numerico) {
    for (let i = flotantes.length - 1; i >= 0; i--) {
      const f = flotantes[i];
      if (!f.numerico || f.color !== color || f.t > FUSION_VENTANA) continue;
      const dx = f.x - x, dy = f.y - y;
      if (dx * dx + dy * dy > FUSION_RADIO * FUSION_RADIO) continue;
      const suma = (parseInt(f.txt, 10) || 0) + (parseInt(txt, 10) || 0);
      f.txt = (suma >= 0 ? "+" : "") + suma;
      f.t = 0;                                   // recién nacido: vive su `life` entero otra vez
      f.tam = Math.min((f.tam || 16) + 1, 28);    // crece un poco: se nota que ha fundido más de uno
      f.prioridad = Math.max(f.prioridad, prioridad);
      return f;
    }
  }
  let f;
  if (flotantes.length >= FLOTANTES_MAX) {
    // Sin hueco libre: cede el de menor prioridad y, entre iguales, el
    // más viejo. Un hito de combo o un jackpot no se pisan por un "+10".
    let peor = 0;
    for (let i = 1; i < flotantes.length; i++) {
      const a = flotantes[i], b = flotantes[peor];
      if (a.prioridad < b.prioridad || (a.prioridad === b.prioridad && a.t > b.t)) peor = i;
    }
    if (flotantes[peor].prioridad > prioridad) return null;   // ni sitio para él: se descarta en silencio
    f = flotantes[peor];
  } else if (flotantesLibres.length) {
    f = flotantesLibres.pop();
    flotantes.push(f);
  } else {
    f = {};
    flotantes.push(f);
  }
  f.x = clamp(x, 30, W - 30);
  f.y = clamp(y - (flotantes.length % 6) * 10, 30, H - 30);
  f.txt = txt; f.color = color; f.t = 0; f.life = 0.9; f.tam = tam || 16;
  f.numerico = numerico; f.prioridad = prioridad;
  return f;
}

// ── Enemigos ──────────────────────────────────────────────
// Modo supervivencia: elige al azar según el nivel. La campaña por
// niveles llamará a spawnEnemy() con el tipo y la posición concretos.
function elegirTipo() {
  const r = Math.random();
  if (level >= 2 && r < Math.min(0.13 + level * 0.035, 0.36)) return "veloz";
  if (level >= 4 && r > 0.90) return "kamikaze";
  if (level >= 3 && r > 0.84 && r <= 0.90) return "torreta";
  if (level >= 5 && r > 0.78 && r <= 0.84) return "tanque";
  return "normal";
}

// Probabilidad BASE de que un enemigo cualquiera nazca élite, en
// MEDIUM. `DIF.eliteFreqMul` (bloque 6B, sin usar hasta ahora) la
// escala por dificultad.
const ELITE_PROB_BASE = 0.05;

function spawnEnemy(tipo, x) {
  const k = tipo || elegirTipo();
  const d = ENEMIGOS[k];
  asegurarSpriteEnemigo(k);
  const r = d.r * ESC;   // el tamaño de la tabla es "a 414 px de ancho"
  // Élite: variante del mismo enemigo, nunca uno "grande" (jefes en
  // miniatura) ni de mando (ya son especiales por su cuenta). Vida y
  // cadencia se mueven poco -no es un x2 HP disfrazado-; lo que cambia
  // de verdad es el aura, el score y el drop.
  const elite = !d.grande && !d.esComando &&
    Math.random() < ELITE_PROB_BASE * DIF.eliteFreqMul;
  const hpMul = elite ? 1.4 : 1;
  const e = {
    tipo: k, r, hp: d.hp * hpMul, hpMax: d.hp * hpMul,
    x: x != null ? clamp(x, r, W - r) : rand(r + 10, W - r - 10),
    y: -r - 12,
    vy: CONFIG.velocidadEnemigo * ESC * (1 + (level - 1) * 0.13) * d.vel,
    fase: rand(0, TAU), giro: rand(0, TAU),
    cd: d.recarga ? d.recarga() * DIF.enemyCadenceMul * (elite ? 0.85 : 1) : 0, flash: 0,
    recoil: 0, lentoT: 0, avisado: 0, escFlash: 0, onda: 0, elite,
  };
  if (d.init) d.init(e);
  enemies.push(e);
  RHYTHM.marcar();
  return e;
}

// Qué CLASE de premio es. Se usa solo para el aspecto: cuántos anillos
// lleva, de qué color late y qué hace al recogerlo. El color por sí solo
// no basta —hay dieciséis premios y cuatro mundos que cambian la
// paleta—, así que la clase se lee también por la FORMA.
function clasePremio(tipo) {
  if (tipo === "bomba") return "bomba";
  if (tipo === "escudo" || tipo === "vida") return "defensa";
  if (tipo === "arma" || (PREMIOS[tipo] && PREMIOS[tipo].familia)) return "arma";
  return "util";
}

function soltarPremio(x, y, tipo) {
  premios.push({ x, y, vy: 95, r: 17, tipo, f: rand(0, TAU), giro: rand(0, TAU), t: 0, nace: 0.45 });
  // Aparecer un premio no sonaba. En pantalla llena es la única forma de
  // enterarse de que ha caído algo detrás de la explosión que lo soltó.
  sfx("premio_cae");
  // Y ahora tampoco se VEÍA aparecer: caía ya hecho en medio del humo de
  // la explosión que lo soltó. Se materializa, igual que la nave.
  const d = premio(tipo);
  VFX.materializar(x, y, 8, d.color, 46);
  onda(x, y, d.color, 42, 0.32, 3);
  RHYTHM.marcar();
}

// ── Daño ──────────────────────────────────────────────────
function enemigoMasCerca(x, y, max, excluir) {
  let mejor = null, md = max * max;
  for (const e of enemies) {
    if (e === excluir || e.hp <= 0) continue;
    const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy;
    if (d < md) { md = d; mejor = e; }
  }
  return mejor;
}
function danioArea(x, y, r, dmg, excluir) {
  const r2 = r * r;
  for (const e of enemies) {
    if (e === excluir || e.hp <= 0) continue;
    const dx = e.x - x, dy = e.y - y;
    if (dx * dx + dy * dy < r2) { e.hp -= dmg; e.flash = 0.08; }
  }
  if (miniboss) {
    const dx = miniboss.x - x, dy = miniboss.y - y;
    if (dx * dx + dy * dy < (r + miniboss.r) ** 2) { miniboss.hp -= dmg; miniboss.flash = 0.06; }
  }
}
let rayos = [];
// Estallido de bomba: hace daño durante los primeros 160 ms y luego solo
// es humo. La ventana corta es lo que permite salir del radio a tiempo.
let estallidos = [];
function estallido(x, y, r) {
  estallidos.push({ x, y, r, t: 0, life: 0.45, hecho: 0 });
  vfx("exp_media", x, y, r * 3.2, 0.42);
  boom(x, y, "#ff8a1f", 22, 1.2);
  onda(x, y, "#ff8a1f", r * 2.2, 0.4);
  sacudir("small");
  sfx("exp_med");
}
function cadenaElectrica(b, x, y, victima) {
  const o = enemigoMasCerca(x, y, 150, victima);
  if (!o) return;
  o.hp -= b.cadena; o.flash = 0.1;
  rayos.push({ x1: x, y1: y, x2: o.x, y2: o.y, col: b.col, t: 0, life: 0.13 });
  impacto(o.x, o.y, "ligero", b.col);
}
// Devuelve true si la bala se ha consumido.
function golpearCon(b, x, y, victima) {
  impacto(x, y, b.imp, b.col);
  if (b.area) danioArea(x, y, b.area, b.dmg * 0.6, victima);
  if (b.cadena) cadenaElectrica(b, x, y, victima);
  if (b.lento && victima) victima.lentoT = Math.max(victima.lentoT || 0, 1.6);
  if (b.pierce > 0) { b.pierce--; b.cd = 0.07; return false; }
  return true;
}

// ════════════════════════════════════════════════════════════
//  KILL FUNNEL — alMatar()
// ════════════════════════════════════════════════════════════
//  Había cinco sitios que subían combo/score por su cuenta: matar(),
//  los nodos de AEGIS, los subsistemas de OMEGA, las torretas de
//  escenario y ALPHA/BETA/GAMMA de M9. Cualquier sistema futuro que
//  necesite enterarse de "algo ha muerto" —Overdrive, skill events,
//  élites, jackpot, boss break— tenía que engancharse a los cinco por
//  separado, o se le olvidaba uno. Éste es el único embudo desde
//  ahora: combo, comboT, multCombo, el score y el texto flotante
//  pasan todos por aquí. Cada sitio sigue soltando su propio efecto de
//  muerte, su propio premio o su propio texto con nombre —eso no es
//  un dato de kill, es suyo— y pasa por `enemigos.splice`/`.vivo =
//  false`/lo que le toque, que tampoco es cosa de este embudo.
//
//  `opciones.combo` decide si `puntosBase` se multiplica por el combo
//  (matar(), nodos, torretas: sí) o va a secas (subsistemas de OMEGA y
//  M9, que hoy dan 500/400 fijos). NO se ha igualado el criterio:
//  igualarlo sería tocar el balance, y esto es una migración, no un
//  rebalanceo — los cinco sitios dan EXACTAMENTE lo que daban antes.
function alMatar(o) {
  const opciones = o.opciones || {};
  const cuentaCombo = opciones.combo !== false;
  combo++; comboT = comboVentana(); enemiesKilled++;
  maxCombo = Math.max(maxCombo, combo);
  const mult = multCombo();
  const base = Math.round(o.puntosBase * (cuentaCombo ? mult : 1));
  // El multiplicador de DIFICULTAD se aplica AQUÍ, en el único embudo, y
  // no en las tablas de puntos de ENEMIGOS/DEFENSA_TIPOS (no se tocan):
  // así FÁCIL/NORMAL/DIFÍCIL premian sin desequilibrar el ELOI, que sale
  // de los extras de `cerrarMision()` — no de aquí — y no se mueve.
  // El bono de OVERDRIVE va en el mismo sitio: activa, TODO kill vale más.
  const pts = Math.round(base * DIF.scoreMul * (overdriveActivo > 0 ? 1.5 : 1));
  score += pts;
  hitoCombo();
  // BOSS BREAK carga más que un kill normal: es un momento más raro.
  const esRomperJefe = o.fuente === "nodoAegis" || o.fuente === "subOmega" || o.fuente === "sistema";
  cargarOverdrive(esRomperJefe ? 6 : 2.2);

  const mostrar = opciones.texto === true ? true : opciones.texto === false ? false : mult > 1;
  if (mostrar) {
    texto(o.posicion.x, o.posicion.y + (opciones.textoOffsetY || 0),
      "+" + pts, opciones.textoColor || T.bala, opciones.textoTam || (13 + Math.min(8, mult)));
  }
  if (opciones.premio && Math.random() < opciones.premio.prob) {
    const rango = opciones.premio.offsetX;
    const ox = rango ? rand(rango[0], rango[1]) : 0;
    soltarPremio(o.posicion.x + ox, o.posicion.y, elegirPremioAleatorio());
  }

  // CHAIN KILL: cuenta CUALQUIER muerte que pase por este embudo, no
  // solo enemigos — un AEGIS y dos torretas seguidas también son una
  // cadena. `=== CADENA_OBJETIVO` y no `>=`: dispara una vez por
  // racha, no en cada muerte mientras la racha sigue viva.
  cadenaTiempos.push(elapsed);
  cadenaTiempos = cadenaTiempos.filter(t => elapsed - t <= CADENA_VENTANA);
  if (cadenaTiempos.length === CADENA_OBJETIVO) skillEvent("cadena", o.posicion.x, o.posicion.y);

  // BOSS BREAK: romper una pieza de jefe (nodo de AEGIS, subsistema de
  // OMEGA, ALPHA/BETA/GAMMA de M9) es ya un momento fuerte por su
  // cuenta. No todas -"no abusar"- así que es una tirada, no un
  // disparo garantizado.
  if (esRomperJefe && Math.random() < 0.3) jackpot(o.posicion.x, o.posicion.y);

  // PLASMA BURST: explosión propia al matar, escalada por nivel. Daño
  // aparte del de la bala que mató -no lo dobla, lo complementa-.
  if (upgradesJugador.plasma_burst) {
    const n = upgradesJugador.plasma_burst;
    danioArea(o.posicion.x, o.posicion.y, 60 + n * 18, 6 + n * 4, null);
    vfx("exp_media", o.posicion.x, o.posicion.y, 40 + n * 10, 0.3);
  }
  comprobarUpgradeOfrecido();
  return { pts, mult, combo };
}

function matar(e, i) {
  const d = ENEMIGOS[e.tipo];
  muerte(e.x, e.y, d.color(T), d.muerte || (d.grande ? "pesada" : "basica"));
  alMatar({
    fuente: "enemigo", tipo: e.tipo, puntosBase: d.puntos * (e.elite ? 2.2 : 1), posicion: { x: e.x, y: e.y },
    opciones: { textoOffsetY: -e.r, premio: { prob: e.elite ? 1 : CONFIG.probPremio * (d.premio || 1) } },
  });
  lluviaShards(e.x, e.y, e.elite ? "elite" : "normal");
  if (e.elite) {
    elitesMuertos++;
    cargarOverdrive(6);
    // Cadena de élites: dos dentro de la ventana disparan un jackpot.
    // No hace falta contar más de dos — la ventana ya se corta sola si
    // el jugador tarda.
    if (elapsed - eliteChainT <= ELITE_CADENA_VENTANA) jackpot(e.x, e.y);
    eliteChainT = elapsed;
  }
  if (e.bonusGen) bonusEventoMuerte(e);
  if (e.olaGen) cerrarOla(e.olaGen, e.x, e.y, false);
  enemies.splice(i, 1);
  // Gancho GENÉRICO y opcional: un enemigo que deja algo detrás al morir
  // (crisol, bloque 5E) declara `alMorir(e)`. Va DESPUÉS del splice,
  // igual que `matarMiniboss()` limpia antes de que nadie más mire ese
  // hueco: lo que `alMorir` empuje a `enemies` no se procesa este mismo
  // fotograma porque el bucle que llama a `matar()` recorre hacia atrás
  // y ya ha dejado atrás los índices por delante de `i`.
  if (d.alMorir) d.alMorir(e);
}

// ── Combo ─────────────────────────────────────────────────
//  Sube por muertes encadenadas y se cae al recibir daño. Los hitos
//  (x5, x10, x25, x50, x100) sí avisan; los demás números, no: llenar la
//  pantalla de cifras es la manera más rápida de que dejen de leerse.
// ── Cierre de misión ──────────────────────────────────────
//  Los extras se calculan una vez y se enseñan uno a uno. Ver la
//  puntuación subir en tramos con nombre es lo que convierte terminar
//  una misión en un premio y no en una pantalla de carga.
let resultado = null;
// ════════════════════════════════════════════════════════════
//  RANK
// ════════════════════════════════════════════════════════════
//  No solo score: score/segundo (normaliza misiones cortas y largas),
//  combo, cuánto daño se ha evitado, skill events, élites, si el jefe
//  cayó sin un golpe, y la dificultad elegida -jugar en DIFÍCIL da
//  hasta 10 puntos de margen que FÁCIL no da, así que un S+ en DIFÍCIL
//  pesa de verdad-. 100 puntos de la partida + 10 de dificultad = 110.
const RANK_UMBRALES = [["S+", 95], ["S", 80], ["A", 60], ["B", 35], ["C", 0]];
const RANK_NUMERO = { "C": 0, "B": 1, "A": 2, "S": 3, "S+": 4 };
const RANK_COLOR = { "C": "#8fa0b8", "B": "#7df9ff", "A": "#8fffb0", "S": "#ffd700", "S+": "#ff2fbd" };
const totalSkillEventos = () => Object.keys(skillEventos).reduce((a, k) => a + skillEventos[k], 0);
function calcularRank() {
  const dur = Math.max(1, elapsed);
  const pScore = clamp((score / dur) / 15, 0, 1) * 35;
  const pCombo = clamp(maxCombo / 60, 0, 1) * 20;
  const pLimpio = clamp(1 - vidasPerdidas / 3, 0, 1) * 15;
  const pSkills = clamp(totalSkillEventos() / 6, 0, 1) * 15;
  const pElites = clamp(elitesMuertos / 4, 0, 1) * 10;
  const pBoss = sinDanioBoss ? 5 : 0;
  const pDificultad = { easy: 0, medium: 5, high: 10 }[OPCIONES.dificultad] || 0;
  const puntos = pScore + pCombo + pLimpio + pSkills + pElites + pBoss + pDificultad;
  let letra = "C";
  for (const [l, umbral] of RANK_UMBRALES) { if (puntos >= umbral) { letra = l; break; } }
  return { letra, numero: RANK_NUMERO[letra], puntos: Math.round(puntos) };
}

function cerrarMision() {
  const prec = bulletsFiredo > 0 ? Math.round(bulletsHit / bulletsFiredo * 100) : 0;
  const extras = [
    ["MISIÓN COMPLETADA", 1500],
    ["COMBO MÁXIMO ×" + maxCombo, maxCombo * 25],
    ["PRECISIÓN " + prec + "%", prec * 15],
  ];
  if (sinDanio) extras.push(["SIN UN RASGUÑO", 5000]);
  if (lives >= CONFIG.vidas) extras.push(["INTEGRIDAD INTACTA", 1200]);
  const total = extras.reduce((a, b) => a + b[1], 0);
  score += total;
  resultado = { extras, total, base: score - total, prec };
  // RANK y el resumen de la partida (bloque 6I) — se calculan con el
  // score YA final, que es el número que el jugador ve en pantalla.
  resultado.rank = calcularRank();
  resultado.maxCombo = maxCombo;
  resultado.skillEventos = totalSkillEventos();
  resultado.elites = elitesMuertos;
  resultado.overdrives = overdrivesActivados;
  resultado.jackpots = jackpotsCount;
  resultado.evoluciones = evolucionesTotal;
  resultado.dificultad = DIF.label;
  misionCompletaT = 6.5;
  // Los contadores animados empiezan de cero en cada misión: si no, el
  // total de la anterior se quedaría en pantalla como punto de partida.
  UI.reiniciarCifras();
  sfx("victoria");
  // Corte propio, más corto y menos triunfal que el del jefe: esto se
  // oye diez veces por campaña.
  musica("mision");
  if (hayGuardado) {
    // MISIÓN COMPLETADA es el punto de guardado más importante del
    // juego: es lo que el jugador cree que ha ganado. Va TODO junto y
    // se escribe en el acto, sin esperar al freno del autoguardado.
    if (SAVE.subirRecord(score)) best = score;
    resultado.recordMision = SAVE.subirRecordMision(misionIdx, score);
    // Bloque 6I: récord de score Y de rank, cada uno por su lado, los
    // dos por misión Y por dificultad — no tienen por qué caer juntos.
    resultado.recordDif = SAVE.subirRecordDif(misionIdx, OPCIONES.dificultad, score);
    resultado.rankRecordDif = SAVE.subirRankDif(misionIdx, OPCIONES.dificultad, resultado.rank.numero);
    SAVE.sumar("perfil.closeCalls", skillEventos.cierre);
    SAVE.sumar("perfil.elitesDerrotados", elitesMuertos);
    SAVE.sumar("perfil.jackpots", jackpotsCount);
    SAVE.sumar("perfil.evolucionesDescubiertas", evolucionesTotal);
    SAVE.sumar("perfil.overdrivesUsados", overdrivesActivados);
    // El máximo desbloqueado SOLO sube. Rejugar la M1 con diez abiertas
    // no puede volver a cerrarlas: esta línea es el arreglo del bug.
    misionMax = SAVE.subirMision(Math.min(misionIdx + 1, MISIONES.length - 1));
    // Chasis que se abran con esta misión. Aquí SÍ se avisa: es el
    // momento en que el jugador se lo ha ganado. La propia lista de
    // desbloqueadas evita que el aviso salga dos veces.
    // misionIdx + 1 son las misiones completadas contando ésta, sin el
    // tope de misionMax: es lo que permite que la M10 abra NOVA.
    const nuevosChasis = SHIPS.otorgarPorProgreso(
      Math.max(misionMax, misionIdx + 1), NAVES[naveSel] && NAVES[naveSel].id, true);
    // Skins de material de la expansión (bloque 5H): mismo momento,
    // mismo aviso, misma concesión retroactiva — solo que la tabla es
    // otra. `misionIdx + 1` y no `misionMax`: es lo mismo que ya hace
    // la línea de arriba y por lo mismo, para que M20 conceda COSMIC
    // exactamente cuando toca, sin esperar a que `misionMax` termine de
    // subir.
    SHIPS.otorgarSkinsPorProgreso(Math.max(misionMax, misionIdx + 1), true);
    SHIPS.otorgarEmblemasPorProgreso(Math.max(misionMax, misionIdx + 1), true);
    if (nuevosChasis.length) {
      NAVES = SHIPS.construir(NAVES[naveSel] && NAVES[naveSel].id, SAVE.get("naves.desbloqueadas", []));
      nvIdx = -1; trIdx = -1; spIdx = -1;
      naveSel = Math.max(0, NAVES.findIndex(n => n.id === (SAVE.get("naves.seleccionada") || "")));
    }
    SAVE.sumar("perfil.misionesCompletadas", 1);
    SAVE.sumar("perfil.tiempoJugado", Math.round(elapsed));
    // ELOI: la moneda del juego. Todavía no se gasta en nada —eso es
    // del bloque del hangar— pero se acumula desde ya para que cuando
    // haya tienda no empiece a cero quien lleve media campaña.
    resultado.eloi = Math.round(total / 10);
    SAVE.sumar("perfil.eloi", resultado.eloi);
    // Mismo ELOI, aparte: la pantalla de EXPANSIÓN COMPLETADA (5H) quiere
    // enseñar lo ganado SOLO en M11+, no el total de toda la partida.
    // Es una segunda cuenta del mismo dato, no un sistema de moneda
    // nuevo — `perfil.eloi` sigue siendo la única suma que importa.
    if (misionIdx >= MISIONES_BASE) SAVE.sumar("campana.eloiExp", resultado.eloi);
    SAVE.ya("misión completada");
    // Aviso de desbloqueo. Genérico: el bloque del hangar usará el mismo
    // sistema con tipo "nave" o "skin" sin tocar nada de esto.
    if (misionMax === misionIdx + 1 && misionMax < MISIONES.length) {
      UI.desbloqueo({
        tipo: "mision",
        titulo: "M" + (misionMax + 1) + " · " + MISIONES[misionMax].nombre,
        desc: MISIONES[misionMax].desc,
        color: (TEMAS.find(t => t.id === MISIONES[misionMax].temaId) || TEMAS[0]).nave,
      });
    }
  } else if (score > best) best = score;
}

const HITOS = [5, 10, 25, 50, 100];
const multCombo = () => (1 + Math.floor(combo / 8)) * (dobleT > 0 ? 2 : 1);
function hitoCombo() {
  for (const h of HITOS) {
    if (combo === h && comboHito < h) {
      comboHito = h;
      texto(W / 2, H * 0.62, "COMBO ×" + h, h >= 50 ? "#ffd700" : T.bala, 22 + h / 10, { prioridad: 2 });
      vfx("chispa", W / 2, H * 0.62, 90 + h, 0.4);
      sfx("combo", { tono: 1 + HITOS.indexOf(h) * 0.12 });
      if (h >= 25) sacudir("tiny");
      cargarOverdrive(h * 0.3);
      if (h >= 50) jackpot(W / 2, H * 0.48);
    }
  }
}

function cogerPremio(p) {
  const d = premio(p.tipo);
  const clase = clasePremio(p.tipo);
  sfx("pickup");
  vfx("chispa", p.x, p.y, 96, 0.34);
  // Recoger va por la familia PRIORITARIA: con la pantalla llena, la
  // confirmación de que has cogido algo no puede ser lo primero que se
  // cae del presupuesto.
  VFX.jugador(p.x, p.y, clase === "defensa" ? 22 : 16, d.color, 1, -Math.PI / 2, Math.PI * 2);
  onda(p.x, p.y, d.color, 78, 0.34);
  // Segundo anillo, más lento y más ancho, solo en lo que cambia el
  // estado del jugador de verdad. Un turbo y una vida extra no pueden
  // sentirse igual.
  if (clase === "defensa" || clase === "bomba") {
    onda(p.x, p.y, mezcla(d.color, "#ffffff", 0.5), 130, 0.5, 4);
  }
  // El nombre va FUERA del PNG, y solo al recogerlo. Un icono con letras
  // encima es un cartel; sin ellas, es un objeto.
  texto(p.x, p.y - 26, d.nombre, d.color, 17);

  if (d.familia) { armaId = d.familia; shootAcc = 0; sfx("mejora"); flash = Math.max(flash, 0.22); }
  else if (p.tipo === "arma") {
    if (arma >= ARMA_MAX) { score += 250; texto(p.x, p.y - 46, "+250", "#ffd700", 14); }
    else { arma++; sfx("mejora"); }
  }
  else if (p.tipo === "escudo") { escudo = 1; sfx("escudo_on"); }
  else if (p.tipo === "vida") { lives = Math.min(lives + 1, 6); sfx("vida"); }
  else if (p.tipo === "rapido") turbo = 8;
  else if (p.tipo === "x2") dobleT = 14;
  else if (p.tipo === "iman") imanT = 14;
  // Recoger una bomba es GANAR UNA CARGA, y hasta ahora sonaba igual que
  // recoger cualquier otra cosa. La subida de `carga` dice justo eso: hay
  // algo guardado y listo. Solo suena si el contador sube de verdad: con
  // cinco bombas ya en la mochila no se ha ganado nada que anunciar.
  else if (p.tipo === "bomba") {
    const antes = bombas;
    bombas = Math.min(bombas + 1, 5);
    if (bombas > antes) sfx("carga");
  }
}

// ── Bomba ─────────────────────────────────────────────────
//  El momento más satisfactorio del juego tiene que estar en las manos
//  del jugador, no caer del cielo. Se guarda y se gasta cuando ella
//  decide. Y no deja la pantalla en blanco: un fogonazo corto, una onda
//  que recorre el campo y el daño llegando con ella.
let bombaT = 0;
function usarBomba() {
  if (bombas <= 0 || state !== "play" || paused || misionCompletaT > 0) {
    if (state === "play") sfx("ui_no");
    return;
  }
  bombas--;
  bombaT = 0.85;
  flash = Math.max(flash, 0.55);
  sacudir("heavy");
  hitstop(0.07);
  sfx("bomba");
  vfx("ultimate", player.x, player.y, Math.max(W, H) * 1.25, 0.8, { crece: 1.5, desde: 0.1, alpha: 0.85 });
  onda(player.x, player.y, "#ffffff", Math.max(W, H) * 1.2, 0.65);
  onda(player.x, player.y, T.nave, Math.max(W, H) * 0.9, 0.5);
  invulnT = Math.max(invulnT, 0.9);

  // Los proyectiles no desaparecen: se convierten en puntos. Ver la
  // pantalla llena de balas volverse puntuación es la recompensa.
  const balas = eBullets.length;
  for (const b of eBullets) { if (Math.random() < 0.35) boom(b.x, b.y, TIRO_SUYO, 2, 0.5); }
  score += balas * 5;
  eBullets.length = 0;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.hp -= 14;
    if (e.hp <= 0) matar(e, i);
    else e.flash = 0.2;
  }
  for (let i = defensas.length - 1; i >= 0; i--) {
    defensas[i].hp -= 10;
    if (defensas[i].hp <= 0) { muerte(defensas[i].x, defensas[i].y, "#4499ff", "defensa"); defensas.splice(i, 1); }
  }
  for (let i = hazards.length - 1; i >= 0; i--) { muerte(hazards[i].x, hazards[i].y, "#ff8800", "basica"); hazards.splice(i, 1); }
  if (miniboss) { miniboss.hp -= Math.ceil(miniboss.hpMax * 0.09); miniboss.flash = 0.3; }
  if (balas) texto(W / 2, H * 0.5, "+" + balas * 5, "#ffffff", 24);
}

// `fx`/`fy` son de dónde viene el golpe, y son OPCIONALES: solo sirven
// para orientar el destello del escudo hacia el lado por el que han
// dado. No cambian ni el daño ni la hitbox ni nada del cálculo.
function golpe(fx, fy) {
  if (invulnT > 0) return;
  // Ángulo del impacto visto desde la nave. Sin origen conocido se
  // asume "desde arriba", que es de donde viene casi todo.
  const angImp = (fx !== undefined && fy !== undefined)
    ? Math.atan2(fy - player.y, fx - player.x) : -Math.PI / 2;

  if (escudo > 0) {
    escudo = 0; invulnT = 0.9;
    escudoRoto = 0.5; escudoAng = angImp;
    impacto(player.x, player.y, "rotura", "#5ce1ff");
    // Las chispas salen POR DONDE han dado, en un abanico de 120°, no
    // en círculo: así el golpe dice de dónde venía.
    VFX.jugador(player.x + Math.cos(angImp) * player.r * 1.6,
                player.y + Math.sin(angImp) * player.r * 1.6,
                26, "#9beeff", 1.3, angImp, Math.PI * 0.66);
    onda(player.x, player.y, "#5ce1ff", player.r * 7, 0.4);
    texto(player.x, player.y - 34, "ESCUDO ROTO", "#5ce1ff", 15);
    return;
  }
  lives--; invulnT = CONFIG.invulnerable * DIF.invulnMul; vidasPerdidas++;
  RHYTHM.marcar();
  if (bonusEvento && bonusEvento.tipo === "riesgo" && bonusEvento.estado === "activo") finalizarBonusEvento(false);
  // OVERDRIVE: en carga, un golpe le cuesta un buen mordisco. Ya activa,
  // NO se apaga en seco -eso castigaría doblemente un golpe que ya duele-
  // sino que se le recortan unos segundos.
  if (overdriveActivo > 0) overdriveActivo = Math.max(0, overdriveActivo - 3);
  else overdrive = Math.max(0, overdrive - 20);
  for (const w of olas.values()) w.sinDanio = false;
  sinDanioBoss = false;
  sinDanio = false;
  arma = Math.max(1, arma - 1);
  combo = 0; comboHito = 0; comboT = 0;
  danoT = 0.32; danoAng = angImp;
  muerte(player.x, player.y, T.nave, "jugador");
  // Chispas del casco, prioritarias: esto no se recorta ni en BAJO.
  VFX.jugador(player.x, player.y, 30, "#ffffff", 1.4, angImp, Math.PI);
  onda(player.x, player.y, T.nave, player.r * 9);
  sacudir("heavy"); hitstop(0.05);
  // Última vida. Nada avisaba de esto, y es la información más
  // importante de la partida. La alarma va DESPUÉS del golpe, no encima.
  if (lives === 1) setTimeout(() => sfx("aviso"), 420);
  if (lives > 0) {
    // Sigue viva: la nave se REHACE. La materialización empieza medio
    // segundo después del golpe, cuando ya ha pasado la explosión, y es
    // lo que separa "he perdido una vida" de "me han matado".
    respawnT = 0.6;
    setTimeout(() => { if (state === "play") sfx("carga", { vol: 0.7 }); }, 260);
  }
  if (lives <= 0) {
    state = "over"; overAt = performance.now();
    respawnT = 0;
    UI.reiniciarCifras();
    // Muerte del jugador en tres capas: el casco reventando, los restos
    // saliendo y el anillo. Es más que la de un enemigo pesado y menos
    // que la de un jefe, que es exactamente donde tiene que estar.
    muerte(player.x, player.y, nvColor(), "jugador_final");
    VFX.jugador(player.x, player.y, 40, "#ffffff", 1.8);
    VFX.debris(player.x, player.y, 26, nvColor(), 1.9);
    onda(player.x, player.y, "#ffffff", player.r * 11, 0.5, 5);
    sacudir("boss"); sfx("derrota");
    // El juego llevaba desde siempre sin música de derrota: era el único
    // estado con la llamada sin poner. La pista se va del todo, que es
    // lo que hace que la pantalla de fin de partida pese.
    musica("derrota");
    onda(player.x, player.y, T.motor, player.r * 20, 0.9);
    // Fin de partida: se escribe en el acto. Es el momento en que más
    // probable es que el jugador cierre la pestaña.
    if (hayGuardado) {
      if (SAVE.subirRecord(score)) best = score;
      if (modo === "campana") SAVE.subirRecordMision(misionIdx, score);
      SAVE.sumar("perfil.tiempoJugado", Math.round(elapsed));
      SAVE.ya("fin de partida");
    } else if (score > best) best = score;
    // Limpiar campo para que el overlay quede limpio
    enemies.length = 0; eBullets.length = 0; bullets.length = 0;
    premios.length = 0; spawnQueue.length = 0; miniboss = null;
    hazards.length = 0; defensas.length = 0; zonas.length = 0;
    columnas.length = 0; rupturas.length = 0;
    oscuro.k = 0; oscuro.obj = 0; oscuro.dur = 0;
    hazardEnabled = false; zonaEnabled = false;
  }
}

// ── Disparo ───────────────────────────────────────────────
//  Un disparo son SIETE cosas, no una: núcleo, halo, estela, fogonazo en
//  la boca del cañón, impacto, sonido y retroceso. Quitar cualquiera de
//  ellas y el arma deja de sentirse conectada a la mano.
const libresBala = [];
function nuevaBala(x, y, vx, vy, a) {
  const b = libresBala.pop() || {};
  b.x = x; b.y = y; b.vx = vx; b.vy = vy;
  // HEAVY CORE: +20%/nivel, multiplicativo sobre lo que ya pone la nave.
  const dmgUp = 1 + (upgradesJugador.heavy_core || 0) * 0.2;
  b.r = a.r; b.dmg = a.dmg * (naveActual().dmg || 1) * dmgUp;
  b.col = a.col; b.sp = SPRITES[a.sp]; b.largo = a.largo;
  b.pierce = a.pierce || 0; b.area = a.area || 0;
  // CHAIN LIGHTNING: si el arma no trae salto propio, el upgrade se lo
  // presta -reutiliza cadenaElectrica(), que ya existe para las armas
  // eléctricas-. El nivel decide cuánto pega el salto, no cuántos saltos.
  const nvCadena = upgradesJugador.chain_lightning || 0;
  b.cadena = a.cadena || (nvCadena ? b.dmg * (0.3 + nvCadena * 0.15) : 0);
  b.lento = a.lento || 0;
  b.guia = a.guia || 0; b.vida = a.vida || 0;
  b.imp = a.imp; b.estela = a.estela || 0;
  b.t = 0; b.cd = 0; b.ang = Math.atan2(vy, vx) + Math.PI / 2;
  return b;
}
function soltarBala(i) { libresBala.push(bullets[i]); bullets.splice(i, 1); }

function fogonazo(x, y, col, tam) {
  VFX.fogonazo(x, y, col, tam);
}

function disparar() {
  const a = ARMAS[armaId] || ARMAS.cannon;
  const y = player.y - player.r * 1.1;
  const tiros = a.tiros(arma);
  for (const t of tiros) {
    const bx = player.x + (t.dx || 0);
    bullets.push(nuevaBala(bx, y, t.vx || 0, -a.vel, a));
    fogonazo(bx, y - 4, a.col, a.r * 3.4);
  }
  bulletsFiredo += tiros.length;
  player.retro = Math.min(6, a.dmg * 1.6);
  sfx(a.snd);
  if (a.sac) sacudir(a.sac);
  if (overdriveActivo > 0) {
    // Dos disparos laterales EXTRA, siempre, con el arma que sea: es el
    // bloque el que se pone bruto, no el arma que llevas puesta.
    bullets.push(nuevaBala(player.x - player.r * 0.75, y, -260, -a.vel * 0.85, a));
    bullets.push(nuevaBala(player.x + player.r * 0.75, y, 260, -a.vel * 0.85, a));
    bulletsFiredo += 2;
  }
  // TRIPLE SHOT: +2 disparos laterales por nivel, sumados a lo que ya
  // sale por overdrive/arma. Van más pegados al centro que los de
  // Overdrive para que se lean como del PILOTO, no del bloque.
  const nvTriple = upgradesJugador.triple_shot || 0;
  for (let i = 0; i < nvTriple; i++) {
    const dx = (i + 1) * player.r * 0.55;
    bullets.push(nuevaBala(player.x - dx, y, -140, -a.vel * 0.95, a));
    bullets.push(nuevaBala(player.x + dx, y, 140, -a.vel * 0.95, a));
    bulletsFiredo += 2;
  }
}

// Cambiar de familia conserva el nivel: subir el arma seis veces y perderlo
// todo por recoger un premio nuevo se siente como un castigo, no como una
// mejora.
function ponerArma(id) {
  if (!ARMAS[id] || armaId === id) { arma = Math.min(arma + 1, ARMA_MAX); return; }
  armaId = id;
  shootAcc = 0;
}

// ── Actualizar ────────────────────────────────────────────
function update(dt) {
  // Background: siempre anima (menú, pausa, over)
  fondoY += 42 * dt;
  for (const s of bg) {
    s.y += (T.bg === "rejilla" ? 120 : 34 + s.z * 78) * dt;
    if (T.bg === "burbujas") s.x += Math.sin(s.f += dt * 2) * 14 * dt;
    if (s.y > H + 10) { s.y = -10; s.x = rand(0, W); }
  }
  // VFX: se ejecutan incluso en pause=false pero sí en over (explosión de muerte)
  if (!paused) {
    // Partículas, ondas, fogonazos y sacudidas: todo dentro de VFX, en
    // un solo recorrido.
    VFX.actualizar(dt);
    actualizarEfectos(dt);
    actualizarBonusEvento(dt);
    rhythmDirectorTick(dt);
    actualizarShards(dt);
    actualizarOverdrive(dt);
    actualizarUpgradesPasivos(dt);
    actualizarEvoluciones(dt);
    for (let i = flotantes.length - 1; i >= 0; i--) {
      const f = flotantes[i]; f.t += dt; f.y -= 34 * dt;
      if (f.t >= f.life) { flotantesLibres.push(f); flotantes.splice(i, 1); }
    }
    if (flash > 0) flash = Math.max(0, flash - dt * 2.4);
    if (escudoRoto > 0) escudoRoto = Math.max(0, escudoRoto - dt);
    if (danoT > 0) danoT = Math.max(0, danoT - dt);
    if (respawnT > 0) {
      respawnT = Math.max(0, respawnT - dt);
      // Partículas convergiendo hacia la nave mientras se rehace.
      if (state === "play" && Math.random() < 0.8) {
        VFX.materializar(player.x, player.y, 3, nvColor(), player.r * 3.4);
      }
    }
    if (avisoT > 0) avisoT -= dt;
    if (warningT > 0) warningT -= dt;
    if (misionIniT > 0) misionIniT -= dt;
  }
  if (state !== "play" || paused || upgradesOfrecidos) return;

  elapsed += dt;
  if (invulnT > 0) invulnT -= dt;
  if (turbo > 0) turbo -= dt;
  if (dobleT > 0) dobleT -= dt;
  if (imanT > 0) imanT -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

  // Teclado: aplica desplazamiento al destino para fusionarse con el táctil
  const kbSpeed = 340 * dt;
  if (keys["ArrowLeft"]  || keys["KeyA"]) targetX = Math.max(player.r, targetX - kbSpeed);
  if (keys["ArrowRight"] || keys["KeyD"]) targetX = Math.min(W - player.r, targetX + kbSpeed);
  if (keys["ArrowUp"]    || keys["KeyW"]) targetY = Math.max(player.r + 40, targetY - kbSpeed);
  if (keys["ArrowDown"]  || keys["KeyS"]) targetY = Math.min(H - player.r, targetY + kbSpeed);

  const nv = naveActual();
  const k = 1 - Math.exp(-CONFIG.velocidadNave * nv.vel * dt);
  player.px = player.x; const pyAnt = player.y;
  player.x += (clamp(targetX, player.r, W - player.r) - player.x) * k;
  player.y += (clamp(targetY, player.r + 40, H - player.r) - player.y) * k;
  bank += (clamp((player.x - player.px) * 0.045, -0.45, 0.45) - bank) * (1 - Math.exp(-9 * dt));
  if (player.retro > 0) player.retro = Math.max(0, player.retro - dt * 42);

  // ── Propulsión ──
  //  El empuje se mide por lo que la nave se ha movido este fotograma. Al
  //  frenar en seco los motores bajan, al lanzarse suben: es lo que hace
  //  que un PNG deje de parecer una pegatina flotando.
  const desp = Math.hypot(player.x - player.px, player.y - pyAnt) / Math.max(dt, 0.001);
