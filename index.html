<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flight Strike">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flight Strike</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#05060f;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  body { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }
  #file { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<input type="file" id="file" accept="image/*">
<!-- Banco de efectos: MP3 en base64, generado por herramientas/forjar-audio.mjs.
     Va en <script src> clásico y no en fetch() porque el juego tiene que
     seguir abriéndose con doble clic, y con file:// fetch() está prohibido.
     Si falta el archivo, el motor cae a la síntesis y el juego no se queda
     mudo: por eso no lleva onerror. -->
<script src="audio/muestras.js"></script>
<!-- Música dinámica. También <script src> clásico y por el mismo motivo.
     Si el archivo falta, `typeof MUSICA === "undefined"` y el juego
     arranca igual, sin música y sin un solo error: por eso tampoco
     lleva onerror. Pistas y licencias en audio/MUSICA.json. -->
<script src="js/music.js"></script>
<!-- Guardado. Igual que los otros dos: si falta, el juego arranca y se
     juega, solo que sin recordar nada. Esquema y migraciones dentro. -->
<script src="js/save.js"></script>
<!-- Efectos visuales. Presupuesto, reservas, capas y sacudida. Si
     faltara, el juego se queda sin partículas pero se juega igual. -->
<script src="js/vfx.js"></script>
<!-- Presentación: transiciones, avisos de desbloqueo y el lenguaje
     visual común. Si falta, el juego se ve como antes de la fase 3D. -->
<script src="js/ui.js"></script>
<!-- Catálogo de chasis: ids, alias de los nombres viejos, escala de
     render y ficha de juego de cada nave. -->
<script src="js/ships.js"></script>
<!-- El Hangar. Va DESPUÉS de ships.js porque lee su catálogo, y antes
     del juego porque `pantallaNaves()` lo llama. -->
<script src="js/hangar.js"></script>
<!-- MODO ADMIN / FAMILY SANDBOX. Va DESPUÉS de save.js y ships.js
     porque los usa, y antes del juego porque el juego le pregunta. -->
<script src="js/admin.js"></script>
<!-- Las tablas de DATOS del juego. Van antes del bloque del juego
     porque éste las lee al arrancar. Entre ellas no dependen unas de
     otras, así que el orden es el de leerlas: qué mundos hay, qué
     enemigos y qué jefes, y por último el guión que los usa. -->
<script src="js/enemigos.js"></script>
<script src="js/jefes.js"></script>
<script src="js/misiones.js"></script>
<script>
"use strict";

// ════════════════════════════════════════════════════════════
//  AJUSTES — cambia los números, guarda y recarga.
// ════════════════════════════════════════════════════════════
const CONFIG = {
  vidas:              3,
  cadenciaDisparo:    165,   // ms entre disparos (menos = más rápido)
  velocidadBala:      820,
  velocidadNave:      15,    // qué pegada va al dedo
  offsetDedo:         64,    // px que la nave va POR ENCIMA del dedo
  enemigosPorSegundo: 1.15,
  velocidadEnemigo:   135,
  subeDificultadCada: 11,    // segundos por nivel
  invulnerable:       1.5,
  probPremio:         0.16,
  tamanoNave:         4.8,   // cómo de grande se dibuja la nave cargada
  llamasMotor:        false, // las naves ya traen las llamas dibujadas; ponlo
                             // en true si alguna viene sin ellas
  sonido:             true,
  comboTiempo:        2.6,   // segundos que aguanta el combo sin sumar
};

// ════════════════════════════════════════════════════════════
//  DIFICULTAD — EASY / MEDIUM / HIGH
// ════════════════════════════════════════════════════════════
//  MEDIUM es el juego de siempre: ni CONFIG ni las tablas de ENEMIGOS
//  o JEFES pierden un número. EASY y HIGH son multiplicadores que se
//  aplican en el puñado de sitios donde de verdad se decide la
//  dificultad —velocidad de bala enemiga, cadencia, ventana de aviso,
//  invulnerabilidad tras un golpe, tolerancia del combo, calidad de
//  los drops defensivos y el multiplicador de puntuación final—.
//  Nunca en la vida de un enemigo ni en su daño de contacto: eso sería
//  x2 HP disfrazado de "dificultad", que es justo lo que no se quiere.
//  `eliteFreqMul` y `overdriveAccessMul` están declarados ya para que
//  los bloques de ÉLITES y OVERDRIVE los lean sin tocar esta tabla.
const DIFFICULTY_CONFIG = {
  easy: {
    label:               "FÁCIL",
    enemyBulletSpeedMul: 0.90,
    enemyCadenceMul:     1.15,
    telegraphMul:        1.20,
    invulnMul:           1.25,
    comboToleranceMul:   1.25,
    defensiveDropMul:    1.20,
    scoreMul:            1.00,
    eliteFreqMul:        0.80,
    overdriveAccessMul:  1.15,
  },
  medium: {
    label:               "NORMAL",
    enemyBulletSpeedMul: 1,
    enemyCadenceMul:     1,
    telegraphMul:        1,
    invulnMul:           1,
    comboToleranceMul:   1,
    defensiveDropMul:    1,
    scoreMul:            1.25,
    eliteFreqMul:        1,
    overdriveAccessMul:  1,
  },
  high: {
    label:               "DIFÍCIL",
    enemyBulletSpeedMul: 1.10,
    enemyCadenceMul:     0.87,
    telegraphMul:        0.85,
    invulnMul:           0.85,
    comboToleranceMul:   0.80,
    defensiveDropMul:    0.80,
    scoreMul:            1.60,
    eliteFreqMul:        1.30,
    overdriveAccessMul:  1,
  },
};
// Resuelta al arrancar y cada vez que AJUSTES cambia `OPCIONES.dificultad`.
// Vive fuera de OPCIONES.dificultad (que es la ELECCIÓN, un texto que se
// guarda) para que el resto del juego no repita el lookup en cada sitio.
let DIF = DIFFICULTY_CONFIG.medium;
function resolverDificultad() {
  DIF = DIFFICULTY_CONFIG[OPCIONES.dificultad] || DIFFICULTY_CONFIG.medium;
}
// Ventana real del combo: CONFIG.comboTiempo no se toca (es el dato de
// fábrica, la identidad de MEDIUM), esto es lo que de verdad se compara.
const comboVentana = () => CONFIG.comboTiempo * DIF.comboToleranceMul;

// ════════════════════════════════════════════════════════════
//  RHYTHM DIRECTOR — TIME WITHOUT STIMULUS
// ════════════════════════════════════════════════════════════
//  No sustituye el guión de las misiones: lo acompaña. Mide cuánto
//  tiempo real pasa sin que ocurra nada que cuente como estímulo
//  -enemigo, hazard, aviso, drop, bonus, élite, jefe/miniboss, o el
//  jugador recibiendo daño-. El objetivo no es rellenar cada segundo
//  -un descanso puede ser deliberado, "silencio → portal → AVISO →
//  formación nueva" es sano- sino encontrar los huecos que nadie quiso
//  dejar: silencio → nada → nada → nada → enemigo suelto.
//
//  `marcar()` lo llaman las funciones que YA crean el estímulo
//  -spawnEnemy, soltarPremio, telegrafo, golpe, spawnMiniboss,
//  cambiarFase, spawnPozo/Carril/Sistemas/Defensas- así que ningún
//  sistema futuro (upgrades en 6G, élites en 6E) tiene que acordarse
//  de avisar dos veces: si crea su entidad con una de estas, ya cuenta.
const RHYTHM = {
  ultimo: 0,
  maxHueco: 0,
  huecos: [],          // { t, dur } — solo los que superan UMBRAL
  UMBRAL: 4,            // segundos: por encima de esto, es un hueco real
  HUECOS_MAX: 200,      // tope duro: una sesión larga no crece sin fin
  marcar() {
    if (typeof state === "undefined" || state !== "play" || paused) return;
    const hueco = elapsed - this.ultimo;
    if (this.ultimo > 0 && hueco > this.UMBRAL) {
      this.huecos.push({ t: Math.round(this.ultimo * 10) / 10, dur: Math.round(hueco * 10) / 10 });
      if (this.huecos.length > this.HUECOS_MAX) this.huecos.shift();
    }
    if (hueco > this.maxHueco) this.maxHueco = hueco;
    this.ultimo = elapsed;
  },
  reiniciar() { this.ultimo = elapsed; this.maxHueco = 0; this.huecos.length = 0; },
  estado() { return { maxHueco: Math.round(this.maxHueco * 10) / 10, huecos: this.huecos.slice() }; },
};

// ════════════════════════════════════════════════════════════
//  CAMPO DE JUEGO VERTICAL
// ════════════════════════════════════════════════════════════
//  La plataforma es el iPad en vertical. Un monitor de 2048×858 no puede
//  ensanchar el mundo hasta volver trivial el bullet hell: si el campo mide
//  cinco veces la nave, esquivar deja de ser una decisión. Así que el mundo
//  tiene una proporción máxima y lo que sobra a los lados es marco, no
//  terreno jugable. 0.75 = 4:3, que es justo el iPad: allí no sobra nada.
const PROPORCION_MAX = 0.75;

// ════════════════════════════════════════════════════════════
//  AJUSTES DEL JUGADOR — se guardan en el navegador
// ════════════════════════════════════════════════════════════
const OPCIONES = {
  volMaster: 0.9,
  volMusica: 0.6,
  volSfx:    0.9,
  silencio:  false,
  sacudida:  1,        // 0 = sin sacudida de cámara
  hitstop:   1,        // 0 = sin congelado de impacto
  calidad:   "auto",   // "auto" | "alta" | "media" | "baja"
  nucleo:    true,     // pinta la zona de impacto real de la nave
  // Preparado para el bloque de VFX. Todavía no lo lee nadie ni tiene
  // fila en AJUSTES: está aquí para que se guarde desde ya y ese bloque
  // no tenga que tocar el formato del save ni migrar nada.
  vfx:       "auto",   // "auto" | "alto" | "medio" | "bajo"
  dificultad: "medium", // "easy" | "medium" | "high" — ver DIFFICULTY_CONFIG
};

// ── Niveles de calidad ────────────────────────────────────
//  Se recorta SIEMPRE por el lado decorativo: partículas secundarias,
//  estelas, restos, brillo. Nunca por el lado de la lógica — un enemigo
//  que deja de dispararte porque el móvil va justo es un juego roto, no
//  un juego optimizado.
const CALIDADES = {
  alta:  { part: 1,    estela: 1,   glowSprite: true,  maxPart: 420, sombras: true  },
  media: { part: 0.6,  estela: 0.6, glowSprite: true,  maxPart: 240, sombras: false },
  baja:  { part: 0.32, estela: 0,   glowSprite: false, maxPart: 120, sombras: false },
};
let Q = CALIDADES.alta;
let calidadAuto = "alta";

// El negro de los contornos. Uno solo para todo el juego: es lo que hace que
// las naves dibujadas y lo que pinta el código parezcan la misma cosa.
const TINTA = "#0a0714";

// ── Lenguaje visual fijo ──────────────────────────────────
//  Esto NO cambia con el mundo, a propósito. Lo que te mata tiene que verse
//  igual en los cuatro, o hay que reaprenderlo cada vez que cambias de
//  mundo. Y no se distingue solo por el color: tu disparo es ALARGADO y
//  cian, el suyo es REDONDO y rosa. Aunque se juegue en blanco y negro,
//  se sigue leyendo.
const TIRO_TUYO = "#7df9ff";
const TIRO_SUYO = "#ff2f6e";


// ════════════════════════════════════════════════════════════
//  DÓNDE ESTÁN LOS DIBUJOS
//  Se prueban estas carpetas en orden y gana la primera que tenga
//  el archivo. Así da igual que la carpeta se llame art\ o assets\,
//  y da igual que las naves estén en su subcarpeta o sueltas.
//  ¿Otra carpeta? Se añade a la lista y ya.
// ════════════════════════════════════════════════════════════
const CARPETAS = {
  naves:    ["art/naves/",    "assets/naves/",    "assets/"],
  enemigos: ["art/enemigos/", "assets/enemigos/", "assets/"],
  fondos:   ["art/fondos/",   "assets/fondos/",   "assets/"],
  hazards:  ["art/hazards/",  "assets/hazards/",  "assets/"],
  defensas: ["art/defensas/", "assets/defensas/", "assets/"],
  powerups: ["art/powerups/", "assets/powerups/", "assets/"],
  proyectiles: ["art/proyectiles/", "assets/proyectiles/", "assets/"],
  vfx:      ["art/vfx/",      "assets/vfx/",      "assets/"],
  impactos: ["art/impactos/", "assets/impactos/", "assets/"],
  bosses:   ["art/bosses/",   "assets/bosses/",   "assets/"],
  proyEne:  ["art/proy_enemigos/", "assets/proy_enemigos/", "assets/"],
};
const buscar = (grupo, archivo) => CARPETAS[grupo].map(d => d + archivo);

// ════════════════════════════════════════════════════════════
//  FORMACIONES — posiciones de spawn para oleadas diseñadas
// ════════════════════════════════════════════════════════════
const FORMACIONES = {
  linea(n) {
    const sep = W / (n + 1);
    return Array.from({length: n}, (_, i) => ({ x: sep * (i + 1), y: -52, d: i * 0.14 }));
  },
  V(n) {
    const cx = W / 2, sep = Math.min(50, W * 0.08);
    return Array.from({length: n}, (_, i) => {
      const p = i - Math.floor(n / 2);
      return { x: clamp(cx + p * sep, 40, W - 40), y: -52 - Math.abs(p) * 36, d: Math.abs(p) * 0.16 };
    });
  },
  pinza(n) {
    const half = Math.ceil(n / 2);
    return Array.from({length: n}, (_, i) => ({
      x: i < half ? rand(W * 0.06, W * 0.36) : rand(W * 0.64, W * 0.94),
      y: -52, d: i * 0.12,
    }));
  },
  zigzag(n) {
    const sep = W / (n + 1);
    return Array.from({length: n}, (_, i) => ({ x: sep * (i + 1), y: -52 - (i % 2) * 88, d: i * 0.1 }));
  },
  ola(n) {
    const sep = W / (n + 1);
    return Array.from({length: n}, (_, i) => ({
      x: sep * (i + 1),
      y: -52 - Math.sin(i / Math.max(n - 1, 1) * Math.PI) * 68,
      d: i * 0.11,
    }));
  },
};

// ════════════════════════════════════════════════════════════
//  MINIBOSSES
// ════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════
//  JEFES
// ════════════════════════════════════════════════════════════
//  Un jefe no es un enemigo grande: es un ACONTECIMIENTO, y la
//  arquitectura lo trata como tal. Todos pasan por la misma secuencia
//    aviso → entrada → fases → transición → muerte cinemática → victoria
//  y lo único que cambia por jefe son sus fases y sus ataques. Añadir un
//  jefe nuevo es escribir su tabla; la puesta en escena viene de serie.
//
//  Cada fase declara:
//    umbral    fracción de vida a la que empieza
//    mover     su patrón de movimiento
//    ataques   [{ cd:[min,max], avisa, telegrafo, fn }]
//
//  Hooks opcionales por jefe (todos viven en JEFES[tipo], no en el motor):
//    onSpawn(mb)         una vez, al aparecer — estado propio (nodos...)
//    onEntrada(mb,dt,k)  cada fotograma durante la bajada, k = 0..1
//    reduccionDano(mb)   multiplicador de daño recibido (escudo parcial)
//    onDetonar(mb)       flavor extra en el instante de la explosión grande
//    onMuerte(mb)        limpieza INMEDIATA al morir (antes de la cinemática)
//    dibujarExtra(mb,f)  dibujo en espacio de mundo (nodos, orbitadores)
//  Y por fase: alEntrar(mb), llamado una vez al entrar en esa fase.

// ── Orbitadores de RIFT REAPER (M2) ──────────────────────
//  Ángulo + velocidad angular, nada de física: la posición de cada uno
//  sale de mb.x/mb.y + coseno/seno del ángulo. Barato y determinista.
function crearOrbitadores(mb, n) {
  mb.orbitadores = Array.from({ length: n }, (_, i) => ({
    ang: (i / n) * TAU, velAng: rand(0.9, 1.5) * (Math.random() < 0.5 ? 1 : -1),
    radio: mb.r * 1.75, r: 11,
  }));
}

// ── Nodos de AEGIS PRIME (M3) ─────────────────────────────
//  Torretas de escolta, pegadas a posiciones fijas relativas al jefe.
//  Mientras queda alguna con vida, el jefe encaja menos daño: la pelea
//  premia explícitamente ir a por ellas primero.
function actualizarNodosAegis(mb, dt) {
  if (!mb.nodos || state !== "play" || paused) return;
  for (let i = mb.nodos.length - 1; i >= 0; i--) {
    const n = mb.nodos[i];
    if (n.flash > 0) n.flash -= dt;
    const nx = mb.x + n.ox, ny = mb.y + n.oy;
    n.cd -= dt;
    if (n.cd <= 0) {
      n.cd = rand(1.7, 2.5) * DIF.enemyCadenceMul;
      const a = Math.atan2(player.y - ny, player.x - nx);
      eBala(nx, ny, Math.cos(a) * 220, Math.sin(a) * 220, 5);
      sfx("aegis_lock");
    }
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const dx = b.x - nx, dy = b.y - ny;
      if (dx * dx + dy * dy >= (b.r + 14) ** 2) continue;
      n.hp -= b.dmg; n.flash = 0.1; bulletsHit++;
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (n.hp <= 0) {
        muerte(nx, ny, "#ffcf5c", "defensa");
        sfx("aegis_nodo");
        alMatar({ fuente: "nodoAegis", puntosBase: 220, posicion: { x: nx, y: ny },
          opciones: { textoOffsetY: -20, textoTam: 13, texto: true } });
        mb.nodos.splice(i, 1);
      }
      break;
    }
  }
}

// ── Subsistemas de OMEGA SOVEREIGN (M10, jefe final) ──────
//  Igual de destructibles que los nodos de Aegis, pero con premio
//  propio: cada uno da un empujón real de daño (12% menos protección
//  por cada uno que cae) en vez de ser todo o nada.
function actualizarSubsOmega(mb, dt) {
  if (!mb.subs || state !== "play" || paused) return;
  for (const s of mb.subs) {
    if (!s.vivo) continue;
    const sx = mb.x + s.ox, sy = mb.y + s.oy;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const dx = b.x - sx, dy = b.y - sy;
      if (dx * dx + dy * dy >= (b.r + 13) ** 2) continue;
      s.hp -= b.dmg; bulletsHit++;
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (s.hp <= 0) {
        s.vivo = false;
        muerte(sx, sy, s.col, "defensa");
        sfx("core_offline");
        texto(sx, sy - 24, s.nombre + " DESTRUIDO", s.col, 13);
        alMatar({ fuente: "subOmega", puntosBase: 500, posicion: { x: sx, y: sy },
          opciones: { combo: false, texto: false } });
      }
      break;
    }
  }
}

// ── Mitades de NÝX (bloque 5G, M16) ───────────────────────
//  NÝX se parte en dos cuerpos en su fase 2, pero sigue habiendo UNA
//  sola vida (`mb.hp`) y UNA sola barra: no son dos jefes, es el mismo
//  jefe con dos puntos donde encaja el golpe. Por eso el núcleo
//  genérico se apaga con `d.coreExpuesto` mientras `mb.mitades` existe,
//  y este ayudante hace el golpe real sobre las dos mitades.
//
//  "Una regenera a la otra": la mitad que lleva un rato intacta le pasa
//  un goteo de vida a la que sí está encajando golpes, así que las dos
//  aguantan juntas en vez de caer la más castigada mucho antes. Lo que
//  impide el bucle infinito NO es que "no cure de la nada" — cura de
//  verdad, `mb.hp` sube — sino `REGEN_TOPE_NYX`: un presupuesto de por
//  vida para TODO el combate. Agotado una vez, no vuelve.
const REGEN_TOPE_NYX = 0.12;   // 12% del hpMax, en toda la pelea, una vez
function actualizarMitadesNyx(mb, dt) {
  if (!mb.mitades || state !== "play" || paused) return;
  const d = JEFES[mb.tipo];
  mb._tSinGolpe = mb._tSinGolpe || [0, 0];
  let golpeada = [false, false];
  for (let i = 0; i < mb.mitades.length; i++) {
    const m = mb.mitades[i];
    const mx = mb.x + m.ox, my = mb.y + m.oy;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const dx = b.x - mx, dy = b.y - my;
      if (dx * dx + dy * dy >= (b.r + mb.r * 0.58) ** 2) continue;
      mb.hp -= b.dmg * (d.reduccionDano ? d.reduccionDano(mb) : 1);
      mb.flash = 0.07; bulletsHit++; golpeada[i] = true;
      VFX.bossImpacto({ x: b.x, y: b.y, dmg: b.dmg, tipo: mb.tipo, color: d.color(T),
        ang: Math.atan2(b.y - my, b.x - mx) });
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (mb.hp <= 0) { matarMiniboss(); return; }
      if (gastada) break;
    }
    const dx = player.x - mx, dy = player.y - my;
    if (dx * dx + dy * dy < (hitR() + mb.r * 0.5) ** 2) { golpe(mx, my); if (state !== "play") return; }
  }
  for (let i = 0; i < 2; i++) mb._tSinGolpe[i] = golpeada[i] ? 0 : mb._tSinGolpe[i] + dt;
  // La mitad que lleva más de 2,6 s sin recibir un golpe, mientras la
  // otra sí los está encajando, le cede un goteo pequeño. Se para en
  // cuanto se agota el tope de la pelea entera.
  mb.regenGastado = mb.regenGastado || 0;
  const tope = mb.hpMax * REGEN_TOPE_NYX;
  if (mb.regenGastado < tope && mb.hp < mb.hpMax && mb.hp > 0) {
    const [a, b2] = mb._tSinGolpe;
    if (a > 2.6 && b2 < 1.0) { const g = Math.min(7 * dt, tope - mb.regenGastado, mb.hpMax - mb.hp); mb.hp += g; mb.regenGastado += g; }
    else if (b2 > 2.6 && a < 1.0) { const g = Math.min(7 * dt, tope - mb.regenGastado, mb.hpMax - mb.hp); mb.hp += g; mb.regenGastado += g; }
  }
}

// ── FORJA de VULCANO (bloque 5G, M18) ─────────────────────
//  Cada ciclo aparece un objetivo destructible CON AVISO: si el
//  jugador lo revienta a tiempo, LA FORJA SE CANCELA — ahí termina el
//  ciclo, sin premio para el jefe. Si no, VULCANO gana un modo
//  temporal (martillo/cañón/columna/lanzador) que cambia su ataque
//  mientras dura. Los números del ciclo y la lista de modos los pasa
//  cada fase, así fase 2 alterna más tipos y fase 3 acelera sin tener
//  tres copias de esta función.
function actualizarForjaVulcano(mb, dt, cicloSeg, avisoSeg, modoSeg, modosPosibles) {
  if (state !== "play" || paused || upgradesOfrecidos) return;
  if (mb.modoForja) {
    mb.modoForjaT -= dt;
    if (mb.modoForjaT <= 0) mb.modoForja = null;
    return;
  }
  if (mb.forjaObjetivo) {
    const o = mb.forjaObjetivo; o.t += dt;
    const ox = mb.x + o.ox, oy = mb.y + o.oy;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const dx = b.x - ox, dy = b.y - oy;
      if (dx * dx + dy * dy >= (b.r + 20) ** 2) continue;
      o.hp -= b.dmg; bulletsHit++;
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (o.hp <= 0) {
        mb.forjaObjetivo = null;
        muerte(ox, oy, "#ffcf5c", "defensa");
        sfx("core_offline"); texto(mb.x, mb.y - mb.r - 30, "FORJA CANCELADA", "#8fffb0", 14);
        score += 300;
        return;
      }
      if (gastada) break;
    }
    if (mb.forjaObjetivo && o.t >= avisoSeg) {
      mb.forjaObjetivo = null;
      mb.modoForja = modosPosibles[(Math.random() * modosPosibles.length) | 0];
      mb.modoForjaT = modoSeg;
      texto(mb.x, mb.y - mb.r - 30, "MODO: " + mb.modoForja.toUpperCase(), "#ffcf5c", 15);
      sfx("ultimate", { tono: 0.6 }); sacudir("medium"); hitstop(0.03);
    }
    return;
  }
  mb.forjaT -= dt;
  if (mb.forjaT <= 0) {
    mb.forjaT = cicloSeg;
    mb.forjaObjetivo = { ox: 0, oy: mb.r * 0.55, hp: 14, hpMax: 14, t: 0 };
    telegrafo("anillo", { x: mb.x, y: mb.y + mb.r * 0.55, r: 36, life: avisoSeg, sigue: mb, col: "#ffcf5c" });
    texto(mb.x, mb.y - mb.r - 30, "FORJA — DESTRÚYELO", "#ffcf5c", 14);
    sfx("fuego_ignicion");
  }
}

// ── Zonas de VENOM CORE (M4) ──────────────────────────────
//  Reutiliza el estado TELEGRAPH → ACTIVE → DISSIPATE de zonas[] (el
//  mismo sistema de M4 ambiente), acotado a un tercio de pantalla para
//  poder garantizar que siempre queda una columna libre.
function venomZona(col) {
  if (zonas.length > 8) return;
  const anchoCol = W / 3;
  zonas.push({
    x: anchoCol * col + rand(anchoCol * 0.22, anchoCol * 0.78),
    y: rand(H * 0.22, H * 0.6), r: rand(50, 78), t: 0, fase: 0, damageCd: 0,
  });
  sfx("venom_zona");
}



// ════════════════════════════════════════════════════════════
//  NAVES
//  - "clasica" es la dibujada por código, siempre está.
//  - Las demás se cargan solas SI existe su PNG en alguna carpeta.
//  - Las que ella cargue con el botón + se guardan en el navegador.
// ════════════════════════════════════════════════════════════
//  Las tres tienen que sentirse distintas en la MANO, no solo en la ficha:
//  la diferencia va en velocidad de respuesta, tamaño de la zona de impacto
//  y arma de salida. Los números están acotados a propósito — ±35 % — para
//  que elegir sea una preferencia y no una trampa.
//
//    vel     pegada al dedo        dmg     daño por proyectil
//    cad     multiplicador de cadencia (menos = dispara más)
//    hitbox  tamaño de la zona de impacto real
// ── Naves ─────────────────────────────────────────────────
//  El catálogo vive en js/ships.js: chasis, alias de los ids viejos,
//  factor de render y la ficha de juego de cada uno. Aquí solo se
//  construye la tabla que el motor ya leía, con la MISMA forma, para no
//  tener que tocar las decenas de sitios que consultan .vel, .hitbox,
//  .arma o .motor.
//
//  Se rellena de verdad en el bloque de carga inicial, cuando ya se sabe
//  qué nave lleva equipada el jugador y qué tiene desbloqueado.
let NAVES = SHIPS.construir(null, []);
const NAVE_BASE = { arma:"cannon", vel:1, cad:1, dmg:1, hitbox:1, escudo:0, motor:null,
  lema:"PERSONAL", desc:"Tu nave.", stats:{ ATAQUE:3, VELOCIDAD:3, CONTROL:3 } };
// Con caché, y no por elegancia: hitR() llama aquí una vez POR CADA bala
// enemiga y por fotograma. Para una nave cargada por el jugador, que no
// trae ficha propia, eso eran 340 objetos nuevos por fotograma.
let nvCache = null, nvIdx = -1;
function naveActual() {
  if (nvIdx !== naveSel || !nvCache) {
    const n = NAVES[naveSel] || NAVES[0];
    nvCache = n.vel ? n : Object.assign({}, NAVE_BASE, n);
    nvIdx = naveSel;
  }
  return nvCache;
}

// ════════════════════════════════════════════════════════════
//  A partir de aquí es la maquinaria.
// ════════════════════════════════════════════════════════════

const c = document.getElementById("c");
const ctx = c.getContext("2d");
let SAFE_TOP = 0, SAFE_BOTTOM = 0;
const fileInput = document.getElementById("file");
// W, H = el CAMPO DE JUEGO. VW, VH = la ventana. Todo el juego trabaja en
// coordenadas de campo y no se entera de que existe un marco: el desfase
// va metido en la transformación base del contexto.
let W = 0, H = 0, VW = 0, VH = 0, PX = 0, DPR = 1;

// ── Escala por tamaño de pantalla ─────────────────────────
//  El juego está calibrado en el móvil (414×896). Sin esto, ese mismo
//  número de píxeles en un iPad ocupa una fracción menor de la pantalla:
//  la nave se ve diminuta y esquivar es más fácil de lo que se diseñó.
//  ESC multiplica tamaños Y velocidades de lo que se juega —nave, enemigos,
//  balas, premios— para que ocupen el mismo % de pantalla y se crucen en
//  el mismo tiempo relativo en cualquier dispositivo.
//
//  Se usa el MENOR de los dos ratios (ancho y alto), no solo el ancho.
//  El iPad es más "cuadrado" que el móvil (menos alto en proporción a lo
//  ancho que es), así que escalar solo por ancho aceleraba la caída de
//  los enemigos más de lo que crecía la pantalla: menos tiempo de
//  reacción, no el mismo. Con el menor de los dos, el eje que manda es
//  el que de verdad determina cuánto tiempo hay para esquivar, y en el
//  peor de los casos sobra margen de reacción, nunca falta.
//
//  Solo CRECE (mínimo 1): por debajo de la referencia el juego ya está
//  probado y no se toca. Tope en 2x para que una ventana de escritorio
//  enorme no convierta la nave en un pantallazo.
const REF_ANCHO = 414, REF_ALTO = 896;
let ESC = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  H = VH;
  W = Math.min(VW, Math.round(VH * PROPORCION_MAX));
  PX = Math.round((VW - W) / 2);
  // Leer safe-area-insets para apartar el HUD de la muesca/home bar
  const cs = getComputedStyle(document.documentElement);
  SAFE_TOP    = parseInt(cs.getPropertyValue("--sat") || "0") || 0;
  SAFE_BOTTOM = parseInt(cs.getPropertyValue("--sab") || "0") || 0;
  c.width = Math.round(VW * DPR); c.height = Math.round(VH * DPR);
  c.style.width = VW + "px"; c.style.height = VH + "px";
  aCampo();
  // Tocar canvas.width reinicia TODO el estado del contexto, así que la
  // calidad de filtrado hay que volver a ponerla aquí. Si no, las naves
  // se reducen con el filtro malo y pierden detalle en cada fotograma.
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
}
const aCampo   = () => ctx.setTransform(DPR, 0, 0, DPR, PX * DPR, 0);
const aVentana = () => ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;

// La zona de impacto real de la nave, más pequeña que el dibujo. Es la
// convención del género y lo que hace que esquivar se sienta justo: rozar
// un ala no puede matarte. Un único sitio para que no se desincronice con
// el núcleo que se pinta encima.
function hitR() { return player.r * 0.66 * (naveActual().hitbox || 1); }
const nvColor = () => trailActual().col || naveActual().motor || T.motor;

// El TRAIL y el SPRITE efectivos de la nave equipada. Se cachean junto a
// naveActual() porque se piden una vez por partícula de motor y por
// fotograma: resolver la skin en cada uno significaba leer el guardado,
// componer una clave de texto y buscarla en un diccionario 60 veces por
// segundo durante toda la partida, para un dato que solo cambia cuando
// el jugador toca el Hangar.
//
// Los invalida `nvIdx = -1`, que ya es lo que se toca en todos los
// sitios donde la nave o su configuración cambian.
let trCache = null, trIdx = -1;
function trailActual() {
  const nv = naveActual();
  if (trIdx !== naveSel || !trCache) {
    trCache = SHIPS.trail(SHIPS.config(nv.id).trailId);
    trIdx = naveSel;
  }
  return trCache;
}

let spCache = null, spIdx = -1, spConMaterial = false;
function spriteNave() {
  const id = NAVES[naveSel] && NAVES[naveSel].id;
  // Mientras el PNG no haya llegado NO se cachea el fallo: si no, una
  // nave que tarda 200 ms en cargar se quedaría dibujada en vectorial
  // hasta que el jugador cambiara de nave.
  if (!SPRITES[id]) { spIdx = -1; return null; }
  // Skin de MATERIAL (bloque 5I): mismo truco que arriba con el propio
  // chasis. Mientras el PNG de material no ha llegado, no se cachea el
  // tinte de repuesto como si fuera el definitivo — `spConMaterial` es
  // lo que detecta el momento en que el material TERMINA de llegar
  // (`spIdx` ya vale `naveSel` desde el tinte de la vuelta anterior, así
  // que sin esto la comparación de arriba no vería ningún cambio y el
  // material real no se llegaría a pintar nunca).
  let arteMaterial = null;
  const cf = SHIPS.config(id);
  const archivo = SHIPS.materialArchivo(cf.skinId, id);
  if (archivo) {
    const clave = "skin_" + cf.skinId + "_" + id;
    asegurarSkinMaterial(clave, id, archivo);
    arteMaterial = SPRITES[clave];
  }
  if (spIdx !== naveSel || !spCache || spConMaterial !== !!arteMaterial) {
    spCache = SHIPS.sprite(id, SPRITES[id], arteMaterial);
    spIdx = naveSel;
    spConMaterial = !!arteMaterial;
  }
  return spCache;
}

// Mezcla dos colores "#rrggbb". Sirve para sacar la luz y la sombra de un
// color base sin tener que declarar tres tonos por cada cosa.
function mezcla(a, b, t) {
  const exp = h => h.length === 4 ? "#" + h[1]+h[1]+h[2]+h[2]+h[3]+h[3] : h;
  const n = h => {
    if (typeof h === "string" && h.startsWith("rgb")) {
      const m = h.match(/\d+/g); return [+m[0], +m[1], +m[2]];
    }
    const e = exp(h); return [parseInt(e.slice(1,3),16), parseInt(e.slice(3,5),16), parseInt(e.slice(5,7),16)];
  };
  const [r1, g1, b1] = n(a), [r2, g2, b2] = n(b);
  return "rgb(" + Math.round(r1 + (r2 - r1) * t) + "," +
                  Math.round(g1 + (g2 - g1) * t) + "," +
                  Math.round(b1 + (b2 - b1) * t) + ")";
}

// ── Tratamiento de imagen ─────────────────────────────────
//  Quita el fondo si es de un color plano (magenta, blanco, verde…),
//  recorta lo que sobra y reduce a 256 px. Todo en el navegador.
const MAX_SPRITE = 512;

// Reducir de golpe de 1024 a 512 pierde detalle aunque el filtro sea bueno.
// Bajando de mitad en mitad se conserva mucho más.
function reducir(img, destW, destH) {
  let cur = img;
  let cw = img.naturalWidth || img.width, ch = img.naturalHeight || img.height;
  while (cw > destW * 2 && ch > destH * 2) {
    const nw = Math.max(destW, cw >> 1), nh = Math.max(destH, ch >> 1);
    const t = document.createElement("canvas");
    t.width = nw; t.height = nh;
    const tx = t.getContext("2d");
    tx.imageSmoothingEnabled = true; tx.imageSmoothingQuality = "high";
    tx.drawImage(cur, 0, 0, nw, nh);
    cur = t; cw = nw; ch = nh;
  }
  return cur;
}

// Relleno por inundación DESDE LOS BORDES. Solo se va el fondo que toca
// el marco: un blanco del interior de la nave, rodeado de contorno, no se
// toca. Con el método anterior (comparar toda la imagen contra el color de
// fondo) una nave blanca sobre fondo blanco se quedaba sin la mitad.
function quitarFondo(cx, w, h) {
  let d;
  try { d = cx.getImageData(0, 0, w, h); } catch (_) { return null; }
  const px = d.data;
  const at = (x, y) => (y * w + x) * 4;

  const esq = [at(1, 1), at(w - 2, 1), at(1, h - 2), at(w - 2, h - 2)]
    .map(i => [px[i], px[i + 1], px[i + 2], px[i + 3]]);
  const cerca = (a, b) => Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]) < 40;
  if (!esq.every(q => q[3] > 200 && cerca(q, esq[0]))) return px;   // ya tiene transparencia

  const bgc = esq[0];
  const TOL = 100, SUAVE = 90;
  const visto = new Uint8Array(w * h);
  const pila = [];
  for (let x = 0; x < w; x++) pila.push(x, 0, x, h - 1);
  for (let y = 0; y < h; y++) pila.push(0, y, w - 1, y);

  while (pila.length) {
    const y = pila.pop(), x = pila.pop();
    if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const k = y * w + x;
    if (visto[k]) continue;
    const i = k * 4;
    const dist = Math.abs(px[i]-bgc[0]) + Math.abs(px[i+1]-bgc[1]) + Math.abs(px[i+2]-bgc[2]);
    if (dist > TOL + SUAVE) continue;
    visto[k] = 1;
    px[i + 3] = dist <= TOL ? 0 : Math.round(px[i + 3] * (dist - TOL) / SUAVE);
    pila.push(x + 1, y, x - 1, y, x, y + 1, x, y - 1);
  }
  cx.putImageData(d, 0, 0);
  return px;
}

function prepararSprite(img) {
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  if (!w0 || !h0) return null;

  const esc = Math.min(1, MAX_SPRITE / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * esc)), h = Math.max(1, Math.round(h0 * esc));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = "high";
  cx.drawImage(reducir(img, w, h), 0, 0, w, h);

  // Al abrir con file:// el navegador no deja leer los píxeles de una imagen
  // de disco. En ese caso la usamos tal cual: se verá con su fondo, pero
  // no se rompe nada. Con el botón + sí se puede leer siempre.
  const px = quitarFondo(cx, w, h);
  if (!px) return cv;

  const at = (x, y) => (y * w + x) * 4;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (px[at(x, y) + 3] > 12) {
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
        if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return cv;
  x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1);
  x1 = Math.min(w - 1, x1 + 1); y1 = Math.min(h - 1, y1 + 1);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  if (cw === w && ch === h) return cv;

  const cv2 = document.createElement("canvas");
  cv2.width = cw; cv2.height = ch;
  cv2.getContext("2d").drawImage(cv, x0, y0, cw, ch, 0, 0, cw, ch);
  return cv2;
}

const SPRITES = {};
// Prueba las rutas una tras otra y se queda con la primera que cargue.
// Si no está en ninguna, esa pieza se dibuja por código y no pasa nada.
function cargarSprite(id, rutas) {
  const cola = Array.isArray(rutas) ? rutas.slice() : [rutas];
  (function siguiente() {
    const src = cola.shift();
    if (!src) return;
    const img = new Image();
    img.onload = () => { const s = prepararSprite(img); if (s) SPRITES[id] = s; else siguiente(); };
    img.onerror = siguiente;
    img.src = src;
  })();
}

// Igual, pero tal cual viene: ni recorte de fondo ni recorte al contenido.
// Para imágenes que YA son el fondo.
function cargarImagen(id, rutas) {
  const cola = Array.isArray(rutas) ? rutas.slice() : [rutas];
  (function siguiente() {
    const src = cola.shift();
    if (!src) return;
    const img = new Image();
    img.onload = () => { SPRITES[id] = img; };
    img.onerror = siguiente;
    img.src = src;
  })();
}
// La CLAVE de SPRITES es el id del CHASIS y el archivo sigue siendo el
// del legacy: así 4C solo tiene que cambiar el nombre del archivo en
// ships.js y no hay que tocar nada más.
//
// Se piden los de la tabla ACTUAL, no los del catálogo entero: la
// FOUNDER FLEET son cuatro PNG de medio mega que un jugador normal no
// va a ver nunca, y cargarlos "por si acaso" es medio mega de datos por
// arranque a cambio de nada. Entrar en Admin rehace la tabla y vuelve a
// pasar por aquí, así que se cargan justo cuando hacen falta.
function asegurarSprites(lista) {
  for (const n of lista) if (n.src && !SPRITES[n.id]) cargarSprite(n.id, n.src);
}
asegurarSprites(NAVES);
// Emblemas y fondo del Hangar. Se piden aquí, con todo lo demás, y no al
// abrir la pantalla: una carga a mitad de menú deja huecos vacíos
// durante medio segundo, que es justo cuando el jugador está mirando.
//
// Los cinco emblemas de la expansión (bloque 5I, `requiere` puesto) NO
// entran en este bucle: nadie los tiene el primer minuto de partida, así
// que pedirlos aquí sería exactamente el error de precarga de 5F —
// bajan bajo demanda con `asegurarEmblema()`, más abajo.
for (const e of SHIPS.EMBLEMAS) {
  if (e.archivo && e.requiere == null) cargarSprite("emb_" + e.id, ["art/emblemas/" + e.archivo]);
}
cargarImagen("hangar_fondo", ["art/hangar/hangar_h.png"]);
// (los sprites de enemigos se precargan más abajo, con la tabla ENEMIGOS)

// Emblema de expansión bajo demanda (bloque 5I). Mismo patrón que
// `asegurarFondo`: un Set para no repetir la petición, y una sola vez
// por id. Se llama desde donde se vaya a PINTAR uno (ficha del Hangar,
// icono de la nave equipada, aviso de desbloqueo) — nunca desde el
// arranque.
const emblemasPedidos = new Set();
function asegurarEmblema(id) {
  if (!id || id === "ninguno" || emblemasPedidos.has(id)) return;
  const e = SHIPS.emblema(id);
  if (!e || !e.archivo) return;
  emblemasPedidos.add(id);
  cargarSprite("emb_" + e.id, ["art/emblemas/" + e.archivo]);
}

// Skin de MATERIAL bajo demanda (bloque 5I). Solo existe hoy para
// chassis_01; para cualquier otro chasis `SHIPS.materialArchivo()`
// devuelve null y esto no hace nada. Misma razón que arriba: nadie la
// tiene en M1-M10, así que no se pide hasta que el jugador la elige de
// verdad en el Hangar (o ya la llevaba puesta en un save antiguo).
const skinsMaterialPedidas = new Set();
function asegurarSkinMaterial(clave, chasisId, archivo) {
  if (skinsMaterialPedidas.has(clave)) return;
  skinsMaterialPedidas.add(clave);
  cargarSprite(clave, ["art/naves/skins/" + chasisId + "/" + archivo]);
}

// ── Naves guardadas por ella ──────────────────────────────
const MAX_CUSTOM = 4;
function leerCustom() {
  try { return JSON.parse(localStorage.getItem("sf_naves") || "[]"); } catch (_) { return []; }
}
function aplicarCustom() {
  nvIdx = -1; trIdx = -1; spIdx = -1;   // la tabla cambia de tamaño: la caché de naveActual() ya no vale
  for (let i = NAVES.length - 1; i >= 0; i--) if (!NAVES[i].fija) NAVES.splice(i, 1);
  leerCustom().forEach((n, i) => {
    const id = "custom" + i;
    NAVES.push({ id, nombre: n.nombre, src: null, fija: false, indice: i });
    const img = new Image();
    img.onload = () => { SPRITES[id] = img; };
    img.src = n.data;
  });
}
function guardarCustom(nombre, dataURL) {
  const lista = leerCustom();
  lista.push({ nombre, data: dataURL });
  while (lista.length > MAX_CUSTOM) lista.shift();
  try { localStorage.setItem("sf_naves", JSON.stringify(lista)); }
  catch (_) {
    lista.shift();
    try { localStorage.setItem("sf_naves", JSON.stringify(lista)); } catch (__) { return false; }
  }
  aplicarCustom();
  return true;
}
function borrarCustom(indice) {
  const lista = leerCustom();
  lista.splice(indice, 1);
  localStorage.setItem("sf_naves", JSON.stringify(lista));
  aplicarCustom();
}
aplicarCustom();

let aviso = "", avisoT = 0;
fileInput.addEventListener("change", (ev) => {

});

// ════════════════════════════════════════════════════════════
//  MOTOR DE AUDIO
// ════════════════════════════════════════════════════════════
//  Cuatro buses (MASTER · MUSICA · SFX · UI), cada uno con su volumen, y
//  un compresor a la salida. El compresor no es adorno: con seis cañones
//  disparando a 6 disparos/segundo y tres explosiones encima, la suma de
//  las voces se sale de rango y lo que se oye es un chasquido. Con él,
//  agacha el conjunto en vez de recortar la onda.
//
//  Cada sonido declara además:
//    prio      cuál gana cuando hay que tirar voces
//    voces     cuántas copias suyas pueden sonar a la vez
//    espera    ms mínimos entre dos disparos suyos (antiametralladora)
//    tono      variación aleatoria de afinación, en semitonos
//
//  Hay DOS fuentes de sonido y el motor prefiere siempre la primera:
//
//    1. MUESTRAS   el banco de audio/muestras.js. Multicapa, con sub y
//                  saturación, fabricado fuera de línea. Es lo que suena.
//    2. SÍNTESIS   el catálogo de aquí abajo. Es el repuesto: cubre el
//                  hueco mientras el banco se descodifica, y cubre el
//                  caso de que el banco no esté. El juego no se queda
//                  mudo nunca, que es la razón de que la síntesis siga.
let audio = null;
const BUS = {};   // master · sfx · musica · ui
const GRP = {};   // grupos de mezcla colgando de sfx/ui
let voces = 0;
const VOCES_MAX = 26;
const sonUltimo = {}, sonVivos = {}, vocesGrupo = {};

// ── Grupos de mezcla ──────────────────────────────────────
//  max    voces simultáneas del grupo. Es el freno de verdad: con
//         treinta enemigos en pantalla lo que satura la mezcla no es el
//         volumen de cada sonido, es cuántos suenan a la vez.
//  agacha cuánto se aparta este grupo cuando entra algo importante.
//         Los disparos se apartan del todo ante una explosión de jefe;
//         el jefe no se aparta ante nada.
const GRUPOS = {
  disparo:   { max: 4, agacha: 1.00 },
  enemigo:   { max: 5, agacha: 1.00 },
  impacto:   { max: 6, agacha: 0.85 },
  explosion: { max: 4, agacha: 0.45 },
  jefe:      { max: 2, agacha: 0    },
  sfx:       { max: 8, agacha: 0.70 },
  ui:        { max: 3, agacha: 0    },
};

// Cuánto se da por ocupada una voz sintetizada, por grupo. Con muestra
// se usa la duración real del archivo. La versión anterior daba 1,2 s a
// TODO: un disparo de 45 ms bloqueaba su hueco durante 1,2 segundos, y
// por eso el repetidor perdía la mayoría de sus disparos.
const DUR_GRUPO = { disparo: 0.18, enemigo: 0.25, impacto: 0.2, explosion: 0.6, jefe: 1.4, sfx: 0.4, ui: 0.15 };

// ── Ciclo de vida en iOS ──────────────────────────────────
//  Safari en iPhone/iPad no deja sonar un AudioContext que no haya
//  arrancado DENTRO de un gesto real del usuario, y además tiene un
//  estado propio, "interrupted", que aparece al cambiar de app, bloquear
//  la pantalla o recibir una llamada.
//
//  La versión anterior fallaba por tres sitios a la vez:
//    · `if (audio) return` — creado el contexto, no se reintentaba nunca
//      el resume(). Si el primer intento no cuajaba, el juego se quedaba
//      mudo para siempre.
//    · resume() se llamaba el último y sin mirar la promesa, así que un
//      fallo pasaba inadvertido.
//    · "interrupted" no se contemplaba: volver de otra app dejaba el
//      contexto parado sin que nada lo levantase.
//
//  Ahora hay un único contexto (nunca se crean más) y CUALQUIER gesto
//  posterior vuelve a intentar levantarlo mientras no esté corriendo.
const audioDbg = { intentos: 0, ok: 0, fallos: 0, ultimo: "—", motivo: "" };
let audioListo = false;

function crearContexto() {
  if (audio) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { audioDbg.motivo = "sin WebAudio"; return false; }
  try {
    audio = new AC();
    // Menos agresivo que antes (era -18 dB y ratio 12). Ahora cada sonido
    // sale del horno con su sonoridad ya puesta y su pico ya sujeto, así
    // que aquí solo hay que atrapar las SUMAS: seis cañones más tres
    // explosiones. Con el ajuste viejo, encima de eso, aplastaba también
    // los transitorios, que es justo lo que hace que un golpe suene seco.
    const comp = audio.createDynamicsCompressor();
    comp.threshold.value = -7; comp.knee.value = 6;
    comp.ratio.value = 16; comp.attack.value = 0.001; comp.release.value = 0.12;

    // Techo de seguridad. El compresor agacha, pero tarda: con catorce
    // voces entrando en el mismo fotograma la suma se va por encima de
    // 1.0 antes de que reaccione, y todo lo que pasa de 1.0 lo recorta
    // la tarjeta de sonido en cuadrado. Ese es el chasquido.
    //
    // Esta curva es transparente por debajo de 0,75 —o sea, el 99 % del
    // tiempo no hace nada— y dobla lo que hay por encima en vez de
    // cortarlo. El máximo absoluto que puede salir es 0,94: el recorte
    // digital deja de ser posible, no menos probable.
    const techo = audio.createWaveShaper();
    const N = 8192, curva = new Float32Array(N), U = 0.75;
    for (let i = 0; i < N; i++) {
      const x = (i / (N - 1)) * 2 - 1, a = Math.abs(x);
      curva[i] = a < U ? x : Math.sign(x) * (U + (1 - U) * Math.tanh((a - U) / (1 - U)));
    }
    techo.curve = curva; techo.oversample = "2x";

    BUS.master = audio.createGain();
    BUS.master.connect(comp).connect(techo).connect(audio.destination);
    BUS.comp = comp; BUS.techo = techo;   // expuestos para medir en pruebas
    for (const k of ["sfx", "musica", "ui"]) {
      BUS[k] = audio.createGain();
      BUS[k].connect(BUS.master);
    }
    // Cada grupo es un nodo propio aunque su bus sea el mismo: agachar
    // el bus entero se llevaría por delante al jefe, que es lo único que
    // nunca debe apartarse.
    for (const k in GRUPOS) {
      GRP[k] = audio.createGain();
      GRP[k].connect(k === "ui" ? BUS.ui : BUS.sfx);
    }
    aplicarVolumenes();
    decodificarMuestras();
    // La música se engancha AQUÍ y no antes: necesita el contexto y el
    // bus ya creados para poder colgarse de ellos. Si falla, se apaga
    // sola y el resto del audio sigue igual.
    if (typeof MUSICA !== "undefined") {
      try { MUSICA.init({ ctx: () => audio, bus: () => BUS.musica, opciones: OPCIONES }); }
      catch (_) {}
    }
    return true;
  } catch (e) {
    audio = null;
    audioDbg.motivo = "creación: " + e.message;
    return false;
  }
}

// Un búfer de un frame a volumen cero. En iOS, resume() a secas no
// siempre basta: hace falta que algo EMPIECE a sonar dentro del gesto
// para que el sistema dé por buena la sesión de audio.
function golpeSilencioso() {
  if (!audio) return;
  try {
    const b = audio.createBuffer(1, 1, audio.sampleRate);
    const s = audio.createBufferSource();
    s.buffer = b;
    s.connect(audio.destination);
    s.start(0);
  } catch (_) {}
}

// Se llama desde cualquier gesto del usuario. Barata cuando ya está
// todo en marcha: sale por la primera línea.
// La música necesita que su primer play() caiga DENTRO de un gesto del
// usuario, igual que el contexto. Se avisa desde los tres sitios donde
// el desbloqueo se da por bueno, y no solo desde uno, porque el que se
// use depende de por dónde venga el gesto.
function musicaLista() {
  if (typeof MUSICA === "undefined") return;
  try { MUSICA.desbloquear(); } catch (_) {}
}

function unlockAudio() {
  if (!CONFIG.sonido) return;
  if (audio && audio.state === "running") { audioListo = true; musicaLista(); return; }
  if (!crearContexto()) return;

  audioDbg.intentos++;
  golpeSilencioso();

  // "interrupted" es de iOS y no está en la especificación: se trata
  // igual que "suspended", que es lo que quiere decir en la práctica.
  if (audio.state !== "running") {
    let p;
    try { p = audio.resume(); } catch (e) { audioDbg.fallos++; audioDbg.motivo = "resume: " + e.message; return; }
    if (p && p.then) {
      p.then(() => {
        if (audio && audio.state === "running") { audioListo = true; audioDbg.ok++; audioDbg.motivo = ""; musicaLista(); }
        else { audioDbg.fallos++; audioDbg.motivo = "resume no dejó running (" + (audio && audio.state) + ")"; }
      }).catch(e => { audioDbg.fallos++; audioDbg.motivo = "resume rechazado: " + e.message; });
    } else if (audio.state === "running") { audioListo = true; audioDbg.ok++; musicaLista(); }
  } else { audioListo = true; audioDbg.ok++; musicaLista(); }
}

// Volver de segundo plano deja el contexto parado en iOS. No se hace un
// bucle de resume() —Safari lo penaliza— sino un intento puntual, y el
// resto queda para el siguiente gesto, que siempre acaba llegando.
function reanudarAudio() {
  if (typeof MUSICA !== "undefined") { try { MUSICA.reanudar(); } catch (_) {} }
  if (!audio || !CONFIG.sonido) return;
  if (audio.state === "running") return;
  audioListo = false;
  unlockAudio();
}

// Compensación de la normalización del horno: las muestras salen con
// mucho margen de pico a propósito (para que sumar diez no clipee), así
// que el bus recupera aquí lo que allí se dejó.
const MAKEUP_SFX = 1.22;

function aplicarVolumenes() {
  if (!BUS.master) return;
  const m = OPCIONES.silencio ? 0 : OPCIONES.volMaster;
  BUS.master.gain.value = m;
  BUS.sfx.gain.value = OPCIONES.volSfx * MAKEUP_SFX;
  BUS.ui.gain.value = Math.min(1.2, OPCIONES.volSfx + 0.1) * MAKEUP_SFX;
  BUS.musica.gain.value = OPCIONES.volMusica;
  // Con file:// la música no pasa por el bus —Chrome deja mudo un medio
  // de origen file: enrutado por WebAudio—, así que allí el volumen y
  // el silencio hay que aplicarlos al elemento a mano.
  if (typeof MUSICA !== "undefined") { try { MUSICA.refrescarVolumen(); } catch (_) {} }
}

// ── Agachado por prioridad ────────────────────────────────
//  Lo que pide el brief cuando dice que los impactos y las explosiones
//  importantes tengan prioridad sonora: no se trata de subirlos —eso
//  solo acerca el clipping— sino de apartar un instante lo demás. Se
//  nota como potencia, no como bajada de volumen.
function agachar(fuerza, dur) {
  if (!audio || !GRP.disparo) return;
  // La música se aparta con lo demás, pero MENOS: es lo único continuo
  // que hay sonando y si desaparece del todo cada vez que explota algo,
  // lo que se oye es el hueco, no la explosión.
  if (typeof MUSICA !== "undefined") { try { MUSICA.duck(fuerza, dur); } catch (_) {} }
  const t = audio.currentTime;
  for (const k in GRUPOS) {
    const f = GRUPOS[k].agacha;
    if (!f) continue;
    const g = GRP[k].gain;
    const destino = Math.max(0.25, 1 - fuerza * f * 0.6);
    try {
      g.cancelScheduledValues(t);
      g.setValueAtTime(g.value, t);
      g.linearRampToValueAtTime(destino, t + 0.015);
      g.setTargetAtTime(1, t + 0.015 + dur, 0.16);
    } catch (_) { g.value = 1; }
  }
}

// Prueba de sonido de los ajustes. Pasa por el motor real —mismo bus,
// mismo límite de voces, misma variación de tono— para que si suena
// aquí, suene en el juego.
// Prueba de sonido de los ajustes. Recorre las cuatro escalas de la
// mezcla —interfaz, disparo, impacto, explosión de jefe— porque lo que
// hay que poder juzgar aquí no es si suena, es si el equilibrio entre
// familias es el correcto en ESTE altavoz.
function probarAudio() {
  unlockAudio();
  sfx("ui_ok");
  setTimeout(() => sfx("cannon"), 200);
  setTimeout(() => sfx("imp_medio"), 320);
  setTimeout(() => sfx("exp_med"), 520);
  setTimeout(() => sfx("exp_boss"), 980);
}

// Ruido blanco reutilizado: generar el buffer en cada explosión son 20 000
// llamadas a Math.random() dentro del fotograma. Se genera uno largo y
// cada disparo entra por un punto distinto.
let bufRuido = null;
function ruidoBuf() {
  if (bufRuido) return bufRuido;
  const n = audio.sampleRate * 2;
  bufRuido = audio.createBuffer(1, n, audio.sampleRate);
  const d = bufRuido.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return bufRuido;
}

// ── Ladrillos de síntesis ─────────────────────────────────
function vozOsc(dest, t0, o) {
  const osc = audio.createOscillator(), g = audio.createGain();
  osc.type = o.tipo || "square";
  const f1 = Math.max(20, o.f), f2 = Math.max(20, o.f2 != null ? o.f2 : o.f);
  osc.frequency.setValueAtTime(f1, t0);
  if (f2 !== f1) osc.frequency.exponentialRampToValueAtTime(f2, t0 + o.dur);
  const at = o.at != null ? o.at : 0.004;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.vol), t0 + at);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
  let n = osc;
  if (o.lp) {
    const f = audio.createBiquadFilter();
    f.type = "lowpass"; f.frequency.setValueAtTime(o.lp, t0);
    if (o.lp2) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.lp2), t0 + o.dur);
    f.Q.value = o.q || 1;
    n.connect(f); n = f;
  }
  n.connect(g).connect(dest);
  osc.start(t0); osc.stop(t0 + o.dur + 0.02);
}
function vozRuido(dest, t0, o) {
  const s = audio.createBufferSource(), g = audio.createGain();
  s.buffer = ruidoBuf(); s.loop = true;
  s.playbackRate.value = o.rate || 1;
  let n = s;
  if (o.lp || o.hp) {
    const f = audio.createBiquadFilter();
    f.type = o.hp ? "highpass" : "lowpass";
    const fr = o.hp || o.lp;
    f.frequency.setValueAtTime(fr, t0);
    if (o.lp2) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.lp2), t0 + o.dur);
    f.Q.value = o.q || 0.8;
    n.connect(f); n = f;
  }
  const at = o.at != null ? o.at : 0.003;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.vol), t0 + at);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
  n.connect(g).connect(dest);
  s.start(t0, Math.random() * 1.5); s.stop(t0 + o.dur + 0.02);
}

// ── Catálogo ──────────────────────────────────────────────
//  hacer(d, t, p) — d: destino, t: instante, p: multiplicador de tono
const SONIDOS = {

    vozOsc(d,t,{f:180*p,f2:2800*p,dur:0.5,tipo:"square",vol:0.04,lp:5000});
    vozRuido(d,t+0.28,{dur:0.5,vol:0.08,lp:5000,lp2:400}); } },

  // ENEMIGOS
  ene_disparo:{ bus:"sfx", prio:1, voces:5, espera:55, tono:1.2, hacer:(d,t,p)=>{
    vozOsc(d,t,{f:340*p,f2:150*p,dur:0.09,tipo:"sawtooth",vol:0.03,lp:2000}); } },

  carga:     { bus:"sfx", prio:7, voces:1, espera:400, tono:0, hacer:(d,t)=>{
    vozOsc(d,t,{f:70,f2:620,dur:0.9,tipo:"sawtooth",vol:0.07,lp:500,lp2:4200,at:0.5});
    vozOsc(d,t,{f:140,f2:1240,dur:0.9,tipo:"sine",vol:0.028,at:0.5});
    vozRuido(d,t,{dur:0.9,vol:0.035,hp:800,rate:1.4,at:0.6}); } },
};

// ── Reparto en grupos de mezcla ───────────────────────────
//  Fuera de la tabla a propósito: es una decisión de MEZCLA, no una
//  propiedad del sonido, y verla junta es lo que permite comprobar de un
//  vistazo que ninguna familia se ha quedado sin cupo de voces.
const GRUPO_DE = {
  disparo:   ["cannon","rapid","plasma","laser","railgun","electrico","fuego","cryo","misil"],
  enemigo:   ["ene_disparo","ene_pesado","ene_mortero","ene_barrido","ene_laser","ene_misil",
              "sniper_tiro","venom_pulso"],
  impacto:   ["imp_ligero","imp_medio","imp_pesado","imp_escudo","jug_golpe","jug_escudo",
              "roca_impacto"],
  explosion: ["exp_peq","exp_med","exp_grande","roca_break","aegis_nodo"],
  jefe:      ["exp_boss","exp_miniboss","jug_muerte","ultimate","bomba","boss_llega","fase",
              "aegis_overload","venom_collapse","gravedad_colapso","finale","campana_victoria"],
};
for (const g in GRUPO_DE) for (const id of GRUPO_DE[g]) if (SONIDOS[id]) SONIDOS[id].grupo = g;
for (const id in SONIDOS) {
  const s = SONIDOS[id];
  if (!s.grupo) s.grupo = s.bus === "ui" ? "ui" : "sfx";
  // Variación de volumen, solo donde la repetición es el problema. El
  // brief lo acota bien: pequeña, o el audio se vuelve raro en vez de
  // vivo. Nunca sube: solo baja hasta este porcentaje.
  s.varVol = s.grupo === "explosion" ? 0.22
           : (s.grupo === "disparo" || s.grupo === "enemigo" || s.grupo === "impacto") ? 0.16 : 0;
}
// Con muestras de verdad hay margen para más variación de afinación sin
// que suene desafinado: son ruido y transitorio, no notas.
for (const id of ["exp_peq","exp_med","exp_grande","roca_break","imp_ligero","imp_medio","imp_pesado"])
  SONIDOS[id].tono = Math.max(SONIDOS[id].tono, 1.2);

// ════════════════════════════════════════════════════════════
//  BANCO DE MUESTRAS
// ════════════════════════════════════════════════════════════
//  audio/muestras.js trae los MP3 en base64. Aquí se descodifican una
//  vez, en tandas, y a partir de ahí cada id tiene su lista de variantes.
//
//  Se descodifica en dos oleadas porque descodificar 124 archivos de
//  golpe bloquea el hilo el tiempo suficiente para que se note: primero
//  lo que suena en los primeros diez segundos de partida, y el resto
//  después. Lo que aún no esté listo suena sintetizado, así que la
//  transición no se oye como un hueco.
const MUESTRAS = {};
const muestrasDbg = { total: 0, listas: 0, fallo: 0, ms: 0, arrancado: false };

const ESENCIALES = ["cannon","rapid","ene_disparo","ene_pesado","ene_barrido",
  "imp_ligero","imp_medio","imp_pesado","exp_peq","exp_med","exp_grande",
  "jug_golpe","jug_escudo","pickup","ui_sel","ui_ok","ui_atras"];

function b64aBuffer(s) {
  const bin = atob(s), n = bin.length, u = new Uint8Array(n);
  for (let i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}

// El MP3 añade unos milisegundos de silencio al principio al codificar.
// En un disparo eso es la diferencia entre "responde" y "va con retraso",
// así que se mide una vez aquí y se salta al reproducir.
function arranqueReal(b) {
  const d = b.getChannelData(0);
  const n = Math.min(d.length, Math.round(b.sampleRate * 0.15));
  for (let i = 0; i < n; i++) {
    if (Math.abs(d[i]) > 0.004) return Math.max(0, (i - 12) / b.sampleRate);
  }
  return 0;
}

function decodificarMuestras() {
  const banco = typeof window !== "undefined" && window.SFX_MUESTRAS;
  if (!banco || !banco.d || !audio || muestrasDbg.arrancado) return;
  muestrasDbg.arrancado = true;
  const ids = Object.keys(banco.d);
  muestrasDbg.total = ids.reduce((a, id) => a + banco.d[id].length, 0);
  const t0 = performance.now();
  const orden = ESENCIALES.filter(i => banco.d[i]).concat(ids.filter(i => ESENCIALES.indexOf(i) < 0));
  let i = 0;
  const tanda = () => {
    for (const fin = Math.min(orden.length, i + 5); i < fin; i++) {
      const id = orden[i], lista = banco.d[id];
      const reg = MUESTRAS[id] || (MUESTRAS[id] = { bufs: [], offs: [], durs: [], ult: -1 });
      for (const b64 of lista) {
        let ab;
        try { ab = b64aBuffer(b64); } catch (_) { muestrasDbg.fallo++; continue; }
        const ok = b => {
          reg.bufs.push(b);
          reg.offs.push(arranqueReal(b));
          reg.durs.push(b.duration);
          muestrasDbg.listas++;
          muestrasDbg.ms = Math.round(performance.now() - t0);
        };
        try {
          // Forma con callbacks: es la única que acepta el Safari viejo
          // de iOS, y la moderna la sigue admitiendo. La promesa que
          // devuelven los navegadores nuevos se silencia para que un
          // archivo malo no ensucie la consola.
          const p = audio.decodeAudioData(ab, ok, () => { muestrasDbg.fallo++; });
          if (p && p.catch) p.catch(() => {});
        } catch (_) { muestrasDbg.fallo++; }
      }
    }
    if (i < orden.length) setTimeout(tanda, 0);
  };
  tanda();
}

// ── Reproducir ────────────────────────────────────────────
//  Una llamada con el contexto parado no es un error: se descarta y ya.
//  El juego pide sonidos desde el primer fotograma —mucho antes de que
//  el jugador toque nada— y eso tiene que ser inofensivo.
let ultimoIntentoResume = 0;
function sfx(id, opts) {
  if (!audio || OPCIONES.silencio) return;
  if (audio.state !== "running") {
    // Reintento perezoso y con freno: como mucho uno por segundo. Sin el
    // freno, un juego que pide 30 sonidos por segundo llamaría a
    // resume() 30 veces por segundo, y Safari eso lo castiga.
    const t = performance.now();
    if (t - ultimoIntentoResume > 1000) { ultimoIntentoResume = t; reanudarAudio(); }
    return;
  }
  const s = SONIDOS[id];
  if (!s) return;
  audioDbg.ultimo = id;
  const o = opts || {};
  const ahora = performance.now();
  const prio = s.prio || 1;
  if (ahora - (sonUltimo[id] || -1e9) < (s.espera || 0)) return;
  if ((sonVivos[id] || 0) >= (s.voces || 4)) return;

  // Tres frenos, del más fino al más grueso. Lo que tiene prioridad 8 o
  // más se salta el cupo de su grupo: la explosión del jefe entra sí o
  // sí, aunque haya cuatro explosiones sonando.
  const gr = s.grupo || "sfx";
  const cupo = GRUPOS[gr];
  if (cupo && (vocesGrupo[gr] || 0) >= cupo.max && prio < 8) return;
  if (voces >= VOCES_MAX && prio < 5) return;

  // Lo importante aparta a lo demás un instante. Es lo que hace que una
  // explosión de jefe se sienta enorme sin subir ni un decibelio.
  if (prio >= 8) agachar(prio >= 10 ? 1 : 0.7, prio >= 10 ? 0.5 : 0.22);

  const semis = (s.tono || 0) * (Math.random() * 2 - 1);
  const p = Math.pow(2, semis / 12) * (o.tono || 1);
  const vol = (o.vol != null ? o.vol : 1) * (1 - Math.random() * (s.varVol || 0));

  const destino = GRP[gr] || BUS[s.bus] || BUS.sfx;
  let dest = destino;
  if (vol !== 1) {
    dest = audio.createGain(); dest.gain.value = vol; dest.connect(destino);
  }

  const t = audio.currentTime + 0.001;
  let dur;
  const m = MUESTRAS[id];
  if (m && m.bufs.length) {
    // Rotación sin repetir la anterior. Al azar puro, con tres variantes,
    // dos explosiones seguidas salen iguales una de cada tres veces, y
    // eso se oye: es exactamente lo que el brief pide evitar.
    let k = 0;
    if (m.bufs.length > 1) {
      k = (Math.random() * m.bufs.length) | 0;
      if (k === m.ult) k = (k + 1) % m.bufs.length;
    }
    m.ult = k;
    const src = audio.createBufferSource();
    src.buffer = m.bufs[k];
    src.playbackRate.value = p;
    src.connect(dest);
    try { src.start(t, m.offs[k]); } catch (_) { try { src.start(t); } catch (_) {} }
    dur = (m.durs[k] - m.offs[k]) / p;
  } else {
    try { s.hacer(dest, t, p); } catch (_) {}
    dur = s.dur || DUR_GRUPO[gr] || 0.4;
  }

  sonUltimo[id] = ahora;
  sonVivos[id] = (sonVivos[id] || 0) + 1;
  voces++;
  vocesGrupo[gr] = (vocesGrupo[gr] || 0) + 1;
  // La voz se libera cuando el sonido acaba DE VERDAD. Antes se daba
  // 1,2 s a todo, y un disparo de 45 ms ocupaba su hueco veintiséis
  // veces más de lo que sonaba.
  setTimeout(() => { sonVivos[id]--; voces--; vocesGrupo[gr]--; },
    Math.min(2600, dur * 1000) + 25);
}

// Compatibilidad con las llamadas antiguas mientras queden. Van por
// GRP.sfx y no por BUS.sfx para que también se aparten cuando entra algo
// importante: colgar de un bus se saltaba el agachado entero.
function beep(f, dur, type, vol, f2) {
  if (!audio || audio.state !== "running" || OPCIONES.silencio || voces >= VOCES_MAX) return;
  vozOsc(GRP.sfx || BUS.sfx, audio.currentTime + 0.001,
    { f, f2: f2 || f * 0.5, dur: dur || 0.1, tipo: type || "square", vol: vol || 0.04 });
}
function ruido(dur, vol) {
  if (!audio || audio.state !== "running" || OPCIONES.silencio || voces >= VOCES_MAX) return;
  vozRuido(GRP.sfx || BUS.sfx, audio.currentTime + 0.001, { dur: dur || 0.2, vol: vol || 0.08, lp: 3000, lp2: 300 });
}

// ── Música ────────────────────────────────────────────────
//  El sistema vive en js/music.js. Esto es el PUENTE: traduce los
//  nombres que el juego lleva llamando desde siempre —musica("jefe"),
//  musica("combate")— a estados y cortes del sistema nuevo. Se mantiene
//  la firma vieja a propósito: hay nueve sitios repartidos por el
//  archivo que ya llamaban aquí en el momento correcto, y ninguno ha
//  tenido que moverse.
//
//  Hay dos clases de música y no se comportan igual:
//    ESTADO   un bucle. Se cruza con el anterior y se queda.
//    CORTE    un stinger. Suena ENCIMA del bucle, lo aparta un momento
//             y se va solo. No sustituye a nada.

// Dos pistas de combate, alternadas por misión: ninguna suena dos
// misiones seguidas. Supervivencia se queda con la primera.
//
// Un mundo puede pedir la suya con `pista`, y los cinco de la expansión
// lo hacen: con veinte misiones, alternar por índice deja cada pista
// sonando diez veces, y así al menos cada mundo suena siempre igual a sí
// mismo. Cuando 5I traiga pistas nuevas se cambia el campo en TEMAS.
function pistaCombate() {
  if (modo === "campana" && T && T.pista) return T.pista;
  return (modo === "campana" && misionIdx % 2 === 1) ? "combate_b" : "combate_a";
}

function musica(nombre, pista) {
  if (typeof MUSICA === "undefined") return;
  try {
    switch (nombre) {
      case "menu":       MUSICA.estado("menu"); break;
      case "hangar":     MUSICA.estado("hangar"); break;
      case "combate":    MUSICA.estado("combate", { pista: pistaCombate() }); break;
      case "jefe":       MUSICA.estado("jefe", pista ? { pista } : undefined); break;
      case "jefe_final": MUSICA.estado("jefe_final", pista ? { pista } : undefined); break;
      case "silencio":   MUSICA.estado("silencio"); break;
      // Cortes
      case "mision":     MUSICA.stinger("mision"); break;
      case "victoria":   MUSICA.stinger("victoria"); break;
      case "unlock":     MUSICA.stinger("unlock"); break;
      // La derrota es el único sitio donde el bucle se va del todo: el
      // silencio detrás de la pantalla de fin de partida es parte de
      // que se sienta como un final.
      case "derrota":    MUSICA.stinger("derrota"); MUSICA.estado("silencio"); break;
    }
  } catch (_) {}
}
// Punto de entrada para una muestra SUELTA servida por HTTP. El banco
// normal no pasa por aquí —va embebido en audio/muestras.js— pero esto
// sigue sirviendo para probar un reemplazo sin volver a forjar el banco:
//
//    cargarMuestra("exp_boss", "audio/pruebas/otra_explosion.mp3")
//
// Se añade como variante más del id, así que la vieja sigue estando y la
// rotación las alterna. Con file:// falla en silencio, como debe.
function cargarMuestra(id, url) {
  if (!audio || !SONIDOS[id]) return;
  fetch(url).then(r => r.arrayBuffer()).then(b => new Promise((res, rej) => {
    const p = audio.decodeAudioData(b, res, rej);
    if (p && p.catch) p.catch(() => {});
  })).then(buf => {
    const reg = MUESTRAS[id] || (MUESTRAS[id] = { bufs: [], offs: [], durs: [], ult: -1 });
    reg.bufs.push(buf); reg.offs.push(arranqueReal(buf)); reg.durs.push(buf.duration);
  }).catch(() => {});
}

// ════════════════════════════════════════════════════════════
//  PREMIOS
// ════════════════════════════════════════════════════════════
//  Cada uno es un objeto energético con su PNG. La letra gigante dentro
//  de una caja era un marcador de posición, no un diseño: lo que el
//  premio hace se dice DESPUÉS de cogerlo, con el texto flotante, no
//  imprimiendo una "W" sobre el icono.
//
//    arma   sube un nivel dentro de la familia actual
//    familia cambia de familia de disparo y conserva el nivel
const PREMIOS = {
  arma:      { sp:"pu_arma",      color:"#ffe066", nombre:"ARMA +1" },
  escudo:    { sp:"pu_escudo",    color:"#5ce1ff", nombre:"ESCUDO" },
  bomba:     { sp:"pu_bomba",     color:"#ff5c8a", nombre:"BOMBA" },
  vida:      { sp:"pu_vida",      color:"#ff5d8f", nombre:"VIDA EXTRA" },
  rapido:    { sp:"pu_turbo",     color:"#8affd1", nombre:"TURBO FUEGO" },
  plasma:    { sp:"pu_plasma",    color:"#c77dff", nombre:"PLASMA",     familia:"plasma"    },
  fuego:     { sp:"pu_fuego",     color:"#ff8a1f", nombre:"LANZALLAMAS",familia:"fuego"     },
  cryo:      { sp:"pu_cryo",      color:"#88ddff", nombre:"CRIO",       familia:"cryo"      },
  electrico: { sp:"pu_electrico", color:"#ffd34d", nombre:"ELÉCTRICO",  familia:"electrico" },
  misil:     { sp:"pu_misil",     color:"#ff6b3d", nombre:"MISILES",    familia:"misil"     },
  laser:     { sp:"pu_laser",     color:"#7df9ff", nombre:"LÁSER",      familia:"laser"     },
  void:      { sp:"pu_void",      color:"#b45cff", nombre:"VACÍO",      familia:"void"      },
  railgun:   { sp:"pu_railgun",   color:"#ffffff", nombre:"RAÍL",       familia:"railgun"   },
  rapid:     { sp:"pu_rapid",     color:"#8affd1", nombre:"REPETIDOR",  familia:"rapid"     },
  x2:        { sp:"pu_x2",        color:"#ffd700", nombre:"PUNTOS ×2" },
  iman:      { sp:"pu_iman",      color:"#ff5c8a", nombre:"IMÁN" },
};
// Un premio sin ficha no puede tumbar el juego: cae al premio de arma.
const premio = t => PREMIOS[t] || PREMIOS.arma;
const ARMA_MAX = 6;

// ════════════════════════════════════════════════════════════
//  ARMAS DEL JUGADOR
// ════════════════════════════════════════════════════════════
//  La lógica y la presentación están separadas a propósito: `tiros(n)`
//  dice DÓNDE y HACIA DÓNDE sale cada proyectil, y el resto de la ficha
//  dice a qué suena, qué deja al impactar y de qué color es. Cambiar el
//  aspecto de un arma no puede obligar a tocar cómo dispara.
//
//    cad    ms entre ráfagas          pierce  enemigos que atraviesa
//    dmg    daño por proyectil        area    radio de daño al impactar
//    guia   fuerza de seguimiento     cadena  daño que salta al vecino
//    lento  frena al enemigo tocado
const ARMAS = {
  cannon: {
    nombre:"CAÑÓN", sp:"pr_cannon", col:"#7df9ff", cad:165, vel:820,
    dmg:1, r:5, largo:48, snd:"cannon", imp:"ligero", estela:0.5,
    tiros(n) {
      if (n <= 1) return [{ dx:0 }];
      if (n === 2) return [{ dx:-9 }, { dx:9 }];
      if (n === 3) return [{ dx:0 }, { dx:-12, vx:-80 }, { dx:12, vx:80 }];
      if (n === 4) return [{ dx:-8 }, { dx:8 }, { dx:-16, vx:-150 }, { dx:16, vx:150 }];
      if (n === 5) return [{ dx:0 }, { dx:-10, vx:-90 }, { dx:10, vx:90 }, { dx:-18, vx:-210 }, { dx:18, vx:210 }];
      return [{ dx:-6 }, { dx:6 }, { dx:-14, vx:-110 }, { dx:14, vx:110 }, { dx:-22, vx:-260 }, { dx:22, vx:260 }];
    },
  },

  // Cadencia altísima, daño mínimo. Se nota en las manos antes que en la
  // barra de vida del enemigo: es un arma de sensación.
  rapid: {
    nombre:"REPETIDOR", sp:"pr_rapid", col:"#8affd1", cad:78, vel:980,
    dmg:0.6, r:4, largo:36, snd:"rapid", imp:"ligero", estela:0.35,
    tiros(n) {
      const t = [{ dx: n % 2 ? 0 : -7 }];
      if (!(n % 2)) t.push({ dx:7 });
      if (n >= 3) { t.push({ dx:-15, vx:-120 }); t.push({ dx:15, vx:120 }); }
      if (n >= 5) { t.push({ dx:-23, vx:-260 }); t.push({ dx:23, vx:260 }); }
      return t;
    },
  },

  // Lento, gordo, atraviesa. Cada disparo es una decisión, no una lluvia.
  plasma: {
    nombre:"PLASMA", sp:"pr_plasma", col:"#c77dff", cad:330, vel:520,
    dmg:3.2, r:12, largo:74, snd:"plasma", imp:"medio", pierce:1, estela:1.1,
    tiros(n) {
      if (n <= 2) return [{ dx:0 }];
      if (n <= 4) return [{ dx:-13 }, { dx:13 }];
      return [{ dx:0 }, { dx:-19, vx:-90 }, { dx:19, vx:90 }];
    },
  },

  // Chorro corto y ancho: mata rápido de cerca y no llega lejos.
  fuego: {
    nombre:"LANZALLAMAS", sp:"pr_fuego", col:"#ff8a1f", cad:62, vel:600,
    dmg:0.55, r:8, largo:46, snd:"fuego", imp:"ligero", vida:0.55, estela:0.8,
    tiros(n) {
      const abre = 0.09 + n * 0.022, k = Math.min(3, 1 + Math.floor(n / 2));
      const t = [];
      for (let i = 0; i < k; i++) {
        const a = (i - (k - 1) / 2) * abre + rand(-0.05, 0.05);
        t.push({ dx: a * 40, vx: Math.sin(a) * 600 });
      }
      return t;
    },
  },

  // Frena a quien toca. Convierte una oleada rápida en una lenta, que es
  // otra manera de hacer daño.
  cryo: {
    nombre:"CRIO", sp:"pr_cryo", col:"#88ddff", cad:205, vel:760,
    dmg:1.3, r:7, largo:50, snd:"cryo", imp:"ligero", lento:0.45, estela:0.6,
    tiros(n) {
      const k = Math.min(4, 1 + Math.floor((n - 1) / 1.5));
      return Array.from({ length:k }, (_, i) => ({ dx:(i - (k - 1) / 2) * 15, vx:(i - (k - 1) / 2) * 70 }));
    },
  },

  // Salta al enemigo de al lado. Premia meterse en formaciones cerradas.
  electrico: {
    nombre:"ELÉCTRICO", sp:"pr_electrico", col:"#ffd34d", cad:190, vel:900,
