<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PLAYZONE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<title>PLAYZONE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    min-height:100%; background:#05060f; color:#fff;
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior-y:none;
  }
  body {
    min-height:100vh; min-height:100dvh;
    padding:calc(28px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));
    background:
      radial-gradient(1100px 620px at 50% -12%, #2a1055 0%, transparent 62%),
      radial-gradient(760px 520px at 8% 105%, #05203f 0%, transparent 60%),
      #05060f;
  }
  .marco { max-width:1000px; margin:0 auto; }

  h1 {
    font-size:clamp(46px, 13vw, 104px); font-weight:900; letter-spacing:.03em;
    line-height:.95; text-align:center;
    background:linear-gradient(102deg, #00f5ff 0%, #c77dff 46%, #ff2ea6 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 26px rgba(199,125,255,.45));
  }
  .lema {
    text-align:center; margin-top:10px; font-size:13px; font-weight:600;
    letter-spacing:.22em; text-transform:uppercase; color:#8f96c4;
  }

  h2 {
    margin:44px 0 16px; font-size:12px; font-weight:700;
    letter-spacing:.24em; text-transform:uppercase; color:#7d84b4;
    display:flex; align-items:center; gap:14px;
  }
  h2::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, #2c3160, transparent); }

  .rejilla {
    display:grid; gap:14px;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  }

  .carta {
    display:block; text-decoration:none; color:inherit;
    border-radius:20px; padding:20px 18px 18px; min-height:172px;
    background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.11);
    display:flex; flex-direction:column; gap:8px;
    transition:transform .12s ease, border-color .12s ease;
    position:relative; overflow:hidden;
  }
  .carta::before {
    content:""; position:absolute; inset:-40% -30% auto -30%; height:150px;
    background:radial-gradient(closest-side, var(--tinte), transparent 72%);
    opacity:.34; pointer-events:none;
  }
  .carta:active { transform:scale(.97); }
  .carta .icono { font-size:34px; line-height:1; color:var(--tinte); }
  .carta .nombre { margin-top:auto; font-size:17px; font-weight:800; letter-spacing:.04em; }
  .carta .desc { font-size:12.5px; line-height:1.4; color:#9aa1cc; }

  .carta.pronto {
    background:none; border-style:dashed; border-color:rgba(255,255,255,.14);
    opacity:.42; cursor:default;
  }
  .carta.pronto::before { display:none; }
  .carta.pronto .etiqueta {
    margin-top:auto; font-size:10px; font-weight:800;
    letter-spacing:.18em; color:#7d84b4;
  }

  .puerta-max {
    display:block; text-decoration:none; color:inherit;
    margin-top:16px; padding:26px 24px; border-radius:22px;
    background:linear-gradient(112deg, rgba(255,46,166,.16), rgba(0,245,255,.13));
    border:1px solid rgba(255,255,255,.17);
    transition:transform .12s ease;
  }
  .puerta-max:active { transform:scale(.985); }
  .puerta-max .titulo {
    font-size:clamp(26px, 7vw, 40px); font-weight:900; letter-spacing:.02em;
    background:linear-gradient(96deg, #ff2ea6, #ffd166 55%, #00f5ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .puerta-max .desc { margin-top:6px; font-size:13.5px; line-height:1.45; color:#c3c8ee; }
  .puerta-max .flecha { margin-top:14px; font-size:12px; font-weight:700; letter-spacing:.16em; color:#fff; opacity:.8; }

  footer {
    margin-top:40px; text-align:center; font-size:11.5px; line-height:1.7; color:#565d8a;
  }

  @media (prefers-reduced-motion: no-preference) {
    .carta, .puerta-max { animation:entra .34s ease both; }
    @keyframes entra { from { opacity:0; transform:translateY(10px); } }
  }
</style>
</head>
<body>
<div class="marco">
  <h1>PLAYZONE</h1>
  <p class="lema">Todos nuestros juegos en un sitio</p>

  <h2>Minijuegos</h2>
  <div class="rejilla" id="rejilla"></div>

  <h2>Los grandes</h2>
  <a class="puerta-max" href="max/index.html">
    <div class="titulo">PLAYZONE MAX</div>
    <div class="desc">Los juegos largos, con mundos, niveles y jefes. Empezando por Strike&nbsp;Flight.</div>
    <div class="flecha">ENTRAR &nbsp;›</div>
  </a>

  <footer>
    Un archivo por juego. Sin instalar nada, sin internet.<br>
    Para añadir un minijuego, mira <code>minijuegos/LEEME.txt</code>.
  </footer>
</div>

<script>
"use strict";

// ════════════════════════════════════════════════════════════
//  LOS MINIJUEGOS
//  Aquí van los juegos cortos, de partida rápida.
//  Los juegos grandes NO van aquí: esos van en PLAYZONE MAX.
//
//  Para añadir uno: copia una línea, cambia los datos y pon
//  listo:true cuando la carpeta exista de verdad.
//    ruta   → siempre terminando en index.html, que si no
//             no funciona al abrir con doble clic
//    listo  → false lo deja en gris como "PRÓXIMAMENTE"
// ════════════════════════════════════════════════════════════
const MINIJUEGOS = [
  { nombre:"ESQUIVA", icono:"◆", color:"#00f5ff", listo:true,
    desc:"Cruza los muros por el hueco. Un roce y se acabó.",
    ruta:"minijuegos/esquiva/index.html" },

  // Estos dos son solo el hueco esperando. Cámbialos o bórralos.
  { nombre:"", icono:"", color:"#c77dff", listo:false, desc:"", ruta:"" },
  { nombre:"", icono:"", color:"#ff2ea6", listo:false, desc:"", ruta:"" },
];

// ════════════════════════════════════════════════════════════
//  A partir de aquí es la maquinaria.
// ════════════════════════════════════════════════════════════

const rejilla = document.getElementById("rejilla");

MINIJUEGOS.forEach((j, i) => {
  const carta = document.createElement(j.listo ? "a" : "div");
  carta.className = "carta" + (j.listo ? "" : " pronto");
  carta.style.setProperty("--tinte", j.color || "#c77dff");
  carta.style.animationDelay = (i * 45) + "ms";

  if (j.listo) {
    carta.href = j.ruta;
    carta.innerHTML =
      '<div class="icono"></div>' +
      '<div class="nombre"></div>' +
      '<div class="desc"></div>';
    carta.querySelector(".icono").textContent  = j.icono;
    carta.querySelector(".nombre").textContent = j.nombre;
    carta.querySelector(".desc").textContent   = j.desc;
  } else {
    carta.innerHTML = '<div class="etiqueta">PRÓXIMAMENTE</div>';
  }

  rejilla.appendChild(carta);
});
</script>
</body>
</html>
