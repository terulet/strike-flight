// ════════════════════════════════════════════════════════════
//  FORMACIONES — posiciones de spawn para oleadas diseñadas
// ════════════════════════════════════════════════════════════
const FORMACIONES = {
  linea(n) {
    const sep = W / (n + 1);
    return Array.from({length: n}, (_, i) => ({ x: sep * (i + 1), y: -52, d: i * 0.14 }));
  },
  V(n) {
    const cx = W / 2, sep = Math.min(50, W * 0.08);
    return Array.from({length: n}, (_, i) => {
      const p = i - Math.floor(n / 2);
      return { x: clamp(cx + p * sep, 40, W - 40), y: -52 - Math.abs(p) * 36, d: Math.abs(p) * 0.16 };
    });
  },
  pinza(n) {
    const half = Math.ceil(n / 2);
    return Array.from({length: n}, (_, i) => ({
      x: i < half ? rand(W * 0.06, W * 0.36) : rand(W * 0.64, W * 0.94),
      y: -52, d: i * 0.12,
    }));
  },
  zigzag(n) {
    const sep = W / (n + 1);
    return Array.from({length: n}, (_, i) => ({ x: sep * (i + 1), y: -52 - (i % 2) * 88, d: i * 0.1 }));
  },
  ola(n) {
    const sep = W / (n + 1);
    return Array.from({length: n}, (_, i) => ({
      x: sep * (i + 1),
      y: -52 - Math.sin(i / Math.max(n - 1, 1) * Math.PI) * 68,
      d: i * 0.11,
    }));
  },
};

// convención del género y lo que hace que esquivar se sienta justo: rozar

// Mezcla dos colores "#rrggbb". Sirve para sacar la luz y la sombra de un
// color base sin tener que declarar tres tonos por cada cosa.
function mezcla(a, b, t) {
  const exp = h => h.length === 4 ? "#" + h[1]+h[1]+h[2]+h[2]+h[3]+h[3] : h;
  const n = h => {
    if (typeof h === "string" && h.startsWith("rgb")) {
      const m = h.match(/\d+/g); return [+m[0], +m[1], +m[2]];
    }
    const e = exp(h); return [parseInt(e.slice(1,3),16), parseInt(e.slice(3,5),16), parseInt(e.slice(5,7),16)];
  };
  const [r1, g1, b1] = n(a), [r2, g2, b2] = n(b);
  return "rgb(" + Math.round(r1 + (r2 - r1) * t) + "," +
                  Math.round(g1 + (g2 - g1) * t) + "," +
                  Math.round(b1 + (b2 - b1) * t) + ")";
}

// ── Tratamiento de imagen ─────────────────────────────────
//  Quita el fondo si es de un color plano (magenta, blanco, verde…),
//  recorta lo que sobra y reduce a 256 px. Todo en el navegador.
const MAX_SPRITE = 512;

// Reducir de golpe de 1024 a 512 pierde detalle aunque el filtro sea bueno.
// Bajando de mitad en mitad se conserva mucho más.
function reducir(img, destW, destH) {
  let cur = img;
  let cw = img.naturalWidth || img.width, ch = img.naturalHeight || img.height;
  while (cw > destW * 2 && ch > destH * 2) {
    const nw = Math.max(destW, cw >> 1), nh = Math.max(destH, ch >> 1);
    const t = document.createElement("canvas");
    t.width = nw; t.height = nh;
    const tx = t.getContext("2d");
    tx.imageSmoothingEnabled = true; tx.imageSmoothingQuality = "high";
    tx.drawImage(cur, 0, 0, nw, nh);
    cur = t; cw = nw; ch = nh;
  }
  return cur;
}

// Relleno por inundación DESDE LOS BORDES. Solo se va el fondo que toca
// el marco: un blanco del interior de la nave, rodeado de contorno, no se
// toca. Con el método anterior (comparar toda la imagen contra el color de
// fondo) una nave blanca sobre fondo blanco se quedaba sin la mitad.
function quitarFondo(cx, w, h) {
  let d;
  try { d = cx.getImageData(0, 0, w, h); } catch (_) { return null; }
  const px = d.data;
  const at = (x, y) => (y * w + x) * 4;

  const esq = [at(1, 1), at(w - 2, 1), at(1, h - 2), at(w - 2, h - 2)]
    .map(i => [px[i], px[i + 1], px[i + 2], px[i + 3]]);
  const cerca = (a, b) => Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]) < 40;
  if (!esq.every(q => q[3] > 200 && cerca(q, esq[0]))) return px;   // ya tiene transparencia

  const bgc = esq[0];
  const TOL = 100, SUAVE = 90;
  const visto = new Uint8Array(w * h);
  const pila = [];
  for (let x = 0; x < w; x++) pila.push(x, 0, x, h - 1);
  for (let y = 0; y < h; y++) pila.push(0, y, w - 1, y);

  while (pila.length) {
    const y = pila.pop(), x = pila.pop();
    if (x < 0 || y < 0 || x >= w || y >= h) continue;
    const k = y * w + x;
    if (visto[k]) continue;
    const i = k * 4;
    const dist = Math.abs(px[i]-bgc[0]) + Math.abs(px[i+1]-bgc[1]) + Math.abs(px[i+2]-bgc[2]);
    if (dist > TOL + SUAVE) continue;
    visto[k] = 1;
    px[i + 3] = dist <= TOL ? 0 : Math.round(px[i + 3] * (dist - TOL) / SUAVE);
    pila.push(x + 1, y, x - 1, y, x, y + 1, x, y - 1);
  }
  cx.putImageData(d, 0, 0);
  return px;
}

function prepararSprite(img) {
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  if (!w0 || !h0) return null;

  const esc = Math.min(1, MAX_SPRITE / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * esc)), h = Math.max(1, Math.round(h0 * esc));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = "high";
  cx.drawImage(reducir(img, w, h), 0, 0, w, h);

  // Al abrir con file:// el navegador no deja leer los píxeles de una imagen
  // de disco. En ese caso la usamos tal cual: se verá con su fondo, pero
  // no se rompe nada. Con el botón + sí se puede leer siempre.
  const px = quitarFondo(cx, w, h);
  if (!px) return cv;

  const at = (x, y) => (y * w + x) * 4;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (px[at(x, y) + 3] > 12) {
        if (x < x0) x0 = x;
        if (x > x1) x1 = x;
        if (y < y0) y0 = y;
        if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0) return cv;
  x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1);
  x1 = Math.min(w - 1, x1 + 1); y1 = Math.min(h - 1, y1 + 1);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  if (cw === w && ch === h) return cv;

  const cv2 = document.createElement("canvas");
  cv2.width = cw; cv2.height = ch;
  cv2.getContext("2d").drawImage(cv, x0, y0, cw, ch, 0, 0, cw, ch);
  return cv2;
}

const SPRITES = {};
// Prueba las rutas una tras otra y se queda con la primera que cargue.
// Si no está en ninguna, esa pieza se dibuja por código y no pasa nada.
function cargarSprite(id, rutas) {
  const cola = Array.isArray(rutas) ? rutas.slice() : [rutas];
  (function siguiente() {
    const src = cola.shift();
    if (!src) return;
    const img = new Image();
    img.onload = () => { const s = prepararSprite(img); if (s) SPRITES[id] = s; else siguiente(); };
    img.onerror = siguiente;
    img.src = src;
  })();
}

// Igual, pero tal cual viene: ni recorte de fondo ni recorte al contenido.
// Para imágenes que YA son el fondo.
function cargarImagen(id, rutas) {
  const cola = Array.isArray(rutas) ? rutas.slice() : [rutas];
  (function siguiente() {
    const src = cola.shift();
    if (!src) return;
    const img = new Image();
    img.onload = () => { SPRITES[id] = img; };
    img.onerror = siguiente;
    img.src = src;
  })();
}
for (const n of NAVES) if (n.src) cargarSprite(n.id, n.src);

const MAX_CUSTOM = 4;
function leerCustom() {
  try { return JSON.parse(localStorage.getItem("sf_naves") || "[]"); } catch (_) { return []; }
}
function aplicarCustom() {
  for (let i = NAVES.length - 1; i >= 0; i--) if (!NAVES[i].fija) NAVES.splice(i, 1);
  leerCustom().forEach((n, i) => {
    const id = "custom" + i;
    NAVES.push({ id, nombre: n.nombre, src: null, fija: false, indice: i });
    const img = new Image();
    img.onload = () => { SPRITES[id] = img; };
    img.src = n.data;
  });
}
function guardarCustom(nombre, dataURL) {
  const lista = leerCustom();
  lista.push({ nombre, data: dataURL });
  while (lista.length > MAX_CUSTOM) lista.shift();
  try { localStorage.setItem("sf_naves", JSON.stringify(lista)); }
  catch (_) {
    lista.shift();
    try { localStorage.setItem("sf_naves", JSON.stringify(lista)); } catch (__) { return false; }
  }
  aplicarCustom();
  return true;
}
function borrarCustom(indice) {
  const lista = leerCustom();
  lista.splice(indice, 1);
  localStorage.setItem("sf_naves", JSON.stringify(lista));
  aplicarCustom();
}
aplicarCustom();

// ════════════════════════════════════════════════════════════
//  MOTOR DE AUDIO
// ════════════════════════════════════════════════════════════
//  Cuatro buses (MASTER · MUSICA · SFX · UI), cada uno con su volumen, y
//  un compresor a la salida. El compresor no es adorno: con seis cañones
//  disparando a 6 disparos/segundo y tres explosiones encima, la suma de
//  las voces se sale de rango y lo que se oye es un chasquido. Con él,
//  agacha el conjunto en vez de recortar la onda.
//
//  Cada sonido declara además:
//    prio      cuál gana cuando hay que tirar voces
//    voces     cuántas copias suyas pueden sonar a la vez
//    espera    ms mínimos entre dos disparos suyos (antiametralladora)
//    tono      variación aleatoria de afinación, en semitonos
//
//  Todo es síntesis: cero archivos, cero latencia de carga, cero
//  licencias que verificar. La ruta para muestras externas está en
//  cargarMuestra() y documentada en THIRD_PARTY_AUDIO_LICENSES.md.
let audio = null;
const BUS = {};
let voces = 0;
const VOCES_MAX = 24;
const sonUltimo = {}, sonVivos = {};

function unlockAudio() {
  if (audio || !CONFIG.sonido) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audio = new AC();
  const comp = audio.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 24;
  comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.22;
  BUS.master = audio.createGain();
  BUS.master.connect(comp).connect(audio.destination);
  for (const k of ["sfx", "musica", "ui"]) {
    BUS[k] = audio.createGain();
    BUS[k].connect(BUS.master);
  }
  aplicarVolumenes();
  if (audio.state === "suspended") audio.resume();
}
function aplicarVolumenes() {
  if (!BUS.master) return;
  const m = OPCIONES.silencio ? 0 : OPCIONES.volMaster;
  BUS.master.gain.value = m;
  BUS.sfx.gain.value = OPCIONES.volSfx;
  BUS.ui.gain.value = Math.min(1, OPCIONES.volSfx + 0.1);
  BUS.musica.gain.value = OPCIONES.volMusica;
}

// Ruido blanco reutilizado: generar el buffer en cada explosión son 20 000
// llamadas a Math.random() dentro del fotograma. Se genera uno largo y
// cada disparo entra por un punto distinto.
let bufRuido = null;
function ruidoBuf() {
  if (bufRuido) return bufRuido;
  const n = audio.sampleRate * 2;
  bufRuido = audio.createBuffer(1, n, audio.sampleRate);
  const d = bufRuido.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return bufRuido;
}

// ── Ladrillos de síntesis ─────────────────────────────────
function vozOsc(dest, t0, o) {
  const osc = audio.createOscillator(), g = audio.createGain();
  osc.type = o.tipo || "square";
  const f1 = Math.max(20, o.f), f2 = Math.max(20, o.f2 != null ? o.f2 : o.f);
  osc.frequency.setValueAtTime(f1, t0);
  if (f2 !== f1) osc.frequency.exponentialRampToValueAtTime(f2, t0 + o.dur);
  const at = o.at != null ? o.at : 0.004;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.vol), t0 + at);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
  let n = osc;
  if (o.lp) {
    const f = audio.createBiquadFilter();
    f.type = "lowpass"; f.frequency.setValueAtTime(o.lp, t0);
    if (o.lp2) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.lp2), t0 + o.dur);
    f.Q.value = o.q || 1;
    n.connect(f); n = f;
  }
  n.connect(g).connect(dest);
  osc.start(t0); osc.stop(t0 + o.dur + 0.02);
}
function vozRuido(dest, t0, o) {
  const s = audio.createBufferSource(), g = audio.createGain();
  s.buffer = ruidoBuf(); s.loop = true;
  s.playbackRate.value = o.rate || 1;
  let n = s;
  if (o.lp || o.hp) {
    const f = audio.createBiquadFilter();
    f.type = o.hp ? "highpass" : "lowpass";
    const fr = o.hp || o.lp;
    f.frequency.setValueAtTime(fr, t0);
    if (o.lp2) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.lp2), t0 + o.dur);
    f.Q.value = o.q || 0.8;
    n.connect(f); n = f;
  }
  const at = o.at != null ? o.at : 0.003;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.vol), t0 + at);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
  n.connect(g).connect(dest);
  s.start(t0, Math.random() * 1.5); s.stop(t0 + o.dur + 0.02);
}

// ── Reproducir ────────────────────────────────────────────
function sfx(id, opts) {
  if (!audio || audio.state !== "running" || OPCIONES.silencio) return;
  const s = SONIDOS[id];
  if (!s) return;
  const o = opts || {};
  const ahora = performance.now();
  if (ahora - (sonUltimo[id] || -1e9) < (s.espera || 0)) return;
  if ((sonVivos[id] || 0) >= (s.voces || 4)) return;
  // Cuando el presupuesto de voces está lleno, entra solo lo importante:
  // una explosión de jefe siempre; el impacto número treinta, no.
  if (voces >= VOCES_MAX && (s.prio || 1) < 5) return;

  sonUltimo[id] = ahora;
  sonVivos[id] = (sonVivos[id] || 0) + 1;
  voces++;
  const dur = o.dur || 1.2;
  setTimeout(() => { sonVivos[id]--; voces--; }, dur * 1000);

  const semis = (s.tono || 0) * (Math.random() * 2 - 1);
  const p = Math.pow(2, semis / 12) * (o.tono || 1);
  const bus = BUS[s.bus] || BUS.sfx;
  let dest = bus;
  if (o.vol != null && o.vol !== 1) {
    dest = audio.createGain(); dest.gain.value = o.vol; dest.connect(bus);
  }
  try { s.hacer(dest, audio.currentTime + 0.001, p); } catch (_) {}
}

// Compatibilidad con las llamadas antiguas mientras queden.
function beep(f, dur, type, vol, f2) {
  if (!audio || audio.state !== "running" || OPCIONES.silencio || voces >= VOCES_MAX) return;
  vozOsc(BUS.sfx, audio.currentTime + 0.001,
    { f, f2: f2 || f * 0.5, dur: dur || 0.1, tipo: type || "square", vol: vol || 0.04 });
}
function ruido(dur, vol) {
  if (!audio || audio.state !== "running" || OPCIONES.silencio || voces >= VOCES_MAX) return;
  vozRuido(BUS.sfx, audio.currentTime + 0.001, { dur: dur || 0.2, vol: vol || 0.08, lp: 3000, lp2: 300 });
}

// ── Música ────────────────────────────────────────────────
//  Arquitectura lista, sin pistas. Deliberado: no hay música metida por
//  tenerla. En cuanto haya un .mp3 con licencia comercial verificada en
//  audio/musica/, esto lo recoge sin tocar una línea más.
//  Pendientes y criterios: THIRD_PARTY_AUDIO_LICENSES.md
const PISTAS = { menu:null, combate:null, jefe:null, victoria:null, derrota:null };
let pistaActual = null, pistaNodo = null;
function musica(nombre) {
  if (pistaActual === nombre) return;
  pistaActual = nombre;
  if (pistaNodo) { try { pistaNodo.pause(); } catch (_) {} pistaNodo = null; }
  const src = PISTAS[nombre];
  if (!src || !audio || OPCIONES.silencio) return;
  const el = new Audio(src);
  el.loop = true; el.volume = OPCIONES.volMusica * OPCIONES.volMaster;
  el.play().catch(() => {});
  pistaNodo = el;
}
function cargarMuestra(id, url) {   // punto de entrada para muestras externas
  if (!audio) return;
  fetch(url).then(r => r.arrayBuffer()).then(b => audio.decodeAudioData(b))
    .then(buf => { SONIDOS[id] = { bus:"sfx", prio:3, voces:4, espera:30, tono:0.4,
      hacer:(d,t,p)=>{ const s=audio.createBufferSource(); s.buffer=buf;
        s.playbackRate.value=p; s.connect(d); s.start(t); } }; })
    .catch(() => {});
}

// ════════════════════════════════════════════════════════════
//  ARMAS DEL JUGADOR
// ════════════════════════════════════════════════════════════
//  La lógica y la presentación están separadas a propósito: `tiros(n)`
//  dice DÓNDE y HACIA DÓNDE sale cada proyectil, y el resto de la ficha

//    cad    ms entre ráfagas          pierce  enemigos que atraviesa

// ════════════════════════════════════════════════════════════
//  PATRONES DE DISPARO
//  Reutilizables. Los usan los enemigos y, cuando lleguen, los
//  bosses. Añadir un patrón aquí lo pone a disposición de todos.
// ════════════════════════════════════════════════════════════
const haciaJugador = (e) => Math.atan2(player.y - e.y, player.x - e.x);

//  Tope de proyectiles enemigos en pantalla. No es una optimización: es
//  una regla de diseño. Por encima de esto la pantalla deja de tener
//  huecos y el patrón se convierte en daño inevitable, que es justo lo
//  que un bullet hell justo no puede hacer.
const EBALAS_MAX = 340;
function eBala(x, y, vx, vy, r, extra) {
  if (eBullets.length >= EBALAS_MAX) return null;
  const b = { x, y, vx, vy, r: r || 5 };
  if (extra) Object.assign(b, extra);
  eBullets.push(b);
  return b;
}

const PATRONES = {
  // n disparos abiertos alrededor de un ángulo
  abanico(x, y, ang, vel, n, apertura, r, extra) {
    for (let i = 0; i < n; i++) {
      const a = ang + (n === 1 ? 0 : (i - (n - 1) / 2) * apertura);
      eBala(x, y, Math.cos(a) * vel, Math.sin(a) * vel, r, extra);
    }
  },
  // n disparos repartidos por toda la circunferencia
  circulo(x, y, vel, n, fase, r, extra) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + (fase || 0);
      eBala(x, y, Math.cos(a) * vel, Math.sin(a) * vel, r, extra);
    }
  },
  // Espiral: el mismo círculo pero con las velocidades escalonadas, así
  // que los brazos se abren en curva en vez de en línea recta.
  espiral(x, y, vel, n, fase, r, brazos) {
    const br = brazos || 2;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU * br + (fase || 0);
      const v = vel * (0.72 + (i % n) / n * 0.5);
      eBala(x, y, Math.cos(a) * v, Math.sin(a) * v, r);
    }
  },
  // Ráfaga escalonada: n balas por el mismo sitio a velocidades distintas.
  // Llegan en fila india, así que hay que moverse DURANTE el ataque, no
  // antes de él.
  rafaga(x, y, ang, vel, n, sep, r) {
    for (let i = 0; i < n; i++) {
      const v = vel * (1 - i * (sep || 0.13));
      eBala(x, y, Math.cos(ang) * v, Math.sin(ang) * v, r);
    }
  },
  // Barrido: abanico con las velocidades giradas progresivamente. Barre
  // la pantalla de un lado al otro y siempre deja por dónde salir.
  barrido(x, y, angIni, angFin, vel, n, r) {
    for (let i = 0; i < n; i++) {
      const a = angIni + (angFin - angIni) * (i / Math.max(n - 1, 1));
      const v = vel * (0.8 + i / n * 0.4);
      eBala(x, y, Math.cos(a) * v, Math.sin(a) * v, r);
    }
  },
  // Muro con huecos. El hueco es el patrón: si no hay hueco no es un
  // muro, es una condena.
  muro(y, vel, r, huecos, ancho) {
    const paso = (r || 6) * 3.4;
    const n = Math.ceil(W / paso) + 1;
    const gaps = [];
    const nh = huecos || 2, an = ancho || 2.2;
    for (let i = 0; i < nh; i++) gaps.push(rand(W * 0.12, W * 0.88));
    for (let i = 0; i < n; i++) {
      const x = i * paso + paso / 2;
      if (gaps.some(g => Math.abs(x - g) < paso * an)) continue;
      eBala(x, -10, 0, vel, r);
    }
  },
  // Fuego cruzado desde los dos lados.
  cruzado(y, vel, n, r) {
    for (let i = 0; i < n; i++) {
      const yy = y + i * 34;
      const a1 = Math.atan2(player.y - yy, player.x - 0);
      const a2 = Math.atan2(player.y - yy, player.x - W);
      eBala(0, yy, Math.cos(a1) * vel, Math.sin(a1) * vel, r);
      eBala(W, yy, Math.cos(a2) * vel, Math.sin(a2) * vel, r);
    }
  },
};

// ════════════════════════════════════════════════════════════
//  TELEGRÁFICOS
// ════════════════════════════════════════════════════════════
//  TELEGRÁFICO → ATAQUE → RECUPERACIÓN. Sin el primer paso, esquivar es
//  adivinar; sin el tercero, no hay ventana para devolver el golpe.
//  Dibujar el aviso es tan parte del ataque como los proyectiles.
let telegrafos = [];
function telegrafo(tipo, o) {
  if (telegrafos.length > 24) return null;
  const t = Object.assign({ tipo, t: 0, life: 0.9, col: TIRO_SUYO }, o);
  telegrafos.push(t);
  return t;
}
function actualizarTelegrafos(dt) {
  for (let i = telegrafos.length - 1; i >= 0; i--) {
    const g = telegrafos[i];
    g.t += dt;
    if (g.sigue) { g.x = g.sigue.x; g.y = g.sigue.y; }
    if (g.t >= g.life || (g.sigue && g.sigue.hp <= 0)) telegrafos.splice(i, 1);
  }
}
function dibujarTelegrafos() {
  for (const g of telegrafos) {
    const k = g.t / g.life;
    const pulso = 0.45 + 0.55 * Math.abs(Math.sin(performance.now() / 90));
    ctx.save();
    ctx.globalAlpha = (g.tipo === "mira" ? 0.35 + k * 0.5 : 0.5) * pulso;
    ctx.strokeStyle = g.col; ctx.fillStyle = g.col;
    if (g.tipo === "mira") {
      // Línea de puntería del francotirador. Se estrecha y se afila según
      // se acerca el disparo: el jugador ve cuánto le queda.
      ctx.lineWidth = 1 + k * 2.5;
      ctx.setLineDash([10 - k * 7, 8 - k * 6]);
      ctx.beginPath(); ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x + Math.cos(g.ang) * 1400, g.y + Math.sin(g.ang) * 1400);
      ctx.stroke(); ctx.setLineDash([]);
      if (k > 0.55) {
        ctx.globalAlpha = (k - 0.55) / 0.45 * pulso;
        ctx.lineWidth = 2;
        const bx = g.bx != null ? g.bx : player.x, by = g.by != null ? g.by : player.y;
        ctx.beginPath(); ctx.arc(bx, by, 26 - (k - 0.55) * 30, 0, TAU); ctx.stroke();
      }
    } else if (g.tipo === "cono") {
      ctx.globalAlpha *= 0.22;
      ctx.beginPath(); ctx.moveTo(g.x, g.y);
      ctx.arc(g.x, g.y, g.r || 700, g.a1, g.a2);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha *= 2.4; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r || 700, g.a1, g.a2); ctx.stroke();
    } else if (g.tipo === "anillo") {
      ctx.lineWidth = 2 + k * 3;
      ctx.setLineDash([12, 10]);
      ctx.beginPath(); ctx.arc(g.x, g.y, (g.r || 90) * (0.3 + k * 0.8), 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    } else if (g.tipo === "banda") {
      ctx.globalAlpha *= 0.2;
      ctx.fillRect(0, g.y - (g.h || 30) / 2, W, g.h || 30);
      ctx.globalAlpha *= 3; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, g.y - (g.h || 30) / 2); ctx.lineTo(W, g.y - (g.h || 30) / 2);
      ctx.moveTo(0, g.y + (g.h || 30) / 2); ctx.lineTo(W, g.y + (g.h || 30) / 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ════════════════════════════════════════════════════════════
//  ENEMIGOS — dirigidos por datos
//  Cada tipo declara sus números, su forma y su comportamiento.
//  Añadir uno nuevo es añadir una entrada AQUÍ: no hay que tocar
//  ni update() ni dibujarEnemigo().
//
//    mover(e, dt)   obligatorio
//    atacar(e)      opcional; si existe, se usa recarga()
//    embiste        true = sobrevive al chocar contra el jugador
//    grande         true = explosión y sonido de peso pesado
//    premio         multiplicador de probabilidad de soltar premio
// ════════════════════════════════════════════════════════════
const caer = (e, dt) => { e.y += e.vy * dt; };

const ENEMIGOS = {
  // Silueta redonda, movimiento recto, un disparo de vez en cuando.
  // Es el enemigo contra el que se aprende todo lo demás.
  normal: {
    r: 18, hp: 2, puntos: 10, vel: 1, forma: "circulo",
    color: t => t.enemigoA, muerte: "basica",
    mover: caer,
    recarga: () => rand(2.4, 4.2),
    atacar(e) {
      if (e.y < 40 || e.y > H * 0.72) return;
      PATRONES.abanico(e.x, e.y + e.r * 0.6, Math.PI / 2, 210, 1, 0, 5);
      sfx("ene_disparo");
    },
  },

  // No dispara. Su amenaza es la trayectoria: entra rápido, zigzaguea y
  // se te echa encima antes de que la mires.
  veloz: {
    r: 13, hp: 1, puntos: 25, vel: 1.85, forma: "rombo",
    color: t => t.enemigoB, muerte: "rapida", estela: true, rota: true,
    init(e) { e.zig = rand(80, 165) * (Math.random() < 0.5 ? -1 : 1); },
    mover(e, dt) {
      caer(e, dt);
      e.fase += dt * 3.2;
      e.x = clamp(e.x + Math.cos(e.fase) * e.zig * dt, e.r, W - e.r);
      e.giro = Math.cos(e.fase) * e.zig * 0.0022;
    },
  },

  // Se planta y apunta. Obliga a moverse en lateral, que es lo contrario
  // de lo que pide el veloz.
  torreta: {
    r: 20, hp: 4, puntos: 40, vel: 0.62, forma: "hexagono", premio: 2.2,
    color: t => t.enemigoA, muerte: "basica",
    mover(e, dt) {
      // Frena al llegar a su altura de tiro en vez de cruzar la pantalla.
      if (e.y > H * 0.3) e.y += e.vy * 0.25 * dt; else caer(e, dt);
    },
    recarga: () => rand(1.2, 1.9),
    atacar(e) {
      PATRONES.rafaga(e.x, e.y, haciaJugador(e), 265, 3, 0.16, 5);
      sfx("ene_disparo");
      e.recoil = 4;
    },
  },

  // Pesado de verdad: entra despacio, aguanta, y cuando dispara abre en
  // abanico para cerrar el hueco por el que ibas a salir.
  tanque: {
    r: 27, hp: 14, puntos: 120, vel: 0.46, forma: "acorazado",
    color: t => t.enemigoC, embiste: true, grande: true, premio: 6,
    muerte: "pesada", sonidoTiro: "ene_pesado",
    mover: caer,
    recarga: () => rand(1.4, 2.0),
    avisa: 0.5,
    telegrafo(e) {
      const a = haciaJugador(e);
      telegrafo("cono", { x: e.x, y: e.y, a1: a - 0.42, a2: a + 0.42, r: 620, life: 0.5, sigue: e });
    },
    atacar(e) {
      PATRONES.abanico(e.x, e.y, haciaJugador(e), 255, 5, 0.2, 6);
      sfx("ene_pesado");
      e.recoil = 9;
    },
  },

  // ── KAMIKAZE ──────────────────────────────────────────
  //  Cuatro fases y las cuatro se VEN: entra, se coloca, se enciende y
  //  se lanza. Nunca aparece encima del jugador y nunca gira durante la
  //  embestida — una vez lanzado, el vector está fijado y esquivarlo es
  //  cosa del jugador, no una tirada de dados.
  kamikaze: {
    r: 15, hp: 2, puntos: 45, vel: 1.15, forma: "punta",
    color: t => t.enemigoB, muerte: "kamikaze", premio: 1.4, rota: true,
    init(e) { e.est = 0; e.vx = 0; e.carga = 0; e.paraY = rand(H * 0.16, H * 0.3); },
    mover(e, dt) {
      if (e.est === 0) {
        caer(e, dt);
        e.vx = clamp(e.vx + Math.sign(player.x - e.x) * 260 * dt, -170, 170);
        e.x = clamp(e.x + e.vx * dt, e.r, W - e.r);
        if (e.y >= e.paraY) {
          e.est = 1; e.carga = 0;
          sfx("kamikaze");
          telegrafo("anillo", { x: e.x, y: e.y, r: 74, life: 0.85, sigue: e });
        }
      } else if (e.est === 1) {
        // Se coloca y se enciende. El sonido sube con la carga.
        e.carga += dt / 0.85;
        e.x += clamp(player.x - e.x, -110 * dt, 110 * dt);
        e.y += 14 * dt;
        if (Q.estela) part(e.x + rand(-e.r, e.r), e.y + rand(-e.r, e.r),
          rand(-40, 40), rand(-70, -20), 0.3, "#ff8a1f", rand(1, 2.6));
        if (e.carga >= 1) {
          e.est = 2;
          const a = Math.atan2(player.y - e.y, player.x - e.x);
          e.dvx = Math.cos(a) * 620; e.dvy = Math.sin(a) * 620;
          telegrafo("mira", { x: e.x, y: e.y, ang: a, life: 0.22, col: "#ff8a1f" });
          sfx("ene_pesado", { tono: 1.4 });
        }
      } else {
        e.x += e.dvx * dt; e.y += e.dvy * dt;
        e.giro = Math.atan2(e.dvx, Math.max(e.dvy, 1)) * 0.8;
        if (Q.estela) part(e.x, e.y, rand(-30, 30), rand(-40, 40), 0.34, "#ffcf5c", rand(1.4, 3.2));
      }
    },
    dibujarExtra(e) {
      if (e.est !== 1) return;
      const p = 0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 60));
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = e.carga * p * 0.85;
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, e.r * 3);
      g.addColorStop(0, "#ffffff"); g.addColorStop(0.4, "#ff6a1f");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, e.r * 3, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    },
  },

  // ── BOMBARDERO ────────────────────────────────────────
  //  Lento, grave y con retroceso. Sus bombas caen despacio y explotan
  //  con radio: no basta con no estar debajo, hay que no estar cerca.
  bombardero: {
    r: 24, hp: 9, puntos: 90, vel: 0.5, forma: "acorazado",
    color: t => t.enemigoA, grande: true, premio: 4, muerte: "pesada",
    mover(e, dt) { e.y += e.vy * (e.y < 60 ? 0.55 : 1) * dt; },
    recarga: () => rand(2.0, 2.8),
    avisa: 0.55,
    telegrafo(e) {
      // La banda marca la altura EXACTA a la que van a estallar las
      // bombas. Con eso, estar fuera de ella es una decisión del jugador.
      e.bombaY = clamp(e.y + 170, 0, H - 40);
      telegrafo("banda", { y: e.bombaY, h: 58, life: 0.55, col: "#ff8a1f" });
    },
    atacar(e) {
      const yb = e.bombaY || clamp(e.y + 170, 0, H - 40);
      for (let i = -1; i <= 1; i++) {
        const ang = Math.PI / 2 + i * 0.3;
        eBala(e.x + i * 15, e.y + 12, Math.cos(ang) * 200, Math.sin(ang) * 200, 8,
          { bomba: 58, explotaY: yb });
      }
      sfx("ene_pesado", { tono: 0.8 });
      e.recoil = 11;
      sacudir("tiny");
    },
  },

  // ── FRANCOTIRADOR ─────────────────────────────────────
  //  Entra · se coloca · adquiere · telegrafía · fija · DISPARA ·
  //  reposiciona. Cada paso tiene su sonido y su dibujo, y el disparo
  //  sale por donde decía la línea, no por donde estás en ese momento:
  //  moverse durante el bloqueo funciona SIEMPRE.
  francotirador: {
    r: 15, hp: 3, puntos: 70, vel: 0.8, forma: "rombo",
    color: t => t.enemigoB, premio: 2, muerte: "basica",
    init(e) { e.est = 0; e.tt = 0; e.paraY = rand(H * 0.12, H * 0.26); e.tiros = 0; },
    mover(e, dt) {
      e.tt += dt;
      if (e.est === 0) {                                  // entrada
        caer(e, dt);
        if (e.y >= e.paraY) { e.est = 1; e.tt = 0; sfx("sniper_lock"); }
      } else if (e.est === 1) {                           // adquisición
        e.y += Math.sin(e.tt * 2) * 8 * dt;
        if (e.tt > 0.55) {
          e.est = 2; e.tt = 0;
          e.mira = telegrafo("mira", { x: e.x, y: e.y, ang: haciaJugador(e), life: 1.35, sigue: e });
        }
      } else if (e.est === 2) {                           // seguimiento
        if (e.mira) {
          const obj = Math.atan2(player.y - e.y, player.x - e.x);
          let d = ((obj - e.mira.ang + Math.PI * 3) % TAU) - Math.PI;
          e.mira.ang += clamp(d, -2.4 * dt, 2.4 * dt);
        }
        if (e.tt > 0.9) { e.est = 3; e.tt = 0; sfx("sniper_aviso"); }
      } else if (e.est === 3) {                           // BLOQUEO: ángulo fijo
        if (e.mira) { e.mira.bx = e.x + Math.cos(e.mira.ang) * 400; e.mira.by = e.y + Math.sin(e.mira.ang) * 400; }
        if (e.tt > 0.42) {
          const a = e.mira ? e.mira.ang : haciaJugador(e);
          eBala(e.x, e.y, Math.cos(a) * 760, Math.sin(a) * 760, 5, { lanza: true, halo: false });
          vfx("chispa", e.x + Math.cos(a) * 20, e.y + Math.sin(a) * 20, 54, 0.2);
          sfx("sniper_tiro");
          e.recoil = 8;
          if (e.mira) { telegrafos.splice(telegrafos.indexOf(e.mira), 1); e.mira = null; }
          e.est = 4; e.tt = 0; e.tiros++;
          e.destino = clamp(e.x + rand(-W * 0.4, W * 0.4), 40, W - 40);
        }
      } else {                                            // reposición
        e.x += clamp(e.destino - e.x, -230 * dt, 230 * dt);
        e.y += Math.sin(e.tt * 3) * 12 * dt;
        // Tras dos disparos se retira: un francotirador que no se va nunca
        // deja de ser un acontecimiento y pasa a ser un impuesto.
        if (e.tiros >= 3) { e.y += 190 * dt; return; }
        if (e.tt > 1.1 && Math.abs(e.destino - e.x) < 24) { e.est = 1; e.tt = 0; sfx("sniper_lock"); }
      }
    },
    dibujarExtra(e) {
      if (e.est !== 3) return;
      const p = Math.abs(Math.sin(performance.now() / 55));
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.5 + p * 0.5;
      ctx.fillStyle = TIRO_SUYO;
      ctx.beginPath(); ctx.arc(0, 0, e.r * 1.5, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    },
  },

  // ── PORTAESCUDOS ──────────────────────────────────────
  //  El escudo se ve, se ondula cuando le pegas y se rompe con
  //  estruendo. Y NO es invulnerabilidad: los disparos pasan al casco
  //  reducidos, así que pegarle mientras aguanta sigue sirviendo.
  portaescudos: {
    r: 26, hp: 14, puntos: 130, vel: 0.42, forma: "hexagono",
    color: t => t.enemigoC, embiste: true, grande: true, premio: 5,
    muerte: "pesada", escMax: 16,
    init(e) { e.esc = 16; e.escFlash = 0; e.onda = 0; },
    mover: caer,
    alGolpe(e, b, dmg) {
      if (e.esc <= 0) return dmg;
      e.esc -= dmg;
      e.escFlash = 0.14; e.onda = 1;
      impacto(b.x, b.y, "escudo", "#5ce1ff");
      if (e.esc <= 0) {
        e.esc = 0;
        impacto(e.x, e.y, "rotura", "#5ce1ff");
        onda(e.x, e.y, "#5ce1ff", e.r * 5, 0.5);
        texto(e.x, e.y - e.r - 14, "ESCUDO ROTO", "#5ce1ff", 13);
        sacudir("tiny");
      } else sfx("escudo_zumb");
      return dmg * 0.35;      // pasa reducido, no anulado
    },
    recarga: () => rand(2.4, 3.2),
    avisa: 0.45,
    telegrafo(e) { telegrafo("anillo", { x: e.x, y: e.y, r: e.r * 3, life: 0.45, sigue: e }); },
    atacar(e) {
      PATRONES.circulo(e.x, e.y, 205, e.esc > 0 ? 8 : 12, e.fase, 5);
      sfx("escudo_zumb", { tono: 0.7 });
    },
    dibujarExtra(e) {
      if (e.esc <= 0) return;
      const k = e.esc / 16;
      const p = 0.5 + 0.5 * Math.sin(performance.now() / 260);
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = (0.2 + k * 0.28 + (e.escFlash > 0 ? 0.5 : 0)) * (0.7 + p * 0.3);
      const rr = e.r * (1.55 + (e.onda > 0 ? e.onda * 0.25 : 0));
      const g = ctx.createRadialGradient(0, 0, rr * 0.55, 0, 0, rr);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(1, "#5ce1ff");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 0.4 + k * 0.45;
      ctx.strokeStyle = e.escFlash > 0 ? "#ffffff" : "#9beeff";
      ctx.lineWidth = 1.5 + k * 1.5;
      ctx.beginPath();
      // Hexágono, no círculo: se lee como tecnología y no se confunde
      // con el halo de un premio.
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU + e.fase * 0.3;
        ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.stroke();
      ctx.globalAlpha = 1;
    },
  },

  // ── ÉLITE ─────────────────────────────────────────────
  //  Escolta pesada. Se queda arriba y teje espirales: no se esquiva
  //  reaccionando, se esquiva leyendo por dónde se abre el brazo.
  elite: {
    r: 30, hp: 26, puntos: 240, vel: 0.4, forma: "acorazado",
    color: t => t.enemigoC, embiste: true, grande: true, premio: 7,
    muerte: "pesada",
    init(e) { e.paraY = rand(H * 0.14, H * 0.24); e.lado = Math.random() < 0.5 ? -1 : 1; },
    mover(e, dt) {
      if (e.y < e.paraY) { caer(e, dt); return; }
      e.fase += dt * 0.7;
      e.x = clamp(e.x + Math.cos(e.fase) * 90 * e.lado * dt, e.r + 8, W - e.r - 8);
    },
    recarga: () => rand(1.6, 2.2),
    avisa: 0.4,
    telegrafo(e) { telegrafo("anillo", { x: e.x, y: e.y, r: e.r * 3.4, life: 0.4, sigue: e }); },
    atacar(e) {
      PATRONES.espiral(e.x, e.y, 215, 10, e.fase * 2.4, 5, 1);
      PATRONES.abanico(e.x, e.y, haciaJugador(e), 300, 3, 0.2, 5);
      sfx("ene_pesado");
      e.recoil = 6;
    },
  },
};

// Formas por defecto, para cuando todavía no hay PNG del enemigo.
// Solo trazan el contorno: de rellenarlo y perfilarlo se encarga
// dibujarEnemigo(), para que todos compartan el mismo acabado.
const FORMAS = {
  circulo(e) { ctx.arc(0, 0, e.r, 0, TAU); },

  rombo(e) {
    ctx.rotate(e.giro);
    ctx.moveTo(0, -e.r); ctx.lineTo(e.r * 0.7, 0);
    ctx.lineTo(0, e.r); ctx.lineTo(-e.r * 0.7, 0);
    ctx.closePath();
  },

  hexagono(e) {
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + e.giro * 0.4;
      ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * e.r, Math.sin(a) * e.r);
    }
    ctx.closePath();
  },

  // Los pods laterales van dentro del MISMO trazo que el casco. Si fueran
  // rectángulos aparte, el contorno perfilaría cada pieza y se vería como
  // tres cosas pegadas en vez de una nave.
  acorazado(e) {
    const r = e.r;
    ctx.moveTo(0, -r);
    ctx.lineTo(r * 0.95, -r * 0.3);
    ctx.lineTo(r * 1.38, -r * 0.28); ctx.lineTo(r * 1.38, r * 0.44);
    ctx.lineTo(r * 0.9, r * 0.44);
    ctx.lineTo(r * 0.7, r * 0.55);
    ctx.lineTo(0, r * 0.88);
    ctx.lineTo(-r * 0.7, r * 0.55);
    ctx.lineTo(-r * 0.9, r * 0.44);
    ctx.lineTo(-r * 1.38, r * 0.44); ctx.lineTo(-r * 1.38, -r * 0.28);
    ctx.lineTo(-r * 0.95, -r * 0.3);
    ctx.closePath();
  },

  // Punta hacia abajo: se ve de un vistazo que viene a por ti
  punta(e) {
    ctx.rotate(e.giro || 0);
    const r = e.r;
    ctx.moveTo(0, r * 1.2);
    ctx.lineTo(r * 0.9, -r * 0.55);
    ctx.lineTo(0, -r * 0.2);
    ctx.lineTo(-r * 0.9, -r * 0.55);
    ctx.closePath();
  },
};

// Detalles que van ENCIMA del relleno, una vez perfilada la silueta
const DETALLES = {
  acorazado(e) {
    const r = e.r;
    ctx.fillStyle = "rgba(10,7,20,0.42)";
    ctx.fillRect(-r * 0.62, -r * 0.55, r * 1.24, r * 0.26);
  },
};

// ════════════════════════════════════════════════════════════
//  HAZARDS — asteroides y cristales ambientales (M2, M5)
// ════════════════════════════════════════════════════════════
const HAZARD_TIPOS = {
  asteroide: { r: 30, vel: 145, hp: 5, lateral: true  },
  cristal:   { r: 26, vel: 165, hp: 4, lateral: false },
};
let hazards = [], hazardEnabled = false, hazardAcc = 0, hazardTipo = "asteroide";
const esCristal = h => h.tipo === "cristal";

function spawnHazard() {
  const d = HAZARD_TIPOS[hazardTipo];
  const lado = hazardTipo === "asteroide" && Math.random() < 0.33 ? (Math.random() < 0.5 ? 1 : 2) : 0;
  let x, y, vx = rand(-35, 35), vy = d.vel + rand(-20, 20);
  if (lado === 1) { x = -d.r - 5; y = rand(H * 0.08, H * 0.65); vx = rand(70, 120); vy = rand(80, 140); }
  else if (lado === 2) { x = W + d.r + 5; y = rand(H * 0.08, H * 0.65); vx = rand(-120, -70); vy = rand(80, 140); }
  else { x = rand(d.r + 30, W - d.r - 30); y = -(d.r + 20); }
  hazards.push({ tipo: hazardTipo, x, y, r: d.r, vx, vy,
    giro: rand(0, TAU), giroV: rand(0.8, 2.4) * (Math.random() > 0.5 ? 1 : -1),
    hp: d.hp, warnT: lado === 0 ? 1.0 : 0 });
}

function actualizarHazards(dt) {
  if (hazardEnabled && state === "play" && !paused && !miniboss) {
    hazardAcc += dt;
    const ritmo = 2.0 + Math.random() * 1.4;
    while (hazardAcc >= ritmo) { hazardAcc -= ritmo; spawnHazard(); }
  }
  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i];
    if (h.warnT > 0) { h.warnT -= dt; continue; }
    h.y += h.vy * dt; h.x += h.vx * dt; h.giro += h.giroV * dt;
    if (h.x < h.r && h.vx < 0) h.vx = -h.vx;
    if (h.x > W - h.r && h.vx > 0) h.vx = -h.vx;
    if (h.y - h.r > H + 30) { hazards.splice(i, 1); continue; }
    if (state !== "play" || paused) continue;
    const dx = player.x - h.x, dy = player.y - h.y;
    if (dx * dx + dy * dy < (hitR() + h.r * 0.72) ** 2) {
      muerte(h.x, h.y, esCristal(h) ? "#88ddff" : "#ff6600", "media");
      hazards.splice(i, 1); golpe(); continue;
    }
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const bx = b.x - h.x, by = b.y - h.y;
      if (bx * bx + by * by >= (b.r + h.r) ** 2) continue;
      h.hp -= b.dmg;
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (h.hp <= 0) {
        muerte(h.x, h.y, esCristal(h) ? "#88ddff" : "#ff8800", "basica");
        if (esCristal(h)) vfx("cryo", h.x, h.y, 130, 0.4);
        hazards.splice(i, 1);
      }
      break;
    }
  }
}

function dibujarHazards() {
  for (const h of hazards) {
    const esC = h.tipo === "cristal";
    const sp = SPRITES["hz_" + h.tipo];
    if (h.warnT > 0) {
      const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 90);
      ctx.save(); ctx.globalAlpha = pulse;
      ctx.fillStyle = esC ? "#88ddff" : "#ff8800";
      const wx = clamp(h.x, 18, W - 18), wy = SAFE_TOP + 24;
      ctx.beginPath(); ctx.moveTo(wx, wy + 10); ctx.lineTo(wx - 9, wy - 5); ctx.lineTo(wx + 9, wy - 5);
      ctx.closePath(); ctx.fill(); ctx.restore();
      continue;
    }
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.giro);
    if (sp) {
      ctx.shadowColor = esC ? "#44aaff" : "#ff4400"; ctx.shadowBlur = 12;
      pintarSprite(sp, h.r * 2.3); ctx.shadowBlur = 0;
    } else {
      ctx.beginPath(); ctx.arc(0, 0, h.r, 0, TAU);
      ctx.fillStyle = esC ? "#4499ee" : "#cc4400"; ctx.fill();
      ctx.strokeStyle = esC ? "#aaddff" : "#ff8800"; ctx.lineWidth = 2.5; ctx.stroke();
    }
    ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════
//  DEFENSAS FIJAS — torretas estacionarias (M3)
// ════════════════════════════════════════════════════════════
const DEFENSA_TIPOS = {
  torreta: {
    r: 22, hpMax: 8, puntos: 150,
    recarga: () => rand(2.0, 2.8),
    atacar(d) { PATRONES.abanico(d.x, d.y, haciaJugador(d), 240, 1, 0, 5); beep(280, 0.09, "sawtooth", 0.025); },
  },
  canon: {
    r: 24, hpMax: 14, puntos: 220,
    recarga: () => rand(1.4, 2.0),
    atacar(d) { PATRONES.abanico(d.x, d.y, haciaJugador(d), 265, 3, 0.18, 6); beep(200, 0.12, "sawtooth", 0.035); },
  },
};
let defensas = [];

function spawnDefensas(tipo, n) {
  const d = DEFENSA_TIPOS[tipo];
  const sep = W / (n + 1);
  const y = SAFE_TOP + H * 0.09 + rand(-15, 15);
  for (let i = 0; i < n; i++) {
    defensas.push({ tipo, x: sep * (i + 1), y, r: d.r,
      hp: d.hpMax, hpMax: d.hpMax, cd: d.recarga() * 0.6, flash: 0 });
  }
}

function actualizarDefensas(dt) {
  for (let i = defensas.length - 1; i >= 0; i--) {
    const d = defensas[i];
    if (d.flash > 0) d.flash -= dt;
    if (state !== "play" || paused) continue;
    d.cd -= dt;
    if (d.cd <= 0) { DEFENSA_TIPOS[d.tipo].atacar(d); d.cd = DEFENSA_TIPOS[d.tipo].recarga(); }
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const dx = b.x - d.x, dy = b.y - d.y;
      if (dx * dx + dy * dy >= (b.r + d.r) ** 2) continue;
      d.hp -= b.dmg; d.flash = 0.1; bulletsHit++;
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (d.hp <= 0) {
        muerte(d.x, d.y, "#4499ff", "defensa");
        combo++; comboT = CONFIG.comboTiempo; enemiesKilled++;
        maxCombo = Math.max(maxCombo, combo);
        const pts = Math.round(DEFENSA_TIPOS[d.tipo].puntos * multCombo());
        score += pts;
        texto(d.x, d.y - 30, "+" + pts, T.bala, 15);
        hitoCombo();
        if (Math.random() > 0.45) soltarPremio(d.x + rand(-20, 20), d.y, elegirPremioAleatorio());
        defensas.splice(i, 1);
      }
      break;
    }
  }
}

function dibujarDefensas() {
  for (const d of defensas) {
    const sp = SPRITES["df_" + d.tipo];
    ctx.save(); ctx.translate(d.x, d.y);
    if (sp) {
      if (d.flash > 0) ctx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 35);
      ctx.shadowColor = "rgba(0,80,255,0.5)"; ctx.shadowBlur = 10;
      pintarSprite(sp, d.r * 2.2); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    } else {
      ctx.beginPath(); ctx.arc(0, 0, d.r, 0, TAU);
      ctx.fillStyle = d.flash > 0 ? "#ffffff" : "#4466cc"; ctx.fill();
      ctx.strokeStyle = "#88aaff"; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.restore();
    const bw = d.r * 2.4, bh = 4, bx = d.x - bw / 2, by = d.y - d.r - 9;
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    const col = d.hp > d.hpMax * 0.5 ? "#44aaff" : d.hp > d.hpMax * 0.25 ? "#ffaa00" : "#ff4444";
    ctx.fillStyle = col; ctx.fillRect(bx, by, bw * (d.hp / d.hpMax), bh);
  }
}

// ════════════════════════════════════════════════════════════
//  ZONAS TÓXICAS — daño ambiental con telegráfico (M4)
// ════════════════════════════════════════════════════════════
let zonas = [], zonaEnabled = false, zonaAcc = 0;

function spawnZona() {
  zonas.push({ x: rand(70, W - 70), y: rand(H * 0.18, H * 0.62),
    r: rand(52, 88), t: 0, fase: 0, damageCd: 0 });
}

function actualizarZonas(dt) {
  if (zonaEnabled && state === "play" && !paused) {
    zonaAcc += dt;
    if (zonaAcc >= 5.5) { zonaAcc = 0; spawnZona(); if (Math.random() > 0.5) spawnZona(); }
  }
  for (let i = zonas.length - 1; i >= 0; i--) {
    const z = zonas[i]; z.t += dt;
    if (z.fase === 0 && z.t >= 2.0) { z.fase = 1; z.t = 0; beep(220, 0.08, "sawtooth", 0.025); }
    if (z.fase === 1 && z.t >= 4.2) { z.fase = 2; z.t = 0; }
    if (z.fase === 2 && z.t >= 0.85) { zonas.splice(i, 1); continue; }
    if (z.fase !== 1 || state !== "play" || paused) continue;
    const dx = player.x - z.x, dy = player.y - z.y;
    if (dx * dx + dy * dy < (hitR() * 0.85 + z.r * 0.82) ** 2) {
      if (z.damageCd <= 0) { golpe(); z.damageCd = 1.4; }
    }
    if (z.damageCd > 0) z.damageCd -= dt;
  }
}

function dibujarZonas() {
  const sp = SPRITES["hz_nube_toxica"];
  for (const z of zonas) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 200);
    ctx.save();
    if (z.fase === 0) {
      const alpha = (0.35 + 0.4 * pulse) * Math.min(1, z.t / 0.5);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = "#55ff55"; ctx.lineWidth = 2.5; ctx.setLineDash([8, 7]);
      const rad = z.r * Math.min(1, 0.25 + z.t * 0.375);
      ctx.beginPath(); ctx.arc(z.x, z.y, rad, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = alpha * 0.15; ctx.fillStyle = "#33ff33";
      ctx.beginPath(); ctx.arc(z.x, z.y, rad, 0, TAU); ctx.fill();
    } else if (z.fase === 1) {
      if (sp) {
        ctx.globalAlpha = 0.78; ctx.translate(z.x, z.y); pintarSprite(sp, z.r * 2.0);
      } else {
        ctx.globalAlpha = 0.38 + 0.18 * pulse;
        ctx.fillStyle = "rgba(60,220,60,0.55)";
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
        ctx.globalAlpha = 0.7 + 0.3 * pulse; ctx.strokeStyle = "#66ff66"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.stroke();
      }
    } else {
      ctx.globalAlpha = (1 - z.t / 0.85) * 0.38; ctx.fillStyle = "rgba(60,220,60,0.4)";
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.restore();
  }
}

const SAVE_VERSION = 1;
function cargarSave() {
  try {
    const raw = localStorage.getItem("sf_save");
    if (!raw) return {};
    const s = JSON.parse(raw);
    if (!s || typeof s !== "object") return {};
    if (s.v !== SAVE_VERSION) return {};   // versión antigua → reset limpio
    return s;
  } catch (_) { return {}; }
}
function guardarSave(campos) {
  try {
    const actual = cargarSave();
    const nuevo = Object.assign({}, actual, campos, { v: SAVE_VERSION });
    localStorage.setItem("sf_save", JSON.stringify(nuevo));
  } catch (_) {}
}
function leerMisionIdx(s) {
  const v = s.misionIdx;
  if (typeof v !== "number" || !isFinite(v)) return 0;
  return Math.max(0, Math.min(Math.floor(v), MISIONES.length - 1));
}

// Las familias de arma que suelta cada misión son parte de su identidad:
// en el cinturón de asteroides caen misiles, en la fisura helada cae crio.
// Salir de M2 con un arma distinta a la de M5 es lo que hace que la
// campaña no sepa toda igual.
function armasDeMision() {
  const m = modo === "campana" && MISIONES[misionIdx];
  return (m && m.armas) || ["plasma", "laser"];
}
function elegirPremioAleatorio() {
  const r = Math.random();
  if (r > 0.945) return "vida";
  if (r > 0.855) return "bomba";
  if (r > 0.715) return "escudo";
  if (r > 0.595) return "rapido";
  if (r > 0.435) {
    const fam = armasDeMision();
    return fam[(Math.random() * fam.length) | 0];
  }
  return "arma";
}

function procesarEvento(ev) {
  if (ev.fn === "ola") {
    spawnFormacion(ev.tipo, ev.n, ev.patron || "linea");
  } else if (ev.fn === "reward") {
    soltarPremio(W / 2 + rand(-80, 80), -30, elegirPremioAleatorio());
  } else if (ev.fn === "miniboss") {
    spawnMiniboss(ev.tipo, ev.mult);
  } else if (ev.fn === "hazardOn") {
    hazardEnabled = true;
    if (ev.subtipo) hazardTipo = ev.subtipo;
  } else if (ev.fn === "hazardOff") {
    hazardEnabled = false;
  } else if (ev.fn === "defensa") {
    spawnDefensas(ev.tipo || "torreta", ev.n || 3);
  } else if (ev.fn === "zonaOn") {
    zonaEnabled = true;
  } else if (ev.fn === "zonaOff") {
    zonaEnabled = false;
  }
}

// ── Puesta en escena ──────────────────────────────────────
//  El jefe existe desde el AVISO, no desde que se le puede disparar.
//  Ese par de segundos de pausa dramática es lo que separa "aparece un
//  enemigo grande" de "llega alguien".
function spawnMiniboss(tipo, mult) {
  const d = JEFES[tipo];
  if (!d) return;
  // El mismo jefe cuatro misiones seguidas se agota. Escalarlo por misión
  // no lo arregla del todo — eso lo arreglan M6-M10 con jefes propios —
  // pero al menos el Guardián de la M4 no cae igual que el de la M1.
  const hpm = Math.round(d.hpMax * (mult || 1));
  miniboss = {
    tipo, r: d.r, hp: hpm, hpMax: hpm,
    x: W / 2, y: -d.r - 60, baseY: H * 0.2 + d.r * 0.35,
    est: "aviso", estT: 0, fase: 0, faseT: 0, flash: 0, recoil: 0,
    cds: [], muerteT: 0, invul: true, sacudida: 0,
  };
  warningT = 2.6;
  eBullets.length = 0;
  sfx("boss_llega");
  sacudir("medium");
  musica("jefe");
}

function cambiarFase(mb, n) {
  const d = JEFES[mb.tipo];
  const f = d.fases[n];
  if (!f) return;
  mb.fase = n; mb.faseT = 0;
  mb.cds = f.ataques.map(a => rand(a.cd[0], a.cd[1]) * 0.6);
  if (n > 0) {
    // TRANSICIÓN. Un pulso que barre los proyectiles, cambia el color de
    // los ojos y da al jugador un respiro de medio segundo. Sin ella, la
    // fase 2 solo se nota en que te matan más rápido.
    mb.invul = true; mb.estT = 0; mb.est = "transicion";
    eBullets.length = 0;
    telegrafos.length = 0;
    vfx("emp", mb.x, mb.y, Math.max(W, H) * 1.1, 0.7, { crece: 1.6, desde: 0.15 });
    vfx("fase", mb.x, mb.y, mb.r * 6, 0.6);
    onda(mb.x, mb.y, f.ojo, Math.max(W, H), 0.7);
    flash = Math.max(flash, 0.4);
    sacudir("heavy"); hitstop(0.08);
    sfx("fase");
    texto(W / 2, H * 0.36, f.final ? "FASE FINAL" : "FASE " + (n + 1), f.ojo, 26);
  }
}

function actualizarMiniboss(dt) {
  if (!miniboss) return;
  const mb = miniboss, d = JEFES[mb.tipo];
  if (mb.flash > 0) mb.flash -= dt;
  if (mb.recoil > 0) mb.recoil = Math.max(0, mb.recoil - dt * 45);
  mb.estT += dt;

  // ── AVISO: el jefe todavía no está, pero ya se le siente ──
  if (mb.est === "aviso") {
    if (mb.estT > 2.6) { mb.est = "entrada"; mb.estT = 0; }
    return;
  }

  // ── ENTRADA: baja frenando, con los motores encendidos ──
  if (mb.est === "entrada") {
    const k = Math.min(1, mb.estT / 1.9);
    mb.y = (-d.r - 60) + (mb.baseY + d.r - (-d.r - 60)) * (1 - Math.pow(1 - k, 3));
    for (let i = 0; i < Q.part * 3; i++) {
      part(mb.x + rand(-mb.r, mb.r), mb.y + mb.r * 0.7, rand(-60, 60), rand(120, 300),
        rand(0.2, 0.45), i % 3 ? d.color(T) : "#ffffff", rand(1.5, 3.6));
    }
    if (k >= 1) {
      mb.est = "combate"; mb.estT = 0; mb.invul = false;
      mb.baseY = mb.y;
      cambiarFase(mb, 0);
      sacudir("heavy");
      onda(mb.x, mb.y, d.color(T), mb.r * 7, 0.6);
      vfx("anillo", mb.x, mb.y, mb.r * 6, 0.5);
    }
    return;
  }

  // ── TRANSICIÓN entre fases ──
  if (mb.est === "transicion") {
    mb.faseT += dt;
    d.fases[mb.fase].mover(mb, dt);
    if (mb.estT > 1.1) { mb.est = "combate"; mb.estT = 0; mb.invul = false; }
    return;
  }

  // ── MUERTE CINEMÁTICA ──
  if (mb.est === "muriendo") {
    mb.muerteT += dt;
    mb.x += Math.sin(mb.muerteT * 22) * 90 * dt;
    mb.y += 16 * dt;
    // 1 · Fallos internos en cadena
    if (mb.muerteT < 1.9) {
      if (Math.random() < 0.55) {
        const a = rand(0, TAU), rr = rand(0, mb.r * 0.85);
        const ex = mb.x + Math.cos(a) * rr, ey = mb.y + Math.sin(a) * rr;
        vfx("exp_basica", ex, ey, rand(60, 130), 0.35);
        boom(ex, ey, "#ffcf5c", 8, 1);
        sfx("exp_peq", { vol: 0.6 });
        sacudir("tiny");
      }
      if (mb.muerteT > 1.5) flash = Math.max(flash, (mb.muerteT - 1.5) / 0.4 * 0.5);
    }
    // 2 · Detonación principal
    else if (!mb.detonado) {
      mb.detonado = true;
      flash = 0.9;
      hitstop(0.16);
      sacudir("boss");
      sfx("exp_boss");
      vfx("exp_boss", mb.x, mb.y, mb.r * 11, 1.4, { crece: 1.6, desde: 0.3 });
      vfx("ultimate", mb.x, mb.y, mb.r * 7, 1.0);
      onda(mb.x, mb.y, "#ffffff", Math.max(W, H) * 1.2, 0.9);
      onda(mb.x, mb.y, d.color(T), mb.r * 14, 1.1);
      boom(mb.x, mb.y, d.color(T), 110, 3);
      restos(mb.x, mb.y, "#ffcf5c", 70, 2.4);
      eBullets.length = 0; telegrafos.length = 0;
    }
    // 3 · Silencio breve y VICTORIA
    else if (mb.muerteT > 3.1) {
      score += d.puntos;
      texto(W / 2, H * 0.42, "+" + d.puntos.toLocaleString("es"), "#ffd700", 30);
      texto(W / 2, H * 0.48, d.nombre + " DESTRUIDO", "#ffffff", 18);
      sfx("victoria");
      for (const tipo of d.drops) soltarPremio(W / 2 + rand(-W * 0.3, W * 0.3), H * 0.3 + rand(-40, 40), tipo);
      miniboss = null;
      musica("combate");
    }
    return;
  }

  // ── COMBATE ──
  mb.faseT += dt;
  const f = d.fases[mb.fase];
  f.mover(mb, dt);

  // Cambio de fase por umbral de vida
  const ratio = mb.hp / mb.hpMax;
  if (mb.fase + 1 < d.fases.length && ratio <= d.fases[mb.fase + 1].umbral) {
    cambiarFase(mb, mb.fase + 1);
    return;
  }

  for (let i = 0; i < f.ataques.length; i++) {
    const a = f.ataques[i];
    mb.cds[i] -= dt;
    if (a.avisa && !mb.avisados) mb.avisados = {};
    if (a.avisa && mb.cds[i] <= a.avisa && !mb.avisados[i]) { mb.avisados[i] = 1; a.telegrafo(mb); }
    if (mb.cds[i] <= 0) {
      a.fn(mb);
      mb.cds[i] = rand(a.cd[0], a.cd[1]);
      if (mb.avisados) mb.avisados[i] = 0;
    }
  }

  // Impactos de balas del jugador
  if (!mb.invul) {
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const dx = b.x - mb.x, dy = b.y - mb.y;
      if (dx * dx + dy * dy >= (b.r + mb.r * 0.84) ** 2) continue;
      mb.hp -= b.dmg; mb.flash = 0.07; bulletsHit++;
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (mb.hp <= 0) { matarMiniboss(); return; }
      if (gastada) break;
    }
    const dx = player.x - mb.x, dy = player.y - mb.y;
    if (dx * dx + dy * dy < (hitR() + mb.r * 0.78) ** 2) golpe();
  }
}

function matarMiniboss() {
  const mb = miniboss;
  mb.hp = 0; mb.est = "muriendo"; mb.estT = 0; mb.muerteT = 0;
  mb.invul = true; mb.detonado = false;
  maxCombo = Math.max(maxCombo, combo);
  telegrafos.length = 0;
  hitstop(0.1);
  sacudir("heavy");
  sfx("exp_grande");
}

// ── Dibujo del jefe ───────────────────────────────────────
function dibujarMiniboss() {
  if (!miniboss) return;
  const mb = miniboss, d = JEFES[mb.tipo];
  const col = d.color(T);
  const f = d.fases[mb.fase] || d.fases[0];
  if (mb.est === "aviso") return;

  const sp = SPRITES[d.sp];
  ctx.save();
  ctx.translate(mb.x, mb.y - mb.recoil * 0.6);
  if (mb.est === "muriendo") ctx.rotate(Math.sin(mb.muerteT * 9) * 0.06);

  // Aura de fase. Es la señal grande de que algo ha cambiado, visible
  // desde el otro lado de la pantalla.
  if (mb.est !== "entrada") {
    const p = 0.5 + 0.5 * Math.sin(performance.now() / (f.furia ? 130 : 260));
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = (f.furia ? 0.3 : 0.16) + p * 0.16;
    const g = ctx.createRadialGradient(0, 0, mb.r * 0.5, 0, 0, mb.r * 2);
    g.addColorStop(0, f.ojo); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, mb.r * 2, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }

  if (sp) {
    if (Q.sombras) { ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 18; }
    pintarSprite(sp, mb.r * 2.5);
    ctx.shadowBlur = 0;
    const enc = mb.flash > 0 ? Math.min(1, mb.flash * 10)
      : mb.est === "transicion" ? 0.35 + 0.25 * Math.sin(performance.now() / 70) : 0;
    if (enc > 0) {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = enc;
      pintarSprite(sp, mb.r * 2.5);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.beginPath();
    FORMAS.acorazado({ r: mb.r, giro: mb.faseT * 0.04 });
    const lw = Math.max(3, mb.r * 0.12);
    ctx.lineJoin = "round";
    ctx.strokeStyle = mezcla(col, "#ffffff", 0.55); ctx.lineWidth = lw + 8; ctx.stroke();
    ctx.strokeStyle = TINTA; ctx.lineWidth = lw + 3; ctx.stroke();
    const g = ctx.createLinearGradient(0, -mb.r, 0, mb.r);
    g.addColorStop(0, mezcla(col, "#fff", 0.42));
    g.addColorStop(0.5, col);
    g.addColorStop(1, mezcla(col, TINTA, 0.5));
    ctx.fillStyle = mb.flash > 0 ? "#ffffff" : g; ctx.fill();
  }

  // Ojo/núcleo: cambia de color con la fase. Es el indicador más barato
  // y más legible de "esto ya no es lo de antes".
  if (mb.est !== "entrada") {
    const p = 0.55 + 0.45 * Math.sin(performance.now() / (f.furia ? 110 : 230));
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = p * 0.9;
    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, mb.r * 0.5);
    g2.addColorStop(0, "#ffffff"); g2.addColorStop(0.35, f.ojo);
    g2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0, 0, mb.r * 0.5, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// La barra va aparte del jefe: es HUD, no mundo, y no debe temblar con
// la sacudida de cámara ni quedar tapada por una explosión.
function barraJefe() {
  if (!miniboss || miniboss.est === "aviso") return;
  const mb = miniboss, d = JEFES[mb.tipo];
  const f = d.fases[mb.fase] || d.fases[0];
  // Debajo del bloque de marcador, no encima: el nombre del jefe pisando
  // los puntos hace ilegibles las dos cosas.
  const bW = Math.min(W - 40, 460), bH = 9;
  const bX = (W - bW) / 2, bY = SAFE_TOP + 128;
  const ent = mb.est === "entrada" ? Math.min(1, mb.estT / 0.6) : 1;
  ctx.save();
  ctx.globalAlpha = ent;
  ctx.textBaseline = "middle";

  ctx.textAlign = "center";
  ctx.font = "800 " + Math.round(clamp(W * 0.05, 16, 22)) + "px " + F;
  ctx.fillStyle = "#fff";
  ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 6;
  letras(d.nombre, W / 2, bY - 26, 3, "center");
  ctx.font = "700 9px " + F; ctx.fillStyle = f.ojo; ctx.globalAlpha = ent * 0.8;
  letras(d.titulo, W / 2, bY - 10, 1.8, "center");
  ctx.globalAlpha = ent;

  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(bX - 2, bY - 2, bW + 4, bH + 4);
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  ctx.fillRect(bX, bY, bW, bH);
  const fill = Math.max(0, mb.hp / mb.hpMax);
  const g = ctx.createLinearGradient(bX, 0, bX + bW, 0);
  g.addColorStop(0, mezcla(f.ojo, "#ffffff", 0.4));
  g.addColorStop(1, f.ojo);
  ctx.fillStyle = mb.flash > 0 ? "#ffffff" : g;
  ctx.fillRect(bX, bY, bW * fill, bH);
  // Marcas de umbral: se ve cuánto falta para el siguiente cambio.
  for (let i = 1; i < d.fases.length; i++) {
    const u = d.fases[i].umbral;
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(bX + bW * u - 1, bY - 2, 2, bH + 4);
  }
  ctx.shadowBlur = 0;
  ctx.restore();
  ctx.globalAlpha = 1;
}

// El menú también anima, así que todo esto tiene que existir ya
bullets = []; eBullets = []; enemies = []; premios = []; particles = []; flotantes = []; ondas = [];
spawnQueue = []; miniboss = null; misionCompletaT = 0;
player = { x: W / 2, y: H * 0.78, r: 16, px: W / 2 };
targetX = player.x; targetY = player.y;
score = 0; lives = 0; elapsed = 0; level = 1; spawnAcc = 0; shootAcc = 0; invulnT = 0;
arma = 1; escudo = 0; turbo = 0; combo = 0; comboT = 0;
shakeT = 0; shakeMag = 0; flash = 0; bank = 0;
crearFondo();

// ── Entrada ───────────────────────────────────────────────
// El dedo llega en coordenadas de ventana y el juego piensa en coordenadas
// de campo. El marco lateral se descuenta aquí y en ningún sitio más.
function pos(e) { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left - PX, y: e.clientY - r.top }; }
function aim(e) { const p = pos(e); targetX = p.x; targetY = p.y - CONFIG.offsetDedo; }
const dentro = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

c.addEventListener("pointerdown", (e) => {
  unlockAudio();
  if (state === "menu") {
    const p = pos(e);

    // La × de borrar, solo en las naves cargadas por ella, y antes que
    // nada: cae dentro del botón de selección y tiene que ganarle.
    for (const r of naveRects) {
      if (!dentro(p, r) || !r.borrar) continue;
      if (p.x > r.x + r.w - 24 && p.y < r.y + 24) {
        borrarCustom(r.indice);
        naveSel = Math.min(naveSel, NAVES.length - 1);
        guardarSave({ naveId: NAVES[naveSel].id });
        sfx("ui_atras");
        return;
      }
    }
    // Al revés: lo último dibujado está encima y decide.
    for (let i = botones.length - 1; i >= 0; i--) {
      const b = botones[i];
      if (!dentro(p, b) || !b.fn) continue;
      sfx("ui_sel");
      b.fn();
      return;
    }
    return;
  }
  if (state === "over") {
    if (performance.now() - overAt > 700) { state = "menu"; musica("menu"); }
    return;
  }
  if (paused) { paused = false; unlockAudio(); sfx("ui_ok"); return; }
  if (state === "play") {
    const p = pos(e);
    if (dentro(p, hudRects.pausa)) { paused = true; sfx("ui_sel"); return; }
    if (dentro(p, hudRects.bomba)) { usarBomba(); return; }
  }
  dragging = true; aim(e);
  if (c.setPointerCapture) { try { c.setPointerCapture(e.pointerId); } catch (_) {} }
});
c.addEventListener("pointermove", (e) => { if (dragging && state === "play") aim(e); });
window.addEventListener("pointerup", () => { dragging = false; });
window.addEventListener("pointercancel", () => { dragging = false; });

// Teclado: WASD/flechas para mover, Escape para pausar, Ctrl+Shift+D para debug
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Escape" && state === "play") {
    paused = !paused;
    if (!paused) unlockAudio();
  }
  if (e.ctrlKey && e.shiftKey && e.code === "KeyD") showDebug = !showDebug;
  if (e.code === "Escape" && state === "over") state = "menu";
  if ((e.code === "Space" || e.code === "KeyB") && state === "play") { e.preventDefault(); usarBomba(); }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// ════════════════════════════════════════════════════════════
//  EFECTOS
// ════════════════════════════════════════════════════════════
//  Todo lo de aquí sale de una reserva. A densidad de bullet hell se
//  crean y se tiran cientos de objetos por segundo, y en el iPad eso se
//  nota en forma de tirón cada vez que el recolector de basura pasa. Se
//  reutilizan: `libres` guarda los muertos y `push` los resucita.
const libresPart = [];
function part(x, y, vx, vy, life, color, r, tipo) {
  if (particles.length >= Q.maxPart) return null;
  const p = libresPart.pop() || {};
  p.x = x; p.y = y; p.vx = vx; p.vy = vy;
  p.life = life; p.t = 0; p.color = color; p.r = r;
  p.tipo = tipo || 0; p.roce = 0.93; p.grav = 0;
  particles.push(p);
  return p;
}
function soltarPart(i) { libresPart.push(particles[i]); particles.splice(i, 1); }

function boom(x, y, color, n, fuerza) {
  const f = fuerza || 1;
  n = Math.max(1, Math.round(n * Q.part));
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(50, 300) * f;
    part(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.25, 0.65), color, rand(1.5, 4) * f);
  }
}

// Restos: fragmentos que salen despedidos y caen. Lo que separa "ha
// desaparecido" de "se ha roto".
function restos(x, y, color, n, fuerza) {
  if (!Q.estela) return;
  n = Math.round(n * Q.part);
  for (let i = 0; i < n; i++) {
    const a = rand(-TAU / 2, 0), s = rand(80, 320) * (fuerza || 1);
    const p = part(x, y, Math.cos(a) * s, Math.sin(a) * s + rand(-60, 40),
      rand(0.5, 1.2), color, rand(1.2, 3), 1);
    if (p) { p.roce = 0.985; p.grav = 320; }
  }
}

// ── Efectos de sprite ─────────────────────────────────────
//  Un PNG luminoso escalando y apagándose. Es lo que hace que una
//  explosión parezca una explosión y no cuarenta puntos de colores.
let efectos = [];
const libresFx = [];
function vfx(id, x, y, tam, dur, o) {
  const sp = SPRITES["vfx_" + id] || SPRITES["imp_" + id];
  if (!sp) return;
  o = o || {};
  if (efectos.length > 60) return;
  const f = libresFx.pop() || {};
  f.sp = sp; f.x = x; f.y = y; f.tam = tam; f.t = 0; f.life = dur;
  f.rot = o.rot != null ? o.rot : rand(0, TAU);
  f.spin = o.spin || 0;
  f.crece = o.crece != null ? o.crece : 1.35;
  f.desde = o.desde != null ? o.desde : 0.55;
  f.alpha = o.alpha != null ? o.alpha : 1;
  f.aditivo = o.aditivo !== false;
  f.vx = o.vx || 0; f.vy = o.vy || 0;
  efectos.push(f);
}
function actualizarEfectos(dt) {
  for (let i = efectos.length - 1; i >= 0; i--) {
    const f = efectos[i];
    f.t += dt;
    f.rot += f.spin * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.t >= f.life) { libresFx.push(f); efectos.splice(i, 1); }
  }
}
function dibujarEfectos() {
  if (!efectos.length) return;
  for (const f of efectos) {
    const k = f.t / f.life;
    ctx.globalCompositeOperation = f.aditivo ? "lighter" : "source-over";
    // Sube rápido y se apaga despacio: al revés parece un parpadeo.
    ctx.globalAlpha = f.alpha * (k < 0.12 ? k / 0.12 : Math.pow(1 - (k - 0.12) / 0.88, 1.6));
    const s = f.tam * (f.desde + (f.crece - f.desde) * Math.pow(k, 0.45));
    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    const w = f.sp.width || f.sp.naturalWidth, h = f.sp.height || f.sp.naturalHeight;
    const esc = s / Math.max(w, h);
    ctx.drawImage(f.sp, -w * esc / 2, -h * esc / 2, w * esc, h * esc);
    ctx.restore();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}

// ── Muertes ───────────────────────────────────────────────
//  La misma explosión para todo hace que matar un caza y matar un
//  acorazado se sientan igual, que es exactamente lo que no queremos.
const MUERTES = {
  basica:   { vfx:"exp_basica",   tam:120, dur:0.42, part:16, fuerza:1.0, sac:"tiny",   snd:"exp_peq",    onda:0 },
  rapida:   { vfx:"chispa",       tam:100, dur:0.3,  part:12, fuerza:1.2, sac:"tiny",   snd:"exp_peq",    onda:0 },
  media:    { vfx:"exp_media",    tam:170, dur:0.5,  part:26, fuerza:1.3, sac:"small",  snd:"exp_med",    onda:0 },
  pesada:   { vfx:"exp_pesada",   tam:250, dur:0.62, part:44, fuerza:1.7, sac:"medium", snd:"exp_grande", onda:7, stop:0.045 },
  kamikaze: { vfx:"exp_kamikaze", tam:190, dur:0.5,  part:30, fuerza:1.5, sac:"small",  snd:"exp_med",    onda:4 },
  defensa:  { vfx:"defensa",      tam:200, dur:0.55, part:28, fuerza:1.4, sac:"small",  snd:"exp_med",    onda:5 },
  miniboss: { vfx:"exp_boss",     tam:420, dur:1.1,  part:80, fuerza:2.4, sac:"boss",   snd:"exp_boss",   onda:14, stop:0.12 },
};
function muerte(x, y, color, tipo) {
  const d = MUERTES[tipo] || MUERTES.basica;
  vfx(d.vfx, x, y, d.tam, d.dur, { spin: rand(-1, 1) });
  boom(x, y, color, d.part, d.fuerza);
  restos(x, y, mezcla(color, "#ffffff", 0.4), d.part * 0.35, d.fuerza);
  if (d.onda) onda(x, y, color, d.onda * 22, 0.55);
  sacudir(d.sac);
  sfx(d.snd);
  if (d.stop) hitstop(d.stop);
}

// ── Impactos ──────────────────────────────────────────────
//  Cada golpe tiene que sentirse pegado al disparo que lo causó. Un
//  proyectil que entra en un enemigo sin que pase nada es un proyectil
//  que el jugador cree que ha fallado.
const IMPACTOS = {
  ligero: { vfx:"ligero", tam:44, dur:0.2, part:3, snd:"imp_ligero" },
  medio:  { vfx:"medio",  tam:76, dur:0.26, part:7, snd:"imp_medio", sac:"tiny" },
  pesado: { vfx:"pesado", tam:130, dur:0.36, part:14, snd:"imp_pesado", sac:"small", stop:0.03 },
  escudo: { vfx:"escudo", tam:96, dur:0.3,  part:6, snd:"imp_escudo" },
  rotura: { vfx:"escudo_roto", tam:170, dur:0.5, part:20, snd:"emp", sac:"small" },
};
function impacto(x, y, peso, color) {
  const d = IMPACTOS[peso] || IMPACTOS.ligero;
  vfx(d.vfx, x, y, d.tam, d.dur, { aditivo: true });
  if (d.part) boom(x, y, color || "#ffffff", d.part, 0.6);
  if (d.sac) sacudir(d.sac);
  if (d.stop) hitstop(d.stop);
  sfx(d.snd);
}

// ── Sacudida de cámara ────────────────────────────────────
//  Cinco intensidades y ninguna continua. Una sacudida que no para deja
//  de comunicar nada y solo marea, sobre todo en una tablet a 30 cm.
const SACUDIDAS = { tiny:[3,0.1], small:[6,0.18], medium:[11,0.28], heavy:[17,0.42], boss:[26,0.7] };
let shakeDur = 0.4;
function shake(mag, dur) {
  if (!OPCIONES.sacudida) return;
  mag *= OPCIONES.sacudida;
  if (mag >= shakeMag) { shakeMag = mag; shakeDur = dur; shakeT = dur; }
  else if (dur > shakeT) shakeT = Math.min(dur, shakeDur);
}
function sacudir(nivel) {
  const s = SACUDIDAS[nivel];
  if (s) shake(s[0], s[1]);
}

// ── Congelado de impacto ──────────────────────────────────
//  Milisegundos, y solo en lo que pesa. Es lo que hace que un golpe
//  fuerte se sienta fuerte; usado a diario, hace que el juego vaya a
//  tirones.
let hitStop = 0;
function hitstop(s) { hitStop = Math.max(hitStop, s * OPCIONES.hitstop); }

// Anillo de choque. Solo para lo que pesa: acorazados, bombas y la nave.
// Si sale en cada muerte deja de significar nada.
function onda(x, y, color, rMax, dur) {
  if (ondas.length > 14) return;
  ondas.push({ x, y, color, rMax, t: 0, life: dur || 0.45 });
}
function texto(x, y, txt, color, tam) {
  flotantes.push({ x, y: y - flotantes.length * 20, txt, color, t: 0, life: 0.9, tam: tam || 16 });
}

// ── Enemigos ──────────────────────────────────────────────
// Modo supervivencia: elige al azar según el nivel. La campaña por
// niveles llamará a spawnEnemy() con el tipo y la posición concretos.
function elegirTipo() {
  const r = Math.random();
  if (level >= 2 && r < Math.min(0.13 + level * 0.035, 0.36)) return "veloz";
  if (level >= 4 && r > 0.90) return "kamikaze";
  if (level >= 3 && r > 0.84 && r <= 0.90) return "torreta";
  if (level >= 5 && r > 0.78 && r <= 0.84) return "tanque";
  return "normal";
}

function spawnEnemy(tipo, x) {
  const k = tipo || elegirTipo();
  const d = ENEMIGOS[k];
  const e = {
    tipo: k, r: d.r, hp: d.hp, hpMax: d.hp,
    x: x != null ? clamp(x, d.r, W - d.r) : rand(d.r + 10, W - d.r - 10),
    y: -d.r - 12,
    vy: CONFIG.velocidadEnemigo * (1 + (level - 1) * 0.13) * d.vel,
    fase: rand(0, TAU), giro: rand(0, TAU),
    cd: d.recarga ? d.recarga() : 0, flash: 0,
    recoil: 0, lentoT: 0, avisado: 0, escFlash: 0, onda: 0,
  };
  if (d.init) d.init(e);
  enemies.push(e);
  return e;
}

function soltarPremio(x, y, tipo) {
  premios.push({ x, y, vy: 95, r: 17, tipo, f: rand(0, TAU), giro: rand(0, TAU), t: 0 });
}

// ── Daño ──────────────────────────────────────────────────
function enemigoMasCerca(x, y, max, excluir) {
  let mejor = null, md = max * max;
  for (const e of enemies) {
    if (e === excluir || e.hp <= 0) continue;
    const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy;
    if (d < md) { md = d; mejor = e; }
  }
  return mejor;
}
function danioArea(x, y, r, dmg, excluir) {
  const r2 = r * r;
  for (const e of enemies) {
    if (e === excluir || e.hp <= 0) continue;
    const dx = e.x - x, dy = e.y - y;
    if (dx * dx + dy * dy < r2) { e.hp -= dmg; e.flash = 0.08; }
  }
  if (miniboss) {
    const dx = miniboss.x - x, dy = miniboss.y - y;
    if (dx * dx + dy * dy < (r + miniboss.r) ** 2) { miniboss.hp -= dmg; miniboss.flash = 0.06; }
  }
}
let rayos = [];
// Estallido de bomba: hace daño durante los primeros 160 ms y luego solo
// es humo. La ventana corta es lo que permite salir del radio a tiempo.
let estallidos = [];
function estallido(x, y, r) {
  estallidos.push({ x, y, r, t: 0, life: 0.45, hecho: 0 });
  vfx("exp_media", x, y, r * 3.2, 0.42);
  boom(x, y, "#ff8a1f", 22, 1.2);
  onda(x, y, "#ff8a1f", r * 2.2, 0.4);
  sacudir("small");
  sfx("exp_med");
}
function cadenaElectrica(b, x, y, victima) {
  const o = enemigoMasCerca(x, y, 150, victima);
  if (!o) return;
  o.hp -= b.cadena; o.flash = 0.1;
  rayos.push({ x1: x, y1: y, x2: o.x, y2: o.y, col: b.col, t: 0, life: 0.13 });
  impacto(o.x, o.y, "ligero", b.col);
}
// Devuelve true si la bala se ha consumido.
function golpearCon(b, x, y, victima) {
  impacto(x, y, b.imp, b.col);
  if (b.area) danioArea(x, y, b.area, b.dmg * 0.6, victima);
  if (b.cadena) cadenaElectrica(b, x, y, victima);
  if (b.lento && victima) victima.lentoT = Math.max(victima.lentoT || 0, 1.6);
  if (b.pierce > 0) { b.pierce--; b.cd = 0.07; return false; }
  return true;
}

function matar(e, i) {
  const d = ENEMIGOS[e.tipo];
  combo++; comboT = CONFIG.comboTiempo; enemiesKilled++;
  maxCombo = Math.max(maxCombo, combo);
  const mult = multCombo();
  const pts = Math.round(d.puntos * mult);
  score += pts;
  muerte(e.x, e.y, d.color(T), d.muerte || (d.grande ? "pesada" : "basica"));
  if (mult > 1) texto(e.x, e.y - e.r, "+" + pts, T.bala, 13 + Math.min(8, mult));
  hitoCombo();

  const p = CONFIG.probPremio * (d.premio || 1);
  if (Math.random() < p) soltarPremio(e.x, e.y, elegirPremioAleatorio());
  enemies.splice(i, 1);
}

// ── Combo ─────────────────────────────────────────────────
//  Sube por muertes encadenadas y se cae al recibir daño. Los hitos
//  (x5, x10, x25, x50, x100) sí avisan; los demás números, no: llenar la
//  pantalla de cifras es la manera más rápida de que dejen de leerse.
// ── Cierre de misión ──────────────────────────────────────
//  Los extras se calculan una vez y se enseñan uno a uno. Ver la
//  puntuación subir en tramos con nombre es lo que convierte terminar
//  una misión en un premio y no en una pantalla de carga.
let resultado = null;
function cerrarMision() {
  const prec = bulletsFiredo > 0 ? Math.round(bulletsHit / bulletsFiredo * 100) : 0;
  const extras = [
    ["MISIÓN COMPLETADA", 1500],
    ["COMBO MÁXIMO ×" + maxCombo, maxCombo * 25],
    ["PRECISIÓN " + prec + "%", prec * 15],
  ];
  if (sinDanio) extras.push(["SIN UN RASGUÑO", 5000]);
  if (lives >= CONFIG.vidas) extras.push(["INTEGRIDAD INTACTA", 1200]);
  const total = extras.reduce((a, b) => a + b[1], 0);
  score += total;
  resultado = { extras, total, base: score - total, prec };
  misionCompletaT = 6.5;
  sfx("victoria");
  musica("victoria");
  if (score > best) { best = score; guardarSave({ record: best }); }
}

const HITOS = [5, 10, 25, 50, 100];
const multCombo = () => 1 + Math.floor(combo / 8);
function hitoCombo() {
  for (const h of HITOS) {
    if (combo === h && comboHito < h) {
      comboHito = h;
      texto(W / 2, H * 0.62, "COMBO ×" + h, h >= 50 ? "#ffd700" : T.bala, 22 + h / 10);
      vfx("chispa", W / 2, H * 0.62, 90 + h, 0.4);
      sfx("combo", { tono: 1 + HITOS.indexOf(h) * 0.12 });
      if (h >= 25) sacudir("tiny");
    }
  }
}

function cogerPremio(p) {
  const d = premio(p.tipo);
  sfx("pickup");
  vfx("chispa", p.x, p.y, 96, 0.34);
  boom(p.x, p.y, d.color, 18, 0.9);
  onda(p.x, p.y, d.color, 78, 0.34);
  // El nombre va FUERA del PNG, y solo al recogerlo. Un icono con letras
  // encima es un cartel; sin ellas, es un objeto.
  texto(p.x, p.y - 26, d.nombre, d.color, 17);

  if (d.familia) { armaId = d.familia; shootAcc = 0; sfx("mejora"); flash = Math.max(flash, 0.22); }
  else if (p.tipo === "arma") {
    if (arma >= ARMA_MAX) { score += 250; texto(p.x, p.y - 46, "+250", "#ffd700", 14); }
    else { arma++; sfx("mejora"); }
  }
  else if (p.tipo === "escudo") { escudo = 1; sfx("escudo_on"); }
  else if (p.tipo === "vida") { lives = Math.min(lives + 1, 6); sfx("mejora"); }
  else if (p.tipo === "rapido") turbo = 8;
  else if (p.tipo === "bomba") bombas = Math.min(bombas + 1, 5);
}

// ── Bomba ─────────────────────────────────────────────────
//  El momento más satisfactorio del juego tiene que estar en las manos
//  del jugador, no caer del cielo. Se guarda y se gasta cuando ella
//  decide. Y no deja la pantalla en blanco: un fogonazo corto, una onda
//  que recorre el campo y el daño llegando con ella.
let bombaT = 0;
function usarBomba() {
  if (bombas <= 0 || state !== "play" || paused || misionCompletaT > 0) {
    if (state === "play") sfx("ui_no");
    return;
  }
  bombas--;
  bombaT = 0.85;
  flash = Math.max(flash, 0.55);
  sacudir("heavy");
  hitstop(0.07);
  sfx("bomba");
  vfx("ultimate", player.x, player.y, Math.max(W, H) * 1.25, 0.8, { crece: 1.5, desde: 0.1, alpha: 0.85 });
  onda(player.x, player.y, "#ffffff", Math.max(W, H) * 1.2, 0.65);
  onda(player.x, player.y, T.nave, Math.max(W, H) * 0.9, 0.5);
  invulnT = Math.max(invulnT, 0.9);

  // Los proyectiles no desaparecen: se convierten en puntos. Ver la
  // pantalla llena de balas volverse puntuación es la recompensa.
  const balas = eBullets.length;
  for (const b of eBullets) { if (Math.random() < 0.35) boom(b.x, b.y, TIRO_SUYO, 2, 0.5); }
  score += balas * 5;
  eBullets.length = 0;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.hp -= 14;
    if (e.hp <= 0) matar(e, i);
    else e.flash = 0.2;
  }
  for (let i = defensas.length - 1; i >= 0; i--) {
    defensas[i].hp -= 10;
    if (defensas[i].hp <= 0) { muerte(defensas[i].x, defensas[i].y, "#4499ff", "defensa"); defensas.splice(i, 1); }
  }
  for (let i = hazards.length - 1; i >= 0; i--) { muerte(hazards[i].x, hazards[i].y, "#ff8800", "basica"); hazards.splice(i, 1); }
  if (miniboss) { miniboss.hp -= Math.ceil(miniboss.hpMax * 0.09); miniboss.flash = 0.3; }
  if (balas) texto(W / 2, H * 0.5, "+" + balas * 5, "#ffffff", 24);
}

function golpe() {
  if (invulnT > 0) return;
  if (escudo > 0) {
    escudo = 0; invulnT = 0.9;
    impacto(player.x, player.y, "rotura", "#5ce1ff");
    boom(player.x, player.y, "#5ce1ff", 30, 1.3);
    onda(player.x, player.y, "#5ce1ff", player.r * 7, 0.4);
    texto(player.x, player.y - 34, "ESCUDO ROTO", "#5ce1ff", 15);
    return;
  }
  lives--; invulnT = CONFIG.invulnerable;
  sinDanio = false;
  arma = Math.max(1, arma - 1);
  combo = 0; comboHito = 0; comboT = 0;
  muerte(player.x, player.y, T.nave, "media");
  onda(player.x, player.y, T.nave, player.r * 9);
  sacudir("heavy"); hitstop(0.05);
  if (lives <= 0) {
    state = "over"; overAt = performance.now();
    muerte(player.x, player.y, nvColor(), "pesada");
    sacudir("boss"); sfx("derrota");
    onda(player.x, player.y, T.motor, player.r * 20, 0.9);
    if (score > best) { best = score; guardarSave({ record: best }); }
    // Limpiar campo para que el overlay quede limpio
    enemies.length = 0; eBullets.length = 0; bullets.length = 0;
    premios.length = 0; spawnQueue.length = 0; miniboss = null;
    hazards.length = 0; defensas.length = 0; zonas.length = 0;
    hazardEnabled = false; zonaEnabled = false;
  }
}

// ── Disparo ───────────────────────────────────────────────
//  Un disparo son SIETE cosas, no una: núcleo, halo, estela, fogonazo en
//  la boca del cañón, impacto, sonido y retroceso. Quitar cualquiera de
//  ellas y el arma deja de sentirse conectada a la mano.
const libresBala = [];
function nuevaBala(x, y, vx, vy, a) {
  const b = libresBala.pop() || {};
  b.x = x; b.y = y; b.vx = vx; b.vy = vy;
  b.r = a.r; b.dmg = a.dmg * (naveActual().dmg || 1);
  b.col = a.col; b.sp = SPRITES[a.sp]; b.largo = a.largo;
  b.pierce = a.pierce || 0; b.area = a.area || 0;
  b.cadena = a.cadena || 0; b.lento = a.lento || 0;
  b.guia = a.guia || 0; b.vida = a.vida || 0;
  b.imp = a.imp; b.estela = a.estela || 0;
  b.t = 0; b.cd = 0; b.ang = Math.atan2(vy, vx) + Math.PI / 2;
  return b;
}
function soltarBala(i) { libresBala.push(bullets[i]); bullets.splice(i, 1); }

let fogonazos = [];
function fogonazo(x, y, col, tam) {
  if (fogonazos.length > 14) return;
  fogonazos.push({ x, y, col, tam, t: 0, life: 0.08 });
}

function disparar() {
  const a = ARMAS[armaId] || ARMAS.cannon;
  const y = player.y - player.r * 1.1;
  const tiros = a.tiros(arma);
  for (const t of tiros) {
    const bx = player.x + (t.dx || 0);
    bullets.push(nuevaBala(bx, y, t.vx || 0, -a.vel, a));
    fogonazo(bx, y - 4, a.col, a.r * 3.4);
  }
  bulletsFiredo += tiros.length;
  player.retro = Math.min(6, a.dmg * 1.6);
  sfx(a.snd);
  if (a.sac) sacudir(a.sac);
}

// Cambiar de familia conserva el nivel: subir el arma seis veces y perderlo
