  player.empuje += (clamp(desp / 900, 0, 1) - player.empuje) * (1 - Math.exp(-12 * dt));
  const motorCol = nv.motor || T.motor;
  // La llama del motor tiene familia y tope PROPIOS. Es la única
  // partícula que el jugador mira todo el rato, así que no puede
  // quedarse sin sitio porque acabe de explotar medio nivel.
  const nCh = VFX.limites().escala * (1.6 + player.empuje * 2.4);
  for (let i = 0; i < nCh; i++) {
    if (Math.random() > nCh - i) break;
    const sep = player.r * 0.42;
    const sx = (Math.random() < 0.5 ? -sep : sep) + rand(-2, 2);
    VFX.motor(player.x + sx - bank * 12, player.y + player.r * 0.9,
      rand(-22, 22) - bank * 60, rand(110, 220) + player.empuje * 170,
      Math.random() < 0.35 ? "#ffffff" : motorCol,
      rand(1.1, 2.6) * (0.7 + player.empuje * 0.6), rand(0.14, 0.3));
  }

  const armaAct = ARMAS[armaId] || ARMAS.cannon;
  // RAPID CORE: -12%/nivel, multiplicativo y aparte del boost de
  // turbo/Overdrive -los tres se pueden pisar sin romper el tope de
  // disparos por fotograma de más abajo-.
  const cadUp = 1 - (upgradesJugador.rapid_core || 0) * 0.12;
  const cad = armaAct.cad * nv.cad * cadUp * ((turbo > 0 || overdriveActivo > 0) ? 0.55 : 1);
  shootAcc += dt * 1000;
  let disparos = 0;
  while (shootAcc >= cad && disparos < 4) { shootAcc -= cad; disparar(); disparos++; }
  if (shootAcc > cad * 4) shootAcc = 0;

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.t += dt;
    if (b.cd > 0) b.cd -= dt;
    if (b.guia) {
      // Guiado con giro limitado. Un misil que gira sin límite acierta
      // siempre y deja de ser un misil: es un botón de matar.
      const o = enemigoMasCerca(b.x, b.y, 420);
      if (o) {
        const deseado = Math.atan2(o.y - b.y, o.x - b.x);
        const actual = Math.atan2(b.vy, b.vx);
        let d = ((deseado - actual + Math.PI * 3) % TAU) - Math.PI;
        const giro = clamp(d, -b.guia * dt, b.guia * dt);
        const v = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(actual + giro) * v; b.vy = Math.sin(actual + giro) * v;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.ang = Math.atan2(b.vy, b.vx) + Math.PI / 2;
    if (b.estela && Math.random() < b.estela) {
      VFX.estela(b.x, b.y, rand(-14, 14), rand(-14, 14) + 60,
        b.col, b.r * rand(0.4, 0.8), rand(0.1, 0.24) * b.estela);
    }
    if ((b.vida && b.t > b.vida) || b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40) soltarBala(i);
  }
  // OJO con golpe(): al morir vacía eBullets, enemies, premios y compañía.
  // Si eso pasa a mitad de un bucle que recorre el array hacia atrás, la
  // siguiente vuelta lee un hueco. De ahí el corte en seco al perder el
  // estado de juego, en éste y en todos los bucles que puedan golpear.
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    if (b.guiaEne && state === "play" && !paused) {
      // Igual que el guiado del jugador pero mirando al revés: giro
      // limitado, nunca puntería perfecta.
      const deseado = Math.atan2(player.y - b.y, player.x - b.x);
      const actual = Math.atan2(b.vy, b.vx);
      let d = ((deseado - actual + Math.PI * 3) % TAU) - Math.PI;
      const giro = clamp(d, -b.guiaEne * dt, b.guiaEne * dt);
      const v = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(actual + giro) * v; b.vy = Math.sin(actual + giro) * v;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.bomba && b.y >= b.explotaY) { estallido(b.x, b.y, b.bomba); eBullets.splice(i, 1); continue; }
    if (b.y > H + 24 || b.y < -140 || b.x < -24 || b.x > W + 24) { eBullets.splice(i, 1); continue; }
    const dx = b.x - player.x, dy = b.y - player.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < (b.r + hitR()) ** 2) {
      if (b.bomba) estallido(b.x, b.y, b.bomba);
      eBullets.splice(i, 1); golpe(b.x, b.y);
      if (state !== "play") return;
    } else if (!b.cerca) {
      // CLOSE CALL: pasa cerca sin tocar. Una vez por bala -`b.cerca`
      // se apaga en cuanto entra en el anillo- para que no dispare cada
      // fotograma mientras ronda por ahí.
      const rCerca = (b.r + hitR()) * CERCA_MULT;
      if (d2 < rCerca * rCerca) { b.cerca = true; skillEvent("cierre", b.x, b.y); }
    }
  }
  for (let i = estallidos.length - 1; i >= 0; i--) {
    const x = estallidos[i];
    x.t += dt;
    if (x.t < 0.16 && !x.hecho) {
      const dx = player.x - x.x, dy = player.y - x.y;
      if (dx * dx + dy * dy < (x.r + hitR()) ** 2) {
        x.hecho = 1; golpe(x.x, x.y);
        if (state !== "play") return;
      }
    }
    if (x.t >= x.life) estallidos.splice(i, 1);
  }

  // Spawn: campaña vs supervivencia
  if (modo === "campana") {
    // Cola de spawn con retraso (formaciones)
    for (let i = spawnQueue.length - 1; i >= 0; i--) {
      const q = spawnQueue[i];
      if (elapsed >= q.at) {
        const e = spawnEnemy(q.tipo, q.x);
        if (q.y !== undefined) e.y = q.y;
        if (q.marca) e.bonusGen = q.marca;
        if (q.olaGen) e.olaGen = q.olaGen;
        spawnQueue.splice(i, 1);
      }
    }
    // Procesar eventos de la misión
    const mision = MISIONES[misionIdx];
    while (eventoIdx < mision.eventos.length) {
      const ev = mision.eventos[eventoIdx];
      if (elapsed < ev.t) break;
      procesarEvento(ev); eventoIdx++;
    }
    // Detección de misión completa
    if (misionCompletaT <= 0 && eventoIdx >= mision.eventos.length &&
        !miniboss && enemies.length === 0 && spawnQueue.length === 0) {
      cerrarMision();
    }
    if (misionCompletaT > 0) {
      misionCompletaT -= dt;
      if (misionCompletaT <= 0) {
        // DOS finales, no uno.
        //
        //  La M10 es el final de la CAMPAÑA BASE y lo seguirá siendo
        //  aunque la campaña llegue a treinta misiones: es donde muere
        //  OMEGA SOVEREIGN. Antes esto se preguntaba con
        //  `misionIdx >= MISIONES.length - 1`, que significa "la última
        //  que hay" — y con la expansión puesta, el final de la campaña
        //  base habría dejado de existir para todo el que estuviera a
        //  medias.
        //
        //  El final de la EXPANSIÓN es otro hito, con su propio trofeo.
        //  Hoy no existe, y por eso `esFinalExp` es siempre falso: la
        //  tabla tiene exactamente MISIONES_BASE misiones.
        const esFinalBase = misionIdx === MISIONES_BASE - 1;
        const esFinalExp  = MISIONES.length > MISIONES_BASE &&
                            misionIdx === MISIONES.length - 1;
        if (esFinalBase || esFinalExp) {
          const st = {
            score, best: Math.max(best, score), enemiesKilled, maxCombo,
            precision: bulletsFiredo > 0 ? Math.round(bulletsHit / bulletsFiredo * 100) : 0,
            tiempo: elapsed, nave: NAVES[naveSel].nombre,
          };
          if (score > best) best = score;
          if (esFinalExp) {
            campaignCompletedExp = true; campaignStatsExp = st;
          } else {
            campaignCompleted = true; campaignStats = st;
          }
          if (hayGuardado) {
            // El trofeo de la expansión va a SUS campos. `campana.stats`
            // es de OMEGA y no se pisa nunca más.
            SAVE.setVarios(esFinalExp
              ? { "campana.completadaExp": true, "campana.statsExp": st }
              : { "campana.completada": true, "campana.completadaBase": true,
                  "campana.stats": st,
                  // Y se abre la puerta de la expansión AQUÍ MISMO, no solo
                  // al cargar. `subirMision` está topado en la última
                  // misión que existe, así que terminar la campaña base
                  // deja el mismo 9 que tenerla abierta sin ganarla: sin
                  // esta línea, quien la termine hoy tendría que cerrar y
                  // volver a abrir el juego para que la M11 le apareciera.
                  "campana.misionMax": Math.max(
                    SAVE.get("campana.misionMax", 0), MISIONES_BASE) });
            SAVE.ya("campaña completada");
          }
          // Barrido desde la cola de la explosión de OMEGA/AXIOMA. Sin
          // esto, la pantalla final aparecía de golpe encima de los restos.
          UI.reiniciarCifras();
          // Qué pantalla mostrar en "campana-completa" se decide AQUÍ, no
          // dentro de ella: solo se navega a esta pantalla en el instante
          // exacto de un final, así que no hace falta releer el save para
          // saber cuál de los dos acaba de pasar.
          pantallaCompletaEsExp = esFinalExp;
          UI.ir(() => { state = "menu"; pantalla = "campana-completa"; },
            esFinalExp ? "#c9a8ff" : "#ffd700");
          musica("menu"); musica("victoria");
          sfx("campana_victoria");
          UI.desbloqueo({ tipo: "logro",
            titulo: esFinalExp ? "EXPANSIÓN COMPLETADA" : "CAMPAÑA COMPLETADA",
            desc: (esFinalExp ? MISIONES.length : MISIONES_BASE) +
                  " misiones · " + jefeDeMision(misionIdx) + " derrotado",
            color: esFinalExp ? "#c9a8ff" : "#ffd700", dur: 3.4 });
        } else {
          // Avanzar la SELECCIÓN a la siguiente. El desbloqueo ya subió
          // en cerrarMision(), y por separado: si rejugar una misión
          // vieja moviera el máximo, volveríamos al bug de siempre.
          misionIdx = Math.min(misionIdx + 1, MISIONES.length - 1);
          if (hayGuardado) SAVE.set("campana.misionIdx", misionIdx, "siguiente misión");
          state = "menu"; pantalla = "campana"; musica("menu");
        }
      }
    }
  } else {
    // Supervivencia: dificultad escalada por tiempo
    const nl = 1 + Math.floor(elapsed / CONFIG.subeDificultadCada);
    if (nl > level) { level = nl; sfx("desbloqueo"); texto(W / 2, H * 0.42, "NIVEL " + level, T.bala); }
    spawnAcc += dt;
    const ritmo = 1 / (CONFIG.enemigosPorSegundo * (1 + (level - 1) * 0.2));
    while (spawnAcc >= ritmo) { spawnAcc -= ritmo; spawnEnemy(); }
  }

  // Sistemas de misión
  actualizarTelegrafos(dt);
  actualizarHazards(dt);
  actualizarRocas(dt);
  actualizarDefensas(dt);
  actualizarZonas(dt);
  actualizarPozos(dt);
  actualizarCarriles(dt);
  actualizarColumnas(dt);
  actualizarRupturas(dt);
  actualizarOscuridad(dt);
  actualizarSistemas(dt);

  // Miniboss
  actualizarMiniboss(dt);

  for (let i = rayos.length - 1; i >= 0; i--) { rayos[i].t += dt; if (rayos[i].t >= rayos[i].life) rayos.splice(i, 1); }

  // COMMAND SHIPS (M6): mientras viva alguno, la flota entera recarga
  // más rápido. Contar en vez de llevar la cuenta a mano evita que un
  // despawn fuera de pantalla deje el contador desincronizado.
  comandosVivos = 0;
  for (const e of enemies) if (ENEMIGOS[e.tipo].esComando) comandosVivos++;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i], d = ENEMIGOS[e.tipo];
    if (e.flash > 0) e.flash -= dt;
    if (e.lentoT > 0) e.lentoT -= dt;
    e.giro += dt * 1.6;
    // Congelado: se mueve y recarga a la mitad. Frenar es hacer daño.
    const edt = e.lentoT > 0 ? dt * 0.5 : dt;
    d.mover(e, edt);
    if (e.y - e.r > H + 20) {
      if (e.bonusGen) bonusEventoEscape(e);
      if (e.olaGen) cerrarOla(e.olaGen, e.x, e.y, true);
      enemies.splice(i, 1); continue;
    }

    if (e.recoil > 0) e.recoil = Math.max(0, e.recoil - dt * 48);
    if (e.escFlash > 0) e.escFlash -= dt;
    if (e.onda > 0) e.onda = Math.max(0, e.onda - dt * 4);
    if (d.estela && Math.random() < 0.7) {
      VFX.estela(e.x, e.y, rand(-20, 20), rand(-70, -20), d.color(T), rand(1, 2.4), 0.26);
    }

    if (d.atacar) {
      e.cd -= edt;
      // El aviso sale ANTES del ataque, no con él. Esa fracción de
      // segundo es toda la diferencia entre esquivar y adivinar.
      if (d.avisa && !e.avisado && e.cd <= d.avisa * DIF.telegraphMul && e.y > 30) { e.avisado = 1; d.telegrafo(e); }
      if (e.cd <= 0 && e.y > 30) {
        e.cd = d.recarga() * (comandosVivos > 0 && !d.esComando ? 0.7 : 1) * DIF.enemyCadenceMul;
        e.avisado = 0; d.atacar(e);
      }
    }

    // Gancho GENÉRICO y opcional: un enemigo "entre sitios" (rompedor,
    // bloque 5E) declara `invulnerable(e)`. Mientras dice que sí, no
    // encaja balas NI toca al jugador — las dos cosas a la vez, porque
    // un teletransporte que solo se salta una de las dos sigue siendo
    // injusto en la otra dirección.
    const invul = !!(d.invulnerable && d.invulnerable(e));

    let muerto = false;
    if (!invul) for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const bx = b.x - e.x, by = b.y - e.y;
      if (bx * bx + by * by >= (b.r + e.r) ** 2) continue;
      // Gancho GENÉRICO y opcional: un enemigo que REFLEJA en vez de
      // encajar (prisma, bloque 5E) declara `reflejar(e, b)`. Si dice que
      // sí, ya ha cambiado él mismo la velocidad de la bala — aquí solo
      // se le da un respiro de colisión para que no vuelva a rebotar
      // contra el mismo golpe en el fotograma siguiente, y la bala SIGUE
      // VIVA: ni resta vida, ni se gasta, ni cuenta como impacto.
      if (d.reflejar && d.reflejar(e, b)) { b.cd = 0.08; continue; }
      e.hp -= (d.alGolpe ? d.alGolpe(e, b, b.dmg) : b.dmg) * (sistemaBeta ? 0.55 : 1);
      e.flash = 0.09; bulletsHit++;
      const gastada = golpearCon(b, b.x, b.y, e);
      if (gastada) soltarBala(j);
      if (e.hp <= 0) { matar(e, i); muerto = true; break; }
      if (gastada) break;
    }
    if (muerto) continue;

    if (!invul) {
      const px = player.x - e.x, py = player.y - e.y;
      if (px * px + py * py < (hitR() + e.r) ** 2) {
        boom(e.x, e.y, d.color(T), 16);
        if (!d.embiste) { muerte(e.x, e.y, d.color(T), d.muerte || "basica"); enemies.splice(i, 1); }
        golpe(e.x, e.y);
        if (state !== "play") return;
      }
    }
  }

  for (let i = premios.length - 1; i >= 0; i--) {
    const p = premios[i];
    p.f += dt * 4; p.t += dt; p.giro += dt * 1.1;
    const dx = player.x - p.x, dy = player.y - p.y;
    const d = Math.hypot(dx, dy);
    // MAGNET FIELD: imán permanente, más discreto que el power-up
    // temporal -si igualara a imanT dejaría de sentirse especial-.
    const magnetUp = upgradesJugador.magnet_field || 0;
    const alcance = imanT > 0 ? 520 : 165 + magnetUp * 90;
    const velIman = imanT > 0 ? 460 : (260 + magnetUp * 90);
    if (d < alcance) { p.x += (dx / d) * velIman * dt; p.y += (dy / d) * velIman * dt; }
    else p.y += p.vy * dt;
    if (Math.random() < 0.35) {
      VFX.estela(p.x + rand(-p.r, p.r), p.y + rand(-p.r, p.r), rand(-12, 12), rand(-30, -8),
        premio(p.tipo).color, rand(0.8, 1.8), rand(0.3, 0.6));
    }
    if (p.y > H + 30) { premios.splice(i, 1); continue; }
    // Recogida generosa: perder una mejora por dos píxeles no enseña nada.
    if (d < player.r * 1.3 + p.r) { cogerPremio(p); premios.splice(i, 1); }
  }
  if (bombaT > 0) bombaT -= dt;
}

// ── Dibujo ────────────────────────────────────────────────
function fondo() {
  // Si hay imagen de fondo para este mundo, manda ella: se ajusta al ancho
  // y se repite hacia arriba, así que basta con que enlace por arriba y por
  // abajo para que el desplazamiento sea infinito y sin costura.
  // Pedirlo aquí y no al cambiar de mundo es a propósito: hay varios
  // sitios que cambian `T` —misión, supervivencia, hangar, admin, cargar
  // partida— y ninguno tiene por qué acordarse de esto. Pasado el primer
  // fotograma la llamada no hace nada.
  asegurarFondo(T);
  const img = SPRITES["f_" + fondoDe(T)];
  let iw = 0, ih = 0;
  if (img) { iw = img.naturalWidth || img.width; ih = img.naturalHeight || img.height; }
  if (iw && ih) {
    // Espejo alternado. Un fondo pintado no enlaza consigo mismo, así que
    // repetirlo tal cual deja una costura horizontal recorriendo la
    // pantalla cada pocos segundos. Volteando una de cada dos copias, el
    // borde de abajo enlaza con su propio reflejo y desaparece.
    const alto = W * ih / iw, per = alto * 2;
    for (let y = -(fondoY % per) - per; y < H; y += per) {
      ctx.drawImage(img, 0, y, W, alto);
      ctx.save();
      ctx.translate(0, y + per); ctx.scale(1, -1);
      ctx.drawImage(img, 0, 0, W, alto);
      ctx.restore();
    }
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, T.fondoA); g.addColorStop(1, T.fondoB);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // Con imagen detrás, el polvo de siempre se queda como capa de parallax
  // por encima: da sensación de velocidad sin taparla.
  const cap = (iw && ih) ? 0.4 : 1;
  ctx.fillStyle = T.bgColor; ctx.strokeStyle = T.bgColor;
  if (T.bg === "rejilla") {
    ctx.lineWidth = 1;
    for (const s of bg) {
      ctx.globalAlpha = (0.10 + s.z * 0.16) * cap;
      ctx.beginPath(); ctx.moveTo(0, s.y); ctx.lineTo(W, s.y); ctx.stroke();
    }
    ctx.globalAlpha = 0.07 * cap;
    for (let i = 0; i <= 10; i++) {
      const x = (i / 10) * W;
      ctx.beginPath(); ctx.moveTo(W / 2 + (x - W / 2) * 0.15, H * 0.1); ctx.lineTo(x, H); ctx.stroke();
    }
  } else if (T.bg === "burbujas") {
    for (const s of bg) {
      ctx.globalAlpha = (0.12 + s.z * 0.26) * cap;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 2.2, 0, TAU); ctx.stroke();
    }
  } else if (T.bg === "brasas") {
    for (const s of bg) {
      ctx.globalAlpha = (0.2 + s.z * 0.45) * cap;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.1, 0, TAU); ctx.fill();
    }
  } else {
    for (const s of bg) {
      ctx.globalAlpha = (0.25 + s.z * 0.55) * cap;
      ctx.fillRect(s.x, s.y, s.r, s.r * 2.6);
    }
  }
  ctx.globalAlpha = 1;

  // Viñeta: apaga los bordes para que la acción del centro respire y la
  // nave sea lo más claro de la pantalla. Es lo que impide que el fondo
  // compita con un dibujo de contorno grueso.
  const v = ctx.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.2,
                                     W / 2, H * 0.46, Math.max(W, H) * 0.76);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(0.6, "rgba(0,0,0,0.14)");
  v.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function naveVector(r) {
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(2, r * 0.15);
  ctx.strokeStyle = TINTA;

  const cuerpo = (col, arriba) => {
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, mezcla(col, "#ffffff", arriba));
    g.addColorStop(1, mezcla(col, TINTA, 0.35));
    ctx.fillStyle = g;
    ctx.fill(); ctx.stroke();
  };

  ctx.beginPath();
  ctx.moveTo(0, -r * 0.35);
  ctx.lineTo(r * 1.5, r * 0.5); ctx.lineTo(r * 1.05, r * 0.72);
  ctx.lineTo(0, r * 0.3);
  ctx.lineTo(-r * 1.05, r * 0.72); ctx.lineTo(-r * 1.5, r * 0.5);
  ctx.closePath(); cuerpo(T.naveAla, 0.3);

  ctx.beginPath();
  ctx.moveTo(0, -r * 1.25);
  ctx.lineTo(r * 0.42, r * 0.15); ctx.lineTo(r * 0.5, r * 0.72);
  ctx.lineTo(0, r * 0.55);
  ctx.lineTo(-r * 0.5, r * 0.72); ctx.lineTo(-r * 0.42, r * 0.15);
  ctx.closePath(); cuerpo(T.nave, 0.45);

  ctx.fillStyle = T.cabina;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.35, r * 0.2, r * 0.42, 0, 0, TAU);
  ctx.fill(); ctx.lineWidth = Math.max(1.5, r * 0.1); ctx.stroke();
}

// Dibuja el sprite encajado en un ancho dado, manteniendo proporción
function pintarSprite(s, ancho) {
  const w = s.width || s.naturalWidth, h = s.height || s.naturalHeight;
  if (!w || !h) return false;
  const esc = ancho / w;
  ctx.drawImage(s, -ancho / 2, -h * esc / 2, ancho, h * esc);
  return true;
}

function dibujarNave(x, y, r, ang) {
  const nv = naveActual();
  // El color de la llama sale del TRAIL elegido, no del chasis: es
  // cosmético y el jugador lo cambia en el Hangar.
  const motorCol = trailActual().col || nv.motor || T.motor;
  ctx.save();
  ctx.translate(x, y + (player.retro || 0) * 0.5); ctx.rotate(ang);

  // Medidas del sprite, si hay. Las toberas se ajustan a ellas.
  // El sprite ya viene resuelto con la skin del jugador, y cacheado.
  const sp = spriteNave();
  let ws = 0, hs = 0;
  if (sp) {
    const iw = sp.width || sp.naturalWidth, ih = sp.height || sp.naturalHeight;
    // Escala de render POR CHASIS. Es lo que permite que un STRIKER se
    // vea ancho y un INTERCEPTOR estilizado. NO toca la hitbox: esa
    // sigue saliendo de nave.hitbox y solo de ahí.
    if (iw && ih) { ws = r * CONFIG.tamanoNave * (nv.escala || 1); hs = ws * ih / iw; }
  }

  // ── Propulsión ──
  //  Tres capas: resplandor de tobera, llama y pulso. Las tres reaccionan
  //  al empuje, así que frenar y lanzarse se VEN. Va debajo del casco,
  //  para que la llama salga de dentro de la nave y no encima de ella.
  const emp = 0.35 + (player.empuje || 0) * 0.65;
  const sep    = ws ? ws * 0.155 : 7;
  const yMotor = ws ? hs * 0.34 : r * 0.5;
  const largo  = (ws ? ws * 0.34 : 24) * (0.55 + emp * 0.75) * (1 + Math.random() * 0.28);
  const grosor = (ws ? ws * 0.07 : 4) * (0.8 + emp * 0.4);
  ctx.globalCompositeOperation = "lighter";
  for (const sx of [-sep, sep]) {
    const g = ctx.createRadialGradient(sx, yMotor + largo * 0.25, 0, sx, yMotor + largo * 0.25, largo * 1.1);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.28, motorCol);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = 0.5 + emp * 0.4;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, yMotor + largo * 0.25, largo * 1.1, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.9;
    const gl = ctx.createLinearGradient(0, yMotor, 0, yMotor + largo);
    gl.addColorStop(0, "#ffffff");
    gl.addColorStop(0.35, motorCol);
    gl.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.moveTo(sx - grosor, yMotor); ctx.lineTo(sx + grosor, yMotor);
    ctx.lineTo(sx + grosor * 0.2, yMotor + largo);
    ctx.lineTo(sx - grosor * 0.2, yMotor + largo);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  if (ws) {
    // Sombra oscura, no de color: despega la nave del fondo sin pelearse
    // con la paleta del mundo, sea cual sea la nave que haya cargado.
    if (Q.sombras) { ctx.shadowColor = "rgba(0,0,0,0.65)"; ctx.shadowBlur = 10; }
    ctx.drawImage(sp, -ws / 2, -hs / 2, ws, hs);
    ctx.shadowBlur = 0;
  } else {
    if (Q.sombras) { ctx.shadowColor = "rgba(0,0,0,0.65)"; ctx.shadowBlur = 10; }
    naveVector(r);
    ctx.shadowBlur = 0;
    ctx.fillStyle = T.bala;
    for (let i = 0; i < Math.min(arma, 3); i++) {
      const px = r * (0.95 + i * 0.22);
      ctx.beginPath(); ctx.arc(px, r * 0.55, 2.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-px, r * 0.55, 2.4, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();

  // ── Escudo y núcleo ──
  //  Fuera de la rotación del casco: un escudo que se inclina con la nave
  //  parece parte del dibujo, y tiene que leerse como una capa aparte.
  ctx.save();
  ctx.translate(x, y);
  // Escudo activo. TRANSPARENTE a propósito: es una burbuja que hay que
  // ver sin que esconda lo que pasa dentro ni las balas que cruzan por
  // encima. El relleno se queda por debajo de 0,3 de alfa y el borde es
  // fino; lo que lo hace legible es el latido, no la opacidad.
  if (escudo > 0) {
    const pul = 0.5 + Math.sin(performance.now() / 140) * 0.25;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = pul * 0.26;
    const g = ctx.createRadialGradient(0, 0, r * 1.45, 0, 0, r * 2.1);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "#5ce1ff");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.1, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 0.4 + pul * 0.28;
    ctx.strokeStyle = "#9beeff"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, r * 2, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // El núcleo: la zona de impacto de VERDAD. En un bullet hell el jugador
  // necesita saber exactamente qué píxeles le matan, y el dibujo de la
  // nave es más grande que eso a propósito.
  if (OPCIONES.nucleo) {
    const hr = hitR();
    const denso = eBullets.length > 24;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = denso ? 0.95 : 0.6;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, hr * 1.9);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.5, T.bala);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, hr * 1.9, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0, 0, hr * 0.45, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// ── El jugador, con todo su estado visual ─────────────────
//  La invulnerabilidad ya NO parpadea. Antes se encendía y apagaba a
//  15 Hz, o sea que durante segundo y medio —justo después de que te
//  den, justo cuando más falta hace saber dónde estás— la nave no
//  estaba la mitad del tiempo. Ahora se dibuja SIEMPRE y lo que dice
//  "eres intocable" es un anillo de energía que gira, con dos ventajas:
//  se ve sin quitar la nave, y al acabarse late más rápido, que es un
//  aviso de verdad de que se acaba el margen.
function dibujarJugador() {
  if (state !== "play") return;
  const r = player.r;

  // Materialización: la nave entra desde fuera hacia dentro.
  if (respawnT > 0) {
    const k = 1 - respawnT / 0.6;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = (1 - k) * 0.5;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * (4 - k * 2));
    g.addColorStop(0, nvColor());
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * (4 - k * 2), 0, TAU); ctx.fill();
    ctx.restore();
  }

  dibujarNave(player.x, player.y, r, bank);

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.globalCompositeOperation = "lighter";

  // Fogonazo corto de DAÑO. 320 ms, no más: un destello que dura se
  // convierte en un estorbo justo cuando hay que esquivar.
  if (danoT > 0) {
    const k = danoT / 0.32;
    ctx.globalAlpha = k * 0.55;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0, 0, r * (1.2 + (1 - k) * 1.4), 0, TAU); ctx.fill();
    // Arco por donde entró el golpe.
    ctx.globalAlpha = k * 0.8;
    ctx.strokeStyle = "#ff8a9c"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.7, danoAng - 0.7, danoAng + 0.7);
    ctx.stroke();
  }

  // Anillo de invulnerabilidad. Late al doble de rápido en el último
  // medio segundo: eso es información, no adorno.
  if (invulnT > 0) {
    const queda = invulnT;
    const vel = queda < 0.5 ? 220 : 420;
    const pul = 0.55 + 0.45 * Math.sin(performance.now() / (vel / 6));
    const gira = performance.now() / 620;
    ctx.globalAlpha = 0.30 + pul * 0.35;
    ctx.strokeStyle = "#9beeff";
    ctx.lineWidth = 2;
    // Dos arcos opuestos girando: se lee como un campo activo y cuesta
    // cuatro líneas, sin desenfoques ni filtros.
    for (let i = 0; i < 2; i++) {
      const a0 = gira + i * Math.PI;
      ctx.beginPath();
      ctx.arc(0, 0, r * 2.25, a0, a0 + Math.PI * 0.62);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.14 + pul * 0.12;
    const g = ctx.createRadialGradient(0, 0, r * 1.3, 0, 0, r * 2.4);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "#5ce1ff");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, TAU); ctx.fill();
  }

  // Rotura del escudo, orientada al impacto.
  if (escudoRoto > 0) {
    const k = escudoRoto / 0.5;
    ctx.globalAlpha = k * 0.85;
    ctx.strokeStyle = "#9beeff";
    ctx.lineWidth = 2 + k * 4;
    ctx.beginPath();
    ctx.arc(0, 0, r * (2 + (1 - k) * 1.2), escudoAng - 0.9 * k, escudoAng + 0.9 * k);
    ctx.stroke();
  }

  // Aura de OVERDRIVE. Más grande y más rápida que la de invulnerabilidad
  // -tienen que distinguirse a un vistazo- y NO tapa la nave ni sube el
  // radio real de impacto: es lectura, no un escudo disfrazado.
  if (overdriveActivo > 0) {
    const gira = performance.now() / 340;
    ctx.globalAlpha = 0.55 + 0.25 * Math.sin(performance.now() / 70);
    ctx.strokeStyle = "#ff2fbd";
    ctx.lineWidth = 2.6;
    for (let i = 0; i < 3; i++) {
      const a0 = gira + i * TAU / 3;
      ctx.beginPath();
      ctx.arc(0, 0, r * 2.7, a0, a0 + TAU / 3 * 0.55);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.16;
    const go = ctx.createRadialGradient(0, 0, r * 1.4, 0, 0, r * 3.2);
    go.addColorStop(0, "rgba(0,0,0,0)");
    go.addColorStop(1, "#ff2fbd");
    ctx.fillStyle = go;
    ctx.beginPath(); ctx.arc(0, 0, r * 3.2, 0, TAU); ctx.fill();
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.restore();
}

function dibujarEnemigo(e) {
  const d = ENEMIGOS[e.tipo];
  ctx.save();
  // El retroceso empuja el dibujo hacia ATRÁS al disparar. Son cuatro
  // píxeles y medio fotograma, pero es lo que hace que el cañón parezca
  // tener masa en vez de escupir balas.
  ctx.translate(e.x, e.y - (e.recoil || 0));

  // Gancho GENÉRICO y opcional: un enemigo que aparece y desaparece
  // (medusa, bloque 5E) declara `alpha(e)` en vez de reinventar su
  // propio control de opacidad. El resto de enemigos no lo tiene y
  // dibujan a opacidad 1, como siempre.
  if (d.alpha) ctx.globalAlpha = d.alpha(e);

  const sp = SPRITES["e_" + e.tipo];
  if (sp) {
    // Sombra propia: despega el dibujo del fondo sin teñirlo
    if (Q.sombras) { ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 9; }
    ctx.save();
    if (d.rota && e.giro) ctx.rotate(e.giro);
    pintarSprite(sp, e.r * 2.4);
    // Fogonazo al recibir un impacto: se REPINTA el sprite en aditivo.
    // La tentación es un rectángulo blanco con source-atop, pero el
    // destino aquí es el lienzo entero —que es opaco—, así que eso pinta
    // un cuadrado gris alrededor del enemigo en vez de encenderlo.
    if (e.flash > 0) {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = Math.min(1, e.flash * 9);
      pintarSprite(sp, e.r * 2.4);
      pintarSprite(sp, e.r * 2.4);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx.shadowBlur = 0;
    if (e.lentoT > 0) {   // escarcha: el congelado tiene que verse
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.3 + 0.12 * Math.sin(performance.now() / 180);
      const gf = ctx.createRadialGradient(0, 0, e.r * 0.3, 0, 0, e.r * 1.5);
      gf.addColorStop(0, "#bfe9ff"); gf.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gf;
      ctx.beginPath(); ctx.arc(0, 0, e.r * 1.5, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }
    if (d.dibujarExtra) d.dibujarExtra(e);
  } else {
    const col = d.color(T);
    ctx.beginPath();
    (FORMAS[d.forma] || FORMAS.circulo)(e);

    // Volumen: luz arriba, sombra abajo. Lo que separa un cuerpo de
    // una mancha de color, y lo que hace que peguen con las naves.
    // Un contorno negro sobre fondo casi negro no separa nada: en las
    // imágenes de las naves funciona porque están dibujadas sobre blanco.
    // Así que primero un filo claro que despegue del fondo, y el negro
    // por dentro. Se traza antes de rellenar para que el relleno tape la
    // mitad interior de ambos.
    const lw = Math.max(2, e.r * 0.17);
    ctx.lineJoin = "round";
    ctx.strokeStyle = mezcla(col, "#ffffff", 0.6);
    ctx.lineWidth = lw + 6;
    ctx.stroke();
    ctx.strokeStyle = TINTA;
    ctx.lineWidth = lw + 2;
    ctx.stroke();

    const g = ctx.createLinearGradient(0, -e.r, 0, e.r);
    g.addColorStop(0, mezcla(col, "#ffffff", 0.42));
    g.addColorStop(0.5, col);
    g.addColorStop(1, mezcla(col, TINTA, 0.5));
    ctx.fillStyle = e.flash > 0 ? "#ffffff" : g;
    ctx.fill();

    if (DETALLES[d.forma]) DETALLES[d.forma](e);
    if (d.dibujarExtra) d.dibujarExtra(e);

    // Brillo especular, como el de las chapas de las naves
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.beginPath();
    ctx.ellipse(-e.r * 0.22, -e.r * 0.34, e.r * 0.34, e.r * 0.17, -0.5, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  if (e.elite) {
    const pulso = 0.55 + 0.45 * Math.abs(Math.sin(performance.now() / 220));
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "#ffcf5c";
    ctx.globalAlpha = 0.5 * pulso; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.35, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.85 * pulso; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.55, 0, TAU); ctx.stroke();
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
  }

  if (e.hpMax > 3 && e.hp < e.hpMax) {
    const w = e.r * 2;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w, 4);
    ctx.fillStyle = T.bala;
    ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w * (e.hp / e.hpMax), 4);
  }
}

// ── Premios ───────────────────────────────────────────────
//  Un objeto energético flotando, no una chapa con una letra: halo que
//  respira, cabeceo, un anillo que gira alrededor y el icono con su
//  propio brillo. Lo que hace tiene nombre — pero el nombre aparece al
//  cogerlo, no impreso encima.
function dibujarPremio(p) {
  const d = premio(p.tipo);
  const pulso = 0.5 + 0.5 * Math.sin(p.f);
  const bob = Math.sin(p.t * 2.4) * 3.5;
  const s = 1 + pulso * 0.07;
  ctx.save();
  ctx.translate(p.x, p.y + bob);

  // Halo. Aditivo para que se lea sobre cualquier fondo de misión.
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(0, 0, p.r * 0.2, 0, 0, p.r * (2.4 + pulso * 0.5));
  g.addColorStop(0, mezcla(d.color, "#ffffff", 0.35));
  g.addColorStop(0.45, d.color);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.globalAlpha = 0.42 + pulso * 0.2;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, p.r * (2.4 + pulso * 0.5), 0, TAU); ctx.fill();

  // Anillos orbitales: dan eje y velocidad sin gastar partículas, y
  // ADEMÁS dicen de qué clase es el premio sin depender del color.
  //   arma      un anillo
  //   defensa   dos, girando al revés el uno del otro (escudo/vida)
  //   bomba     dos concéntricos y planos, como una carga guardada
  //   útil      uno, rápido
  const clase = clasePremio(p.tipo);
  ctx.globalAlpha = 0.55 + pulso * 0.25;
  ctx.strokeStyle = mezcla(d.color, "#ffffff", 0.5);
  ctx.lineWidth = 1.6;
  ctx.save();
  ctx.rotate(p.giro); ctx.scale(1, clase === "bomba" ? 1 : 0.38);
  ctx.beginPath(); ctx.arc(0, 0, p.r * 1.75, 0, TAU); ctx.stroke();
  ctx.restore();
  if (clase === "defensa" || clase === "bomba") {
    ctx.save();
    ctx.rotate(clase === "bomba" ? p.giro : -p.giro * 1.4);
    ctx.scale(1, clase === "bomba" ? 1 : 0.38);
    ctx.beginPath(); ctx.arc(0, 0, p.r * (clase === "bomba" ? 1.32 : 2.05), 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // PULSO: un anillo que sale del premio cada 1,1 s. El halo respira,
  // pero respirar no llama la atención en una pantalla llena de cosas
  // moviéndose; un pulso que sale sí. No gasta partículas: es un arco.
  const fasePulso = (p.t % 1.1) / 1.1;
  if (fasePulso < 0.55) {
    const kp = fasePulso / 0.55;
    ctx.globalAlpha = (1 - kp) * 0.5;
    ctx.strokeStyle = mezcla(d.color, "#ffffff", 0.4);
    ctx.lineWidth = 2 * (1 - kp) + 0.5;
    ctx.beginPath(); ctx.arc(0, 0, p.r * (1.1 + kp * 1.9), 0, TAU); ctx.stroke();
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  const sp = SPRITES[d.sp];
  ctx.scale(s, s);
  if (sp) {
    if (Q.sombras) { ctx.shadowColor = d.color; ctx.shadowBlur = 14; }
    pintarSprite(sp, p.r * 2.5);
    ctx.shadowBlur = 0;
  } else {
    // Sin PNG, representación procedural. Nunca una letra: un cristal
    // facetado con el color del premio, que sigue leyéndose como objeto.
    ctx.rotate(p.giro * 0.4);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU, r = i % 2 ? p.r * 0.62 : p.r * 1.05;
      ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    const gg = ctx.createLinearGradient(0, -p.r, 0, p.r);
    gg.addColorStop(0, mezcla(d.color, "#ffffff", 0.7));
    gg.addColorStop(1, mezcla(d.color, TINTA, 0.35));
    ctx.fillStyle = gg; ctx.fill();
    ctx.strokeStyle = mezcla(d.color, "#ffffff", 0.85); ctx.lineWidth = 1.6; ctx.stroke();
  }
  ctx.restore();
}

const F = "-apple-system, system-ui, Segoe UI, Roboto, sans-serif";

// ════════════════════════════════════════════════════════════
//  HUD
// ════════════════════════════════════════════════════════════
//  Reglas: nada de cajas de página web, nada de tipografía de 9 px, y
//  todo lo tocable con área de 44 px como mínimo. Los datos viven en dos
//  franjas —arriba lo que se consulta, abajo lo que se usa— y el centro
//  de la pantalla se deja libre, que es donde está el juego.
let hudRects = {};

function panel(x, y, w, h, r, alpha) {
  ctx.fillStyle = "rgba(6,9,22," + (alpha != null ? alpha : 0.55) + ")";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
  ctx.fill();
}
function filo(x, y, w, h, r, col, alpha) {
  ctx.strokeStyle = col; ctx.globalAlpha = alpha != null ? alpha : 0.35;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, r) : ctx.rect(x, y, w, h);
  ctx.stroke(); ctx.globalAlpha = 1;
}
// Texto con espaciado. En una interfaz sci-fi el interletraje hace más
// por el tono que cualquier adorno, y el canvas no tiene letter-spacing
// en los navegadores viejos, así que se hace a mano.
// measureText por carácter y por fotograma son ~150 llamadas de más en
// cada HUD. Los anchos no cambian nunca para una fuente dada, así que se
// miden una vez y se guardan.
const anchoCar = {};
function ancho(ch) {
  const k = ctx.font + "|" + ch;
  let w = anchoCar[k];
  if (w === undefined) { w = ctx.measureText(ch).width; anchoCar[k] = w; }
  return w;
}
function letras(txt, x, y, esp, alinear) {
  let w = esp * (txt.length - 1);
  for (const ch of txt) w += ancho(ch);
  let cx = alinear === "center" ? x - w / 2 : alinear === "right" ? x - w : x;
  const ta = ctx.textAlign; ctx.textAlign = "left";
  for (const ch of txt) { ctx.fillText(ch, cx, y); cx += ancho(ch) + esp; }
  ctx.textAlign = ta;
  return w;
}

// ── Rejilla de lista ──────────────────────────────────────
//  Coloca `n` tarjetas en el hueco que hay, SIN salirse. En el juego no
//  hay desplazamiento —ni lo va a haber: en táctil arrastrar y pulsar se
//  confunden—, así que lo que no cabe no se ve, y por eso la rejilla es
//  la que decide. Con pocas tarjetas van en una columna ancha.
//
//  Pasa a dos columnas por cualquiera de las dos razones, y son razones
//  distintas: `altoMin` es que NO CABE —una columna dejaría las tarjetas
//  por debajo de lo tocable— y `maxFilas` es que no se LEE: una lista de
//  veinte filas no se recorre de un vistazo aunque quepa de sobra, que
//  es justo lo que pasa en un iPad.
//
//  Se llena COLUMNA A COLUMNA, no fila a fila: la campaña se lee de
//  arriba abajo y la M2 tiene que estar debajo de la M1, no al lado.
function rejilla(n, o) {
  const hueco = o.hueco != null ? o.hueco : 8;
  const disp = (H - SAFE_BOTTOM - (o.reserva || 0)) - o.y0;
  const ancho = Math.min(W - 32, o.ancho || 420);
  const x0 = (W - ancho) / 2;
  const cols = n > 1 && ((disp - (n - 1) * hueco) / n < o.altoMin ||
                         n > (o.maxFilas || Infinity)) ? 2 : 1;
  const filas = Math.ceil(n / cols);
  const w = cols === 1 ? ancho : (ancho - hueco) / 2;
  const alto = clamp((disp - (filas - 1) * hueco) / filas, o.altoTope || 30, o.altoMax || 78);
  return {
    cols, filas, w, alto, hueco, compacta: cols > 1,
    pos(i) {
      return { x: x0 + Math.floor(i / filas) * (w + hueco),
               y: o.y0 + (i % filas) * (alto + hueco) };
    },
  };
}

// Corta un texto para que quepa en `maxW` midiéndolo con el MISMO
// espaciado con el que lo va a pintar `letras()`. Sin esto, un nombre
// largo en la rejilla de dos columnas se sale de su tarjeta y se mete
// encima de la de al lado.
function cortar(txt, maxW, esp) {
  const mide = (t) => { let w = esp * (t.length - 1); for (const ch of t) w += ancho(ch); return w; };
  if (mide(txt) <= maxW) return txt;
  let t = txt;
  while (t.length > 1 && mide(t + "…") > maxW) t = t.slice(0, -1);
  return t + "…";
}

function hud() {
  // En partida el distintivo es más importante que en el menú: es el
  // momento en el que uno se cree que está avanzando su campaña.
  if (typeof ADMIN !== "undefined") ADMIN.indicador(PUENTE_HANGAR);
  const acc = T.nave;
  const top = SAFE_TOP + 10;
  const bot = H - SAFE_BOTTOM - 10;
  hudRects = {};

  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = 4;

  // ── Franja superior ──
  const g = ctx.createLinearGradient(0, 0, 0, top + 96);
  g.addColorStop(0, "rgba(3,5,14,0.72)"); g.addColorStop(1, "rgba(3,5,14,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, top + 96);

  // Marcador. Es el número que el jugador mira, así que es el más grande
  // de la pantalla después del juego.
  ctx.textAlign = "center"; ctx.fillStyle = "#fff";
  ctx.font = "800 " + Math.round(clamp(W * 0.075, 26, 38)) + "px " + F;
  ctx.fillText(score.toLocaleString("es"), W / 2, top + 22);
  ctx.font = "700 10px " + F; ctx.fillStyle = acc; ctx.globalAlpha = 0.7;
  letras(best > 0 ? "RÉCORD " + best.toLocaleString("es") : "PUNTOS", W / 2, top + 44, 1.6, "center");
  ctx.globalAlpha = 1;

  // Etiqueta de misión
  ctx.textAlign = "left";
  ctx.font = "800 11px " + F;
  ctx.fillStyle = acc; ctx.globalAlpha = 0.9;
  const et = modo === "campana" ? "M" + (misionIdx + 1) : "NIVEL " + level;
  letras(et, 14, top + 14, 1.4);
  ctx.globalAlpha = 0.45; ctx.fillStyle = "#fff"; ctx.font = "700 10px " + F;
  letras(modo === "campana" ? MISIONES[misionIdx].nombre : "SUPERVIVENCIA", 14, top + 30, 1.2);
  ctx.globalAlpha = 1;

  // Pausa: 44 px de área tocable aunque el icono sea pequeño.
  const pb = { x: W - 14 - 40, y: top - 4, w: 40, h: 40 };
  hudRects.pausa = pb;
  panel(pb.x, pb.y, pb.w, pb.h, 12, 0.5);
  filo(pb.x, pb.y, pb.w, pb.h, 12, acc, 0.3);
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillRect(pb.x + 14, pb.y + 12, 4, 16);
  ctx.fillRect(pb.x + 22, pb.y + 12, 4, 16);

  // ── Combo ──
  //  Solo aparece cuando hay algo que decir, y el arco enseña cuánto
  //  queda antes de perderlo. Un número suelto no avisa de nada.
  if (combo >= 3) {
    // Con jefe en pantalla el centro lo ocupa su barra: el combo se
    // aparta al lado en vez de superponerse.
    const cy = top + 84, cx = miniboss ? W - 40 : W / 2;
    const k = clamp(comboT / comboVentana(), 0, 1);
    ctx.globalAlpha = Math.min(1, comboT * 2.5);
    ctx.strokeStyle = "rgba(255,255,255,0.14)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 20, 0, TAU); ctx.stroke();
    ctx.strokeStyle = combo >= 25 ? "#ffd700" : acc; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 20, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "800 15px " + F;
    ctx.fillText("×" + combo, cx, cy + 1);
    ctx.globalAlpha = 1;
  }

  // ── Franja inferior ──
  const bh = 46, by = bot - bh;
  const gb = ctx.createLinearGradient(0, by - 26, 0, H);
  gb.addColorStop(0, "rgba(3,5,14,0)"); gb.addColorStop(1, "rgba(3,5,14,0.8)");
  ctx.fillStyle = gb; ctx.fillRect(0, by - 26, W, H - by + 26);

  // Integridad: barras, no corazones. Se lee de un vistazo cuánto queda
  // y no compite con los premios rosas que hay por la pantalla.
  const seg = Math.min(6, Math.max(3, CONFIG.vidas + 3));
  const segW = Math.min(20, (W * 0.34) / seg), segH = 7;
  for (let i = 0; i < seg; i++) {
    const x = 14 + i * (segW + 4);
    const vivo = i < lives;
    ctx.fillStyle = vivo ? (lives <= 1 ? "#ff3b5c" : "#ff5d8f") : "rgba(255,255,255,0.12)";
    if (vivo && lives <= 1) ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 140);
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, by + 6, segW, segH, 3) : ctx.rect(x, by + 6, segW, segH);
    ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.textAlign = "left"; ctx.font = "700 9px " + F;
  ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.4;
  letras("INTEGRIDAD", 14, by + 26, 1.4);
  ctx.globalAlpha = 1;
  if (escudo > 0) {
    const sx = 14 + seg * (segW + 4) + 8;
    ctx.fillStyle = "#5ce1ff"; ctx.globalAlpha = 0.75 + 0.25 * Math.sin(performance.now() / 200);
    ctx.beginPath(); ctx.arc(sx + 6, by + 9, 6, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Arma: nombre y nivel. El nombre importa — es lo que hace que recoger
  // un premio de familia se sienta como un cambio y no como un +1.
  const aData = ARMAS[armaId] || ARMAS.cannon;
  ctx.textAlign = "center";
  ctx.font = "800 11px " + F; ctx.fillStyle = aData.col;
  letras(aData.nombre, W / 2, by + 10, 1.6, "center");
  const pipW = 12, pipTot = ARMA_MAX * pipW - 3;
  for (let i = 0; i < ARMA_MAX; i++) {
    ctx.fillStyle = i < arma ? aData.col : "rgba(255,255,255,0.14)";
    ctx.fillRect(W / 2 - pipTot / 2 + i * pipW, by + 22, pipW - 3, 4);
  }
  // Estados temporales, en una sola línea y solo mientras duran.
  const activos = [];
  if (turbo > 0) activos.push(["TURBO " + turbo.toFixed(0), "#8affd1"]);
  if (dobleT > 0) activos.push(["×2 " + dobleT.toFixed(0), "#ffd700"]);
  if (imanT > 0) activos.push(["IMÁN " + imanT.toFixed(0), "#ff5c8a"]);
  if (activos.length) {
    ctx.font = "800 9px " + F; ctx.globalAlpha = 0.9;
    let anchoTot = 0;
    for (const [t] of activos) anchoTot += ctx.measureText(t).width + 14;
    let ax = W / 2 - anchoTot / 2;
    for (const [t, col] of activos) {
      ctx.fillStyle = col; ctx.textAlign = "left";
      ctx.fillText(t, ax, by + 36);
      ax += ctx.measureText(t).width + 14;
    }
    ctx.globalAlpha = 1; ctx.textAlign = "center";
  }

  // Bomba: botón de verdad, en la esquina del pulgar.
  const bb = { x: W - 14 - 52, y: by - 6, w: 52, h: 52 };
  hudRects.bomba = bb;
  const hay = bombas > 0;
  panel(bb.x, bb.y, bb.w, bb.h, 16, hay ? 0.6 : 0.3);
  filo(bb.x, bb.y, bb.w, bb.h, 16, hay ? "#ff5c8a" : "#666", hay ? 0.65 : 0.2);
  const spB = SPRITES["pu_bomba"];
  ctx.save();
  ctx.translate(bb.x + bb.w / 2, bb.y + bb.h / 2 - 3);
  ctx.globalAlpha = hay ? 1 : 0.25;
  if (spB) pintarSprite(spB, 30);
  else { ctx.fillStyle = "#ff5c8a"; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill(); }
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.textAlign = "center"; ctx.font = "800 10px " + F;
  ctx.fillStyle = hay ? "#ffffff" : "rgba(255,255,255,0.3)";
  ctx.fillText("×" + bombas, bb.x + bb.w / 2, bb.y + bb.h - 9);

  ctx.shadowBlur = 0;
}

function miniNave(x, y, tam, tema) {
  ctx.save(); ctx.translate(x, y); ctx.scale(tam / 46, tam / 46);
  ctx.fillStyle = tema.naveAla;
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.lineTo(24, 8); ctx.lineTo(17, 12);
  ctx.lineTo(0, 5); ctx.lineTo(-17, 12); ctx.lineTo(-24, 8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = tema.nave;
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(7, 2); ctx.lineTo(8, 12);
  ctx.lineTo(0, 9); ctx.lineTo(-8, 12); ctx.lineTo(-7, 2);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ════════════════════════════════════════════════════════════
//  MENÚ
// ════════════════════════════════════════════════════════════
//  Pantallas en vez de una sola lista con todo apilado. La portada
//  tiene que parecer la entrada a un videojuego: título, nave, y tres
//  decisiones. Lo demás vive un toque más adentro.
let pantalla = "inicio";   // inicio · naves · campana · mundos · ajustes
let botones = [];
let menuT = 0;

function boton(x, y, w, h, opts) {
  const o = opts || {};
  botones.push({ x, y, w, h, fn: o.fn, id: o.id });
  const acc = o.color || T.nave;
  const r = o.r != null ? o.r : 14;
  // PULSACIÓN. En una tablet no hay hover: el único momento en que el
  // jugador sabe que ha acertado el botón es mientras tiene el dedo
  // encima. Sin esto, tocar y que tarde en pasar algo se siente como
  // que el juego se ha colgado. Se hunde 1 px y se aclara el filo.
  const pul = !o.apagado && UI.estaPulsado(x, y, w, h);
  ctx.save();
  if (pul) ctx.translate(0, 1);
  if (o.sel) {
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = acc;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x - 4, y - 4, w + 8, h + 8, r + 4) : ctx.rect(x - 4, y - 4, w + 8, h + 8);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
  panel(x, y, w, h, r, o.solido ? 0.82 : o.sel ? 0.6 : 0.42);
  if (o.solido) {
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, mezcla(acc, "#ffffff", 0.25));
    g.addColorStop(1, acc);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
    ctx.fill();
  }
  // El filo dice el ESTADO, y no solo con el color: pulsado va al 100 %
  // de opacidad y con doble grosor, bloqueado al 18 % y en gris. Quien
  // no distinga el acento del gris sigue viendo la diferencia de brillo.
  filo(x, y, w, h, r, o.apagado ? "#666" : acc,
    o.apagado ? 0.18 : pul ? 1 : o.sel ? 0.9 : 0.45);
  if (pul) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.14;
    ctx.fillStyle = acc;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
    ctx.fill();
    ctx.restore();
  }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (o.label) {
    ctx.fillStyle = o.solido ? "#05060f" : o.apagado ? "rgba(255,255,255,0.28)" : "#ffffff";
    ctx.font = "800 " + (o.tam || 15) + "px " + F;
    letras(o.label, x + w / 2, y + h / 2 + (o.sub ? -8 : 0), o.esp != null ? o.esp : 2.4, "center");
    if (o.sub) {
      ctx.globalAlpha = o.solido ? 0.7 : 0.5;
      ctx.fillStyle = o.solido ? "#05060f" : "#ffffff";
      ctx.font = "700 9px " + F;
      letras(o.sub, x + w / 2, y + h / 2 + 11, 1.4, "center");
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
  return { x, y, w, h };
}

function titulo() {
  const cy = SAFE_TOP + 74;
  const tam = Math.round(clamp(W * 0.115, 30, 54));
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // Resplandor por detrás: el título es lo primero que se ve y tiene que
  // pesar más que el fondo, sin recurrir a una caja.
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.22 + 0.06 * Math.sin(menuT * 1.6);
  const g = ctx.createRadialGradient(W / 2, cy, 0, W / 2, cy, W * 0.62);
  g.addColorStop(0, T.nave); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);          // el radial ya se apaga solo: recortarlo
  ctx.restore();      // con un rectángulo dejaba un canto horizontal visible

  ctx.font = "800 " + tam + "px " + F;
  ctx.fillStyle = TINTA;
  letras("FLIGHT STRIKE", W / 2 + 2, cy + 2, tam * 0.14, "center");
  ctx.fillStyle = "#ffffff";
  letras("FLIGHT STRIKE", W / 2, cy, tam * 0.14, "center");

  ctx.font = "700 10px " + F;
  ctx.fillStyle = T.nave; ctx.globalAlpha = 0.85;
  letras("SHOOT'EM UP VERTICAL", W / 2, cy + tam * 0.62, 4, "center");
  ctx.globalAlpha = 1;
}

// Nave del menú: flota, respira y enciende motores. Es el escaparate.
function naveEscaparate(cx, cy, tam) {
  const n = naveActual();
  // Igual que en partida: el escaparate enseña la nave CON su skin y sus
  // colores. Si aquí se viera el chasis en gris y en misión dorado, la
  // pantalla de elegir estaría mintiendo.
  const sp = spriteNave();
  // El escaparate aplica la MISMA escala de chasis que el juego: si aquí
  // la nave se ve de un tamaño y en misión de otro, la elección engaña.
  tam = tam * (n.escala || 1);
  const bob = Math.sin(menuT * 1.5) * tam * 0.035;
  const bal = Math.sin(menuT * 0.8) * 0.07;
  ctx.save();
  ctx.translate(cx, cy + bob);
  ctx.rotate(bal);
  const col = n.motor || T.motor;
  const llama = tam * (0.2 + Math.random() * 0.07);
  ctx.globalCompositeOperation = "lighter";
  for (const sx of [-tam * 0.15, tam * 0.15]) {
    const g = ctx.createLinearGradient(0, tam * 0.3, 0, tam * 0.3 + llama);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.3, col);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(sx - tam * 0.035, tam * 0.3); ctx.lineTo(sx + tam * 0.035, tam * 0.3);
    ctx.lineTo(sx, tam * 0.3 + llama); ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  if (sp) pintarSprite(sp, tam);
  else { ctx.scale(tam / 52, tam / 52); naveVector(16); }
  ctx.restore();
}

// El emblema de la nave equipada. Se dibuja en el Hangar, en la ficha y
// en resultados; NUNCA sobre el sprite en partida —a 77 px de ancho, un
// emblema legible serían 12 px de mancha encima de lo único que el
// jugador necesita leer mejor que nada—.
function emblemaNave(cx, cy, tam) {
  const id = NAVES[naveSel] && NAVES[naveSel].id;
  if (!id || !SHIPS.porId(id)) return false;
  const e = SHIPS.emblema(SHIPS.config(id).emblemId);
  if (!e || !e.archivo) return false;
  asegurarEmblema(e.id);
  const sp = SPRITES["emb_" + e.id];
  if (!sp) return false;
  const w = sp.width || sp.naturalWidth, h = sp.height || sp.naturalHeight;
  if (!w || !h) return false;
  const esc = tam / Math.max(w, h);
  ctx.drawImage(sp, cx - w * esc / 2, cy - h * esc / 2, w * esc, h * esc);
  return true;
}

// El nombre con el que el jugador conoce SU nave: el suyo si se lo ha
// puesto, y si no el modelo de fábrica.
function nombreNave() {
  const nv = NAVES[naveSel];
  if (!nv) return "";
  if (!SHIPS.porId(nv.id)) return nv.nombre;
  const cn = SHIPS.config(nv.id).customName;
  return cn ? cn.toUpperCase() : nv.nombre;
}

function barraStat(x, y, w, etiqueta, valor, color) {
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.font = "700 9px " + F; ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.45;
  letras(etiqueta, x, y, 1.4);
  ctx.globalAlpha = 1;
  const bx = x + w * 0.42, bw = w - w * 0.42;
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i < valor ? color : "rgba(255,255,255,0.12)";
    ctx.fillRect(bx + i * (bw / 5), y - 3, bw / 5 - 3, 6);
  }
}

// ── Portada ───────────────────────────────────────────────

    ctx.font = "700 10px " + F; ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.45;

// Cuando se entra a los ajustes DESDE la pausa, la flecha de volver tiene
// que devolver a la partida, no al menú. El estado de juego sigue intacto
// —"menu" solo cambia lo que se dibuja y se actualiza—, así que volver es
// literalmente seguir donde estaba.
let vueltaJuego = false;
function cabecera(txt) {
  botones.push({ x: 8, y: SAFE_TOP + 8, w: 56, h: 44, fn: () => {
    sfx("ui_atras");
    UI.ir(() => {
      if (vueltaJuego) { vueltaJuego = false; state = "play"; paused = true; }
      else pantalla = "inicio";
    });
  } });
  ctx.save();
  ctx.strokeStyle = T.nave; ctx.lineWidth = 2.4; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(40, SAFE_TOP + 22); ctx.lineTo(28, SAFE_TOP + 30); ctx.lineTo(40, SAFE_TOP + 38);
  ctx.stroke();
  ctx.restore();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 14px " + F; ctx.fillStyle = "#fff";
  letras(txt, W / 2, SAFE_TOP + 30, 3.4, "center");
}

// ── Hangar ────────────────────────────────────────────────
//  La pantalla entera vive en js/hangar.js. Aquí queda el enganche y el
//  puente: `pantalla = "naves"` sigue llamándose igual para no tocar el
//  reparto de pantallas ni los botones que ya apuntaban ahí.
function pantallaNaves() {
  HANGAR.dibujar(PUENTE_HANGAR);
}

// ── Puente hacia el Hangar ────────────────────────────────
//  Lo que hangar.js necesita del juego, en un sitio y por escrito. Se
//  construye UNA vez —no por fotograma— porque son referencias fijas;
//  lo que cambia (naveSel) se pasa como función, no como valor.
const PUENTE_HANGAR = {
  get ctx() { return ctx; },
  get W() { return W; }, get H() { return H; },
  get SAFE_TOP() { return SAFE_TOP; }, get SAFE_BOTTOM() { return SAFE_BOTTOM; },
  get F() { return F; }, get T() { return T; },
  get NAVES() { return NAVES; },
  get SPRITES() { return SPRITES; },
  get ARMAS() { return ARMAS; },
  get botones() { return botones; },
  get naveRects() { return naveRects; },
  get masRect() { return masRect; },
  naveSel: () => naveSel,
  boton, panel, filo, letras, cortar, rejilla, pintarSprite, miniNave, naveEscaparate,
  barraStat, cabecera, sfx, clamp,
  seleccionar: (i) => { naveSel = i; guardarNave(); },
  cargarArchivo: () => { fileInput.click(); },
  avisar: (txt) => { aviso = txt; avisoT = 2.4; },
  // Invalida la caché de naveActual()/trailActual(): un cambio de estela
  // tiene que verse en el escaparate en el mismo fotograma, no la
  // próxima vez que se cambie de nave.
  invalidarCache: () => { nvIdx = -1; trIdx = -1; spIdx = -1; },
  // Carga bajo demanda de arte de la expansión (bloque 5I): el Hangar
  // las pide justo cuando va a PINTAR una, nunca antes.
  asegurarEmblema,
  asegurarSkinMaterial,
  get naves() { return { skinsDesbloqueadas: SAVE.get("naves.skinsDesbloqueadas", []),
                          emblemasDesbloqueadas: SAVE.get("naves.emblemasDesbloqueadas", []) }; },
  // El teclado del sistema. Envuelto aquí para que hangar.js no dependa
  // de `window` y se pueda probar sin navegador.
  pedirTexto: (msg, def) => {
    try { return window.prompt(msg, def); } catch (_) { return null; }
  },

  // ── Lo que además necesita ADMIN ──
  //  El mismo puente sirve para las dos pantallas. Admin es una capa
  //  sobre el juego, no una interfaz aparte, y compartir el puente es
  //  lo que impide que se convierta en una.
  irA: (p) => UI.ir(() => { pantalla = p; }),
  totalMisiones: () => MISIONES.length,
  mision: (i) => {
    const m = MISIONES[i];
    const tm = TEMAS.find(t => t.id === m.temaId) || TEMAS[0];
    // El nombre del jefe sale del último evento de jefe de la misión,
    // no de una tabla paralela: una tabla paralela se desincroniza en
    // cuanto alguien cambia un jefe de misión.
    let jefe = "—";
    for (const ev of m.eventos) if (ev.fn === "miniboss" && ev.tipo) jefe = ev.tipo;
    const bj = JEFES[jefe];
    return { nombre: m.nombre, color: tm.nave,
             jefe: (bj && bj.nombre) ? bj.nombre : jefe.toUpperCase() };
  },
  irAJefe: (i) => irAJefe(i),
};

// ── Salto directo a un jefe (solo ADMIN) ──────────────────
//  Arranca la misión DE VERDAD y adelanta el reloj hasta su evento de
//  jefe. Por el camino aplica los eventos de ESTADO —hazard y zona— que
//  estuvieran vigentes, para que el combate ocurra en el escenario que
//  le toca y no en uno vacío. Ni una línea de combate duplicada: el
//  evento de jefe lo procesa el bucle normal, en su sitio.
function irAJefe(idx) {
  misionIdx = idx;
  iniciarMision(idx);
  const evs = MISIONES[idx].eventos;
  let iJefe = -1;
  for (let i = 0; i < evs.length; i++) if (evs[i].fn === "miniboss") iJefe = i;
  if (iJefe < 0) return;
  const DE_ESTADO = ["hazardOn", "hazardOff", "zonaOn", "zonaOff"];
  for (let i = 0; i < iJefe; i++) {
    if (DE_ESTADO.indexOf(evs[i].fn) >= 0) procesarEvento(evs[i]);
  }
  eventoIdx = iJefe;
  elapsed = evs[iJefe].t;
}

// ── Campaña ───────────────────────────────────────────────
function pantallaCampana() {
  cabecera("CAMPAÑA");
  const n = MISIONES.length;
  // La lista se reparte sola: con diez misiones son diez tarjetas anchas
  // y con veinte son dos columnas. Antes el alto salía de dividir el
  // hueco entre `n` con un mínimo de 40 px, y con veinte misiones eso se
  // salía de la pantalla en un móvil corto sin avisar.
  const R = rejilla(n, { y0: SAFE_TOP + 72, reserva: 16, maxFilas: 12,
                         altoMin: 44, altoMax: 78, altoTope: 38 });
  const wCard = R.w, alto = R.alto, cmp = R.compacta;
  const pad = cmp ? 11 : 18;

  for (let i = 0; i < n; i++) {
    const m = MISIONES[i];
    const tm = TEMAS.find(t => t.id === m.temaId) || TEMAS[0];
    const { x, y } = R.pos(i);
    // Se bloquea por el MÁXIMO DESBLOQUEADO, no por la elegida. Antes
    // eran la misma variable: elegir la M1 bloqueaba todo lo demás en
    // cuanto se terminaba.
    // En ADMIN están todas abiertas: es el sentido del modo. No se
    // toca `misionMax` ni se escribe nada — solo se deja de bloquear.
    const bloq = i > misionMax && !(typeof ADMIN !== "undefined" && ADMIN.activo());
    const act = i === misionIdx;
    boton(x, y, wCard, alto, { sel: act, apagado: bloq, color: tm.nave, r: cmp ? 12 : 14,
      fn: () => {
        if (bloq) { sfx("ui_no"); aviso = "Completa la misión anterior"; avisoT = 2; return; }
        sfx("mision_ini");
        UI.ir(() => { misionIdx = i; iniciarMision(i); }, tm.nave);
      } });

    // Sitio que hay que dejar a la derecha para el candado o la flecha.
    const dcha = bloq || act ? (cmp ? 22 : 34) : pad;
    const y1 = y + alto * 0.34, y2 = y + alto * 0.7;

    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = bloq ? "rgba(255,255,255,0.22)" : tm.nave;
    ctx.font = "800 " + (cmp ? 10 : 11) + "px " + F;
    const wNum = letras("M" + (i + 1), x + pad, y1, cmp ? 1.4 : 2);
    ctx.fillStyle = bloq ? "rgba(255,255,255,0.25)" : "#fff";
    ctx.font = "800 " + (cmp ? 11 : 13) + "px " + F;
    const xNom = x + pad + wNum + (cmp ? 7 : 12);
    const espNom = cmp ? 1.1 : 1.6;
    letras(cortar(m.nombre, x + wCard - dcha - xNom, espNom), xNom, y1, espNom);

    const rec = hayGuardado ? SAVE.recordMision(i) : 0;
    if (cmp) {
      // En media tarjeta no cabe la descripción: cortada a dos palabras
      // no dice nada. La segunda línea la ocupa lo único que cambia con
      // lo que uno ha jugado, que es el récord.
      if (bloq) {
        ctx.font = "600 8px " + F; ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.2;
        letras("BLOQUEADA", x + pad, y2, 1);
        ctx.globalAlpha = 1;
      } else if (rec > 0) {
        ctx.font = "800 9px " + F; ctx.fillStyle = "#ffd700"; ctx.globalAlpha = 0.85;
        letras(rec.toLocaleString("es"), x + pad, y2, 1);
        ctx.globalAlpha = 1;
      }
    } else {
      ctx.font = "600 10px " + F; ctx.globalAlpha = bloq ? 0.2 : 0.5;
      ctx.fillStyle = "#fff";
      ctx.fillText(bloq ? "BLOQUEADA" : m.desc, x + pad, y2, wCard - 70);
      ctx.globalAlpha = 1;
      // Récord de la misión. Se guardaba desde ahora y no se veía en
      // ninguna parte: un número que nadie mira no es progresión.
      if (!bloq && rec > 0) {
        ctx.textAlign = "right"; ctx.font = "800 10px " + F;
        ctx.fillStyle = "#ffd700"; ctx.globalAlpha = 0.85;
        ctx.fillText(rec.toLocaleString("es"), x + wCard - (act ? 40 : 18), y2);
        ctx.globalAlpha = 1; ctx.textAlign = "left";
      }
    }

    if (bloq) {
      // Candado dibujado, no un emoji: los emojis cambian de aspecto en
      // cada plataforma y aquí el estilo tiene que ser el mismo siempre.
      ctx.save();
      ctx.translate(x + wCard - (cmp ? 18 : 28), y + alto / 2);
      if (cmp) ctx.scale(0.75, 0.75);
      ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -3, 5, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.3)";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-7, 1, 14, 11, 2) : ctx.rect(-7, 1, 14, 11);
      ctx.fill();
      ctx.restore();
    } else if (act) {
      const px = x + wCard - (cmp ? 20 : 32), py = y + alto / 2, t = cmp ? 6 : 8;
      ctx.fillStyle = tm.nave;
      ctx.beginPath();
      ctx.moveTo(px, py - t);
      ctx.lineTo(px + t * 1.5, py);
      ctx.lineTo(px, py + t);
      ctx.closePath(); ctx.fill();
    }
  }
}

// ── Supervivencia ─────────────────────────────────────────
function pantallaMundos() {
  cabecera("SUPERVIVENCIA");
  // Los mundos de SUPERVIVENCIA salen de su propia lista, no de TEMAS.
  // Antes se recorría TEMAS entero y el reparto vertical dividía entre
  // cuatro a mano: añadir un mundo a la campaña metía una tarjeta más
  // aquí y descuadraba la rejilla, sin que nadie lo hubiera decidido.
  const mundos = TEMAS_SUPERVIVENCIA();
  const R = rejilla(mundos.length, { y0: SAFE_TOP + 84, reserva: 24, hueco: 12,
                                     maxFilas: 6, altoMin: 64, altoMax: 96, altoTope: 54 });
  const wCard = R.w, alto = R.alto, cmp = R.compacta;
  for (let i = 0; i < mundos.length; i++) {
    const t = mundos[i];
    const { x, y } = R.pos(i);
    boton(x, y, wCard, alto, { sel: t.id === T.id, color: t.nave, r: 16,
      fn: () => UI.ir(() => { T = t; if (hayGuardado) SAVE.set("campana.temaId", T.id, "mundo");
        modo = "supervivencia"; reset(); musica("combate"); }, t.nave) });
    const g = ctx.createLinearGradient(x, y, x + wCard, y + alto);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, mezcla(t.fondoB, "#000000", 0.2));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, wCard, alto, 16) : ctx.rect(x, y, wCard, alto);
    ctx.fill();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = t.nave; ctx.font = "800 " + (cmp ? 20 : 26) + "px " + F;
    ctx.fillText(t.icono, x + (cmp ? 14 : 22), y + alto / 2);
    const xNom = x + (cmp ? 42 : 58);
    ctx.fillStyle = "#fff"; ctx.font = "800 " + (cmp ? 12 : 14) + "px " + F;
    // En dos columnas la nave del escaparate no cabe, así que el nombre
    // se queda con el ancho entero de la tarjeta.
    const dcha = cmp ? 10 : 58;
    letras(cortar(t.nombre, x + wCard - dcha - xNom, 2), xNom, y + alto / 2 - 6, 2);
    ctx.font = "700 " + (cmp ? 8 : 9) + "px " + F; ctx.globalAlpha = 0.45;
    letras("OLEADAS SIN FIN", xNom, y + alto / 2 + (cmp ? 10 : 12), 1.4);
    ctx.globalAlpha = 1;
    if (!cmp) {
      const sp = SPRITES[NAVES[naveSel] && NAVES[naveSel].id];
      ctx.save(); ctx.translate(x + wCard - 44, y + alto / 2);
      if (sp) pintarSprite(sp, 46); else miniNave(0, 0, 46, t);
      ctx.restore();
    }
  }
}

// ── Ajustes ───────────────────────────────────────────────
function filaVolumen(y, etiqueta, campo) {
  const anchoP = Math.min(W - 44, 340), x0 = (W - anchoP) / 2;
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.font = "700 10px " + F; ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.6;
  letras(etiqueta, x0, y, 1.6);
  ctx.globalAlpha = 1;
  // Cinco escalones tocables en vez de un deslizador: en una tablet un
  // deslizador de 6 px de alto no se acierta, y aquí no hace falta más
  // resolución que ésta.
  const bx = x0 + anchoP * 0.42, bw = anchoP - anchoP * 0.42;
  const paso = bw / 5;
  for (let i = 0; i < 5; i++) {
    const v = (i + 1) / 5;
    const on = OPCIONES[campo] >= v - 0.01;
    botones.push({ x: bx + i * paso, y: y - 16, w: paso - 3, h: 32,
      fn: () => { OPCIONES[campo] = OPCIONES[campo] === v && i === 0 ? 0 : v; guardarOpciones(); } });
    ctx.fillStyle = on ? T.nave : "rgba(255,255,255,0.12)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(bx + i * paso, y - 5, paso - 3, 10, 3) : ctx.rect(bx + i * paso, y - 5, paso - 3, 10);
    ctx.fill();
  }
}
function filaOpcion(y, etiqueta, valores, campo) {
  const anchoP = Math.min(W - 44, 340), x0 = (W - anchoP) / 2;
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.font = "700 10px " + F; ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.6;
  letras(etiqueta, x0, y, 1.6);
  ctx.globalAlpha = 1;
  const bx = x0 + anchoP * 0.42, bw = anchoP - anchoP * 0.42;
  const paso = bw / valores.length;
  for (let i = 0; i < valores.length; i++) {
    const [lab, val] = valores[i];
    const on = OPCIONES[campo] === val;
    boton(bx + i * paso, y - 15, paso - 4, 30, { sel: on, r: 8, tam: 9, esp: 1,
      label: lab, fn: () => { OPCIONES[campo] = val; guardarOpciones();
        if (campo === "calidad") Q = val === "auto" ? CALIDADES[calidadAuto] : CALIDADES[val];
        if (campo === "dificultad") resolverDificultad(); } });
  }
}

function pantallaAjustes() {
  cabecera("AJUSTES");
  let y = SAFE_TOP + 92;
  const sep = 44;
  ctx.textAlign = "left";
  const anchoP = Math.min(W - 44, 340), x0 = (W - anchoP) / 2;

  // Fondo propio: sobre una nebulosa, texto de 10 px en gris no se lee.
  //
  // El alto se CALCULA a partir del contenido, no se pone a ojo. Con el
  // número fijo que había, PROBAR SONIDO y sus dos líneas de ayuda
  // quedaban FUERA del panel, flotando sobre la nebulosa e ilegibles —y
  // el aviso de "audio en espera" aparece y desaparece, así que
  // cualquier número fijo se queda corto la mitad de las veces.
  const altoSonido = sep * 4 + 16;          // 3 volúmenes + silencio
  const altoImagen = sep * 5 + 16;          // calidad, sacudida, impacto, núcleo, efectos
  const altoDificultad = sep + 16;          // fácil / normal / difícil
  const altoBoton = 48;
  const altoAyuda = audioListo ? 30 : 68;   // el aviso naranja ocupa 38 más
  const altoTotal = 44 + altoSonido + altoImagen + altoDificultad + altoBoton + altoAyuda + 14;
  panel(x0 - 18, y - 44, anchoP + 36, altoTotal, 18, 0.72);
  filo(x0 - 18, y - 44, anchoP + 36, altoTotal, 18, T.nave, 0.18);
  ctx.font = "800 9px " + F; ctx.fillStyle = T.nave; ctx.globalAlpha = 0.8;
  letras("SONIDO", x0, y - 22, 3);
  ctx.globalAlpha = 1;
  filaVolumen(y, "GENERAL", "volMaster"); y += sep;
  filaVolumen(y, "EFECTOS", "volSfx"); y += sep;
  filaVolumen(y, "MÚSICA", "volMusica"); y += sep;
  filaOpcion(y, "SILENCIO", [["NO", false], ["SÍ", true]], "silencio"); y += sep + 16;

  ctx.font = "800 9px " + F; ctx.fillStyle = T.nave; ctx.globalAlpha = 0.8;
  letras("IMAGEN", x0, y - 22, 3);
  ctx.globalAlpha = 1;
  filaOpcion(y, "CALIDAD", [["AUTO", "auto"], ["ALTA", "alta"], ["MEDIA", "media"], ["BAJA", "baja"]], "calidad"); y += sep;
  filaOpcion(y, "SACUDIDA", [["NO", 0], ["POCA", 0.5], ["NORMAL", 1]], "sacudida"); y += sep;
  filaOpcion(y, "IMPACTO", [["NO", 0], ["SÍ", 1]], "hitstop"); y += sep;
  filaOpcion(y, "NÚCLEO", [["NO", false], ["SÍ", true]], "nucleo"); y += sep;
  // "DETALLE" y no "EFECTOS": en la sección de SONIDO ya hay una fila
  // que se llama EFECTOS —el volumen de los sonidos— y dos etiquetas
  // idénticas con significados distintos en la misma pantalla es un
  // error de lectura, no un detalle de estilo.
  filaOpcion(y, "DETALLE", [["AUTO", "auto"], ["ALTO", "alto"], ["MEDIO", "medio"], ["BAJO", "bajo"]], "vfx"); y += sep + 16;

  ctx.font = "800 9px " + F; ctx.fillStyle = T.nave; ctx.globalAlpha = 0.8;
  letras("PARTIDA", x0, y - 22, 3);
  ctx.globalAlpha = 1;
  // El multiplicador de puntuación va SOLO en la etiqueta: la cifra exacta
  // se calibra en el bloque del kill funnel y no hace falta duplicarla aquí.
  filaOpcion(y, "DIFICULTAD", [["FÁCIL", "easy"], ["NORMAL", "medium"], ["DIFÍCIL", "high"]], "dificultad"); y += sep + 16;

  // Prueba de sonido: pasa por el motor real, así que si suena aquí,
  // suena en el juego. Y el propio toque sirve de gesto de desbloqueo.
  const bwT = Math.min(anchoP, 200), bxT = (W - bwT) / 2;
  boton(bxT, y - 8, bwT, 40, { label: "PROBAR SONIDO", tam: 12,
    color: audioListo ? T.nave : "#ff8a1f", fn: probarAudio });
  y += 48;

  ctx.font = "700 9px " + F; ctx.textAlign = "center";
  if (!audioListo) {
    // Si el audio no ha arrancado, eso es más importante que cualquier
    // consejo: se dice, y se dice en naranja.
    ctx.fillStyle = "#ff8a1f"; ctx.globalAlpha = 0.9;
    ctx.fillText("Audio en espera — toca PROBAR SONIDO" +
      (audio ? "  (" + audio.state + ")" : ""), W / 2, y);
    ctx.globalAlpha = 0.35; ctx.fillStyle = "#fff";
    ctx.fillText("En iPhone/iPad, el interruptor de silencio también apaga el juego.", W / 2, y + 15);
    y += 38;
  }
  ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.35;
  ctx.fillText("El núcleo marca la zona exacta que recibe impactos.", W / 2, y);
  ctx.fillText("Calidad AUTO baja los efectos si el aparato no da 60 fps.", W / 2, y + 15);
  ctx.globalAlpha = 1;
  // El panel de PROGRESO se coloca a partir del BORDE real del panel de
  // arriba, no de donde acabó el texto: así los dos nunca se tocan ni se
  // solapan, salga o no el aviso naranja de audio.
  y = SAFE_TOP + 92 - 44 + altoTotal + 16;

  // ── Progreso ──────────────────────────────────────────
  //  Panel PROPIO, y no una sección más del de arriba, por dos motivos:
  //  el de arriba tiene alto fijo y el aviso de "audio en espera"
  //  aparece y desaparece, así que cualquier número que se pusiera se
  //  quedaría corto la mitad de las veces. Y porque lo único
  //  irreversible del juego merece su propia caja.
  if (hayGuardado) {
    const e = SAVE.estado();
    const altoP = 112;
    panel(x0 - 18, y, anchoP + 36, altoP, 18, 0.72);
    filo(x0 - 18, y, anchoP + 36, altoP, 18, "#ff3b5c", 0.16);

    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "800 9px " + F; ctx.fillStyle = T.nave; ctx.globalAlpha = 0.8;
    letras("PROGRESO", x0, y + 18, 3);
    ctx.globalAlpha = 1;

    // ── Puerta de ADMIN ──
    //  Cinco toques seguidos sobre el rótulo "PROGRESO" y después el
    //  PIN. Sin botón visible a propósito: un botón ADMIN en los
    //  ajustes es una invitación para cualquiera que abra el juego, y
    //  esta puerta no es para cualquiera.
    //
    //  Sobre un ROTULO y no sobre el logotipo porque el logotipo se
    //  toca sin querer al volver del menú; un rótulo de sección, no.
    botones.push({ x: x0 - 6, y: y + 6, w: 96, h: 26, fn: () => {
      const ahora = Date.now();
      // La racha caduca: cinco toques dispersos a lo largo de una tarde
      // no son una intención, son casualidad.
      if (ahora - adminUltimoToque > 1200) adminToques = 0;
      adminUltimoToque = ahora;
      adminToques++;
      const hacenFalta = adminRapido ? 1 : 5;
      if (adminToques < hacenFalta) {
        // A partir del tercero se avisa: sin ninguna señal, quien la
        // conoce no sabe si va bien y quien no la conoce nunca la
        // encuentra por accidente, que es lo que se quiere.
        if (adminToques >= 3) { aviso = (hacenFalta - adminToques) + " más"; avisoT = 1.2; }
        return;
      }
      adminToques = 0;
      sfx("ui_sel");
      const pin = (() => { try { return window.prompt("PIN", ""); } catch (_) { return null; } })();
      if (pin === null) return;
      if (!ADMIN.entrar(pin, ADMIN.ultimoPerfil())) {
        sfx("ui_no"); aviso = "PIN incorrecto"; avisoT = 2;
        return;
      }
      ADMIN.ir("menu");
      UI.ir(() => { pantalla = "admin"; }, ADMIN.color());
    } });

    ctx.font = "700 9px " + F; ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.45;
    ctx.fillText("Misión " + (e.misionMax + 1) + " de " + MISIONES.length +
      " · récord " + best.toLocaleString("es"), x0, y + 36);
    ctx.fillText(e.disponible
      ? (e.ultimo ? "Guardado " + horaCorta(e.ultimo) : "Sin guardar todavía")
      : "", x0, y + 50);
    if (!e.disponible) {
      ctx.fillStyle = "#ff8a1f"; ctx.globalAlpha = 0.9;
      ctx.fillText("Este navegador no deja guardar: se perderá al salir.", x0, y + 50);
    }
    ctx.globalAlpha = 1;

    boton(bxT, y + 62, bwT, 38, { label: "BORRAR PROGRESO", tam: 11, color: "#ff3b5c",
      fn: () => { confirmando = "progreso"; sfx("ui_no"); } });
  }
}

// Modal de confirmación. Se dibuja SOBRE lo que haya y se queda con
// todos los toques: `botones` se vacía antes, así que nada de debajo
// puede recibir un toque por error mientras está abierto. Borrar el
// progreso es la única acción del juego que no se puede deshacer.
// Estado del gesto de entrada a ADMIN. Fuera de la función porque la
// pantalla se redibuja entera en cada fotograma y una variable local se
// perdería entre toque y toque.
let adminToques = 0, adminUltimoToque = 0;

let confirmando = null;
function pantallaConfirmar() {
  botones.length = 0;
  ctx.fillStyle = "rgba(3,4,10,0.86)";
  ctx.fillRect(0, 0, W, H);

  const anchoP = Math.min(W - 48, 360), x0 = (W - anchoP) / 2;
  const alto = 250, y0 = (H - alto) / 2;

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 17px " + F; ctx.fillStyle = "#ff3b5c";
