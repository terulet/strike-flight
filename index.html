// El dedo llega en coordenadas de ventana y el juego piensa en coordenadas
// de campo. El marco lateral se descuenta aquí y en ningún sitio más.
function pos(e) { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left - PX, y: e.clientY - r.top }; }
function aim(e) { const p = pos(e); targetX = p.x; targetY = p.y - CONFIG.offsetDedo; }
const dentro = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

c.addEventListener("pointerdown", (e) => {
  unlockAudio();
  if (state === "menu") {
    const p = pos(e);

    for (const r of naveRects) {
      if (!dentro(p, r)) continue;
      // La x de borrar, solo en las naves cargadas por ella
      if (r.borrar && p.x > r.x + r.w - 22 && p.y < r.y + 22) {
        borrarCustom(r.indice);
        naveSel = Math.min(naveSel, NAVES.length - 1);
        guardarSave({ naveId: NAVES[naveSel].id });
        beep(200, 0.12, "square", 0.04);
        return;
      }
      naveSel = r.i;
      guardarSave({ naveId: NAVES[naveSel].id });
      beep(760, 0.1, "triangle", 0.045, 1200);
      return;
    }

    if (dentro(p, masRect)) { fileInput.click(); return; }

    for (const m of modoRects || []) {
      if (dentro(p, m)) {
        modo = m.id; beep(660, 0.1, "triangle", 0.04, 1100); return;
      }
    }

    // Campaña: clic en misión
    for (const m of misionRects || []) {
      if (dentro(p, m) && m.idx <= misionIdx) {
        misionIdx = m.idx;
        beep(760, 0.12, "triangle", 0.05, 1400);
        iniciarMision(misionIdx);
        return;
      }
    }

    // Supervivencia: clic en mundo
    for (const m of menuRects) {
      if (dentro(p, m)) {
        T = m.tema;
        guardarSave({ temaId: T.id });
        beep(660, 0.12, "triangle", 0.05, 1320);
        reset();
        return;
      }
    }
    return;
  }
  if (state === "over") {
    if (performance.now() - overAt > 700) state = "menu";
    return;
  }
  if (paused) { paused = false; unlockAudio(); sfx("ui_ok"); return; }
  if (state === "play") {
    const p = pos(e);
    if (dentro(p, hudRects.pausa)) { paused = true; sfx("ui_sel"); return; }
    if (dentro(p, hudRects.bomba)) { usarBomba(); return; }
  }
  dragging = true; aim(e);
  if (c.setPointerCapture) { try { c.setPointerCapture(e.pointerId); } catch (_) {} }
});
c.addEventListener("pointermove", (e) => { if (dragging && state === "play") aim(e); });
window.addEventListener("pointerup", () => { dragging = false; });
window.addEventListener("pointercancel", () => { dragging = false; });

// Teclado: WASD/flechas para mover, Escape para pausar, Ctrl+Shift+D para debug
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Escape" && state === "play") {
    paused = !paused;
    if (!paused) unlockAudio();
  }
  if (e.ctrlKey && e.shiftKey && e.code === "KeyD") showDebug = !showDebug;
  if (e.code === "Escape" && state === "over") state = "menu";
  if ((e.code === "Space" || e.code === "KeyB") && state === "play") { e.preventDefault(); usarBomba(); }
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// ════════════════════════════════════════════════════════════
//  EFECTOS
// ════════════════════════════════════════════════════════════
//  Todo lo de aquí sale de una reserva. A densidad de bullet hell se
//  crean y se tiran cientos de objetos por segundo, y en el iPad eso se
//  nota en forma de tirón cada vez que el recolector de basura pasa. Se
//  reutilizan: `libres` guarda los muertos y `push` los resucita.
const libresPart = [];
function part(x, y, vx, vy, life, color, r, tipo) {
  if (particles.length >= Q.maxPart) return null;
  const p = libresPart.pop() || {};
  p.x = x; p.y = y; p.vx = vx; p.vy = vy;
  p.life = life; p.t = 0; p.color = color; p.r = r;
  p.tipo = tipo || 0; p.roce = 0.93; p.grav = 0;
  particles.push(p);
  return p;
}
function soltarPart(i) { libresPart.push(particles[i]); particles.splice(i, 1); }

function boom(x, y, color, n, fuerza) {
  const f = fuerza || 1;
  n = Math.max(1, Math.round(n * Q.part));
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(50, 300) * f;
    part(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.25, 0.65), color, rand(1.5, 4) * f);
  }
}

// Restos: fragmentos que salen despedidos y caen. Lo que separa "ha
// desaparecido" de "se ha roto".
function restos(x, y, color, n, fuerza) {
  if (!Q.estela) return;
  n = Math.round(n * Q.part);
  for (let i = 0; i < n; i++) {
    const a = rand(-TAU / 2, 0), s = rand(80, 320) * (fuerza || 1);
    const p = part(x, y, Math.cos(a) * s, Math.sin(a) * s + rand(-60, 40),
      rand(0.5, 1.2), color, rand(1.2, 3), 1);
    if (p) { p.roce = 0.985; p.grav = 320; }
  }
}

// ── Efectos de sprite ─────────────────────────────────────
//  Un PNG luminoso escalando y apagándose. Es lo que hace que una
//  explosión parezca una explosión y no cuarenta puntos de colores.
let efectos = [];
const libresFx = [];
function vfx(id, x, y, tam, dur, o) {
  const sp = SPRITES["vfx_" + id] || SPRITES["imp_" + id];
  if (!sp) return;
  o = o || {};
  if (efectos.length > 60) return;
  const f = libresFx.pop() || {};
  f.sp = sp; f.x = x; f.y = y; f.tam = tam; f.t = 0; f.life = dur;
  f.rot = o.rot != null ? o.rot : rand(0, TAU);
  f.spin = o.spin || 0;
  f.crece = o.crece != null ? o.crece : 1.35;
  f.desde = o.desde != null ? o.desde : 0.55;
  f.alpha = o.alpha != null ? o.alpha : 1;
  f.aditivo = o.aditivo !== false;
  f.vx = o.vx || 0; f.vy = o.vy || 0;
  efectos.push(f);
}
function actualizarEfectos(dt) {
  for (let i = efectos.length - 1; i >= 0; i--) {
    const f = efectos[i];
    f.t += dt;
    f.rot += f.spin * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.t >= f.life) { libresFx.push(f); efectos.splice(i, 1); }
  }
}
function dibujarEfectos() {
  if (!efectos.length) return;
  for (const f of efectos) {
    const k = f.t / f.life;
    ctx.globalCompositeOperation = f.aditivo ? "lighter" : "source-over";
    // Sube rápido y se apaga despacio: al revés parece un parpadeo.
    ctx.globalAlpha = f.alpha * (k < 0.12 ? k / 0.12 : Math.pow(1 - (k - 0.12) / 0.88, 1.6));
    const s = f.tam * (f.desde + (f.crece - f.desde) * Math.pow(k, 0.45));
    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    const w = f.sp.width || f.sp.naturalWidth, h = f.sp.height || f.sp.naturalHeight;
    const esc = s / Math.max(w, h);
    ctx.drawImage(f.sp, -w * esc / 2, -h * esc / 2, w * esc, h * esc);
    ctx.restore();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
}

// ── Muertes ───────────────────────────────────────────────
//  La misma explosión para todo hace que matar un caza y matar un
//  acorazado se sientan igual, que es exactamente lo que no queremos.
const MUERTES = {
  basica:   { vfx:"exp_basica",   tam:120, dur:0.42, part:16, fuerza:1.0, sac:"tiny",   snd:"exp_peq",    onda:0 },
  rapida:   { vfx:"chispa",       tam:100, dur:0.3,  part:12, fuerza:1.2, sac:"tiny",   snd:"exp_peq",    onda:0 },
  media:    { vfx:"exp_media",    tam:170, dur:0.5,  part:26, fuerza:1.3, sac:"small",  snd:"exp_med",    onda:0 },
  pesada:   { vfx:"exp_pesada",   tam:250, dur:0.62, part:44, fuerza:1.7, sac:"medium", snd:"exp_grande", onda:7, stop:0.045 },
  kamikaze: { vfx:"exp_kamikaze", tam:190, dur:0.5,  part:30, fuerza:1.5, sac:"small",  snd:"exp_med",    onda:4 },
  defensa:  { vfx:"defensa",      tam:200, dur:0.55, part:28, fuerza:1.4, sac:"small",  snd:"exp_med",    onda:5 },
  miniboss: { vfx:"exp_boss",     tam:420, dur:1.1,  part:80, fuerza:2.4, sac:"boss",   snd:"exp_boss",   onda:14, stop:0.12 },
};
function muerte(x, y, color, tipo) {
  const d = MUERTES[tipo] || MUERTES.basica;
  vfx(d.vfx, x, y, d.tam, d.dur, { spin: rand(-1, 1) });
  boom(x, y, color, d.part, d.fuerza);
  restos(x, y, mezcla(color, "#ffffff", 0.4), d.part * 0.35, d.fuerza);
  if (d.onda) onda(x, y, color, d.onda * 22, 0.55);
  sacudir(d.sac);
  sfx(d.snd);
  if (d.stop) hitstop(d.stop);
}

// ── Impactos ──────────────────────────────────────────────
//  Cada golpe tiene que sentirse pegado al disparo que lo causó. Un
//  proyectil que entra en un enemigo sin que pase nada es un proyectil
//  que el jugador cree que ha fallado.
const IMPACTOS = {
  ligero: { vfx:"ligero", tam:44, dur:0.2, part:3, snd:"imp_ligero" },
  medio:  { vfx:"medio",  tam:76, dur:0.26, part:7, snd:"imp_medio", sac:"tiny" },
  pesado: { vfx:"pesado", tam:130, dur:0.36, part:14, snd:"imp_pesado", sac:"small", stop:0.03 },
  escudo: { vfx:"escudo", tam:96, dur:0.3,  part:6, snd:"imp_escudo" },
  rotura: { vfx:"escudo_roto", tam:170, dur:0.5, part:20, snd:"emp", sac:"small" },
};
function impacto(x, y, peso, color) {
  const d = IMPACTOS[peso] || IMPACTOS.ligero;
  vfx(d.vfx, x, y, d.tam, d.dur, { aditivo: true });
  if (d.part) boom(x, y, color || "#ffffff", d.part, 0.6);
  if (d.sac) sacudir(d.sac);
  if (d.stop) hitstop(d.stop);
  sfx(d.snd);
}

// ── Sacudida de cámara ────────────────────────────────────
//  Cinco intensidades y ninguna continua. Una sacudida que no para deja
//  de comunicar nada y solo marea, sobre todo en una tablet a 30 cm.
const SACUDIDAS = { tiny:[3,0.1], small:[6,0.18], medium:[11,0.28], heavy:[17,0.42], boss:[26,0.7] };
let shakeDur = 0.4;
function shake(mag, dur) {
  if (!OPCIONES.sacudida) return;
  mag *= OPCIONES.sacudida;
  if (mag >= shakeMag) { shakeMag = mag; shakeDur = dur; shakeT = dur; }
  else if (dur > shakeT) shakeT = Math.min(dur, shakeDur);
}
function sacudir(nivel) {
  const s = SACUDIDAS[nivel];
  if (s) shake(s[0], s[1]);
}

// ── Congelado de impacto ──────────────────────────────────
//  Milisegundos, y solo en lo que pesa. Es lo que hace que un golpe
//  fuerte se sienta fuerte; usado a diario, hace que el juego vaya a
//  tirones.
let hitStop = 0;
function hitstop(s) { hitStop = Math.max(hitStop, s * OPCIONES.hitstop); }

// Anillo de choque. Solo para lo que pesa: acorazados, bombas y la nave.
// Si sale en cada muerte deja de significar nada.
function onda(x, y, color, rMax, dur) {
  if (ondas.length > 14) return;
  ondas.push({ x, y, color, rMax, t: 0, life: dur || 0.45 });
}
function texto(x, y, txt, color, tam) {
  flotantes.push({ x, y: y - flotantes.length * 20, txt, color, t: 0, life: 0.9, tam: tam || 16 });
}

// ── Enemigos ──────────────────────────────────────────────
// Modo supervivencia: elige al azar según el nivel. La campaña por
// niveles llamará a spawnEnemy() con el tipo y la posición concretos.
function elegirTipo() {
  const r = Math.random();
  if (level >= 2 && r < Math.min(0.13 + level * 0.035, 0.36)) return "veloz";
  if (level >= 4 && r > 0.90) return "kamikaze";
  if (level >= 3 && r > 0.84 && r <= 0.90) return "torreta";
  if (level >= 5 && r > 0.78 && r <= 0.84) return "tanque";
  return "normal";
}

function spawnEnemy(tipo, x) {
  const k = tipo || elegirTipo();
  const d = ENEMIGOS[k];
  const e = {
    tipo: k, r: d.r, hp: d.hp, hpMax: d.hp,
    x: x != null ? clamp(x, d.r, W - d.r) : rand(d.r + 10, W - d.r - 10),
    y: -d.r - 12,
    vy: CONFIG.velocidadEnemigo * (1 + (level - 1) * 0.13) * d.vel,
    fase: rand(0, TAU), giro: rand(0, TAU),
    cd: d.recarga ? d.recarga() : 0, flash: 0,
  };
  if (d.init) d.init(e);
  enemies.push(e);
  return e;
}

function soltarPremio(x, y, tipo) {
  premios.push({ x, y, vy: 95, r: 17, tipo, f: rand(0, TAU), giro: rand(0, TAU), t: 0 });
}

// ── Daño ──────────────────────────────────────────────────
function enemigoMasCerca(x, y, max, excluir) {
  let mejor = null, md = max * max;
  for (const e of enemies) {
    if (e === excluir || e.hp <= 0) continue;
    const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy;
    if (d < md) { md = d; mejor = e; }
  }
  return mejor;
}
function danioArea(x, y, r, dmg, excluir) {
  const r2 = r * r;
  for (const e of enemies) {
    if (e === excluir || e.hp <= 0) continue;
    const dx = e.x - x, dy = e.y - y;
    if (dx * dx + dy * dy < r2) { e.hp -= dmg; e.flash = 0.08; }
  }
  if (miniboss) {
    const dx = miniboss.x - x, dy = miniboss.y - y;
    if (dx * dx + dy * dy < (r + miniboss.r) ** 2) { miniboss.hp -= dmg; miniboss.flash = 0.06; }
  }
}
let rayos = [];
function cadenaElectrica(b, x, y, victima) {
  const o = enemigoMasCerca(x, y, 150, victima);
  if (!o) return;
  o.hp -= b.cadena; o.flash = 0.1;
  rayos.push({ x1: x, y1: y, x2: o.x, y2: o.y, col: b.col, t: 0, life: 0.13 });
  impacto(o.x, o.y, "ligero", b.col);
}
// Devuelve true si la bala se ha consumido.
function golpearCon(b, x, y, victima) {
  impacto(x, y, b.imp, b.col);
  if (b.area) danioArea(x, y, b.area, b.dmg * 0.6, victima);
  if (b.cadena) cadenaElectrica(b, x, y, victima);
  if (b.lento && victima) victima.lentoT = Math.max(victima.lentoT || 0, 1.6);
  if (b.pierce > 0) { b.pierce--; b.cd = 0.07; return false; }
  return true;
}

function matar(e, i) {
  const d = ENEMIGOS[e.tipo];
  combo++; comboT = CONFIG.comboTiempo; enemiesKilled++;
  maxCombo = Math.max(maxCombo, combo);
  const mult = multCombo();
  const pts = Math.round(d.puntos * mult);
  score += pts;
  muerte(e.x, e.y, d.color(T), d.muerte || (d.grande ? "pesada" : "basica"));
  if (mult > 1) texto(e.x, e.y - e.r, "+" + pts, T.bala, 13 + Math.min(8, mult));
  hitoCombo();

  const p = CONFIG.probPremio * (d.premio || 1);
  if (Math.random() < p) soltarPremio(e.x, e.y, elegirPremioAleatorio());
  enemies.splice(i, 1);
}

// ── Combo ─────────────────────────────────────────────────
//  Sube por muertes encadenadas y se cae al recibir daño. Los hitos
//  (x5, x10, x25, x50, x100) sí avisan; los demás números, no: llenar la
//  pantalla de cifras es la manera más rápida de que dejen de leerse.
const HITOS = [5, 10, 25, 50, 100];
const multCombo = () => 1 + Math.floor(combo / 8);
function hitoCombo() {
  for (const h of HITOS) {
    if (combo === h && comboHito < h) {
      comboHito = h;
      texto(W / 2, H * 0.62, "COMBO ×" + h, h >= 50 ? "#ffd700" : T.bala, 22 + h / 10);
      vfx("chispa", W / 2, H * 0.62, 90 + h, 0.4);
      sfx("combo", { tono: 1 + HITOS.indexOf(h) * 0.12 });
      if (h >= 25) sacudir("tiny");
    }
  }
}

function cogerPremio(p) {
  const d = PREMIOS[p.tipo];
  sfx("pickup");
  vfx("chispa", p.x, p.y, 96, 0.34);
  boom(p.x, p.y, d.color, 18, 0.9);
  onda(p.x, p.y, d.color, 78, 0.34);
  // El nombre va FUERA del PNG, y solo al recogerlo. Un icono con letras
  // encima es un cartel; sin ellas, es un objeto.
  texto(p.x, p.y - 26, d.nombre, d.color, 17);

  if (d.familia) { armaId = d.familia; shootAcc = 0; sfx("mejora"); flash = Math.max(flash, 0.22); }
  else if (p.tipo === "arma") {
    if (arma >= ARMA_MAX) { score += 250; texto(p.x, p.y - 46, "+250", "#ffd700", 14); }
    else { arma++; sfx("mejora"); }
  }
  else if (p.tipo === "escudo") { escudo = 1; sfx("escudo_on"); }
  else if (p.tipo === "vida") { lives = Math.min(lives + 1, 6); sfx("mejora"); }
  else if (p.tipo === "rapido") turbo = 8;
  else if (p.tipo === "bomba") bombas = Math.min(bombas + 1, 5);
}

// ── Bomba ─────────────────────────────────────────────────
//  El momento más satisfactorio del juego tiene que estar en las manos
//  del jugador, no caer del cielo. Se guarda y se gasta cuando ella
//  decide. Y no deja la pantalla en blanco: un fogonazo corto, una onda
//  que recorre el campo y el daño llegando con ella.
let bombaT = 0;
function usarBomba() {
  if (bombas <= 0 || state !== "play" || paused || misionCompletaT > 0) {
    if (state === "play") sfx("ui_no");
    return;
  }
  bombas--;
  bombaT = 0.85;
  flash = Math.max(flash, 0.55);
  sacudir("heavy");
  hitstop(0.07);
  sfx("bomba");
  vfx("ultimate", player.x, player.y, Math.max(W, H) * 1.25, 0.8, { crece: 1.5, desde: 0.1, alpha: 0.85 });
  onda(player.x, player.y, "#ffffff", Math.max(W, H) * 1.2, 0.65);
  onda(player.x, player.y, T.nave, Math.max(W, H) * 0.9, 0.5);
  invulnT = Math.max(invulnT, 0.9);

  // Los proyectiles no desaparecen: se convierten en puntos. Ver la
  // pantalla llena de balas volverse puntuación es la recompensa.
  const balas = eBullets.length;
  for (const b of eBullets) { if (Math.random() < 0.35) boom(b.x, b.y, TIRO_SUYO, 2, 0.5); }
  score += balas * 5;
  eBullets.length = 0;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.hp -= 14;
    if (e.hp <= 0) matar(e, i);
    else e.flash = 0.2;
  }
  for (let i = defensas.length - 1; i >= 0; i--) {
    defensas[i].hp -= 10;
    if (defensas[i].hp <= 0) { muerte(defensas[i].x, defensas[i].y, "#4499ff", "defensa"); defensas.splice(i, 1); }
  }
  for (let i = hazards.length - 1; i >= 0; i--) { muerte(hazards[i].x, hazards[i].y, "#ff8800", "basica"); hazards.splice(i, 1); }
  if (miniboss) { miniboss.hp -= Math.ceil(miniboss.hpMax * 0.09); miniboss.flash = 0.3; }
  if (balas) texto(W / 2, H * 0.5, "+" + balas * 5, "#ffffff", 24);
}

function golpe() {
  if (invulnT > 0) return;
  if (escudo > 0) {
    escudo = 0; invulnT = 0.9;
    impacto(player.x, player.y, "rotura", "#5ce1ff");
    boom(player.x, player.y, "#5ce1ff", 30, 1.3);
    onda(player.x, player.y, "#5ce1ff", player.r * 7, 0.4);
    texto(player.x, player.y - 34, "ESCUDO ROTO", "#5ce1ff", 15);
    return;
  }
  lives--; invulnT = CONFIG.invulnerable;
  sinDanio = false;
  arma = Math.max(1, arma - 1);
  combo = 0; comboHito = 0; comboT = 0;
  muerte(player.x, player.y, T.nave, "media");
  onda(player.x, player.y, T.nave, player.r * 9);
  sacudir("heavy"); hitstop(0.05);
  if (lives <= 0) {
    state = "over"; overAt = performance.now();
    muerte(player.x, player.y, nvColor(), "pesada");
    sacudir("boss"); sfx("derrota");
    onda(player.x, player.y, T.motor, player.r * 20, 0.9);
    if (score > best) { best = score; guardarSave({ record: best }); }
    // Limpiar campo para que el overlay quede limpio
    enemies.length = 0; eBullets.length = 0; bullets.length = 0;
    premios.length = 0; spawnQueue.length = 0; miniboss = null;
    hazards.length = 0; defensas.length = 0; zonas.length = 0;
    hazardEnabled = false; zonaEnabled = false;
  }
}

// ── Disparo ───────────────────────────────────────────────
//  Un disparo son SIETE cosas, no una: núcleo, halo, estela, fogonazo en
//  la boca del cañón, impacto, sonido y retroceso. Quitar cualquiera de
//  ellas y el arma deja de sentirse conectada a la mano.
const libresBala = [];
function nuevaBala(x, y, vx, vy, a) {
  const b = libresBala.pop() || {};
  b.x = x; b.y = y; b.vx = vx; b.vy = vy;
  b.r = a.r; b.dmg = a.dmg * (naveActual().dmg || 1);
  b.col = a.col; b.sp = SPRITES[a.sp]; b.largo = a.largo;
  b.pierce = a.pierce || 0; b.area = a.area || 0;
  b.cadena = a.cadena || 0; b.lento = a.lento || 0;
  b.guia = a.guia || 0; b.vida = a.vida || 0;
  b.imp = a.imp; b.estela = a.estela || 0;
  b.t = 0; b.cd = 0; b.ang = Math.atan2(vy, vx) + Math.PI / 2;
  return b;
}
function soltarBala(i) { libresBala.push(bullets[i]); bullets.splice(i, 1); }

let fogonazos = [];
function fogonazo(x, y, col, tam) {
  if (fogonazos.length > 14) return;
  fogonazos.push({ x, y, col, tam, t: 0, life: 0.08 });
}

function disparar() {
  const a = ARMAS[armaId] || ARMAS.cannon;
  const y = player.y - player.r * 1.1;
  const tiros = a.tiros(arma);
  for (const t of tiros) {
    const bx = player.x + (t.dx || 0);
    bullets.push(nuevaBala(bx, y, t.vx || 0, -a.vel, a));
    fogonazo(bx, y - 4, a.col, a.r * 3.4);
  }
  bulletsFiredo += tiros.length;
  player.retro = Math.min(6, a.dmg * 1.6);
  sfx(a.snd);
  if (a.sac) sacudir(a.sac);
}

// Cambiar de familia conserva el nivel: subir el arma seis veces y perderlo
// todo por recoger un premio nuevo se siente como un castigo, no como una
// mejora.
function ponerArma(id) {
  if (!ARMAS[id] || armaId === id) { arma = Math.min(arma + 1, ARMA_MAX); return; }
  armaId = id;
  shootAcc = 0;
}

// ── Actualizar ────────────────────────────────────────────
function update(dt) {
  // Background: siempre anima (menú, pausa, over)
  fondoY += 42 * dt;
  for (const s of bg) {
    s.y += (T.bg === "rejilla" ? 120 : 34 + s.z * 78) * dt;
    if (T.bg === "burbujas") s.x += Math.sin(s.f += dt * 2) * 14 * dt;
    if (s.y > H + 10) { s.y = -10; s.x = rand(0, W); }
  }
  // VFX: se ejecutan incluso en pause=false pero sí en over (explosión de muerte)
  if (!paused) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t >= p.life) { soltarPart(i); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.grav) p.vy += p.grav * dt;
      p.vx *= p.roce; p.vy *= p.roce;
    }
    actualizarEfectos(dt);
    for (let i = flotantes.length - 1; i >= 0; i--) {
      const f = flotantes[i]; f.t += dt; f.y -= 34 * dt;
      if (f.t >= f.life) flotantes.splice(i, 1);
    }
    for (let i = ondas.length - 1; i >= 0; i--) {
      const o = ondas[i]; o.t += dt;
      if (o.t >= o.life) ondas.splice(i, 1);
    }
    if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeMag = 0; }
    if (flash > 0) flash = Math.max(0, flash - dt * 2.4);
    if (avisoT > 0) avisoT -= dt;
    if (warningT > 0) warningT -= dt;
  }
  if (state !== "play" || paused) return;

  elapsed += dt;
  if (invulnT > 0) invulnT -= dt;
  if (turbo > 0) turbo -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

  // Teclado: aplica desplazamiento al destino para fusionarse con el táctil
  const kbSpeed = 340 * dt;
  if (keys["ArrowLeft"]  || keys["KeyA"]) targetX = Math.max(player.r, targetX - kbSpeed);
  if (keys["ArrowRight"] || keys["KeyD"]) targetX = Math.min(W - player.r, targetX + kbSpeed);
  if (keys["ArrowUp"]    || keys["KeyW"]) targetY = Math.max(player.r + 40, targetY - kbSpeed);
  if (keys["ArrowDown"]  || keys["KeyS"]) targetY = Math.min(H - player.r, targetY + kbSpeed);

  const nv = naveActual();
  const k = 1 - Math.exp(-CONFIG.velocidadNave * nv.vel * dt);
  player.px = player.x; const pyAnt = player.y;
  player.x += (clamp(targetX, player.r, W - player.r) - player.x) * k;
  player.y += (clamp(targetY, player.r + 40, H - player.r) - player.y) * k;
  bank += (clamp((player.x - player.px) * 0.045, -0.45, 0.45) - bank) * (1 - Math.exp(-9 * dt));
  if (player.retro > 0) player.retro = Math.max(0, player.retro - dt * 42);

  // ── Propulsión ──
  //  El empuje se mide por lo que la nave se ha movido este fotograma. Al
  //  frenar en seco los motores bajan, al lanzarse suben: es lo que hace
  //  que un PNG deje de parecer una pegatina flotando.
  const desp = Math.hypot(player.x - player.px, player.y - pyAnt) / Math.max(dt, 0.001);
  player.empuje += (clamp(desp / 900, 0, 1) - player.empuje) * (1 - Math.exp(-12 * dt));
  const motorCol = nv.motor || T.motor;
  const nCh = Q.part * (1.6 + player.empuje * 2.4);
  for (let i = 0; i < nCh; i++) {
    if (Math.random() > nCh - i) break;
    const sep = player.r * 0.42;
    const sx = (Math.random() < 0.5 ? -sep : sep) + rand(-2, 2);
    part(player.x + sx - bank * 12, player.y + player.r * 0.9,
      rand(-22, 22) - bank * 60, rand(110, 220) + player.empuje * 170,
      rand(0.14, 0.3), Math.random() < 0.35 ? "#ffffff" : motorCol,
      rand(1.1, 2.6) * (0.7 + player.empuje * 0.6));
  }

  const armaAct = ARMAS[armaId] || ARMAS.cannon;
  const cad = armaAct.cad * nv.cad * (turbo > 0 ? 0.55 : 1);
  shootAcc += dt * 1000;
  let disparos = 0;
  while (shootAcc >= cad && disparos < 4) { shootAcc -= cad; disparar(); disparos++; }
  if (shootAcc > cad * 4) shootAcc = 0;

  for (let i = fogonazos.length - 1; i >= 0; i--) {
    fogonazos[i].t += dt;
    if (fogonazos[i].t >= fogonazos[i].life) fogonazos.splice(i, 1);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.t += dt;
    if (b.cd > 0) b.cd -= dt;
    if (b.guia) {
      // Guiado con giro limitado. Un misil que gira sin límite acierta
      // siempre y deja de ser un misil: es un botón de matar.
      const o = enemigoMasCerca(b.x, b.y, 420);
      if (o) {
        const deseado = Math.atan2(o.y - b.y, o.x - b.x);
        const actual = Math.atan2(b.vy, b.vx);
        let d = ((deseado - actual + Math.PI * 3) % TAU) - Math.PI;
        const giro = clamp(d, -b.guia * dt, b.guia * dt);
        const v = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(actual + giro) * v; b.vy = Math.sin(actual + giro) * v;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.ang = Math.atan2(b.vy, b.vx) + Math.PI / 2;
    if (b.estela && Q.estela && Math.random() < b.estela * Q.estela) {
      const p = part(b.x, b.y, rand(-14, 14), rand(-14, 14) + 60,
        rand(0.1, 0.24) * b.estela, b.col, b.r * rand(0.4, 0.8));
      if (p) p.roce = 0.9;
    }
    if ((b.vida && b.t > b.vida) || b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40) soltarBala(i);
  }
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 24 || b.x < -24 || b.x > W + 24) { eBullets.splice(i, 1); continue; }
    const dx = b.x - player.x, dy = b.y - player.y;
    if (dx * dx + dy * dy < (b.r + hitR()) ** 2) { eBullets.splice(i, 1); golpe(); }
  }

  // Spawn: campaña vs supervivencia
  if (modo === "campana") {
    // Cola de spawn con retraso (formaciones)
    for (let i = spawnQueue.length - 1; i >= 0; i--) {
      const q = spawnQueue[i];
      if (elapsed >= q.at) {
        const e = spawnEnemy(q.tipo, q.x);
        if (q.y !== undefined) e.y = q.y;
        spawnQueue.splice(i, 1);
      }
    }
    // Procesar eventos de la misión
    const mision = MISIONES[misionIdx];
    // Aviso de boss 5 segundos antes
    if (!miniboss && eventoIdx < mision.eventos.length) {
      const siguiente = mision.eventos[eventoIdx];
      if (siguiente.fn === "miniboss" && elapsed >= siguiente.t - 3 && warningT <= 0) {
        warningT = 3;
        texto(W / 2, H * 0.3, "¡JEFE ENTRANTE!", "#ff4444");
        beep(180, 0.5, "sawtooth", 0.07, 360);
      }
    }
    while (eventoIdx < mision.eventos.length) {
      const ev = mision.eventos[eventoIdx];
      if (elapsed < ev.t) break;
      procesarEvento(ev); eventoIdx++;
    }
    // Detección de misión completa
    if (misionCompletaT <= 0 && eventoIdx >= mision.eventos.length &&
        !miniboss && enemies.length === 0 && spawnQueue.length === 0) {
      misionCompletaT = 5;
      beep(880, 0.6, "triangle", 0.08, 1760);
      texto(W / 2, H * 0.4, "¡MISIÓN COMPLETA!", T.bala);
    }
    if (misionCompletaT > 0) {
      misionCompletaT -= dt;
      if (misionCompletaT <= 0) {
        misionIdx = Math.min(misionIdx + 1, MISIONES.length - 1);
        guardarSave({ misionIdx: misionIdx });
        state = "menu"; menuModo = "misiones";
      }
    }
  } else {
    // Supervivencia: dificultad escalada por tiempo
    const nl = 1 + Math.floor(elapsed / CONFIG.subeDificultadCada);
    if (nl > level) { level = nl; beep(700, 0.2, "triangle", 0.05, 1400); texto(W / 2, H * 0.42, "NIVEL " + level, T.bala); }
    spawnAcc += dt;
    const ritmo = 1 / (CONFIG.enemigosPorSegundo * (1 + (level - 1) * 0.2));
    while (spawnAcc >= ritmo) { spawnAcc -= ritmo; spawnEnemy(); }
  }

  // Sistemas de misión
  actualizarHazards(dt);
  actualizarDefensas(dt);
  actualizarZonas(dt);

  // Miniboss
  actualizarMiniboss(dt);

  for (let i = rayos.length - 1; i >= 0; i--) { rayos[i].t += dt; if (rayos[i].t >= rayos[i].life) rayos.splice(i, 1); }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i], d = ENEMIGOS[e.tipo];
    if (e.flash > 0) e.flash -= dt;
    if (e.lentoT > 0) e.lentoT -= dt;
    e.giro += dt * 1.6;
    // Congelado: se mueve y recarga a la mitad. Frenar es hacer daño.
    const edt = e.lentoT > 0 ? dt * 0.5 : dt;
    d.mover(e, edt);
    if (e.y - e.r > H + 20) { enemies.splice(i, 1); continue; }

    if (d.atacar) {
      e.cd -= edt;
      if (e.cd <= 0 && e.y > 30) { e.cd = d.recarga(); d.atacar(e); }
    }

    let muerto = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const bx = b.x - e.x, by = b.y - e.y;
      if (bx * bx + by * by >= (b.r + e.r) ** 2) continue;
      e.hp -= b.dmg; e.flash = 0.09; bulletsHit++;
      const gastada = golpearCon(b, b.x, b.y, e);
      if (gastada) soltarBala(j);
      if (e.hp <= 0) { matar(e, i); muerto = true; break; }
      if (gastada) break;
    }
    if (muerto) continue;

    const px = player.x - e.x, py = player.y - e.y;
    if (px * px + py * py < (hitR() + e.r) ** 2) {
      boom(e.x, e.y, d.color(T), 16);
      if (!d.embiste) { muerte(e.x, e.y, d.color(T), d.muerte || "basica"); enemies.splice(i, 1); }
      golpe();
    }
  }

  for (let i = premios.length - 1; i >= 0; i--) {
    const p = premios[i];
    p.f += dt * 4; p.t += dt; p.giro += dt * 1.1;
    const dx = player.x - p.x, dy = player.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 165) { p.x += (dx / d) * 260 * dt; p.y += (dy / d) * 260 * dt; }
    else p.y += p.vy * dt;
    if (Q.estela && Math.random() < 0.35) {
      part(p.x + rand(-p.r, p.r), p.y + rand(-p.r, p.r), rand(-12, 12), rand(-30, -8),
        rand(0.3, 0.6), PREMIOS[p.tipo].color, rand(0.8, 1.8));
    }
    if (p.y > H + 30) { premios.splice(i, 1); continue; }
    // Recogida generosa: perder una mejora por dos píxeles no enseña nada.
    if (d < player.r * 1.3 + p.r) { cogerPremio(p); premios.splice(i, 1); }
  }
  if (bombaT > 0) bombaT -= dt;
}

// ── Dibujo ────────────────────────────────────────────────
function fondo() {
  // Si hay imagen de fondo para este mundo, manda ella: se ajusta al ancho
  // y se repite hacia arriba, así que basta con que enlace por arriba y por
  // abajo para que el desplazamiento sea infinito y sin costura.
  const img = SPRITES["f_" + T.id];
  let iw = 0, ih = 0;
  if (img) { iw = img.naturalWidth || img.width; ih = img.naturalHeight || img.height; }
  if (iw && ih) {
    // Espejo alternado. Un fondo pintado no enlaza consigo mismo, así que
    // repetirlo tal cual deja una costura horizontal recorriendo la
    // pantalla cada pocos segundos. Volteando una de cada dos copias, el
    // borde de abajo enlaza con su propio reflejo y desaparece.
    const alto = W * ih / iw, per = alto * 2;
    for (let y = -(fondoY % per) - per; y < H; y += per) {
      ctx.drawImage(img, 0, y, W, alto);
      ctx.save();
      ctx.translate(0, y + per); ctx.scale(1, -1);
      ctx.drawImage(img, 0, 0, W, alto);
      ctx.restore();
    }
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, T.fondoA); g.addColorStop(1, T.fondoB);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // Con imagen detrás, el polvo de siempre se queda como capa de parallax
  // por encima: da sensación de velocidad sin taparla.
  const cap = (iw && ih) ? 0.4 : 1;
  ctx.fillStyle = T.bgColor; ctx.strokeStyle = T.bgColor;
  if (T.bg === "rejilla") {
    ctx.lineWidth = 1;
    for (const s of bg) {
      ctx.globalAlpha = (0.10 + s.z * 0.16) * cap;
      ctx.beginPath(); ctx.moveTo(0, s.y); ctx.lineTo(W, s.y); ctx.stroke();
    }
    ctx.globalAlpha = 0.07 * cap;
    for (let i = 0; i <= 10; i++) {
      const x = (i / 10) * W;
      ctx.beginPath(); ctx.moveTo(W / 2 + (x - W / 2) * 0.15, H * 0.1); ctx.lineTo(x, H); ctx.stroke();
    }
  } else if (T.bg === "burbujas") {
    for (const s of bg) {
      ctx.globalAlpha = (0.12 + s.z * 0.26) * cap;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 2.2, 0, TAU); ctx.stroke();
    }
  } else if (T.bg === "brasas") {
    for (const s of bg) {
      ctx.globalAlpha = (0.2 + s.z * 0.45) * cap;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.1, 0, TAU); ctx.fill();
    }
  } else {
    for (const s of bg) {
      ctx.globalAlpha = (0.25 + s.z * 0.55) * cap;
      ctx.fillRect(s.x, s.y, s.r, s.r * 2.6);
    }
  }
  ctx.globalAlpha = 1;

  // Viñeta: apaga los bordes para que la acción del centro respire y la
  // nave sea lo más claro de la pantalla. Es lo que impide que el fondo
  // compita con un dibujo de contorno grueso.
  const v = ctx.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.2,
                                     W / 2, H * 0.46, Math.max(W, H) * 0.76);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(0.6, "rgba(0,0,0,0.14)");
  v.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function naveVector(r) {
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(2, r * 0.15);
  ctx.strokeStyle = TINTA;

  const cuerpo = (col, arriba) => {
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, mezcla(col, "#ffffff", arriba));
    g.addColorStop(1, mezcla(col, TINTA, 0.35));
    ctx.fillStyle = g;
    ctx.fill(); ctx.stroke();
  };

  ctx.beginPath();
  ctx.moveTo(0, -r * 0.35);
  ctx.lineTo(r * 1.5, r * 0.5); ctx.lineTo(r * 1.05, r * 0.72);
  ctx.lineTo(0, r * 0.3);
  ctx.lineTo(-r * 1.05, r * 0.72); ctx.lineTo(-r * 1.5, r * 0.5);
  ctx.closePath(); cuerpo(T.naveAla, 0.3);

  ctx.beginPath();
  ctx.moveTo(0, -r * 1.25);
  ctx.lineTo(r * 0.42, r * 0.15); ctx.lineTo(r * 0.5, r * 0.72);
  ctx.lineTo(0, r * 0.55);
  ctx.lineTo(-r * 0.5, r * 0.72); ctx.lineTo(-r * 0.42, r * 0.15);
  ctx.closePath(); cuerpo(T.nave, 0.45);

  ctx.fillStyle = T.cabina;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.35, r * 0.2, r * 0.42, 0, 0, TAU);
  ctx.fill(); ctx.lineWidth = Math.max(1.5, r * 0.1); ctx.stroke();
}

// Dibuja el sprite encajado en un ancho dado, manteniendo proporción
function pintarSprite(s, ancho) {
  const w = s.width || s.naturalWidth, h = s.height || s.naturalHeight;
  if (!w || !h) return false;
  const esc = ancho / w;
  ctx.drawImage(s, -ancho / 2, -h * esc / 2, ancho, h * esc);
  return true;
}

function dibujarNave(x, y, r, ang) {
  const nv = naveActual();
  const motorCol = nv.motor || T.motor;
  ctx.save();
  ctx.translate(x, y + (player.retro || 0) * 0.5); ctx.rotate(ang);

  // Medidas del sprite, si hay. Las toberas se ajustan a ellas.
  const sp = SPRITES[NAVES[naveSel] && NAVES[naveSel].id];
  let ws = 0, hs = 0;
  if (sp) {
    const iw = sp.width || sp.naturalWidth, ih = sp.height || sp.naturalHeight;
    if (iw && ih) { ws = r * CONFIG.tamanoNave; hs = ws * ih / iw; }
  }

  // ── Propulsión ──
  //  Tres capas: resplandor de tobera, llama y pulso. Las tres reaccionan
  //  al empuje, así que frenar y lanzarse se VEN. Va debajo del casco,
  //  para que la llama salga de dentro de la nave y no encima de ella.
  const emp = 0.35 + (player.empuje || 0) * 0.65;
  const sep    = ws ? ws * 0.155 : 7;
  const yMotor = ws ? hs * 0.34 : r * 0.5;
  const largo  = (ws ? ws * 0.34 : 24) * (0.55 + emp * 0.75) * (1 + Math.random() * 0.28);
  const grosor = (ws ? ws * 0.07 : 4) * (0.8 + emp * 0.4);
  ctx.globalCompositeOperation = "lighter";
  for (const sx of [-sep, sep]) {
    const g = ctx.createRadialGradient(sx, yMotor + largo * 0.25, 0, sx, yMotor + largo * 0.25, largo * 1.1);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.28, motorCol);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = 0.5 + emp * 0.4;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, yMotor + largo * 0.25, largo * 1.1, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.9;
    const gl = ctx.createLinearGradient(0, yMotor, 0, yMotor + largo);
    gl.addColorStop(0, "#ffffff");
    gl.addColorStop(0.35, motorCol);
    gl.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.moveTo(sx - grosor, yMotor); ctx.lineTo(sx + grosor, yMotor);
    ctx.lineTo(sx + grosor * 0.2, yMotor + largo);
    ctx.lineTo(sx - grosor * 0.2, yMotor + largo);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  if (ws) {
    // Sombra oscura, no de color: despega la nave del fondo sin pelearse
    // con la paleta del mundo, sea cual sea la nave que haya cargado.
    if (Q.sombras) { ctx.shadowColor = "rgba(0,0,0,0.65)"; ctx.shadowBlur = 10; }
    ctx.drawImage(sp, -ws / 2, -hs / 2, ws, hs);
    ctx.shadowBlur = 0;
  } else {
    if (Q.sombras) { ctx.shadowColor = "rgba(0,0,0,0.65)"; ctx.shadowBlur = 10; }
    naveVector(r);
    ctx.shadowBlur = 0;
    ctx.fillStyle = T.bala;
    for (let i = 0; i < Math.min(arma, 3); i++) {
      const px = r * (0.95 + i * 0.22);
      ctx.beginPath(); ctx.arc(px, r * 0.55, 2.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-px, r * 0.55, 2.4, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();

  // ── Escudo y núcleo ──
  //  Fuera de la rotación del casco: un escudo que se inclina con la nave
  //  parece parte del dibujo, y tiene que leerse como una capa aparte.
  ctx.save();
  ctx.translate(x, y);
  if (escudo > 0) {
    const pul = 0.5 + Math.sin(performance.now() / 140) * 0.25;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = pul * 0.45;
    const g = ctx.createRadialGradient(0, 0, r * 1.2, 0, 0, r * 2.1);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, "#5ce1ff");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.1, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 0.55 + pul * 0.3;
    ctx.strokeStyle = "#9beeff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r * 2, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // El núcleo: la zona de impacto de VERDAD. En un bullet hell el jugador
  // necesita saber exactamente qué píxeles le matan, y el dibujo de la
  // nave es más grande que eso a propósito.
  if (OPCIONES.nucleo) {
    const hr = hitR();
    const denso = eBullets.length > 24;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = denso ? 0.95 : 0.6;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, hr * 1.9);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.5, T.bala);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, hr * 1.9, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0, 0, hr * 0.45, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function dibujarEnemigo(e) {
  const d = ENEMIGOS[e.tipo];
  ctx.save();
  ctx.translate(e.x, e.y);

  const sp = SPRITES["e_" + e.tipo];
  if (sp) {
    // Sombra propia: despega el dibujo del fondo sin teñirlo
    ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 9;
    pintarSprite(sp, e.r * 2.4);
    ctx.shadowBlur = 0;
    if (e.flash > 0) {   // fogonazo blanco recortado por el propio dibujo
      ctx.globalCompositeOperation = "source-atop";
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.fillRect(-e.r * 2, -e.r * 2, e.r * 4, e.r * 4);
      ctx.globalCompositeOperation = "source-over";
    }
  } else {
    const col = d.color(T);
    ctx.beginPath();
    (FORMAS[d.forma] || FORMAS.circulo)(e);

    // Volumen: luz arriba, sombra abajo. Lo que separa un cuerpo de
    // una mancha de color, y lo que hace que peguen con las naves.
    // Un contorno negro sobre fondo casi negro no separa nada: en las
    // imágenes de las naves funciona porque están dibujadas sobre blanco.
    // Así que primero un filo claro que despegue del fondo, y el negro
    // por dentro. Se traza antes de rellenar para que el relleno tape la
    // mitad interior de ambos.
    const lw = Math.max(2, e.r * 0.17);
    ctx.lineJoin = "round";
    ctx.strokeStyle = mezcla(col, "#ffffff", 0.6);
    ctx.lineWidth = lw + 6;
    ctx.stroke();
    ctx.strokeStyle = TINTA;
    ctx.lineWidth = lw + 2;
    ctx.stroke();

    const g = ctx.createLinearGradient(0, -e.r, 0, e.r);
    g.addColorStop(0, mezcla(col, "#ffffff", 0.42));
    g.addColorStop(0.5, col);
    g.addColorStop(1, mezcla(col, TINTA, 0.5));
    ctx.fillStyle = e.flash > 0 ? "#ffffff" : g;
    ctx.fill();

    if (DETALLES[d.forma]) DETALLES[d.forma](e);
    if (d.dibujarExtra) d.dibujarExtra(e);

    // Brillo especular, como el de las chapas de las naves
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.beginPath();
    ctx.ellipse(-e.r * 0.22, -e.r * 0.34, e.r * 0.34, e.r * 0.17, -0.5, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  if (e.hpMax > 3 && e.hp < e.hpMax) {
    const w = e.r * 2;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w, 4);
    ctx.fillStyle = T.bala;
    ctx.fillRect(e.x - w / 2, e.y - e.r - 10, w * (e.hp / e.hpMax), 4);
  }
}

// ── Premios ───────────────────────────────────────────────
//  Un objeto energético flotando, no una chapa con una letra: halo que
//  respira, cabeceo, un anillo que gira alrededor y el icono con su
//  propio brillo. Lo que hace tiene nombre — pero el nombre aparece al
//  cogerlo, no impreso encima.
function dibujarPremio(p) {
  const d = PREMIOS[p.tipo];
  const pulso = 0.5 + 0.5 * Math.sin(p.f);
  const bob = Math.sin(p.t * 2.4) * 3.5;
  const s = 1 + pulso * 0.07;
  ctx.save();
  ctx.translate(p.x, p.y + bob);

  // Halo. Aditivo para que se lea sobre cualquier fondo de misión.
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(0, 0, p.r * 0.2, 0, 0, p.r * (2.4 + pulso * 0.5));
  g.addColorStop(0, mezcla(d.color, "#ffffff", 0.35));
  g.addColorStop(0.45, d.color);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.globalAlpha = 0.42 + pulso * 0.2;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, p.r * (2.4 + pulso * 0.5), 0, TAU); ctx.fill();

  // Anillo orbital: da eje y velocidad sin gastar partículas.
  ctx.globalAlpha = 0.55 + pulso * 0.25;
  ctx.strokeStyle = mezcla(d.color, "#ffffff", 0.5);
  ctx.lineWidth = 1.6;
  ctx.save();
  ctx.rotate(p.giro); ctx.scale(1, 0.38);
  ctx.beginPath(); ctx.arc(0, 0, p.r * 1.75, 0, TAU); ctx.stroke();
  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  const sp = SPRITES[d.sp];
  ctx.scale(s, s);
  if (sp) {
    if (Q.sombras) { ctx.shadowColor = d.color; ctx.shadowBlur = 14; }
    pintarSprite(sp, p.r * 2.5);
    ctx.shadowBlur = 0;
  } else {
    // Sin PNG, representación procedural. Nunca una letra: un cristal
    // facetado con el color del premio, que sigue leyéndose como objeto.
    ctx.rotate(p.giro * 0.4);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU, r = i % 2 ? p.r * 0.62 : p.r * 1.05;
      ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    const gg = ctx.createLinearGradient(0, -p.r, 0, p.r);
    gg.addColorStop(0, mezcla(d.color, "#ffffff", 0.7));
    gg.addColorStop(1, mezcla(d.color, TINTA, 0.35));
    ctx.fillStyle = gg; ctx.fill();
    ctx.strokeStyle = mezcla(d.color, "#ffffff", 0.85); ctx.lineWidth = 1.6; ctx.stroke();
  }
  ctx.restore();
}

function corazon(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 16, s / 16);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 5);
  ctx.bezierCurveTo(-9, -3, -5, -10, 0, -5);
  ctx.bezierCurveTo(5, -10, 9, -3, 0, 5);
  ctx.fill(); ctx.restore();
}

const F = "-apple-system, system-ui, Segoe UI, Roboto, sans-serif";

// ════════════════════════════════════════════════════════════
//  HUD
// ════════════════════════════════════════════════════════════
//  Reglas: nada de cajas de página web, nada de tipografía de 9 px, y
//  todo lo tocable con área de 44 px como mínimo. Los datos viven en dos
//  franjas —arriba lo que se consulta, abajo lo que se usa— y el centro
//  de la pantalla se deja libre, que es donde está el juego.
let hudRects = {};

function panel(x, y, w, h, r, alpha) {
  ctx.fillStyle = "rgba(6,9,22," + (alpha != null ? alpha : 0.55) + ")";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
  ctx.fill();
}
function filo(x, y, w, h, r, col, alpha) {
  ctx.strokeStyle = col; ctx.globalAlpha = alpha != null ? alpha : 0.35;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, r) : ctx.rect(x, y, w, h);
  ctx.stroke(); ctx.globalAlpha = 1;
}
// Texto con espaciado. En una interfaz sci-fi el interletraje hace más
// por el tono que cualquier adorno, y el canvas no tiene letter-spacing
// en los navegadores viejos, así que se hace a mano.
function letras(txt, x, y, esp, alinear) {
  const w = ctx.measureText(txt).width + esp * (txt.length - 1);
  let cx = alinear === "center" ? x - w / 2 : alinear === "right" ? x - w : x;
  const ta = ctx.textAlign; ctx.textAlign = "left";
  for (const ch of txt) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + esp; }
  ctx.textAlign = ta;
  return w;
}

function hud() {
  const acc = T.nave;
  const top = SAFE_TOP + 10;
  const bot = H - SAFE_BOTTOM - 10;
  hudRects = {};

  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.85)"; ctx.shadowBlur = 4;

  // ── Franja superior ──
  const g = ctx.createLinearGradient(0, 0, 0, top + 96);
  g.addColorStop(0, "rgba(3,5,14,0.72)"); g.addColorStop(1, "rgba(3,5,14,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, top + 96);

  // Marcador. Es el número que el jugador mira, así que es el más grande
  // de la pantalla después del juego.
  ctx.textAlign = "center"; ctx.fillStyle = "#fff";
  ctx.font = "800 " + Math.round(clamp(W * 0.075, 26, 38)) + "px " + F;
  ctx.fillText(score.toLocaleString("es"), W / 2, top + 22);
  ctx.font = "700 10px " + F; ctx.fillStyle = acc; ctx.globalAlpha = 0.7;
  letras(best > 0 ? "RÉCORD " + best.toLocaleString("es") : "PUNTOS", W / 2, top + 44, 1.6, "center");
  ctx.globalAlpha = 1;

  // Etiqueta de misión
  ctx.textAlign = "left";
  ctx.font = "800 11px " + F;
  ctx.fillStyle = acc; ctx.globalAlpha = 0.9;
  const et = modo === "campana" ? "M" + (misionIdx + 1) : "NIVEL " + level;
  letras(et, 14, top + 14, 1.4);
  ctx.globalAlpha = 0.45; ctx.fillStyle = "#fff"; ctx.font = "700 10px " + F;
  letras(modo === "campana" ? MISIONES[misionIdx].nombre : "SUPERVIVENCIA", 14, top + 30, 1.2);
  ctx.globalAlpha = 1;

  // Pausa: 44 px de área tocable aunque el icono sea pequeño.
  const pb = { x: W - 14 - 40, y: top - 4, w: 40, h: 40 };
  hudRects.pausa = pb;
  panel(pb.x, pb.y, pb.w, pb.h, 12, 0.5);
  filo(pb.x, pb.y, pb.w, pb.h, 12, acc, 0.3);
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillRect(pb.x + 14, pb.y + 12, 4, 16);
  ctx.fillRect(pb.x + 22, pb.y + 12, 4, 16);

  // ── Combo ──
  //  Solo aparece cuando hay algo que decir, y el arco enseña cuánto
  //  queda antes de perderlo. Un número suelto no avisa de nada.
  if (combo >= 3) {
    const cy = top + 84, cx = W / 2;
    const k = clamp(comboT / CONFIG.comboTiempo, 0, 1);
    ctx.globalAlpha = Math.min(1, comboT * 2.5);
    ctx.strokeStyle = "rgba(255,255,255,0.14)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 20, 0, TAU); ctx.stroke();
    ctx.strokeStyle = combo >= 25 ? "#ffd700" : acc; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 20, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "800 15px " + F;
    ctx.fillText("×" + combo, cx, cy + 1);
    ctx.globalAlpha = 1;
  }

  // ── Franja inferior ──
  const bh = 46, by = bot - bh;
  const gb = ctx.createLinearGradient(0, by - 26, 0, H);
  gb.addColorStop(0, "rgba(3,5,14,0)"); gb.addColorStop(1, "rgba(3,5,14,0.8)");
  ctx.fillStyle = gb; ctx.fillRect(0, by - 26, W, H - by + 26);

  // Integridad: barras, no corazones. Se lee de un vistazo cuánto queda
  // y no compite con los premios rosas que hay por la pantalla.
  const seg = Math.min(6, Math.max(3, CONFIG.vidas + 3));
  const segW = Math.min(20, (W * 0.34) / seg), segH = 7;
  for (let i = 0; i < seg; i++) {
    const x = 14 + i * (segW + 4);
    const vivo = i < lives;
    ctx.fillStyle = vivo ? (lives <= 1 ? "#ff3b5c" : "#ff5d8f") : "rgba(255,255,255,0.12)";
    if (vivo && lives <= 1) ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 140);
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, by + 6, segW, segH, 3) : ctx.rect(x, by + 6, segW, segH);
    ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.textAlign = "left"; ctx.font = "700 9px " + F;
  ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.4;
  letras("INTEGRIDAD", 14, by + 26, 1.4);
  ctx.globalAlpha = 1;
  if (escudo > 0) {
    const sx = 14 + seg * (segW + 4) + 8;
    ctx.fillStyle = "#5ce1ff"; ctx.globalAlpha = 0.75 + 0.25 * Math.sin(performance.now() / 200);
    ctx.beginPath(); ctx.arc(sx + 6, by + 9, 6, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Arma: nombre y nivel. El nombre importa — es lo que hace que recoger
  // un premio de familia se sienta como un cambio y no como un +1.
  const aData = ARMAS[armaId] || ARMAS.cannon;
  ctx.textAlign = "center";
  ctx.font = "800 11px " + F; ctx.fillStyle = aData.col;
  letras(aData.nombre, W / 2, by + 10, 1.6, "center");
  const pipW = 12, pipTot = ARMA_MAX * pipW - 3;
  for (let i = 0; i < ARMA_MAX; i++) {
    ctx.fillStyle = i < arma ? aData.col : "rgba(255,255,255,0.14)";
    ctx.fillRect(W / 2 - pipTot / 2 + i * pipW, by + 22, pipW - 3, 4);
  }
  if (turbo > 0) {
    ctx.fillStyle = "#8affd1"; ctx.font = "800 9px " + F;
    ctx.globalAlpha = 0.85;
    letras("TURBO " + turbo.toFixed(1), W / 2, by + 36, 1.2, "center");
    ctx.globalAlpha = 1;
  }

  // Bomba: botón de verdad, en la esquina del pulgar.
  const bb = { x: W - 14 - 52, y: by - 6, w: 52, h: 52 };
  hudRects.bomba = bb;
  const hay = bombas > 0;
  panel(bb.x, bb.y, bb.w, bb.h, 16, hay ? 0.6 : 0.3);
  filo(bb.x, bb.y, bb.w, bb.h, 16, hay ? "#ff5c8a" : "#666", hay ? 0.65 : 0.2);
  const spB = SPRITES["pu_bomba"];
  ctx.save();
  ctx.translate(bb.x + bb.w / 2, bb.y + bb.h / 2 - 3);
  ctx.globalAlpha = hay ? 1 : 0.25;
  if (spB) pintarSprite(spB, 30);
  else { ctx.fillStyle = "#ff5c8a"; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.fill(); }
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.textAlign = "center"; ctx.font = "800 10px " + F;
  ctx.fillStyle = hay ? "#ffffff" : "rgba(255,255,255,0.3)";
  ctx.fillText("×" + bombas, bb.x + bb.w / 2, bb.y + bb.h - 9);

  ctx.shadowBlur = 0;
}

function miniNave(x, y, tam, tema) {
  ctx.save(); ctx.translate(x, y); ctx.scale(tam / 46, tam / 46);
  ctx.fillStyle = tema.naveAla;
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.lineTo(24, 8); ctx.lineTo(17, 12);
  ctx.lineTo(0, 5); ctx.lineTo(-17, 12); ctx.lineTo(-24, 8);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = tema.nave;
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(7, 2); ctx.lineTo(8, 12);
  ctx.lineTo(0, 9); ctx.lineTo(-8, 12); ctx.lineTo(-7, 2);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function dibujarNaves(yBase) {
  naveRects = []; masRect = null;
  const total = NAVES.length + 1;
  const porFila = total <= 6 ? total : Math.ceil(total / 2);
  const filas = Math.ceil(total / porFila);
  const hueco = 8;
  const slot = Math.min(70, (W - 32 - hueco * (porFila - 1)) / porFila);
  const anchoFila = porFila * slot + hueco * (porFila - 1);

  ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff"; ctx.font = "700 11px " + F;
  ctx.fillText("TU NAVE", W / 2, yBase - 12); ctx.globalAlpha = 1;

  for (let i = 0; i < total; i++) {
    const fila = Math.floor(i / porFila), col = i % porFila;
    const enFila = Math.min(porFila, total - fila * porFila);
    const ancho = enFila * slot + hueco * (enFila - 1);
    const x = (W - (enFila === porFila ? anchoFila : ancho)) / 2 + col * (slot + hueco);
    const y = yBase + fila * (slot + hueco);
    const esMas = i === NAVES.length;
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, slot, slot, 12) : ctx.rect(x, y, slot, slot);
    ctx.fill();
    if (esMas) {
      masRect = { x, y, w: slot, h: slot };
      ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.font = "300 30px " + F;
      ctx.fillText("+", x + slot / 2, y + slot / 2 - 5);
      ctx.font = "700 9px " + F; ctx.globalAlpha = 0.6;
      ctx.fillText("CARGAR", x + slot / 2, y + slot - 13); ctx.globalAlpha = 1;
      continue;
    }
    const n = NAVES[i];
    naveRects.push({ x, y, w: slot, h: slot, i, borrar: !n.fija, indice: n.indice });
    const sel = i === naveSel;
    ctx.strokeStyle = sel ? T.nave : "rgba(255,255,255,0.12)"; ctx.lineWidth = sel ? 2.5 : 1;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, slot, slot, 12) : ctx.rect(x, y, slot, slot);
    ctx.stroke();
    const sp = SPRITES[n.id];
    if (sp) {
      ctx.save(); ctx.translate(x + slot / 2, y + slot / 2 - 4); pintarSprite(sp, slot * 0.66); ctx.restore();
    } else if (n.src) {
      ctx.globalAlpha = 0.28; ctx.fillStyle = "#fff"; ctx.font = "700 9px " + F;
      ctx.fillText("falta", x + slot / 2, y + slot / 2 - 4);
      ctx.fillText("el PNG", x + slot / 2, y + slot / 2 + 6); ctx.globalAlpha = 1;
    } else { miniNave(x + slot / 2, y + slot / 2 - 4, slot * 0.6, T); }
    ctx.fillStyle = sel ? T.nave : "rgba(255,255,255,0.55)"; ctx.font = "800 9px " + F;
    ctx.fillText(n.nombre, x + slot / 2, y + slot - 11, slot - 8);
    if (!n.fija) {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.beginPath(); ctx.arc(x + slot - 11, y + 11, 8.5, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.font = "700 11px " + F;
      ctx.fillText("×", x + slot - 11, y + 11);
    }
  }
  return yBase + filas * (slot + hueco);
}

function menu() {
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
  ctx.font = "800 " + Math.min(40, W * 0.098) + "px " + F;
  ctx.fillText("STRIKE FLIGHT", W / 2, 54);
  ctx.globalAlpha = 0.5; ctx.font = "600 12px " + F;
  ctx.fillText(best > 0 ? "RÉCORD  " + best : "elige modo para jugar", W / 2, 80);
  ctx.globalAlpha = 1;

  const yNaves = dibujarNaves(114);

  // ── Selector de modo ──
  modoRects = [];
  const yModo = yNaves + 18;
  const bw = Math.min((W - 48) / 2, 160), bh = 36;
  const bx1 = W / 2 - bw - 6, bx2 = W / 2 + 6;
  ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff"; ctx.font = "700 11px " + F;
  ctx.fillText("MODO DE JUEGO", W / 2, yModo - 10); ctx.globalAlpha = 1;

  const modos = [{ id:"campana", label:"CAMPAÑA" }, { id:"supervivencia", label:"SUPERVIVENCIA" }];
  const bxs = [bx1, bx2];
  for (let i = 0; i < 2; i++) {
    const sel = modo === modos[i].id;
    const bx = bxs[i], by = yModo;
    modoRects.push({ x: bx, y: by, w: bw, h: bh, id: modos[i].id });
    ctx.fillStyle = sel ? T.nave : "rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, 8) : ctx.rect(bx, by, bw, bh);
    ctx.fill();
    ctx.strokeStyle = sel ? T.nave : "rgba(255,255,255,0.18)"; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = sel ? "#05060f" : "#fff"; ctx.font = "800 12px " + F;
    ctx.fillText(modos[i].label, bx + bw / 2, by + bh / 2);
  }

  const yContenido = yModo + bh + 22;
  const wCard = Math.min(W - 32, 400);

  if (modo === "campana") {
    // ── Lista de misiones ──
    misionRects = []; menuRects = [];
    ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff"; ctx.font = "700 11px " + F;
    ctx.fillText("SELECCIONA MISIÓN", W / 2, yContenido - 10); ctx.globalAlpha = 1;

    const disp = H - yContenido - 16;
    const altoCard = clamp((disp - 4 * 8) / 5, 38, 54);
    let yc = yContenido;

    for (let i = 0; i < MISIONES.length; i++) {
      const m = MISIONES[i];
      const temaM = TEMAS.find(t => t.id === m.temaId) || TEMAS[0];
      const cx = (W - wCard) / 2;
      misionRects.push({ x: cx, y: yc, w: wCard, h: altoCard, idx: i });

      const bloqueada = i > misionIdx;
      const actual = i === misionIdx;
      ctx.fillStyle = bloqueada ? "rgba(255,255,255,0.03)" : "rgba(255,255,255,0.07)";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cx, yc, wCard, altoCard, 10) : ctx.rect(cx, yc, wCard, altoCard);
      ctx.fill();
      ctx.strokeStyle = actual ? temaM.nave : bloqueada ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.14)";
      ctx.lineWidth = actual ? 2 : 1; ctx.stroke();

      ctx.textAlign = "left"; ctx.fillStyle = bloqueada ? "rgba(255,255,255,0.25)" : "#fff";
      ctx.font = "800 12px " + F;
      ctx.fillText("M" + (i + 1) + "  " + m.nombre, cx + 16, yc + altoCard * 0.38);
      ctx.font = "600 10px " + F; ctx.globalAlpha = bloqueada ? 0.15 : 0.5;
      ctx.fillText(bloqueada ? "bloqueada" : m.desc, cx + 16, yc + altoCard * 0.72, wCard - 60);
      ctx.globalAlpha = 1; ctx.textAlign = "center";

      if (actual) {
        ctx.fillStyle = temaM.nave; ctx.font = "700 11px " + F;
        ctx.fillText("▶", cx + wCard - 22, yc + altoCard / 2);
      }
      yc += altoCard + 8;
    }

  } else {
    // ── Mundos (supervivencia) ──
    menuRects = []; misionRects = [];
    ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff"; ctx.font = "700 11px " + F;
    ctx.fillText("ELIGE MUNDO", W / 2, yContenido - 10); ctx.globalAlpha = 1;

    const disp = H - yContenido - 16;
    const alto = clamp((disp - 3 * 10) / 4, 44, 68);
    const bloque = 4 * alto + 3 * 10;
    let y = yContenido + Math.max(0, (disp - bloque) * 0.35);

    for (const t of TEMAS) {
      const x = (W - wCard) / 2;
      menuRects.push({ x, y, w: wCard, h: alto, tema: t });
      const g = ctx.createLinearGradient(x, y, x + wCard, y + alto);
      g.addColorStop(0, t.fondoA); g.addColorStop(1, t.fondoB);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, wCard, alto, 12) : ctx.rect(x, y, wCard, alto);
      ctx.fill();
      ctx.strokeStyle = t.id === T.id ? t.nave : "rgba(255,255,255,0.13)";
      ctx.lineWidth = t.id === T.id ? 2.5 : 1; ctx.stroke();
      ctx.fillStyle = t.nave; ctx.font = "800 22px " + F; ctx.textAlign = "left";
      ctx.fillText(t.icono, x + 20, y + alto / 2);
      ctx.fillStyle = "#fff"; ctx.font = "700 14px " + F;
      ctx.fillText(t.nombre, x + 50, y + alto / 2); ctx.textAlign = "center";
      const sp = SPRITES[NAVES[naveSel] && NAVES[naveSel].id];
      ctx.save(); ctx.translate(x + wCard - 38, y + alto / 2);
      if (sp) pintarSprite(sp, 40); else miniNave(0, 0, 40, t);
      ctx.restore();
      y += alto + 10;
    }
  }

  if (avisoT > 0) {
    ctx.globalAlpha = clamp(avisoT, 0, 1) * 0.75; ctx.fillStyle = "#000";
    ctx.fillRect(0, H / 2 - 26, W, 52);
    ctx.globalAlpha = clamp(avisoT, 0, 1); ctx.fillStyle = "#fff"; ctx.font = "800 16px " + F;
    ctx.fillText(aviso, W / 2, H / 2); ctx.globalAlpha = 1;
  }
}

// ── Marco ─────────────────────────────────────────────────
//  Lo que queda a los lados del campo en una pantalla ancha. No es un
//  vacío negro: es el chasis de la cabina, y el degradado hacia dentro
//  hace que el campo parezca iluminado desde el propio juego.
function marco() {
  if (!PX) return;
  aVentana();
  ctx.fillStyle = "#04050c";
  ctx.fillRect(0, 0, PX + 1, VH);
  ctx.fillRect(PX + W - 1, 0, VW - PX - W + 1, VH);
  const col = (T && T.nave) || "#5ce1ff";
  for (const [x0, dir] of [[PX, -1], [PX + W, 1]]) {
    const g = ctx.createLinearGradient(x0, 0, x0 + dir * Math.min(PX, 220), 0);
    g.addColorStop(0, mezcla(col, "#04050c", 0.82));
    g.addColorStop(1, "rgba(4,5,12,0)");
    ctx.fillStyle = g;
    ctx.fillRect(dir < 0 ? x0 - Math.min(PX, 220) : x0, 0, Math.min(PX, 220), VH);
    ctx.fillStyle = mezcla(col, "#04050c", 0.35);
    ctx.globalAlpha = 0.55;
    ctx.fillRect(x0 - (dir < 0 ? 2 : 0), 0, 2, VH);
    ctx.globalAlpha = 1;
  }
  aCampo();
}

function render() {
  marco();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (shakeT > 0) {
    const k = shakeT / Math.max(shakeDur, 0.001);
    const m = shakeMag * k * k;
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  fondo();

  // Los anillos van DEBAJO de los restos, para que la explosión los tape
  for (const o of ondas) {
    const k = o.t / o.life;
    ctx.globalAlpha = (1 - k) * 0.85;
    ctx.strokeStyle = o.color;
    ctx.lineWidth = Math.max(1, 8 * (1 - k));
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.rMax * (1 - Math.pow(1 - k, 2.2)), 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.globalCompositeOperation = "lighter";
  for (const p of particles) {
    const k = 1 - p.t / p.life;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    if (p.tipo === 1) {
      // Los restos se estiran en su dirección: una chispa que vuela no es
      // un punto, y estirada se lee la velocidad sin gastar más partículas.
      const l = Math.min(14, Math.hypot(p.vx, p.vy) * 0.035);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillRect(-l, -p.r * 0.5, l * 2, p.r);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + k * 0.6), 0, TAU); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  if (state !== "menu") {
    // Las balas se distinguen por FORMA antes que por color, porque el color
    // depende del mundo y de la nave, y la forma no. Tuyas: alargadas, con
    // núcleo blanco. Suyas: redondas, con anillo. Aunque cambie la paleta
    // entera, esto se sigue leyendo.
    const caja = (x, y, w, h, r) => {
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
    };
    ctx.lineJoin = "round";
    // TUS disparos: cada familia con su PNG luminoso, pintado en aditivo
    // y orientado a su vector. El fondo del PNG desapareció al prepararlo
    // (optimizar.mjs, modo glow), así que se puede sumar sin recuadro.
    ctx.globalCompositeOperation = "lighter";
    for (const b of bullets) {
      if (!b.sp) continue;
      // Halo debajo del PNG. Un proyectil fino sobre una nebulosa no se ve
      // sin él, y subir el tamaño del dibujo para compensar lo convertiría
      // en un tablón. La luz es lo que lo hace legible, no el grosor.
      if (Q.glowSprite) {
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3.4);
        g.addColorStop(0, b.col);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 3.4, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.ang);
      const w = b.sp.width, h = b.sp.height;
      const alto = b.largo, ancho = Math.max(alto * w / h, b.r * 2.2);
      ctx.drawImage(b.sp, -ancho / 2, -alto / 2, ancho, alto);
      ctx.restore();
    }
    // Fogonazo de boca: 80 ms, pero es lo que ata el disparo a la nave.
    for (const f of fogonazos) {
      const k = 1 - f.t / f.life;
      ctx.globalAlpha = k;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.tam * (0.6 + k * 0.6));
      g.addColorStop(0, "#ffffff");
      g.addColorStop(0.4, f.col);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.tam * (0.6 + k * 0.6), 0, TAU); ctx.fill();
    }
    // Arcos de la cadena eléctrica
    for (const r of rayos) {
      ctx.globalAlpha = 1 - r.t / r.life;
      ctx.strokeStyle = r.col; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(r.x1, r.y1);
      const n = 4;
      for (let i = 1; i < n; i++) {
        const t = i / n;
        ctx.lineTo(r.x1 + (r.x2 - r.x1) * t + rand(-9, 9), r.y1 + (r.y2 - r.y1) * t + rand(-9, 9));
      }
      ctx.lineTo(r.x2, r.y2); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    // Repuesto vectorial: si un PNG no ha cargado, el disparo sigue
    // siendo alargado y cian. La regla de lectura no depende del arte.
    for (const b of bullets) {
      if (b.sp) continue;
      caja(b.x - b.r - 1.5, b.y - b.largo / 2 - 1.5, (b.r + 1.5) * 2, b.largo + 3, b.r + 1.5);
      ctx.fillStyle = TINTA; ctx.fill();
      caja(b.x - b.r, b.y - b.largo / 2, b.r * 2, b.largo, b.r);
      ctx.fillStyle = b.col || TIRO_TUYO; ctx.fill();
      caja(b.x - b.r * 0.4, b.y - b.largo * 0.32, b.r * 0.8, b.largo * 0.64, b.r * 0.4);
      ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.fill();
    }

    // SUS disparos: redondos y rosas, SIEMPRE. Es la única cosa del juego
    // que no cambia nunca de aspecto, porque es la que te mata.
    for (const b of eBullets) {
      if (b.halo !== false) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.5;
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3.2);
        g.addColorStop(0, TIRO_SUYO); g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 3.2, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
      }
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1.8, 0, TAU);
      ctx.fillStyle = TINTA; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fillStyle = TIRO_SUYO; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.16, b.y - b.r * 0.16, b.r * 0.44, 0, TAU);
      ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.fill();
    }

    dibujarZonas();
    dibujarDefensas();
    dibujarHazards();
    for (const e of enemies) dibujarEnemigo(e);
    dibujarMiniboss();
    for (const p of premios) dibujarPremio(p);

    if (state === "play" && !(invulnT > 0 && Math.floor(invulnT * 15) % 2 === 0)) {
      dibujarNave(player.x, player.y, player.r, bank);
    }
    dibujarEfectos();
  }

  ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 4;
  for (const f of flotantes) {
    ctx.globalAlpha = 1 - f.t / f.life;
    ctx.fillStyle = f.color;
    ctx.font = "800 " + (f.tam || 16) + "px " + F;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = "rgba(255,255,255," + (flash * 0.75) + ")"; ctx.fillRect(0, 0, W, H); }

  if (state === "menu") menu();
  else hud();

  // Pantalla de resultados (game over)
  if (state === "over") {
    ctx.fillStyle = "rgba(5,6,15,0.88)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const cx = W / 2, cy = H / 2;
    const isRecord = score >= best && score > 0;

    ctx.font = "800 " + Math.min(28, W * 0.07) + "px " + F;
    ctx.fillStyle = "#ff4444"; ctx.globalAlpha = 0.9;
    ctx.fillText("GAME OVER", cx, cy - 160);

    ctx.font = "800 " + Math.min(64, W * 0.16) + "px " + F;
    ctx.fillStyle = isRecord ? "#ffd700" : "#ffffff";
    ctx.globalAlpha = 1;
    ctx.fillText(String(score), cx, cy - 90);

    if (isRecord) {
      ctx.font = "700 13px " + F; ctx.fillStyle = "#ffd700"; ctx.globalAlpha = 0.9;
      ctx.fillText("★ NUEVO RÉCORD ★", cx, cy - 44);
    } else {
      ctx.font = "700 13px " + F; ctx.fillStyle = "#aaa"; ctx.globalAlpha = 0.7;
      ctx.fillText("RÉCORD  " + best, cx, cy - 44);
    }

    // Stats grid
    const stats = [
      ["ENEMIGOS DERRIBADOS", enemiesKilled],
      ["COMBO MÁX.", maxCombo],
      ["PRECISIÓN", bulletsFiredo > 0 ? Math.round(bulletsHit / bulletsFiredo * 100) + "%" : "—"],
      ["TIEMPO", Math.floor(elapsed / 60) + ":" + String(Math.floor(elapsed % 60)).padStart(2, "0")],
    ];
    ctx.font = "600 12px " + F; ctx.globalAlpha = 0.85;
    stats.forEach(([label, val], i) => {
      const row = cy - 10 + i * 28;
      ctx.fillStyle = "#888"; ctx.textAlign = "left";
      ctx.fillText(label, cx - 120, row);
      ctx.fillStyle = "#fff"; ctx.textAlign = "right";
      ctx.fillText(String(val), cx + 120, row);
    });
    ctx.textAlign = "center";

    if (modo === "campana") {
      ctx.font = "700 11px " + F; ctx.fillStyle = "#aaa"; ctx.globalAlpha = 0.6;
      ctx.fillText("MISIÓN " + (misionIdx + 1) + " — " + MISIONES[misionIdx].nombre, cx, cy + 110);
    }
    ctx.globalAlpha = 0.9; ctx.font = "700 14px " + F; ctx.fillStyle = "#fff";
    ctx.fillText("Toca para volver", cx, cy + 140);
    ctx.globalAlpha = 1;
  }

  // Overlay de misión completa (campaña)
  if (state === "play" && misionCompletaT > 0) {
    const a = Math.min(1, misionCompletaT, 5 - misionCompletaT) * 0.8;
    ctx.fillStyle = "rgba(5,6,15," + a + ")"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = T.bala; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 " + Math.min(36, W * 0.088) + "px " + F;
    ctx.fillText("¡MISIÓN COMPLETA!", W / 2, H / 2 - 24);
    ctx.font = "700 14px " + F; ctx.globalAlpha = 0.75;
    ctx.fillStyle = "#fff";
    const sig = misionIdx + 1 < MISIONES.length ? "Siguiente: " + MISIONES[misionIdx + 1].nombre : "¡Campaña superada!";
    ctx.fillText(sig, W / 2, H / 2 + 18);
    // Stats rápidas al completar misión
    const mins = Math.floor(elapsed / 60), secs = Math.floor(elapsed % 60);
    ctx.fillText(enemiesKilled + " derribados · " + mins + ":" + String(secs).padStart(2,"0"), W/2, H/2+44);
    ctx.globalAlpha = 1;
  }

  // Banner WARNING de boss
  if (state === "play" && warningT > 0) {
    const pulse = Math.sin(performance.now() / 80) * 0.5 + 0.5;
    const fade = Math.min(1, warningT * 2);
    ctx.globalAlpha = fade;
    ctx.fillStyle = "rgba(220,20,20," + (0.75 + pulse * 0.25) + ")";
    ctx.fillRect(0, H * 0.17, W, 42);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 17px " + F;
    ctx.fillText("!! JEFE ENTRANTE !!", W / 2, H * 0.17 + 21);
    ctx.globalAlpha = 1;
  }

  // Overlay de pausa
  if (state === "play" && paused) {
    ctx.fillStyle = "rgba(5,6,15,0.75)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 " + Math.min(40, W * 0.1) + "px " + F;
    ctx.fillText("PAUSA", W / 2, H / 2 - 20);
    ctx.font = "700 13px " + F; ctx.globalAlpha = 0.6;
    ctx.fillText("Esc o toca para continuar", W / 2, H / 2 + 24);
    ctx.globalAlpha = 1;
  }

  // Debug overlay
  if (showDebug && state === "play") {
    const dy = 134;
    ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0, dy, 172, 90);
    ctx.fillStyle = "#0f0"; ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "11px monospace";
    const lines = [
      "FPS " + fps.toFixed(1) + "  t:" + elapsed.toFixed(1) + "s ev:" + eventoIdx,
      "ENE:" + enemies.length + " EBUL:" + eBullets.length + " BULS:" + bullets.length,
      "PART:" + particles.length + " premios:" + premios.length,
      "score:" + score + " combo:" + combo + " boss:" + (miniboss ? "Y" : "N"),
      "spawns:" + spawnQueue.length + (paused ? " [PAUSE]" : ""),
    ];
    lines.forEach((l, i) => ctx.fillText(l, 4, dy + 4 + i * 16));
  }
}

let last = performance.now();
let calAcc = 0, calBajos = 0;
function loop(now) {
  const real = Math.min((now - last) / 1000, 0.05);
  last = now;

  // FPS suavizado
  fpsFrames++; fpsAcc += real;
  if (fpsAcc >= 0.5) { fps = fpsFrames / fpsAcc; fpsFrames = 0; fpsAcc = 0; }

  // Calidad automática. Se mide durante 3 s antes de decidir: bajar de
  // nivel por un pico de un fotograma haría que el juego cambie de aspecto
  // cada vez que explota algo.
  if (OPCIONES.calidad === "auto" && state === "play" && !paused) {
    calAcc += real;
    if (fps < 46) calBajos += real; else calBajos = Math.max(0, calBajos - real * 0.5);
    if (calAcc > 3) {
      if (calBajos > 1.5 && calidadAuto !== "baja") {
        calidadAuto = calidadAuto === "alta" ? "media" : "baja";
      }
      calAcc = 0; calBajos = 0;
      Q = CALIDADES[calidadAuto];
    }
  } else if (OPCIONES.calidad !== "auto") {
    Q = CALIDADES[OPCIONES.calidad] || CALIDADES.alta;
  }

  let dt = real;
  if (hitStop > 0) { hitStop -= real; dt = real * 0.06; }

  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
