  ctx.font = "700 10px " + F; ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.6;
  const e = hayGuardado ? SAVE.estado() : { misionMax: 0 };
  const lineas = [
    "Se perderán las " + (e.misionMax + 1) + " misiones desbloqueadas,",
    "el récord de " + best.toLocaleString("es") + " puntos y todos los",
    "récords por misión. No se puede deshacer.",
    "",
    "Los ajustes de sonido NO se tocan.",
  ];
  lineas.forEach((l, i) => ctx.fillText(l, W / 2, y0 + 78 + i * 15));
  ctx.globalAlpha = 1;

  const bw = anchoP - 48, bx = (W - bw) / 2;
  boton(bx, y0 + 162, bw, 42, { label: "SÍ, BORRAR", tam: 12, color: "#ff3b5c", solido: true,
    fn: () => {
      SAVE.borrar(true);           // true = conservar los ajustes de audio
      misionMax = 0; misionIdx = 0; best = 0;
      campaignCompleted = false; campaignStats = null;
      campaignCompletedExp = false; campaignStatsExp = null;
      naveSel = 1; guardarNave();
      confirmando = null; pantalla = "inicio";
      sfx("ui_atras");
      aviso = "Progreso borrado"; avisoT = 2.4;
    } });
  boton(bx, y0 + 210, bw, 40, { label: "CANCELAR", tam: 12,
    fn: () => { confirmando = null; sfx("ui_atras"); } });
}

const horaCorta = (ms) => {
  try {
    const d = new Date(ms);
    const hoy = new Date();
    const mismoDia = d.toDateString() === hoy.toDateString();
    const hh = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    return mismoDia ? hh : (d.getDate() + "/" + (d.getMonth() + 1) + " " + hh);
  } catch (_) { return "—"; }
};

// El nombre del jefe con el que termina una misión. Se saca del propio
// guión —el último evento de jefe— y no de una tabla aparte: una tabla
// aparte se desincroniza el día que alguien cambie un jefe de misión, y
// no avisa. Es lo mismo que ya hace el selector de jefes de ADMIN.
function jefeDeMision(idx) {
  const m = MISIONES[idx];
  if (!m) return "—";
  let id = null;
  for (const ev of m.eventos) if (ev.fn === "miniboss" && ev.tipo) id = ev.tipo;
  const j = id && JEFES[id];
  return (j && j.nombre) ? j.nombre : (id || "—");
}

// ── Campaña completada ────────────────────────────────────
//  La pantalla que cierra el juego, literalmente: aparece una vez, la
//  primera vez que se destruye a OMEGA SOVEREIGN, y desde entonces vive
//  en el save. Estadísticas de la carrera que la ganó, no de la sesión
//  actual — es un trofeo, no un marcador que se pisa solo.
function pantallaCampanaCompleta() {
  const st = campaignStats || {};
  titulo();
  const cy = SAFE_TOP + 128;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 " + Math.round(clamp(W * 0.08, 22, 30)) + "px " + F;
  ctx.fillStyle = "#ffd700";
  letras("CAMPAÑA COMPLETADA", W / 2, cy, 2.4, "center");
  ctx.font = "700 10px " + F; ctx.fillStyle = T.nave; ctx.globalAlpha = 0.8;
  letras(MISIONES_BASE + " MISIONES · " +
    jefeDeMision(MISIONES_BASE - 1).toUpperCase() + " DERROTADO",
    W / 2, cy + 26, 1.4, "center");
  ctx.globalAlpha = 1;

  const anchoP = Math.min(W - 56, 340), x0 = (W - anchoP) / 2;
  let y = cy + 58;
  const filas = [
    ["PUNTUACIÓN FINAL", (st.score || 0).toLocaleString("es")],
    ["MEJOR PUNTUACIÓN", (st.best || best || 0).toLocaleString("es")],
    ["ENEMIGOS DESTRUIDOS", st.enemiesKilled || 0],
    ["COMBO MÁXIMO", "×" + (st.maxCombo || 0)],
    ["PRECISIÓN", (st.precision || 0) + "%"],
    ["TIEMPO — MISIÓN FINAL", st.tiempo != null ? (Math.floor(st.tiempo / 60) + ":" + String(Math.floor(st.tiempo % 60)).padStart(2, "0")) : "—"],
    ["NAVE", st.nave || "—"],
  ];
  // El alto sale de las filas que hay. Estaba escrito 190 a fuego, que
  // son exactamente estas siete: añadir una fila —y la expansión añade
  // una— dejaba la última fuera del panel, pintada sobre el fondo.
  const altoP = filas.length * 23 + 29;
  panel(x0, y, anchoP, altoP, 16, 0.55);
  filo(x0, y, anchoP, altoP, 16, "#ffd700", 0.25);
  let fy = y + 22;
  for (const [et, v] of filas) {
    ctx.textAlign = "left"; ctx.font = "700 10px " + F;
    ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.5;
    letras(et, x0 + 18, fy, 1.2);
    ctx.globalAlpha = 1; ctx.textAlign = "right"; ctx.font = "800 12px " + F; ctx.fillStyle = "#ffd700";
    ctx.fillText(String(v), x0 + anchoP - 18, fy);
    fy += 23;
  }

  const bw = Math.min(W - 56, 300), bx = (W - bw) / 2;
  let by = y + altoP + 20;
  boton(bx, by, bw, 52, { label: "JUGAR DE NUEVO", tam: 15, solido: true, color: "#ffd700",
    fn: () => UI.ir(() => { misionIdx = 0; iniciarMision(0); }) });
  by += 62;
  boton(bx, by, bw, 44, { label: "SELECCIÓN DE MISIÓN", tam: 12, fn: () => UI.ir(() => { pantalla = "campana"; }) });
  by += 54;
  boton(bx, by, bw, 44, { label: "SUPERVIVENCIA", tam: 12, fn: () => UI.ir(() => { pantalla = "mundos"; modo = "supervivencia"; }) });
}

// Cuántos jefes PRINCIPALES (no minijefes) tiene derrotados la
// expansión — sale de las propias MISIONES, no de un contador aparte:
// llegar a esta pantalla ya implica haberlos matado a los cinco, así
// que contarlos de la tabla es exacto y no se puede desincronizar.
// `fases.length >= 3` es lo mismo que ya distingue jefe de minijefe en
// todo el bloque 5F/5G (2 fases = minijefe, 3-4 = jefe).
function jefesExpansionDerrotados() {
  let n = 0;
  for (let i = MISIONES_BASE; i < MISIONES.length; i++) {
    for (const ev of MISIONES[i].eventos) {
      if (ev.fn !== "miniboss" || !ev.tipo) continue;
      const j = JEFES[ev.tipo];
      if (j && j.fases.length >= 3) n++;
    }
  }
  return n;
}

  panel(x0, y, anchoP, altoP, 16, 0.55);

  let fy = y + 22;
  for (const [et, v] of filas) {

function menu() {
  botones = [];
  menuT += 1 / 60;
  if (pantalla === "inicio") pantallaInicio();
  else if (pantalla === "naves") pantallaNaves();
  else if (pantalla === "campana") pantallaCampana();
  else if (pantalla === "mundos") pantallaMundos();
  else if (pantalla === "ajustes") pantallaAjustes();
  else if (pantalla === "admin") ADMIN.dibujar(PUENTE_HANGAR);
  else if (pantalla === "campana-completa") {
    if (pantallaCompletaEsExp) pantallaExpansionCompletada(); else pantallaCampanaCompleta();
  }

  // El modal va DESPUÉS de la pantalla y se lleva todos los toques.
  if (confirmando) pantallaConfirmar();

  // El distintivo de ADMIN va encima de todo menos del modal: si Eloi
  // está en el sandbox tiene que verlo sin buscarlo, en cualquier
  // pantalla y sin excepciones.
  if (typeof ADMIN !== "undefined") ADMIN.indicador(PUENTE_HANGAR);

  if (avisoT > 0) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.globalAlpha = clamp(avisoT, 0, 1);
    panel(W / 2 - 150, H / 2 - 26, 300, 52, 14, 0.88);
    filo(W / 2 - 150, H / 2 - 26, 300, 52, 14, T.nave, 0.5);
    ctx.fillStyle = "#fff"; ctx.font = "800 13px " + F;
    ctx.fillText(aviso, W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
}

// ── Marco ─────────────────────────────────────────────────
//  Lo que queda a los lados del campo en una pantalla ancha. No es un
//  vacío negro: es el chasis de la cabina, y el degradado hacia dentro
//  hace que el campo parezca iluminado desde el propio juego.
function marco() {
  if (!PX) return;
  aVentana();
  ctx.fillStyle = "#04050c";
  ctx.fillRect(0, 0, PX + 1, VH);
  ctx.fillRect(PX + W - 1, 0, VW - PX - W + 1, VH);
  const col = (T && T.nave) || "#5ce1ff";
  for (const [x0, dir] of [[PX, -1], [PX + W, 1]]) {
    const g = ctx.createLinearGradient(x0, 0, x0 + dir * Math.min(PX, 220), 0);
    g.addColorStop(0, mezcla(col, "#04050c", 0.82));
    g.addColorStop(1, "rgba(4,5,12,0)");
    ctx.fillStyle = g;
    ctx.fillRect(dir < 0 ? x0 - Math.min(PX, 220) : x0, 0, Math.min(PX, 220), VH);
    ctx.fillStyle = mezcla(col, "#04050c", 0.35);
    ctx.globalAlpha = 0.55;
    ctx.fillRect(x0 - (dir < 0 ? 2 : 0), 0, 2, VH);
    ctx.globalAlpha = 1;
  }
  aCampo();
}

function render() {
  marco();
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  // Sacudida: SOLO cámara. Un translate del contexto y nada más — no se
  // toca ni una coordenada del mundo.
  {
    const d = VFX.desplazamiento();
    if (d.x || d.y) ctx.translate(d.x, d.y);
  }
  fondo();

  // ── CAPA FONDO ──
  //  Ondas de choque, humo, estelas y motor. Detrás de todo lo que
  //  importa, para que nada de esto pueda esconder nada.
  VFX.dibujar(ctx, VFX.FONDO);

  if (state !== "menu") {
    // La grieta va debajo de todo lo demás: es un agujero en el sitio,
    // no una cosa que esté en el sitio.
    dibujarRupturas();
    dibujarZonas();
    dibujarPozos();
    dibujarCarriles();
    dibujarColumnas();
    dibujarSistemas();
    // Con oscuridad, los telegráficos se pintan DESPUÉS del velo. Un
    // aviso apagado es daño inevitable, y esa es la línea que el juego
    // no cruza. Sin oscuridad no cambia nada: van donde iban.
    const velo = hayOscuridad();
    if (!velo) dibujarTelegrafos();
    for (const x of estallidos) {
      const k = x.t / x.life;
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = (1 - k) * 0.5;
      const g = ctx.createRadialGradient(x.x, x.y, 0, x.x, x.y, x.r * (0.6 + k * 0.9));
      g.addColorStop(0, "#fff3c4"); g.addColorStop(0.5, "#ff8a1f");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x.x, x.y, x.r * (0.6 + k * 0.9), 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }
    dibujarDefensas();
    dibujarHazards();
    dibujarRocas();
    for (const e of enemies) dibujarEnemigo(e);
    dibujarMiniboss();

    // Las explosiones se pintan AQUÍ: encima de los enemigos —una
    // explosión detrás del que acaba de morir no se ve— pero debajo de
    // los premios, de la nave y de las balas.
    //
    // Estaban al final de todo, así que una explosión pesada al lado de
    // la nave la escondía durante medio segundo. En un bullet hell eso
    // no es un detalle estético: es no saber dónde estás.
    dibujarEfectos();

    // ── VELO DE OSCURIDAD ──
    //  Aquí y en ningún otro sitio. Por encima: premios, nave, chispas y
    //  TODAS las balas. Por debajo: el escenario y los enemigos. No hay
    //  forma de que esto esconda un proyectil, porque el proyectil se
    //  pinta después.
    if (velo) { dibujarOscuridad(); dibujarTelegrafos(); }

    for (const p of premios) dibujarPremio(p);
    dibujarShards();
    dibujarJugador();

    // ── CAPA MEDIO ──
    //  Chispas, restos y fogonazos. Encima de los enemigos —una chispa
    //  detrás del que acaba de explotar no se ve— pero DEBAJO de las
    //  balas, que es lo que viene justo aquí abajo.
    VFX.dibujar(ctx, VFX.MEDIO);

    // ════════════════════════════════════════════════════
    //  BALAS — LO ÚLTIMO DEL MUNDO EN PINTARSE
    // ════════════════════════════════════════════════════
    //  Estaban las PRIMERAS, o sea debajo de los enemigos, de los
    //  asteroides, de la nave y de todas las explosiones. Con la
    //  pantalla llena, la bala que te mataba podía estar tapada por el
    //  efecto de la que acababas de esquivar.
    //
    //  Ahora van encima de todo. Es la regla del bloque: si un efecto
    //  tapa un proyectil, el efecto está mal. No se cambia ni una
    //  hitbox ni una velocidad — solo el orden en que se pinta.
    // Las balas se distinguen por FORMA antes que por color, porque el color
    // depende del mundo y de la nave, y la forma no. Tuyas: alargadas, con
    // núcleo blanco. Suyas: redondas, con anillo. Aunque cambie la paleta
    // entera, esto se sigue leyendo.
    const caja = (x, y, w, h, r) => {
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
    };
    ctx.lineJoin = "round";
    // TUS disparos: cada familia con su PNG luminoso, pintado en aditivo
    // y orientado a su vector. El fondo del PNG desapareció al prepararlo
    // (optimizar.mjs, modo glow), así que se puede sumar sin recuadro.
    ctx.globalCompositeOperation = "lighter";
    for (const b of bullets) {
      if (!b.sp) continue;
      // Halo debajo del PNG. Un proyectil fino sobre una nebulosa no se ve
      // sin él, y subir el tamaño del dibujo para compensar lo convertiría
      // en un tablón. La luz es lo que lo hace legible, no el grosor.
      if (Q.glowSprite) {
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3.4);
        g.addColorStop(0, b.col);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 3.4, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.ang);
      const w = b.sp.width, h = b.sp.height;
      const alto = b.largo, ancho = Math.max(alto * w / h, b.r * 2.2);
      ctx.drawImage(b.sp, -ancho / 2, -alto / 2, ancho, alto);
      ctx.restore();
    }
    // El fogonazo de boca lo pinta ahora VFX, en la capa MEDIO, justo
    // antes de este bloque: va con el resto de partículas y con su tope
    // propio, no suelto aquí.
    // Arcos de la cadena eléctrica
    for (const r of rayos) {
      ctx.globalAlpha = 1 - r.t / r.life;
      ctx.strokeStyle = r.col; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(r.x1, r.y1);
      const n = 4;
      for (let i = 1; i < n; i++) {
        const t = i / n;
        ctx.lineTo(r.x1 + (r.x2 - r.x1) * t + rand(-9, 9), r.y1 + (r.y2 - r.y1) * t + rand(-9, 9));
      }
      ctx.lineTo(r.x2, r.y2); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    // Repuesto vectorial: si un PNG no ha cargado, el disparo sigue
    // siendo alargado y cian. La regla de lectura no depende del arte.
    for (const b of bullets) {
      if (b.sp) continue;
      caja(b.x - b.r - 1.5, b.y - b.largo / 2 - 1.5, (b.r + 1.5) * 2, b.largo + 3, b.r + 1.5);
      ctx.fillStyle = TINTA; ctx.fill();
      caja(b.x - b.r, b.y - b.largo / 2, b.r * 2, b.largo, b.r);
      ctx.fillStyle = b.col || TIRO_TUYO; ctx.fill();
      caja(b.x - b.r * 0.4, b.y - b.largo * 0.32, b.r * 0.8, b.largo * 0.64, b.r * 0.4);
      ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.fill();
    }

    // SUS disparos: redondos y rosas, SIEMPRE. Es la única cosa del juego
    // que no cambia nunca de aspecto, porque es la que te mata.
    for (const b of eBullets) {
      // La lanza del francotirador es la única bala enemiga que rompe la
      // regla del círculo rosa, y lo hace a propósito: es el disparo que
      // hay que reconocer al instante y por el que se muere.
      if (b.lanza) {
        const sp = SPRITES["pe_lanza"];
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
        if (sp) {
          const alto = 92, ancho = alto * sp.width / sp.height;
          ctx.drawImage(sp, -ancho / 2, -alto / 2, ancho, alto);
        } else {
          ctx.fillStyle = TIRO_SUYO;
          ctx.fillRect(-b.r * 0.5, -34, b.r, 68);
        }
        ctx.restore();
        ctx.globalCompositeOperation = "source-over";
        continue;
      }
      if (b.halo !== false) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.5;
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 3.2);
        g.addColorStop(0, TIRO_SUYO); g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 3.2, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
      }
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1.8, 0, TAU);
      ctx.fillStyle = TINTA; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fillStyle = TIRO_SUYO; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.16, b.y - b.r * 0.16, b.r * 0.44, 0, TAU);
      ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.fill();
    }

    // ── CAPA FRENTE ──
    //  Lo único que se pinta por encima de las balas, y con el alfa
    //  atado a la mitad para que aun así no las esconda. Hoy no la usa
    //  nadie: está para que cuando algo la necesite tenga un sitio con
    //  el límite ya puesto, en vez de colarse suelto al final.
    VFX.dibujar(ctx, VFX.FRENTE);
  }

  ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 4;
  for (const f of flotantes) {
    ctx.globalAlpha = 1 - f.t / f.life;
    ctx.fillStyle = f.color;
    ctx.font = "800 " + (f.tam || 16) + "px " + F;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = "rgba(255,255,255," + (flash * 0.75) + ")"; ctx.fillRect(0, 0, W, H); }

  if (state === "menu") menu();
  else { hud(); barraJefe(); barraBonus(); barraOverdrive(); dibujarUpgrades(); }

  // ── Fin de partida ──
  if (state === "over") {
    botones = [];
    // La cortina ENTRA, no aparece. Antes se pintaba opaca en el mismo
    // fotograma en que morías, así que la muerte de la nave —la más
    // aparatosa del juego después de la de un jefe— quedaba debajo y no
    // se veía NUNCA. Nueve décimas de fundido: lo justo para ver
    // reventar la nave y que la pantalla llegue después.
    const apar = clamp((performance.now() - overAt) / 900, 0, 1);
    ctx.fillStyle = "rgba(3,5,14," + (0.9 * apar) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    // El contenido no entra hasta que la cortina ya tapa: mezclarlo con
    // la explosión sería el mismo error al revés.
    if (apar >= 0.4) {
    const cx = W / 2, cy = H * 0.34;
    const record = score >= best && score > 0;

    ctx.font = "800 11px " + F; ctx.fillStyle = "#ff3b5c";
    letras("NAVE PERDIDA", cx, cy - 54, 5, "center");
    ctx.font = "800 " + Math.round(clamp(W * 0.14, 44, 72)) + "px " + F;
    ctx.fillStyle = record ? "#ffd700" : "#ffffff";
    ctx.fillText(UI.cifra("overScore", score).toLocaleString("es"), cx, cy);
    ctx.font = "700 10px " + F;
    if (record) {
      // Late, para distinguirse de la línea de "RÉCORD nnn" que sale
      // cuando NO lo has batido: las dos son oro y están en el mismo
      // sitio, así que lo que las separa es el movimiento y la palabra.
      const pul = 0.7 + 0.3 * Math.sin(performance.now() / 140);
      ctx.globalAlpha = pul;
      ctx.fillStyle = UI.COL.oro;
      letras("¡NUEVO RÉCORD!", cx, cy + 34, 4, "center");
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.5;
      letras("RÉCORD  " + best.toLocaleString("es"), cx, cy + 34, 3, "center");
      ctx.globalAlpha = 1;
    }

    const anchoP = Math.min(W - 56, 320), x0 = (W - anchoP) / 2;
    const stats = [
      ["DERRIBADOS", enemiesKilled],
      ["COMBO MÁXIMO", "×" + maxCombo],
      ["PRECISIÓN", bulletsFiredo > 0 ? Math.round(bulletsHit / bulletsFiredo * 100) + "%" : "—"],
      ["TIEMPO", Math.floor(elapsed / 60) + ":" + String(Math.floor(elapsed % 60)).padStart(2, "0")],
    ];
    let y = cy + 76;
    for (const [et, v] of stats) {
      ctx.textAlign = "left"; ctx.font = "700 10px " + F;
      ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.45;
      letras(et, x0, y, 1.6);
      ctx.globalAlpha = 1; ctx.textAlign = "right"; ctx.font = "800 12px " + F;
      ctx.fillText(String(v), x0 + anchoP, y);
      y += 26;
    }
    ctx.textAlign = "center";
    if (modo === "campana") {
      ctx.font = "700 9px " + F; ctx.fillStyle = T.nave; ctx.globalAlpha = 0.6;
      letras("MISIÓN " + (misionIdx + 1) + " · " + MISIONES[misionIdx].nombre, cx, y + 14, 2, "center");
      ctx.globalAlpha = 1;
    }

    // Reintentar sin pasar por el menú: si te matan en el segundo 200 de
    // una misión de cinco minutos, volver a la lista es un castigo.
    if (performance.now() - overAt > 600) {
      const bw = Math.min(W - 56, 300), bx = (W - bw) / 2;
      let by = H - SAFE_BOTTOM - 150;
      boton(bx, by, bw, 54, { label: "REINTENTAR", tam: 16, solido: true,
        fn: () => UI.ir(() => { if (modo === "campana") iniciarMision(misionIdx); else { reset(); musica("combate"); } }) });
      boton(bx, by + 66, bw, 46, { label: "MENÚ", tam: 13,
        fn: () => UI.ir(() => { state = "menu"; pantalla = modo === "campana" ? "campana" : "mundos"; musica("menu"); }) });
    }
    }
  }

  // ── Resultados de misión ──
  if (state === "play" && misionCompletaT > 0 && resultado) {
    const t = 6.5 - misionCompletaT;
    const a = Math.min(1, t * 2, misionCompletaT * 1.5) * 0.9;
    ctx.fillStyle = "rgba(3,5,14," + a + ")"; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = Math.min(1, t * 2, misionCompletaT * 1.5);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    const cy = H * 0.28;
    // Emblema y nombre de la nave con la que se ha ganado. Es lo que
    // convierte "he pasado la misión" en "la he pasado con LA MÍA", y es
    // el único sitio de la partida donde el emblema tiene tamaño para
    // leerse sin estorbar.
    const conEmb = emblemaNave(W / 2, cy - 92, 46);
    ctx.font = "700 9px " + F; ctx.fillStyle = "#fff"; ctx.globalAlpha *= 0.6;
    letras(nombreNave(), W / 2, cy - (conEmb ? 62 : 66), 2.4, "center");
    ctx.globalAlpha /= 0.6;
    ctx.font = "800 10px " + F; ctx.fillStyle = T.nave;
    letras("MISIÓN " + (misionIdx + 1), W / 2, cy - 40, 4, "center");
    ctx.fillStyle = "#fff";
    ctx.font = "800 " + Math.round(clamp(W * 0.085, 26, 40)) + "px " + F;
    letras("COMPLETADA", W / 2, cy, 3, "center");

    // ── RANK ──
    //  Sello aparte, en su propia esquina: no compite con la lista de
    //  extras ni con el total, y así se lee de un vistazo aunque el
    //  jugador ni siga la cuenta de abajo. Entra "golpeando" -grande y
    //  se asienta- en vez de aparecer hecho.
    if (resultado.rank && t > 0.4) {
      const ap = Math.min(1, (t - 0.4) * 4);
      const golpe = t < 0.75 ? 1.5 - ap * 0.5 : 1;
      const rx = W - 54, ry = SAFE_TOP + 96;
      ctx.save();
      ctx.translate(rx, ry);
      ctx.scale(golpe, golpe);
      ctx.globalAlpha = ap;
      ctx.strokeStyle = RANK_COLOR[resultado.rank.letra]; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.stroke();
      ctx.font = "800 " + (resultado.rank.letra.length > 1 ? 26 : 32) + "px " + F;
      ctx.fillStyle = RANK_COLOR[resultado.rank.letra];
      ctx.fillText(resultado.rank.letra, 0, 2);
      ctx.restore();
      if (t > 0.9) {
        ctx.globalAlpha = Math.min(1, (t - 0.9) * 3) * 0.55;
        ctx.font = "700 8px " + F; ctx.fillStyle = "#fff";
        letras("RANK", rx, ry + 46, 2, "center");
        ctx.globalAlpha = 1;
      }
    }

    // Los extras entran de uno en uno, con su sonido.
    const anchoP = Math.min(W - 56, 340), x0 = (W - anchoP) / 2;
    let y = cy + 52, sumado = resultado.base;
    for (let i = 0; i < resultado.extras.length; i++) {
      const [et, pts] = resultado.extras[i];
      const ap = clamp((t - 0.5 - i * 0.42) * 4, 0, 1);
      if (ap <= 0) break;
      sumado += pts * (ap >= 1 ? 1 : 0);
      ctx.globalAlpha = ap;
      ctx.textAlign = "left"; ctx.font = "700 11px " + F;
      ctx.fillStyle = "#fff";
      ctx.globalAlpha = ap * 0.7;
      letras(et, x0, y, 1.4);
      ctx.globalAlpha = ap;
      ctx.textAlign = "right"; ctx.font = "800 12px " + F;
      ctx.fillStyle = "#ffd700";
      ctx.fillText("+" + pts.toLocaleString("es"), x0 + anchoP, y);
      y += 26;
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fillRect(x0, y + 4, anchoP, 1);
    // La cifra final SUBE hasta su valor en medio segundo. Un número que
    // aparece hecho no se lee como recompensa; uno que sube, sí. Y no
    // más de medio segundo: un contador eterno deja de ser emoción.
    ctx.font = "800 " + Math.round(clamp(W * 0.09, 30, 44)) + "px " + F;
    ctx.fillStyle = "#fff";
    ctx.fillText(UI.cifra("misTotal", Math.round(sumado)).toLocaleString("es"), W / 2, y + 38);
    ctx.font = "700 9px " + F; ctx.fillStyle = T.nave; ctx.globalAlpha = 0.75;
    letras("PUNTUACIÓN TOTAL", W / 2, y + 62, 3, "center");
    ctx.globalAlpha = 1;

    // ── NUEVO RÉCORD ──
    //  Señal distinta de todo lo demás: oro, con latido, y con la
    //  palabra escrita. No depende solo del color.
    if (resultado.recordMision && t > 1.9) {
      const ap = Math.min(1, (t - 1.9) * 3);
      const pul = 0.65 + 0.35 * Math.sin(t * 9);
      ctx.globalAlpha = ap * pul;
      ctx.font = "800 13px " + F; ctx.fillStyle = UI.COL.oro;
      letras("¡NUEVO RÉCORD!", W / 2, y + 88, 3, "center");
      ctx.globalAlpha = ap * 0.5;
      ctx.font = "700 9px " + F; ctx.fillStyle = "#fff";
      ctx.fillText("MEJOR DE ESTA MISIÓN", W / 2, y + 104);
      ctx.globalAlpha = 1;
    }

    // ── ELOI ganados ──
    if (resultado.eloi && t > 2.2) {
      const ap = Math.min(1, (t - 2.2) * 3);
      ctx.globalAlpha = ap;
      ctx.font = "800 12px " + F; ctx.fillStyle = UI.COL.oro;
      letras("+" + UI.cifra("misEloi", resultado.eloi) + " ELOI", W / 2,
        y + (resultado.recordMision ? 126 : 92), 2.6, "center");
      ctx.globalAlpha = 1;
    }

    // ── Resumen compacto ──
    //  Una sola línea, pequeña, solo lo que pasó de verdad -"no
    //  convertir en Excel" es literal en el encargo-. COMBO y
    //  DIFICULTAD siempre; el resto solo si hubo alguno.
    if (t > 2.4) {
      const partes = ["COMBO ×" + resultado.maxCombo];
      if (resultado.skillEventos) partes.push(resultado.skillEventos + " SKILL");
      if (resultado.elites) partes.push(resultado.elites + " ÉLITE" + (resultado.elites > 1 ? "S" : ""));
      if (resultado.overdrives) partes.push(resultado.overdrives + "× OVERDRIVE");
      partes.push(resultado.dificultad);
      if (resultado.recordDif || resultado.rankRecordDif) partes.push("★ NUEVO MEJOR");
      ctx.globalAlpha = Math.min(1, (t - 2.4) * 3) * 0.6;
      ctx.font = "700 9px " + F; ctx.fillStyle = "#fff";
      letras(partes.join("   ·   "), W / 2, y + (resultado.recordMision ? 150 : 116), 1, "center");
      ctx.globalAlpha = 1;
    }

    if (t > 2.6) {
      ctx.globalAlpha = Math.min(1, (t - 2.6) * 2) * (0.6 + 0.4 * Math.sin(t * 3));
      ctx.font = "700 12px " + F; ctx.fillStyle = "#fff";
      const sig = misionIdx + 1 < MISIONES.length
        ? "SIGUIENTE:  " + MISIONES[misionIdx + 1].nombre : "CAMPAÑA SUPERADA";
      letras(sig, W / 2, H * 0.82, 2, "center");
      ctx.globalAlpha = 1;
    }
  }

  // ── AVISO DE JEFE ──
  //  Franjas diagonales que barren, el nombre entrando desde los lados y
  //  el título debajo. Dura lo que dura la pausa dramática, y en ese
  //  tiempo no hay nada que esquivar: es el momento de mirar.
  if (state === "play" && warningT > 0) {
    const jefe = miniboss && JEFES[miniboss.tipo];
    const pulse = Math.sin(performance.now() / 90) * 0.5 + 0.5;
    const fade = Math.min(1, warningT * 2.2, (2.6 - warningT) * 4);
    const y0 = H * 0.34, alto = 108;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.fillStyle = "rgba(4,5,12,0.82)";
    ctx.fillRect(0, y0, W, alto);
    // Cebra diagonal en los bordes de la franja
    ctx.save();
    ctx.beginPath(); ctx.rect(0, y0, W, 14); ctx.rect(0, y0 + alto - 14, W, 14); ctx.clip();
    ctx.fillStyle = "#ff2f6e";
    const off = (performance.now() / 26) % 44;
    for (let x = -60; x < W + 60; x += 44) {
      ctx.beginPath();
      ctx.moveTo(x + off, y0); ctx.lineTo(x + off + 20, y0);
      ctx.lineTo(x + off - 8, y0 + alto); ctx.lineTo(x + off - 28, y0 + alto);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = "#ff2f6e"; ctx.globalAlpha = fade * (0.6 + pulse * 0.4);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, y0 + 14); ctx.lineTo(W, y0 + 14);
    ctx.moveTo(0, y0 + alto - 14); ctx.lineTo(W, y0 + alto - 14);
    ctx.stroke();

    ctx.globalAlpha = fade;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ff2f6e";
    ctx.font = "800 12px " + F;
    letras("A L E R T A", W / 2, y0 + 34, 4, "center");
    ctx.fillStyle = "#ffffff";
    ctx.font = "800 " + Math.round(clamp(W * 0.075, 22, 34)) + "px " + F;
    letras(jefe ? jefe.nombre : "JEFE ENTRANTE", W / 2, y0 + 60, 4, "center");
    if (jefe) {
      ctx.globalAlpha = fade * 0.65;
      ctx.fillStyle = "#ffffff"; ctx.font = "700 9px " + F;
      letras(jefe.titulo, W / 2, y0 + 82, 1.8, "center");
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ── Entrada de misión ──
  if (state === "play" && misionIniT > 0 && modo === "campana") {
    const k = misionIniT / 2.6;
    const a = Math.min(1, misionIniT * 2.5, (1 - k) * 5);
    const m = MISIONES[misionIdx];
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(3,5,14,0.75)";
    ctx.fillRect(0, H * 0.36, W, 130);
    ctx.fillStyle = T.nave; ctx.globalAlpha = a * 0.8;
    ctx.fillRect(0, H * 0.36, W, 2);
    ctx.fillRect(0, H * 0.36 + 128, W, 2);
    ctx.globalAlpha = a;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 11px " + F; ctx.fillStyle = T.nave;
    letras("MISIÓN " + (misionIdx + 1), W / 2, H * 0.36 + 32, 5, "center");
    ctx.font = "800 " + Math.round(clamp(W * 0.075, 22, 32)) + "px " + F;
    ctx.fillStyle = "#fff";
    letras(m.nombre, W / 2, H * 0.36 + 68, 2.5, "center");
    ctx.font = "600 11px " + F; ctx.globalAlpha = a * 0.6;
    ctx.fillText(m.desc, W / 2, H * 0.36 + 100);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ── Pausa ──
  if (state === "play" && paused) {
    botones = [];
    // Atenuado en dos capas: un velo general algo más suave que antes
    // (0,78 en vez de 0,86) para que se siga viendo DÓNDE estabas, y un
    // panel propio detrás de los botones para que el texto no dependa de
    // lo que hubiera debajo.
    ctx.fillStyle = "rgba(3,5,14,0.78)"; ctx.fillRect(0, 0, W, H);

    const bw = Math.min(W - 56, 300), bx = (W - bw) / 2;
    const by0 = H * 0.5;
    const pw = Math.min(W - 40, 344), px0 = (W - pw) / 2;
    const py0 = H * 0.34 - 46, ph = (by0 + 168) - py0 + 8;
    panel(px0, py0, pw, ph, 20, 0.72);
    filo(px0, py0, pw, ph, 20, T.nave, 0.2);

    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 " + Math.round(clamp(W * 0.09, 28, 42)) + "px " + F;
    letras("PAUSA", W / 2, H * 0.34, 6, "center");
    ctx.font = "700 10px " + F; ctx.fillStyle = T.nave; ctx.globalAlpha = 0.7;
    letras(modo === "campana" ? "MISIÓN " + (misionIdx + 1) + " · " + MISIONES[misionIdx].nombre
                              : "SUPERVIVENCIA · NIVEL " + level, W / 2, H * 0.34 + 32, 2.4, "center");
    ctx.globalAlpha = 1;

    let by = by0;
    boton(bx, by, bw, 54, { label: "CONTINUAR", tam: 16, solido: true,
      fn: () => { paused = false; unlockAudio(); sfx("ui_pausa", { tono: 1.18 }); } });
    boton(bx, by + 66, bw, 46, { label: "AJUSTES", tam: 13,
      fn: () => UI.ir(() => { paused = false; state = "menu"; pantalla = "ajustes"; vueltaJuego = true; }) });
    boton(bx, by + 122, bw, 46, { label: "ABANDONAR", tam: 13, color: "#ff3b5c",
      fn: () => UI.ir(() => { paused = false; state = "menu"; pantalla = modo === "campana" ? "campana" : "mundos"; musica("menu"); }) });
  }

  // ── Aviso de desbloqueo ──
  //  Arriba y estrecho: durante una partida no puede taparle a nadie el
  //  centro de la pantalla. El sistema es genérico —tipo, icono, título,
  //  descripción— y el bloque del hangar usará el mismo sin tocarlo.
  UI.dibujarAviso(ctx, W, H, SAFE_TOP, (id, cx, cy, tam) => {
    const sp = SPRITES[id];
    if (!sp) return;
    ctx.save(); ctx.translate(cx, cy);
    pintarSprite(sp, tam);
    ctx.restore();
  });

  // ── Barrido de transición ──
  //  Lo ÚLTIMO de todo: tapa la pantalla entera, HUD incluido. Si fuera
  //  antes del HUD, se vería el marcador flotando sobre el barrido.
  UI.dibujarTransicion(ctx, W, H, T && T.nave);

  // Debug overlay
  // El bloque de audio va SIEMPRE que esté ?debug, también en el menú:
  // es donde se comprueba el desbloqueo antes de empezar a jugar.
  if (showDebug) {
    const dy = state === "play" ? 134 : SAFE_TOP + 60;
    const lines = [];
    if (state === "play") {
      lines.push(
        "FPS " + fps.toFixed(1) + "  t:" + elapsed.toFixed(1) + "s ev:" + eventoIdx,
        "ENE:" + enemies.length + " EBUL:" + eBullets.length + " BULS:" + bullets.length,
        "premios:" + premios.length,
        "score:" + score + " combo:" + combo + " boss:" + (miniboss ? "Y" : "N"),
        "spawns:" + spawnQueue.length + (paused ? " [PAUSE]" : ""),
        "");
    }
    lines.push(
      "AUDIO",
      " ctx:" + (audio ? audio.state : "sin crear") + "  listo:" + (audioListo ? "SI" : "NO"),
      " master:" + OPCIONES.volMaster.toFixed(2) + " sfx:" + OPCIONES.volSfx.toFixed(2) +
        " mus:" + OPCIONES.volMusica.toFixed(2),
      " gain:" + (BUS.master ? BUS.master.gain.value.toFixed(2) : "—") +
        "/" + (BUS.sfx ? BUS.sfx.gain.value.toFixed(2) : "—") +
        "  mute:" + (OPCIONES.silencio ? "SI" : "NO"),
      " voces:" + voces + "/" + VOCES_MAX + "  ult:" + audioDbg.ultimo,
      " grp:" + ["disparo", "enemigo", "impacto", "explosion", "jefe"]
        .map(k => (vocesGrupo[k] || 0) + "/" + GRUPOS[k].max).join(" "),
      " duck:" + (GRP.disparo ? GRP.disparo.gain.value.toFixed(2) : "—"),
      " banco:" + muestrasDbg.listas + "/" + muestrasDbg.total +
        (muestrasDbg.fallo ? " FALLO:" + muestrasDbg.fallo : "") + " " + muestrasDbg.ms + "ms",
      " resume:" + audioDbg.intentos + " int / " + audioDbg.ok + " ok / " + audioDbg.fallos + " fallo");
    if (audioDbg.motivo) lines.push(" " + audioDbg.motivo.slice(0, 30));

    {
      const v = VFX.metricas();
      const f = v.fam, lf = v.limFam;
      lines.push(
        "VFX",
        " calidad:" + v.calidad + (v.pedida === "auto" ? " (auto→" + v.auto + ")" : " (fijo)"),
        " frame:" + v.ms.toFixed(1) + "ms  medio:" + v.msMedio.toFixed(1) +
          "  peor:" + v.msMax.toFixed(1) + "  >20ms:" + v.caidas,
        " part:" + v.parts + "/" + v.maxParts + "  pico:" + v.pico +
          "  reserva:" + v.reserva,
        " nuevas:" + v.porFrame + "/" + v.topeFrame + " frame" +
          "  descartadas:" + v.rechazadas + "  desaloj:" + v.desalojadas,
        " chi:" + f.chispa + "/" + lf.chispa + " deb:" + f.debris + "/" + lf.debris +
          " est:" + f.estela + "/" + lf.estela,
        " hum:" + f.humo + "/" + lf.humo + " mot:" + f.motor + "/" + lf.motor +
          " JUG:" + f.jugador + "/" + lf.jugador + " fog:" + v.fogos,
        " ondas:" + v.ondas + "/" + v.maxOndas +
          " (jefe " + v.ondasBoss + "/" + v.maxOndasBoss + ")" +
          "  sacudidas:" + v.sacudidas + "/" + v.maxSacudidas,
        " BOSS aur:" + f.bossAura + " hit:" + f.bossHit + " fas:" + f.bossFase +
          " mrt:" + f.bossMuerte + " deb:" + f.debrisBoss,
        " boss/frame:" + v.porFrameBoss + "/" + v.topeFrameBoss +
          "  guiones:" + v.guiones + "  flash×" + v.flash +
          (miniboss ? "  int:" + (miniboss.inten || 0).toFixed(2) : ""));
    }

    if (hayGuardado) {
      const s = SAVE.estado();
      lines.push(
        "SAVE",
        " " + (s.ok ? "OK" : "ERROR") + "  v" + s.version +
          (s.migradoDe !== s.version ? " (migrado de v" + s.migradoDe + ")" : "") +
          (s.pendiente ? "  [pendiente]" : ""),
        " maxMision:" + (s.misionMax + 1) + "/" + MISIONES.length +
          "  actual:" + (misionIdx + 1) + "  nave:" + s.nave,
        " ultimo:" + (s.ultimo ? horaCorta(s.ultimo) : "nunca") +
          "  " + (s.bytes / 1024).toFixed(2) + " kB  w:" + s.escrituras,
        " eloi:" + SAVE.get("perfil.eloi", 0) +
          " part:" + SAVE.get("perfil.partidas", 0) +
          " mis:" + SAVE.get("perfil.misionesCompletadas", 0) +
          " jefes:" + SAVE.get("perfil.jefesDerrotados", 0),
        " " + s.motivo.slice(0, 34));
      if (s.error) lines.push(" ERR:" + s.error.slice(0, 30));
    }

    if (typeof MUSICA !== "undefined") {
      const m = MUSICA.debug();
      lines.push(
        "MUSICA",
        " modo:" + m.modo + "  " + (m.sonando ? "SONANDO" : "parada") +
          (m.listo ? "" : " (esperando gesto)"),
        " est:" + m.estado + "  pista:" + m.pista,
        " t:" + m.t.toFixed(1) + "/" + m.dur.toFixed(1) + "s" +
          "  vol:" + m.vol.toFixed(2) + " duck:" + m.duck.toFixed(2) + " int:" + m.inten.toFixed(2),
        " cargas:" + m.cargadas + " fallos:" + m.fallos + "  ult:" + m.ultimo);
      if (m.motivo) lines.push(" " + m.motivo.slice(0, 30));
    }

    const anchoCaja = 252, altoCaja = lines.length * 16 + 8;
    ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fillRect(0, dy, anchoCaja, altoCaja);
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = "11px monospace";
    lines.forEach((l, i) => {
      ctx.fillStyle = (l === "AUDIO" || l === "MUSICA" || l === "SAVE" || l === "VFX") ? "#ff0"
        : (l.startsWith(" ERROR") || l.startsWith(" ERR:")) ? "#f44"
        : (audioListo || !l.startsWith(" ctx")) ? "#0f0" : "#f80";
      ctx.fillText(l, 4, dy + 4 + i * 16);
    });
  }
}

// El juego arrancaba MUDO: la portada no pedía música y la primera
// pista no entraba hasta que se elegía una misión. Se pide aquí; el
// sistema la guarda y la suelta en el primer toque, que es lo antes que
// iOS permite que suene nada.
musica("menu");

// Calidad de VFX. Dos ejes que se combinan por el MÁS RESTRICTIVO:
//   OPCIONES.vfx     lo que ha elegido el jugador
//   calidadAuto      el degradado automático por FPS que ya existía
// Así, si el jugador pide ALTO y el iPad no da, baja igual; y si pide
// BAJO, no sube por mucho margen que sobre.
const VFX_DE_CALIDAD = { alta: "alto", media: "medio", baja: "bajo" };
function aplicarVFX() {
  VFX.escalaSacudida = OPCIONES.sacudida;
  const autoNivel = VFX_DE_CALIDAD[OPCIONES.calidad === "auto" ? calidadAuto : OPCIONES.calidad] || "alto";
  VFX.ajustar(OPCIONES.vfx === "auto" ? "auto" : OPCIONES.vfx, autoNivel);
}
aplicarVFX();

let ultimoMs = 0;
let last = performance.now();
let calAcc = 0, calBajos = 0, calAltos = 0;
function loop(now) {
  const real = Math.min((now - last) / 1000, 0.05);
  last = now;

  // FPS suavizado
  fpsFrames++; fpsAcc += real;
  if (fpsAcc >= 0.5) { fps = fpsFrames / fpsAcc; fpsFrames = 0; fpsAcc = 0; }

  // Calidad automática. Se mide durante 3 s antes de decidir: bajar de
  // nivel por un pico de un fotograma haría que el juego cambie de aspecto
  // cada vez que explota algo.
  if (OPCIONES.calidad === "auto" && state === "play" && !paused) {
    calAcc += real;
    if (fps < 46) calBajos += real; else calBajos = Math.max(0, calBajos - real * 0.5);
    if (fps > 56) calAltos += real; else calAltos = 0;
    if (calAcc > 3) {
      if (calBajos > 1.5 && calidadAuto !== "baja") {
        calidadAuto = calidadAuto === "alta" ? "media" : "baja";
        calAltos = 0;
      // Y también hacia arriba: si el bajón era una tormenta puntual, el
      // juego tiene que recuperar su aspecto en cuanto pase. Subir cuesta
      // 12 s de fluidez limpia y bajar 1,5 s, a propósito: no queremos
      // que oscile entre dos calidades cada tres segundos.
      } else if (calAltos > 12 && calidadAuto !== "alta") {
        calidadAuto = calidadAuto === "baja" ? "media" : "alta";
        calAltos = 0;
      }
      calAcc = 0; calBajos = 0;
      Q = CALIDADES[calidadAuto];
    }
  } else if (OPCIONES.calidad !== "auto") {
    Q = CALIDADES[OPCIONES.calidad] || CALIDADES.alta;
  }
  aplicarVFX();

  let dt = real;
  if (hitStop > 0) { hitStop -= real; dt = real * 0.06; }

  // Tiempo de fotograma real, medido aquí y no deducido de los FPS: los
  // FPS van suavizados a medio segundo y esconden justo lo que importa,
  // que es el tirón de un fotograma suelto.
  const t0 = performance.now();
  VFX.frame(ultimoMs);
  // La interfaz avanza con el dt REAL: no se ralentiza porque el
  // jugador acabe de reventar un jefe.
  UI.tick(real);

  // Una excepción dentro de update() o render() rompía la cadena de
  // requestAnimationFrame y dejaba el juego CONGELADO para siempre: un
  // fallo de un fotograma se convertía en una partida perdida. Ahora se
  // registra una vez y se sigue jugando.
  try { update(dt); render(); ultimoMs = performance.now() - t0; }
  catch (err) {
    if (!fallos[err.message]) { fallos[err.message] = 1; console.error("fallo en el bucle:", err); }
    fallos[err.message]++;
  }
  requestAnimationFrame(loop);
}
const fallos = {};
requestAnimationFrame(loop);
</script>
