    tiros(n) {
      if (n <= 2) return [{ dx:0 }];
      if (n <= 4) return [{ dx:-11 }, { dx:11 }];
      return [{ dx:0 }, { dx:-17 }, { dx:17 }];
    },
  },

  // Pocos, lentos, teledirigidos y con radio. Es el arma que perdona.
  misil: {
    nombre:"MISILES", sp:"pr_misil", col:"#ff6b3d", cad:390, vel:430,
    dmg:2.6, r:9, largo:50, snd:"misil", imp:"pesado", guia:3.4, area:52, estela:1.4,
    tiros(n) {
      const k = Math.min(4, 1 + Math.floor(n / 2));
      return Array.from({ length:k }, (_, i) => ({ dx:(i - (k - 1) / 2) * 17, vx:(i - (k - 1) / 2) * 160 }));
    },
  },

  // Un disparo cada medio segundo que atraviesa la pantalla entera.
  railgun: {
    nombre:"RAÍL", sp:"pr_railgun", col:"#ffffff", cad:560, vel:1750,
    dmg:6, r:9, largo:170, snd:"railgun", imp:"pesado", pierce:99, estela:1.6, sac:"small",
    tiros(n) {
      if (n <= 3) return [{ dx:0 }];
      if (n <= 5) return [{ dx:-14 }, { dx:14 }];
      return [{ dx:0 }, { dx:-20 }, { dx:20 }];
    },
  },

  laser: {
    nombre:"LÁSER", sp:"pr_laser", col:"#7df9ff", cad:110, vel:1400,
    dmg:0.85, r:6, largo:110, snd:"laser", imp:"ligero", pierce:2, estela:0.4,
    tiros(n) {
      const k = Math.min(3, 1 + Math.floor((n - 1) / 2));
      return Array.from({ length:k }, (_, i) => ({ dx:(i - (k - 1) / 2) * 16 }));
    },
  },

  void: {
    nombre:"VACÍO", sp:"pr_void", col:"#b45cff", cad:300, vel:620,
    dmg:2.4, r:11, largo:70, snd:"plasma", imp:"medio", pierce:2, area:34, estela:1.2,
    tiros(n) {
      if (n <= 3) return [{ dx:0 }];
      return [{ dx:-15, vx:-60 }, { dx:15, vx:60 }];
    },
  },

  ultimate: {
    nombre:"ANIQUILADOR", sp:"pr_ultimate", col:"#ffd700", cad:130, vel:900,
    dmg:2.2, r:10, largo:78, snd:"ultimate", imp:"pesado", pierce:3, area:40, estela:1.5, sac:"tiny",
    tiros(n) {
      const k = 3 + Math.min(4, n);
      return Array.from({ length:k }, (_, i) => {
        const a = (i - (k - 1) / 2) * 0.13;
        return { dx: a * 60, vx: Math.sin(a) * 900 };
      });
    },
  },
};

// ════════════════════════════════════════════════════════════
//  PATRONES DE DISPARO
//  Reutilizables. Los usan los enemigos y, cuando lleguen, los
//  bosses. Añadir un patrón aquí lo pone a disposición de todos.
// ════════════════════════════════════════════════════════════
const haciaJugador = (e) => Math.atan2(player.y - e.y, player.x - e.x);

//  Tope de proyectiles enemigos en pantalla. No es una optimización: es
//  una regla de diseño. Por encima de esto la pantalla deja de tener
//  huecos y el patrón se convierte en daño inevitable, que es justo lo
//  que un bullet hell justo no puede hacer.
const EBALAS_MAX = 340;
function eBala(x, y, vx, vy, r, extra) {
  if (eBullets.length >= EBALAS_MAX) return null;
  // Único embudo de toda bala enemiga (patrones, jefes, torretas, nodos):
  // la velocidad de dificultad se aplica UNA vez, aquí, y no en cada sitio
  // que dispara.
  const m = DIF.enemyBulletSpeedMul;
  const b = { x, y, vx: vx * m, vy: vy * m, r: r || 5 };
  if (extra) Object.assign(b, extra);
  eBullets.push(b);
  return b;
}

const PATRONES = {
  // n disparos abiertos alrededor de un ángulo
  abanico(x, y, ang, vel, n, apertura, r, extra) {
    for (let i = 0; i < n; i++) {
      const a = ang + (n === 1 ? 0 : (i - (n - 1) / 2) * apertura);
      eBala(x, y, Math.cos(a) * vel, Math.sin(a) * vel, r, extra);
    }
  },
  // n disparos repartidos por toda la circunferencia
  circulo(x, y, vel, n, fase, r, extra) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + (fase || 0);
      eBala(x, y, Math.cos(a) * vel, Math.sin(a) * vel, r, extra);
    }
  },
  // Espiral: el mismo círculo pero con las velocidades escalonadas, así
  // que los brazos se abren en curva en vez de en línea recta.
  espiral(x, y, vel, n, fase, r, brazos) {
    const br = brazos || 2;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU * br + (fase || 0);
      const v = vel * (0.72 + (i % n) / n * 0.5);
      eBala(x, y, Math.cos(a) * v, Math.sin(a) * v, r);
    }
  },
  // Ráfaga escalonada: n balas por el mismo sitio a velocidades distintas.
  // Llegan en fila india, así que hay que moverse DURANTE el ataque, no
  // antes de él.
  rafaga(x, y, ang, vel, n, sep, r) {
    for (let i = 0; i < n; i++) {
      const v = vel * (1 - i * (sep || 0.13));
      eBala(x, y, Math.cos(ang) * v, Math.sin(ang) * v, r);
    }
  },
  // Barrido: abanico con las velocidades giradas progresivamente. Barre
  // la pantalla de un lado al otro y siempre deja por dónde salir.
  barrido(x, y, angIni, angFin, vel, n, r) {
    for (let i = 0; i < n; i++) {
      const a = angIni + (angFin - angIni) * (i / Math.max(n - 1, 1));
      const v = vel * (0.8 + i / n * 0.4);
      eBala(x, y, Math.cos(a) * v, Math.sin(a) * v, r);
    }
  },
  // Muro con huecos. El hueco es el patrón: si no hay hueco no es un
  // muro, es una condena.
  muro(y, vel, r, huecos, ancho) {
    const paso = (r || 6) * 3.4;
    const n = Math.ceil(W / paso) + 1;
    const gaps = [];
    const nh = huecos || 2, an = ancho || 2.2;
    for (let i = 0; i < nh; i++) gaps.push(rand(W * 0.12, W * 0.88));
    for (let i = 0; i < n; i++) {
      const x = i * paso + paso / 2;
      if (gaps.some(g => Math.abs(x - g) < paso * an)) continue;
      eBala(x, -10, 0, vel, r);
    }
  },
  // Fuego cruzado desde los dos lados.
  cruzado(y, vel, n, r) {
    for (let i = 0; i < n; i++) {
      const yy = y + i * 34;
      const a1 = Math.atan2(player.y - yy, player.x - 0);
      const a2 = Math.atan2(player.y - yy, player.x - W);
      eBala(0, yy, Math.cos(a1) * vel, Math.sin(a1) * vel, r);
      eBala(W, yy, Math.cos(a2) * vel, Math.sin(a2) * vel, r);
    }
  },
};

// ════════════════════════════════════════════════════════════
//  TELEGRÁFICOS
// ════════════════════════════════════════════════════════════
//  TELEGRÁFICO → ATAQUE → RECUPERACIÓN. Sin el primer paso, esquivar es
//  adivinar; sin el tercero, no hay ventana para devolver el golpe.
//  Dibujar el aviso es tan parte del ataque como los proyectiles.
let telegrafos = [];
function telegrafo(tipo, o) {
  if (telegrafos.length > 24) return null;
  const t = Object.assign({ tipo, t: 0, life: 0.9, col: TIRO_SUYO }, o);
  // `life` y el `avisa` que decide cuándo dispara el ataque real se
  // autoran a mano para que coincidan (ver los ~40 sitios que llaman a
  // esto). Se escalan por el MISMO factor en los dos únicos sitios que
  // los leen —éste y el bucle de cadencia de cada motor— para que jamás
  // se desincronicen: un aviso más largo en FÁCIL no puede acabar
  // desapareciendo antes de que llegue el disparo que anuncia.
  t.life *= DIF.telegraphMul;
  telegrafos.push(t);
  RHYTHM.marcar();
  return t;
}
function actualizarTelegrafos(dt) {
  for (let i = telegrafos.length - 1; i >= 0; i--) {
    const g = telegrafos[i];
    g.t += dt;
    if (g.sigue) { g.x = g.sigue.x; g.y = g.sigue.y; }
    if (g.t >= g.life || (g.sigue && g.sigue.hp <= 0)) telegrafos.splice(i, 1);
  }
}
function dibujarTelegrafos() {
  for (const g of telegrafos) {
    const k = g.t / g.life;
    const pulso = 0.45 + 0.55 * Math.abs(Math.sin(performance.now() / 90));
    ctx.save();
    ctx.globalAlpha = (g.tipo === "mira" ? 0.35 + k * 0.5 : 0.5) * pulso;
    ctx.strokeStyle = g.col; ctx.fillStyle = g.col;
    if (g.tipo === "mira") {
      // Línea de puntería del francotirador. Se estrecha y se afila según
      // se acerca el disparo: el jugador ve cuánto le queda.
      ctx.lineWidth = 1 + k * 2.5;
      ctx.setLineDash([10 - k * 7, 8 - k * 6]);
      ctx.beginPath(); ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x + Math.cos(g.ang) * 1400, g.y + Math.sin(g.ang) * 1400);
      ctx.stroke(); ctx.setLineDash([]);
      if (k > 0.55) {
        ctx.globalAlpha = (k - 0.55) / 0.45 * pulso;
        ctx.lineWidth = 2;
        const bx = g.bx != null ? g.bx : player.x, by = g.by != null ? g.by : player.y;
        ctx.beginPath(); ctx.arc(bx, by, 26 - (k - 0.55) * 30, 0, TAU); ctx.stroke();
      }
    } else if (g.tipo === "cono") {
      ctx.globalAlpha *= 0.22;
      ctx.beginPath(); ctx.moveTo(g.x, g.y);
      ctx.arc(g.x, g.y, g.r || 700, g.a1, g.a2);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha *= 2.4; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r || 700, g.a1, g.a2); ctx.stroke();
    } else if (g.tipo === "anillo") {
      ctx.lineWidth = 2 + k * 3;
      ctx.setLineDash([12, 10]);
      ctx.beginPath(); ctx.arc(g.x, g.y, (g.r || 90) * (0.3 + k * 0.8), 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    } else if (g.tipo === "banda") {
      ctx.globalAlpha *= 0.2;
      ctx.fillRect(0, g.y - (g.h || 30) / 2, W, g.h || 30);
      ctx.globalAlpha *= 3; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, g.y - (g.h || 30) / 2); ctx.lineTo(W, g.y - (g.h || 30) / 2);
      ctx.moveTo(0, g.y + (g.h || 30) / 2); ctx.lineTo(W, g.y + (g.h || 30) / 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// Las tablas de datos —ENEMIGOS, JEFES, TEMAS y MISIONES— viven ahora en
// js/enemigos.js, js/jefes.js y js/misiones.js. Aquí se queda el MOTOR:
// spawn, colisiones, dibujo y bucle de eventos.

// Formas por defecto, para cuando todavía no hay PNG del enemigo.
// Solo trazan el contorno: de rellenarlo y perfilarlo se encarga
// dibujarEnemigo(), para que todos compartan el mismo acabado.
const FORMAS = {
  circulo(e) { ctx.arc(0, 0, e.r, 0, TAU); },

  rombo(e) {
    ctx.rotate(e.giro);
    ctx.moveTo(0, -e.r); ctx.lineTo(e.r * 0.7, 0);
    ctx.lineTo(0, e.r); ctx.lineTo(-e.r * 0.7, 0);
    ctx.closePath();
  },

  hexagono(e) {
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + e.giro * 0.4;
      ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * e.r, Math.sin(a) * e.r);
    }
    ctx.closePath();
  },

  // Los pods laterales van dentro del MISMO trazo que el casco. Si fueran
  // rectángulos aparte, el contorno perfilaría cada pieza y se vería como
  // tres cosas pegadas en vez de una nave.
  acorazado(e) {
    const r = e.r;
    ctx.moveTo(0, -r);
    ctx.lineTo(r * 0.95, -r * 0.3);
    ctx.lineTo(r * 1.38, -r * 0.28); ctx.lineTo(r * 1.38, r * 0.44);
    ctx.lineTo(r * 0.9, r * 0.44);
    ctx.lineTo(r * 0.7, r * 0.55);
    ctx.lineTo(0, r * 0.88);
    ctx.lineTo(-r * 0.7, r * 0.55);
    ctx.lineTo(-r * 0.9, r * 0.44);
    ctx.lineTo(-r * 1.38, r * 0.44); ctx.lineTo(-r * 1.38, -r * 0.28);
    ctx.lineTo(-r * 0.95, -r * 0.3);
    ctx.closePath();
  },

  // Punta hacia abajo: se ve de un vistazo que viene a por ti
  punta(e) {
    ctx.rotate(e.giro || 0);
    const r = e.r;
    ctx.moveTo(0, r * 1.2);
    ctx.lineTo(r * 0.9, -r * 0.55);
    ctx.lineTo(0, -r * 0.2);
    ctx.lineTo(-r * 0.9, -r * 0.55);
    ctx.closePath();
  },
};

// Detalles que van ENCIMA del relleno, una vez perfilada la silueta
const DETALLES = {
  acorazado(e) {
    const r = e.r;
    ctx.fillStyle = "rgba(10,7,20,0.42)";
    ctx.fillRect(-r * 0.62, -r * 0.55, r * 1.24, r * 0.26);
  },
};

// ════════════════════════════════════════════════════════════
//  HAZARDS — asteroides y cristales ambientales (M2, M5)
// ════════════════════════════════════════════════════════════
const HAZARD_TIPOS = {
  asteroide: { r: 30, vel: 145, hp: 5, lateral: true  },
  cristal:   { r: 26, vel: 165, hp: 4, lateral: false },

  // ── Peligros de la expansión (bloque 5D) ──────────────────
  //  Cada uno resuelve un problema distinto, y ninguno es "un asteroide
  //  con otro dibujo":
  //
  //    tempano    ESTORBA. Aguanta ocho de daño y se come lo que le
  //               dispares tú Y lo que te disparen a ti: es cobertura
  //               móvil, no una piedra que cae.
  //    trafico    CRUZA. Ni dispara, ni apunta, ni da puntos: es una
  //               ciudad que sigue funcionando mientras peleas.
  //    mina_bio   ESPERA. No hace nada hasta que te acercas, y entonces
  //               avisa antes de reventar.
  //    fragmento  DEVUELVE. Bloquea, y una bala enemiga rebota en él
  //               hacia arriba en vez de desaparecer.
  //
  //  `bloquea` es lo único que toca las balas ENEMIGAS. Lo demás es
  //  velocidad, vida y dibujo.
  tempano:   { r: 40, vel: 62,  hp: 8, lateral: false, bloquea: true,
               col: "#bfe9ff", sp: "hz_tempano", ritmo: [3.4, 1.8] },
  trafico:   { r: 27, vel: 0,   hp: 3, cruza: true, col: "#7fb2ff",
               sp: "hz_trafico", spAlt: "hz_trafico2", ritmo: [1.9, 1.2] },
  mina_bio:  { r: 19, vel: 44,  hp: 2, mina: true, radio: 74, aviso: 0.8,
               col: "#9dff5a", sp: "hz_mina_bio", ritmo: [2.6, 1.6] },
  fragmento: { r: 25, vel: 34,  hp: 6, quieto: true, bloquea: true, rebota: true,
               col: "#c47dff", sp: "hz_fragmento", ritmo: [3.0, 1.6] },
};
let hazards = [], hazardEnabled = false, hazardAcc = 0, hazardTipo = "asteroide";
const esCristal = h => h.tipo === "cristal";
const fichaHazard = h => HAZARD_TIPOS[h.tipo] || HAZARD_TIPOS.asteroide;
const colorHazard = h => fichaHazard(h).col || (esCristal(h) ? "#88ddff" : "#ff8800");

// Cuántas minas puede haber en pantalla A LA VEZ sin que importe quién
// las suelta. `sembrador` (bloque 5E) es el primero en usar esto, pero
// el tope es del TIPO, no del enemigo: si mañana otro enemigo o un
// evento de guión quiere sembrar minas, cuenta contra el mismo límite.
const MINAS_ACTIVAS_MAX = 4;
function minasActivas() { return hazards.filter(h => h.tipo === "mina_bio").length; }

// Suelta una `mina_bio` FUERA del ciclo de `spawnHazard()` — ese ciclo
// es "un tipo de hazard cayendo del cielo todo el rato" (M2, M5 y los
// mundos que lo activan); esto es "un enemigo concreto deja una detrás
// de sí en su sitio". Devuelve si pudo: si ya hay `MINAS_ACTIVAS_MAX`,
// no hace nada — es justo lo que evita llenar la pantalla de minas.
function soltarMinaBio(x, y) {
  if (minasActivas() >= MINAS_ACTIVAS_MAX) return false;
  asegurarSpriteHazard("mina_bio");
  const d = HAZARD_TIPOS.mina_bio;
  hazards.push({ tipo: "mina_bio", x, y, r: d.r, vx: 0, vy: 18,
    alt: false, giro: 0, giroV: 0, hp: d.hp, warnT: 0,
    armada: 0, sway: rand(0, TAU) });
  return true;
}

// Mismo patrón que `soltarMinaBio`, para `fragmento` — el hazard de
// `grieta` (bloque 5D). El primer sitio que lo usa es HERALDO DE LA
// GRIETA (bloque 5F), pero el tope es del TIPO, igual que las minas.
const FRAGMENTOS_ACTIVOS_MAX = 3;
function fragmentosActivos() { return hazards.filter(h => h.tipo === "fragmento").length; }
function soltarFragmentoHazard(x, y) {
  if (fragmentosActivos() >= FRAGMENTOS_ACTIVOS_MAX) return false;
  asegurarSpriteHazard("fragmento");
  const d = HAZARD_TIPOS.fragmento;
  hazards.push({ tipo: "fragmento", x, y, r: d.r, vx: 0, vy: d.vel,
    alt: false, giro: rand(-0.4, 0.4), giroV: 0, hp: d.hp, warnT: 0 });
  return true;
}

function spawnHazard() {
  const d = HAZARD_TIPOS[hazardTipo];
  if (!d) return;
  asegurarSpriteHazard(hazardTipo);
  // El tráfico entra por un lado y cruza; lo demás cae. El asteroide es
  // el único que hace las dos cosas, y sigue haciéndolas igual.
  if (d.cruza) {
    const desdeIzq = Math.random() < 0.5;
    const vx = (desdeIzq ? 1 : -1) * rand(120, 190);
    hazards.push({ tipo: hazardTipo, x: desdeIzq ? -d.r - 10 : W + d.r + 10,
      // Carriles altos: el tráfico cruza POR DELANTE, no por encima de
      // la nave. Abajo es donde se juega, y una ciudad que te embiste
      // mientras esquivas balas no es escenario, es una trampa.
      y: rand(H * 0.12, H * 0.52), vx, vy: 0,
      alt: Math.random() < 0.5, giro: 0, giroV: 0,
      hp: d.hp, warnT: 0.7, lado: desdeIzq ? 1 : 2, luz: rand(0, TAU) });
    return;
  }
  const lado = hazardTipo === "asteroide" && Math.random() < 0.33 ? (Math.random() < 0.5 ? 1 : 2) : 0;
  let x, y, vx = rand(-35, 35), vy = d.vel + rand(-20, 20);
  if (lado === 1) { x = -d.r - 5; y = rand(H * 0.08, H * 0.65); vx = rand(70, 120); vy = rand(80, 140); }
  else if (lado === 2) { x = W + d.r + 5; y = rand(H * 0.08, H * 0.65); vx = rand(-120, -70); vy = rand(80, 140); }
  else { x = rand(d.r + 30, W - d.r - 30); y = -(d.r + 20); }
  // El fragmento no da vueltas ni deriva: es un trozo de sitio roto, y
  // que se quede quieto es lo que permite usarlo de parapeto.
  if (d.quieto) { vx = 0; vy = d.vel; }
  hazards.push({ tipo: hazardTipo, x, y, r: d.r * (d.quieto ? 1 : rand(0.8, 1.25)), vx, vy,
    // Dos dibujos de asteroide alternados: una lluvia de veinte piedras
    // idénticas se lee como un patrón, no como escombro.
    alt: hazardTipo === "asteroide" && Math.random() < 0.5,
    giro: d.quieto ? rand(-0.4, 0.4) : rand(0, TAU),
    giroV: d.quieto ? 0 : rand(0.8, 2.4) * (Math.random() > 0.5 ? 1 : -1),
    hp: d.hp, warnT: lado === 0 ? 1.0 : 0,
    // De la mina: sigue dormida hasta que alguien se acerca.
    armada: 0, sway: rand(0, TAU) });
}

function actualizarHazards(dt) {
  if (hazardEnabled && state === "play" && !paused && !miniboss) {
    hazardAcc += dt;
    const rit = (HAZARD_TIPOS[hazardTipo] && HAZARD_TIPOS[hazardTipo].ritmo) || [2.0, 1.4];
    const ritmo = rit[0] + Math.random() * rit[1];
    while (hazardAcc >= ritmo) { hazardAcc -= ritmo; spawnHazard(); }
  }
  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i];
    const d = fichaHazard(h);
    if (h.warnT > 0) { h.warnT -= dt; continue; }
    h.y += h.vy * dt; h.x += h.vx * dt; h.giro += h.giroV * dt;
    // El tráfico NO rebota en las paredes: cruza y se va. Rebotar lo
    // convertiría en una bola de pinball dentro del campo.
    if (!d.cruza) {
      if (h.x < h.r && h.vx < 0) h.vx = -h.vx;
      if (h.x > W - h.r && h.vx > 0) h.vx = -h.vx;
    } else if (h.x < -h.r - 40 || h.x > W + h.r + 40) { hazards.splice(i, 1); continue; }
    if (h.y - h.r > H + 30) { hazards.splice(i, 1); continue; }
    if (state !== "play" || paused) continue;

    // ── Mina: dormida → avisando → revienta ──
    if (d.mina) {
      const ddx = player.x - h.x, ddy = player.y - h.y;
      const cerca = ddx * ddx + ddy * ddy < (d.radio + hitR()) ** 2;
      if (!h.armada && cerca) { h.armada = d.aviso; sfx("aviso", { vol: 0.55 }); }
      if (h.armada > 0) {
        h.armada -= dt;
        if (h.armada <= 0) {
          // Revienta donde está, no donde estás tú: si te has ido, no te
          // alcanza. El aviso tiene que servir de algo.
          const rx = player.x - h.x, ry = player.y - h.y;
          muerte(h.x, h.y, d.col, "media");
          vfx("toxico", h.x, h.y, d.radio * 2, 0.45);
          VFX.onda(h.x, h.y, d.col, d.radio, 0.42, 3);
          sfx("exp_med");
          hazards.splice(i, 1);
          if (rx * rx + ry * ry < (d.radio + hitR() * 0.7) ** 2) {
            golpe(h.x, h.y);
            if (state !== "play") return;
          }
          continue;
        }
      }
      h.sway += dt * 1.6;
      h.x += Math.cos(h.sway) * 14 * dt;
    }

    const dx = player.x - h.x, dy = player.y - h.y;
    if (dx * dx + dy * dy < (hitR() + h.r * 0.72) ** 2) {
      muerte(h.x, h.y, colorHazard(h), "media");
      hazards.splice(i, 1); golpe(h.x, h.y);
      if (state !== "play") return;
      continue;
    }

    // ── Bloqueo de fuego ENEMIGO ──
    //  Solo lo hacen los que lo declaran. Un témpano entre tú y quien
    //  dispara es cobertura de verdad: la bala se apaga contra él.
    if (d.bloquea) {
      for (let k = eBullets.length - 1; k >= 0; k--) {
        const eb = eBullets[k];
        const ex = eb.x - h.x, ey = eb.y - h.y;
        if (ex * ex + ey * ey >= (eb.r + h.r * 0.86) ** 2) continue;
        if (d.rebota && !eb.rebotada) {
          // Rebote: la manda HACIA ARRIBA, nunca hacia el jugador. Una
          // bala devuelta que se vuelve contra ti es daño que no se veía
          // venir, que es justo lo que el juego no hace.
          eb.rebotada = true;
          eb.vy = -Math.abs(eb.vy || 180) * 0.9;
          eb.vx *= 0.5;
          eb.y = h.y - h.r * 0.9;
          vfx("emp", h.x, h.y, h.r * 2.2, 0.3);
          sfx("emp", { vol: 0.5 });
        } else {
          eBullets.splice(k, 1);
          vfx("escudo", eb.x, eb.y, 44, 0.22);
          sfx("imp_escudo", { vol: 0.35 });
        }
        h.bloqueoT = 0.18;
      }
    }
    if (h.bloqueoT > 0) h.bloqueoT -= dt;

    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const bx = b.x - h.x, by = b.y - h.y;
      if (bx * bx + by * by >= (b.r + h.r) ** 2) continue;
      h.hp -= b.dmg;
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (h.hp <= 0) {
        muerte(h.x, h.y, esCristal(h) ? "#88ddff" : (d.col || "#ff8800"), "basica");
        if (esCristal(h) || h.tipo === "tempano") vfx("cryo", h.x, h.y, 130, 0.4);
        if (h.tipo === "fragmento") { vfx("emp", h.x, h.y, 120, 0.32); sfx("roca_break", { vol: 0.7 }); }
        if (h.tipo === "trafico") sfx("exp_peq", { vol: 0.6 });
        hazards.splice(i, 1);
      }
      break;
    }
  }
}

function dibujarHazards() {
  for (const h of hazards) {
    const d = fichaHazard(h);
    const col = colorHazard(h);
    const sp = SPRITES[h.tipo === "asteroide" && h.alt ? "hz_asteroide2"
      : (d.spAlt && h.alt) ? d.spAlt : (d.sp || "hz_" + h.tipo)];
    if (h.warnT > 0) {
      const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 90);
      ctx.save(); ctx.globalAlpha = pulse;
      ctx.fillStyle = col;
      if (h.lado) {
        // Aviso LATERAL, a la altura por la que va a entrar. El de arriba
        // no sirve para algo que llega de lado: mira donde no es.
        const wx = h.lado === 1 ? 14 : W - 14, s = h.lado === 1 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(wx + 10 * s, h.y); ctx.lineTo(wx - 5 * s, h.y - 9); ctx.lineTo(wx - 5 * s, h.y + 9);
        ctx.closePath(); ctx.fill();
      } else {
        const wx = clamp(h.x, 18, W - 18), wy = SAFE_TOP + 24;
        ctx.beginPath(); ctx.moveTo(wx, wy + 10); ctx.lineTo(wx - 9, wy - 5); ctx.lineTo(wx + 9, wy - 5);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      continue;
    }
    ctx.save(); ctx.translate(h.x, h.y);
    // El tráfico se orienta a su marcha; lo demás gira.
    if (d.cruza) ctx.scale(h.vx < 0 ? -1 : 1, 1);
    else ctx.rotate(h.giro);
    if (sp) {
      // El tráfico va SIN halo de amenaza y un punto apagado: lo que
      // distingue un enemigo de un vehículo no es la forma —a 40 px las
      // dos son una mancha— sino que uno brilla y el otro no.
      if (d.cruza) {
        ctx.globalAlpha = 0.88;
        pintarSprite(sp, h.r * 2.3);
        ctx.globalAlpha = 1;
      } else {
        ctx.shadowColor = h.bloqueoT > 0 ? "#ffffff" : (esCristal(h) ? "#44aaff" : col);
        ctx.shadowBlur = h.bloqueoT > 0 ? 22 : 12;
        pintarSprite(sp, h.r * 2.3); ctx.shadowBlur = 0;
      }
    } else {
      ctx.beginPath(); ctx.arc(0, 0, h.r, 0, TAU);
      ctx.fillStyle = esCristal(h) ? "#4499ee" : "#cc4400"; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
    }
    ctx.restore();

    // Luz de posición del tráfico: parpadea, va en el morro y es lo único
    // suyo que brilla. Es la señal de "esto va a lo suyo".
    if (d.cruza) {
      const p = 0.5 + 0.5 * Math.sin(performance.now() / 180 + h.luz);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.35 + 0.4 * p;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(h.x + (h.vx < 0 ? -h.r * 0.8 : h.r * 0.8), h.y, 3.4, 0, TAU); ctx.fill();
      ctx.restore();
    }

    // La mina avisa con un anillo que se cierra. No hay forma de
    // confundir esto con un enemigo: los enemigos no se encogen.
    if (d.mina && h.armada > 0) {
      const k = 1 - h.armada / d.aviso;
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(performance.now() / 60));
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(h.x, h.y, d.radio * (1 - k * 0.55), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 0.16;
      ctx.beginPath(); ctx.arc(h.x, h.y, d.radio, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }
}

// ════════════════════════════════════════════════════════════
//  ROCAS — mecánica firma del jefe de M2 (ASTEROID BREAK)
// ════════════════════════════════════════════════════════════
//  Un asteroide lanzado por el jefe no muere en un golpe: al reventar,
//  si tenía suficiente masa, se parte en dos fragmentos más pequeños que
//  salen despedidos. Determinista y con pooling por límite — nada de
//  física real, solo velocidad + giro, que es lo que hace falta.
let rocas = [];
const ROCAS_MAX = 26;
function lanzarRoca(x, y, vx, vy, r, hp, frag) {
  if (rocas.length >= ROCAS_MAX) return null;
  const h = { x, y, vx, vy, r, hp, frag: frag || 0,
    giro: rand(0, TAU), giroV: rand(-3.2, 3.2), alt: Math.random() < 0.5 };
  rocas.push(h);
  return h;
}
function actualizarRocas(dt) {
  for (let i = rocas.length - 1; i >= 0; i--) {
    const h = rocas[i];
    h.x += h.vx * dt; h.y += h.vy * dt; h.giro += h.giroV * dt;
    if (h.y - h.r > H + 40 || h.y < -220 || h.x < -100 || h.x > W + 100) { rocas.splice(i, 1); continue; }
    if (state !== "play" || paused) continue;
    const dx = player.x - h.x, dy = player.y - h.y;
    if (dx * dx + dy * dy < (hitR() + h.r * 0.7) ** 2) {
      muerte(h.x, h.y, "#ff6a2f", "media");
      rocas.splice(i, 1); golpe(h.x, h.y);
      if (state !== "play") return;
      continue;
    }
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const bx = b.x - h.x, by = b.y - h.y;
      if (bx * bx + by * by >= (b.r + h.r) ** 2) continue;
      h.hp -= b.dmg;
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (h.hp <= 0) {
        if (h.frag > 0) {
          const n = 2;
          for (let k = 0; k < n; k++) {
            const a = rand(0, TAU);
            lanzarRoca(h.x, h.y, Math.cos(a) * 130 + h.vx * 0.3, Math.sin(a) * 130 + Math.abs(h.vy) * 0.5,
              h.r * 0.52, 1, 0);
          }
          sfx("roca_break");
          vfx("chispa", h.x, h.y, h.r * 2.4, 0.3);
        } else {
          muerte(h.x, h.y, "#ff8a3f", "basica");
        }
        rocas.splice(i, 1);
      } else sfx("roca_impacto", { vol: 0.6 });
      break;
    }
  }
}
function dibujarRocas() {
  for (const h of rocas) {
    const sp = SPRITES[h.alt ? "hz_asteroide2" : "hz_asteroide"];
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.giro);
    if (sp) {
      ctx.shadowColor = "#ff5c1a"; ctx.shadowBlur = 12;
      pintarSprite(sp, h.r * 2.3); ctx.shadowBlur = 0;
    } else {
      ctx.beginPath(); ctx.arc(0, 0, h.r, 0, TAU);
      ctx.fillStyle = "#a04010"; ctx.fill();
      ctx.strokeStyle = "#ff8800"; ctx.lineWidth = 2.5; ctx.stroke();
    }
    ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════
//  DEFENSAS FIJAS — torretas estacionarias (M3)
// ════════════════════════════════════════════════════════════
const DEFENSA_TIPOS = {
  torreta: {
    r: 22, hpMax: 8, puntos: 150,
    recarga: () => rand(2.0, 2.8),
    atacar(d) { PATRONES.abanico(d.x, d.y, haciaJugador(d), 240, 1, 0, 5); sfx("ene_laser", { tono: 0.9 }); },
  },

    atacar(d) { PATRONES.abanico(d.x, d.y, haciaJugador(d), 265, 3, 0.18, 6); sfx("ene_barrido", { tono: 0.8 }); },
  },
};
let defensas = [];

function spawnDefensas(tipo, n) {
  const d = DEFENSA_TIPOS[tipo];

    else if (d.cd <= 0) { d.cd = 0.3; }

      const dx = b.x - d.x, dy = b.y - d.y;
      if (dx * dx + dy * dy >= (b.r + d.r) ** 2) continue;
      d.hp -= b.dmg; d.flash = 0.1; bulletsHit++;

      if (d.hp <= 0) {

          opciones: { textoOffsetY: -30, textoTam: 15, texto: true, premio: { prob: 0.55, offsetX: [-20, 20] } } });
        defensas.splice(i, 1);
      }

    }
  }
}

function dibujarDefensas() {
  for (const d of defensas) {
    const sp = SPRITES["df_" + d.tipo];
    ctx.save(); ctx.translate(d.x, d.y);
    if (sp) {
      if (d.flash > 0) ctx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 35);
      ctx.shadowColor = "rgba(0,80,255,0.5)"; ctx.shadowBlur = 10;
      pintarSprite(sp, d.r * 2.2); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    } else {
      ctx.beginPath(); ctx.arc(0, 0, d.r, 0, TAU);
      ctx.fillStyle = d.flash > 0 ? "#ffffff" : "#4466cc"; ctx.fill();
      ctx.strokeStyle = "#88aaff"; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.restore();
    const bw = d.r * 2.4, bh = 4, bx = d.x - bw / 2, by = d.y - d.r - 9;
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    const col = d.hp > d.hpMax * 0.5 ? "#44aaff" : d.hp > d.hpMax * 0.25 ? "#ffaa00" : "#ff4444";
    ctx.fillStyle = col; ctx.fillRect(bx, by, bw * (d.hp / d.hpMax), bh);
  }
}

// ════════════════════════════════════════════════════════════
//  ZONAS TÓXICAS — daño ambiental con telegráfico (M4)
// ════════════════════════════════════════════════════════════
let zonas = [], zonaEnabled = false, zonaAcc = 0;

function spawnZona() {
  zonas.push({ x: rand(70, W - 70), y: rand(H * 0.18, H * 0.62),
    r: rand(52, 88), t: 0, fase: 0, damageCd: 0 });
}

function actualizarZonas(dt) {
  if (zonaEnabled && state === "play" && !paused) {
    zonaAcc += dt;
    if (zonaAcc >= 5.5) { zonaAcc = 0; spawnZona(); if (Math.random() > 0.5) spawnZona(); }
  }
  for (let i = zonas.length - 1; i >= 0; i--) {
    const z = zonas[i]; z.t += dt;
    if (z.fase === 0 && z.t >= 2.0) { z.fase = 1; z.t = 0; sfx("venom_zona", { vol: 0.7 }); }
    if (z.fase === 1 && z.t >= 4.2) { z.fase = 2; z.t = 0; }
    if (z.fase === 2 && z.t >= 0.85) { zonas.splice(i, 1); continue; }
    if (z.fase !== 1 || state !== "play" || paused) continue;
    const dx = player.x - z.x, dy = player.y - z.y;
    if (dx * dx + dy * dy < (hitR() * 0.85 + z.r * 0.82) ** 2) {
      if (z.damageCd <= 0) { golpe(); z.damageCd = 1.4; if (state !== "play") return; }
    }
    if (z.damageCd > 0) z.damageCd -= dt;
  }
}

function dibujarZonas() {
  const sp = SPRITES["hz_nube_toxica"];
  for (const z of zonas) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 200);
    ctx.save();
    if (z.fase === 0) {
      const alpha = (0.35 + 0.4 * pulse) * Math.min(1, z.t / 0.5);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = "#55ff55"; ctx.lineWidth = 2.5; ctx.setLineDash([8, 7]);
      const rad = z.r * Math.min(1, 0.25 + z.t * 0.375);
      ctx.beginPath(); ctx.arc(z.x, z.y, rad, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = alpha * 0.15; ctx.fillStyle = "#33ff33";
      ctx.beginPath(); ctx.arc(z.x, z.y, rad, 0, TAU); ctx.fill();
    } else if (z.fase === 1) {
      if (sp) {
        ctx.globalAlpha = 0.78; ctx.translate(z.x, z.y); pintarSprite(sp, z.r * 2.0);
      } else {
        ctx.globalAlpha = 0.38 + 0.18 * pulse;
        ctx.fillStyle = "rgba(60,220,60,0.55)";
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
        ctx.globalAlpha = 0.7 + 0.3 * pulse; ctx.strokeStyle = "#66ff66"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.stroke();
      }
    } else {
      ctx.globalAlpha = (1 - z.t / 0.85) * 0.38; ctx.fillStyle = "rgba(60,220,60,0.4)";
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════
//  POZOS GRAVITATORIOS — mecánica firma de M7 (GRAVITY WELL)
// ════════════════════════════════════════════════════════════
//  Estados: TELEGRAPH → FORMATION → ACTIVE → COLLAPSE → CLEAR. La
//  fuerza se SUMA al objetivo del dedo, nunca lo sustituye: por fuerte
//  que tire, el jugador conserva el control. El colapso final es un
//  tirón corto y con techo — espectacular, nunca injusto.
let pozos = [];
function spawnPozo(x, y, radio, fuerza, vida) {
  if (pozos.length > 6) return;
  pozos.push({ x, y, r: radio, fuerza, t: 0, fase: 0, vida: vida || 3.5 });
  RHYTHM.marcar();
}
function actualizarPozos(dt) {
  for (let i = pozos.length - 1; i >= 0; i--) {
    const p = pozos[i]; p.t += dt;
    if (p.fase === 0 && p.t >= 0.9) { p.fase = 1; p.t = 0; sfx("gravedad_forma"); }
    else if (p.fase === 1 && p.t >= 0.5) { p.fase = 2; p.t = 0; }
    else if (p.fase === 2 && p.t >= p.vida) { p.fase = 3; p.t = 0; sfx("gravedad_colapso"); sacudir("tiny"); }
    else if (p.fase === 3 && p.t >= 0.35) { pozos.splice(i, 1); continue; }
    if (state !== "play" || paused) continue;

    if (p.fase === 2) {
      const dx = p.x - player.x, dy = p.y - player.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist < p.r) {
        const f = p.fuerza * (1 - dist / p.r);
        targetX += (dx / dist) * f * dt; targetY += (dy / dist) * f * dt;
      }
    } else if (p.fase === 3) {
      const dx = p.x - player.x, dy = p.y - player.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist < p.r * 1.3) {
        const f = Math.min(p.fuerza * 2.2, 240);   // techo: nunca succión total
        targetX += (dx / dist) * f * dt; targetY += (dy / dist) * f * dt;
      }
    }
  }
}
function dibujarPozos() {
  for (const p of pozos) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 140);
    ctx.save(); ctx.translate(p.x, p.y);
    if (p.fase === 0) {
      const k = p.t / 0.9;
      ctx.globalAlpha = 0.55 * k;
      ctx.strokeStyle = "#b45cff"; ctx.lineWidth = 2; ctx.setLineDash([9, 7]);
      ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    } else if (p.fase === 1 || p.fase === 2) {
      const k = p.fase === 1 ? p.t / 0.5 : 1;
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.r * k);
      g.addColorStop(0, "#e0b3ff"); g.addColorStop(0.4, "#8a3fd6"); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = 0.32 + pulse * 0.14; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, p.r * k, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 0.75; ctx.strokeStyle = "#d9a5ff"; ctx.lineWidth = 2;
      ctx.rotate(performance.now() / 600);
      ctx.beginPath(); ctx.ellipse(0, 0, p.r * k * 0.5, p.r * k * 0.18, 0, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, p.r * k * 0.5, p.r * k * 0.18, Math.PI / 3, 0, TAU); ctx.stroke();
    } else {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 1 - p.t / 0.35; ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(0, 0, p.r * 0.4 * (1 - p.t / 0.35), 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════
//  CARRILES DE CALOR — mecánica firma de M8 (HEAT LANES)
// ════════════════════════════════════════════════════════════
//  TELEGRAPH → IGNITION → ACTIVE → COOLING. Bandas horizontales, no
//  círculos: obligan a elegir altura, que es justo lo que M8 pide —
//  reacción rápida sobre una señal que sigue siendo justa.
let carriles = [];
function spawnCarril(y, h, vida) {
  if (carriles.length > 5) return;
  carriles.push({ y, h: h || 70, t: 0, fase: 0, vida: vida || 2.2, damageCd: 0 });
  RHYTHM.marcar();
}
function actualizarCarriles(dt) {
  for (let i = carriles.length - 1; i >= 0; i--) {
    const c = carriles[i]; c.t += dt;
    if (c.fase === 0 && c.t >= 0.85) { c.fase = 1; c.t = 0; sfx("fuego_ignicion"); sacudir("tiny"); }
    else if (c.fase === 1 && c.t >= 0.25) { c.fase = 2; c.t = 0; }
    else if (c.fase === 2 && c.t >= c.vida) { c.fase = 3; c.t = 0; }
    else if (c.fase === 3 && c.t >= 0.6) { carriles.splice(i, 1); continue; }
    if (c.fase !== 2 || state !== "play" || paused) continue;
    if (player.y > c.y - c.h / 2 && player.y < c.y + c.h / 2) {
      if (c.damageCd <= 0) { golpe(); c.damageCd = 0.7; if (state !== "play") return; }
    }
    if (c.damageCd > 0) c.damageCd -= dt;
  }
}
function dibujarCarriles() {
  for (const c of carriles) {
    ctx.save();
    if (c.fase === 0) {
      const k = c.t / 0.85;
      ctx.globalAlpha = 0.5 * k;
      ctx.strokeStyle = "#ff8a1f"; ctx.lineWidth = 2; ctx.setLineDash([10, 6]);
      ctx.beginPath(); ctx.moveTo(0, c.y - c.h / 2); ctx.lineTo(W, c.y - c.h / 2);
      ctx.moveTo(0, c.y + c.h / 2); ctx.lineTo(W, c.y + c.h / 2); ctx.stroke(); ctx.setLineDash([]);
    } else if (c.fase === 1) {
      ctx.globalAlpha = 0.4 + 0.4 * (c.t / 0.25);
      ctx.fillStyle = "rgba(255,140,20,0.5)"; ctx.fillRect(0, c.y - c.h / 2, W, c.h);
    } else if (c.fase === 2) {
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 70);
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createLinearGradient(0, c.y - c.h / 2, 0, c.y + c.h / 2);
      g.addColorStop(0, "rgba(255,80,0,0)"); g.addColorStop(0.5, "rgba(255,150,30," + (0.55 * pulse) + ")"); g.addColorStop(1, "rgba(255,80,0,0)");
      ctx.fillStyle = g; ctx.fillRect(0, c.y - c.h / 2, W, c.h);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 0.7; ctx.strokeStyle = "#ffcf5c"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, c.y - c.h / 2); ctx.lineTo(W, c.y - c.h / 2);
      ctx.moveTo(0, c.y + c.h / 2); ctx.lineTo(W, c.y + c.h / 2); ctx.stroke();
    } else {
      ctx.globalAlpha = (1 - c.t / 0.6) * 0.3;
      ctx.fillStyle = "rgba(255,100,20,0.4)"; ctx.fillRect(0, c.y - c.h / 2, W, c.h);
    }
    ctx.globalAlpha = 1; ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════
//  COLUMNA — franja VERTICAL telegrafiada (primitiva, bloque 5D)
// ════════════════════════════════════════════════════════════
//  La hermana vertical del carril de calor, y con las mismas cuatro
//  fases: AVISO → IGNICIÓN → ACTIVA → ENFRIANDO. El carril te obliga a
//  elegir altura; la columna, a elegir lado — que en un juego que se
//  mueve con el dedo en horizontal es la pregunta natural.
//
//  Es una PRIMITIVA, no un peligro de la fragua: el estilo solo cambia
//  el color y si suelta brasas. Un jefe que quiera barrer una franja
//  llama aquí y no se escribe nada nuevo.
//
//  NO toca ninguna coordenada del juego: mira dónde estás y hace daño,
//  con su enfriamiento propio para que estar dentro no sea morir de
//  golpe. Ni empuja, ni arrastra, ni te saca de donde has puesto el dedo.
let columnas = [];
const COLUMNAS_MAX = 4;
function spawnColumna(x, w, vida, estilo) {
  if (columnas.length >= COLUMNAS_MAX) return null;
  const c = { x: clamp(x, 30, W - 30), w: clamp(w || 92, 40, W * 0.6),
              t: 0, fase: 0, vida: vida || 2.2, estilo: estilo || "luz",
              damageCd: 0, chispaAcc: 0 };
  columnas.push(c);
  return c;
}
function actualizarColumnas(dt) {
  for (let i = columnas.length - 1; i >= 0; i--) {
    const c = columnas[i]; c.t += dt;
    if (c.fase === 0 && c.t >= 0.95) {
      c.fase = 1; c.t = 0;
      const esColada = c.estilo === "colada";
      sfx(esColada ? "fuego_ignicion" : "emp", { vol: 0.75 });
      sacudir("tiny");
    } else if (c.fase === 1 && c.t >= 0.25) { c.fase = 2; c.t = 0; }
    else if (c.fase === 2 && c.t >= c.vida) { c.fase = 3; c.t = 0; }
    else if (c.fase === 3 && c.t >= 0.6) { columnas.splice(i, 1); continue; }
    if (c.fase !== 2 || state !== "play" || paused) continue;
    // Brasas: pocas y con freno propio. El presupuesto de partículas es
    // el mismo de siempre y VFX ya descarta lo que no cabe; esto es para
    // no llamar mil veces a que le digan que no.
    c.chispaAcc += dt;
    if (c.chispaAcc >= 0.09) {
      c.chispaAcc = 0;
      const col = c.estilo === "colada" ? "#ff9a2f" : T_COLUMNA_LUZ();
      VFX.chispas(c.x + rand(-c.w * 0.4, c.w * 0.4), H - rand(0, H * 0.9), 2, col, 40);
    }
    if (Math.abs(player.x - c.x) < c.w / 2 + hitR() * 0.5) {
      if (c.damageCd <= 0) { golpe(); c.damageCd = 0.75; if (state !== "play") return; }
    }
    if (c.damageCd > 0) c.damageCd -= dt;
  }
}
const T_COLUMNA_LUZ = () => (T && T.nave) || "#8fd8ff";
function dibujarColumnas() {
  for (const c of columnas) {
    const lava = c.estilo === "colada";
    const col = lava ? "#ff8a1f" : T_COLUMNA_LUZ();
    const x0 = c.x - c.w / 2;
    ctx.save();
    if (c.fase === 0) {
      const k = c.t / 0.95;
      ctx.globalAlpha = 0.5 * k;
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([10, 6]);
      ctx.beginPath();
      ctx.moveTo(x0, 0); ctx.lineTo(x0, H);
      ctx.moveTo(x0 + c.w, 0); ctx.lineTo(x0 + c.w, H);
      ctx.stroke(); ctx.setLineDash([]);
    } else if (c.fase === 1) {
      ctx.globalAlpha = 0.4 + 0.4 * (c.t / 0.25);
      ctx.fillStyle = lava ? "rgba(255,140,20,0.5)" : "rgba(140,216,255,0.4)";
      ctx.fillRect(x0, 0, c.w, H);
    } else if (c.fase === 2) {
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 70);
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createLinearGradient(x0, 0, x0 + c.w, 0);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(0.5, (lava ? "rgba(255,150,30," : "rgba(150,220,255,") + (0.5 * pulse) + ")");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(x0, 0, c.w, H);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 0.7; ctx.strokeStyle = lava ? "#ffcf5c" : "#dff2ff"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x0, 0); ctx.lineTo(x0, H);
      ctx.moveTo(x0 + c.w, 0); ctx.lineTo(x0 + c.w, H);
      ctx.stroke();
      // La boca de la colada, arriba y dentro del área segura: es de
      // donde cae, y verlo hace que la columna se lea como una causa y
      // no como una franja de color que ha salido sola.
      const sp = SPRITES["hz_colada"];
      if (lava && sp) {
        ctx.globalAlpha = 0.9;
        ctx.save(); ctx.translate(c.x, SAFE_TOP + 26);
        pintarSprite(sp, Math.min(c.w * 1.1, 96));
        ctx.restore();
      }
    } else {
      ctx.globalAlpha = (1 - c.t / 0.6) * 0.3;
      ctx.fillStyle = lava ? "rgba(255,100,20,0.4)" : "rgba(120,190,255,0.35)";
      ctx.fillRect(x0, 0, c.w, H);
    }
    ctx.globalAlpha = 1; ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════
//  OSCURIDAD — se apaga el escenario, NO el juego (primitiva, 5D)
// ════════════════════════════════════════════════════════════
//  Un velo con un claro alrededor de la nave. Dos reglas, y las dos son
//  de las que no se negocian:
//
//   1. Se pinta DESPUÉS del escenario y ANTES de la nave, los premios y
//      las balas. Por construcción, entonces, no puede apagar un
//      proyectil: lo que te mata se dibuja por encima del velo. Y los
//      telegráficos se repintan encima mientras hay oscuridad, porque un
//      aviso que no se ve es daño inevitable.
//   2. Tiene tope. `OSCURIDAD_MAX` deja siempre un cuarto de luz: a
//      oscuras del todo no se juega, se adivina.
//
//  Sube y baja con rampa: un apagón instantáneo se lee como un fallo del
//  juego, no como algo que pasa en el nivel.
const OSCURIDAD_MAX = 0.72;
let oscuro = { k: 0, obj: 0, t: 0, dur: 0 };
function oscurecer(nivel, dur) {
  const n = clamp(nivel == null ? 0.55 : nivel, 0, OSCURIDAD_MAX);
  if (n > 0 && oscuro.obj <= 0) sfx("core_offline", { vol: 0.55 });
  oscuro.obj = n; oscuro.dur = dur || 0; oscuro.t = 0;
}
function actualizarOscuridad(dt) {
  if (oscuro.dur > 0) {
    oscuro.t += dt;
    if (oscuro.t >= oscuro.dur) { oscuro.obj = 0; oscuro.dur = 0; }
  }
  const paso = 1.6 * dt;
  oscuro.k += clamp(oscuro.obj - oscuro.k, -paso, paso);
  if (oscuro.k < 0.004 && oscuro.obj <= 0) oscuro.k = 0;
}
const hayOscuridad = () => oscuro.k > 0.004 && state !== "menu";
function dibujarOscuridad() {
  const k = oscuro.k;
  if (k <= 0.004) return;
  ctx.save();
  const g = ctx.createRadialGradient(player.x, player.y, 54,
                                     player.x, player.y, Math.max(W, H) * 0.62);
  g.addColorStop(0, "rgba(2,3,10,0)");
  g.addColorStop(0.32, "rgba(2,3,10," + (k * 0.55).toFixed(3) + ")");
  g.addColorStop(1, "rgba(2,3,10," + k.toFixed(3) + ")");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ════════════════════════════════════════════════════════════
//  RUPTURA — una grieta abierta en el sitio (primitiva, 5D)
// ════════════════════════════════════════════════════════════
//  Estado, no arma: se abre, dura y se cierra, y mientras está ABIERTA
//  cualquiera puede preguntarle dónde está para salir de ahí. Eso es lo
//  que hace falta para una entrada, un portal o el fondo partiéndose;
//  lo que haga cada evento con ella es del evento, no de aquí.
//
//  No hace daño. Una grieta que además te mata al tocarla obligaría a
//  telegrafiarla como un ataque, y entonces ya no es un sitio: es un
//  proyectil grande.
let rupturas = [];
const RUPTURAS_MAX = 3;
function spawnRuptura(x, y, r, dur) {
  if (rupturas.length >= RUPTURAS_MAX) return null;
  const g = { x: clamp(x, 40, W - 40), y: clamp(y, SAFE_TOP + 60, H - 120),
              r: clamp(r || 92, 40, 220), t: 0, fase: 0, dur: dur || 4,
              sem: rand(0, TAU) };
  rupturas.push(g);
  sfx("gravedad_forma", { vol: 0.7 });
  return g;
}
function actualizarRupturas(dt) {
  for (let i = rupturas.length - 1; i >= 0; i--) {
    const g = rupturas[i]; g.t += dt;
    if (g.fase === 0 && g.t >= 0.6) { g.fase = 1; g.t = 0; }
    else if (g.fase === 1 && g.t >= g.dur) { g.fase = 2; g.t = 0; sfx("gravedad_colapso", { vol: 0.6 }); }
    else if (g.fase === 2 && g.t >= 0.5) { rupturas.splice(i, 1); continue; }
  }
}
// Lo que necesita quien la use: si hay alguna abierta y dónde.
const rupturaAbierta = () => rupturas.find(g => g.fase === 1) || null;
function dibujarRupturas() {
  for (const g of rupturas) {
    const k = g.fase === 0 ? g.t / 0.6 : g.fase === 2 ? 1 - g.t / 0.5 : 1;
    const r = g.r * (0.25 + 0.75 * k);
    const col = (T && T.bgColor) || "#c9a8ff";
    ctx.save();
    ctx.translate(g.x, g.y);
    // El hueco: negro de verdad, no un agujero transparente. Lo que se
    // ve por una grieta no es el fondo del nivel.
    ctx.globalAlpha = 0.85 * k;
    ctx.fillStyle = "#04030a";
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.42, r, 0, 0, TAU); ctx.fill();
    // El filo, en polígono roto y no en elipse limpia: una grieta que es
    // una elipse perfecta parece un portal de menú.
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = (0.5 + 0.4 * Math.abs(Math.sin(performance.now() / 260 + g.sem))) * k;
    ctx.strokeStyle = col; ctx.lineWidth = 2.2;
    ctx.beginPath();
    const n = 14;
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * TAU;
      const rr = (1 + Math.sin(a * 3 + g.sem) * 0.14 + Math.sin(a * 7 + g.sem * 2) * 0.07);
      const px = Math.cos(a) * r * 0.42 * rr, py = Math.sin(a) * r * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.stroke();
    ctx.globalAlpha = 0.22 * k;
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.restore();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
}

// ════════════════════════════════════════════════════════════
//  SISTEMAS ALPHA/BETA/GAMMA — mecánica firma de M9 (CORE ACCESS)
// ════════════════════════════════════════════════════════════
//  Tres nodos destructibles que cambian el nivel de verdad al caer, no
//  solo dan puntos. ALPHA apaga las torretas de escenario. BETA quita
//  el escudo de flota (los enemigos dejan de encajar el 45% de menos
//  daño). GAMMA para los refuerzos que manda llamar cada pocos segundos.
let sistemas = [], gammaAcc = 0;
function spawnSistemas() {
  sistemas.length = 0;
  const y = SAFE_TOP + H * 0.11;
  const specs = [
    { id: "alpha", x: W * 0.22, col: "#ff5c5c", nombre: "ALPHA", hp: 26 },
    { id: "beta",  x: W * 0.5,  col: "#5cc8ff", nombre: "BETA",  hp: 30 },
    { id: "gamma", x: W * 0.78, col: "#ffe066", nombre: "GAMMA", hp: 26 },
  ];
  for (const s of specs) sistemas.push(Object.assign({ y, r: 26, hpMax: s.hp, flash: 0, vivo: true }, s));
  sfx("reactor");   // el núcleo de M9 arrancando: subgrave, sin melodía
  RHYTHM.marcar();
}
function actualizarSistemas(dt) {
  if (sistemaGamma && sistemas.some(s => s.vivo) && state === "play" && !paused) {
    gammaAcc += dt;
    if (gammaAcc >= 4.2) { gammaAcc = 0; spawnFormacion("dron_ataque", 2, "pinza"); }
  }
  for (const s of sistemas) {
    if (!s.vivo) continue;
    if (s.flash > 0) s.flash -= dt;
    if (state !== "play" || paused) continue;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.cd > 0) continue;
      const dx = b.x - s.x, dy = b.y - s.y;
      if (dx * dx + dy * dy >= (b.r + s.r) ** 2) continue;
      s.hp -= b.dmg; s.flash = 0.1; bulletsHit++;
      const gastada = golpearCon(b, b.x, b.y, null);
      if (gastada) soltarBala(j);
      if (s.hp <= 0) {
        s.vivo = false;
        muerte(s.x, s.y, s.col, "defensa");
        sfx("core_offline");
        texto(s.x, s.y - 40, s.nombre + " OFFLINE", s.col, 15);
        if (s.id === "alpha") sistemaAlpha = false;
        if (s.id === "beta") sistemaBeta = false;
        if (s.id === "gamma") sistemaGamma = false;
        alMatar({ fuente: "sistema", tipo: s.id, puntosBase: 400, posicion: { x: s.x, y: s.y },
          opciones: { combo: false, texto: false } });
      }
      break;
    }
  }
}
function dibujarSistemas() {
  for (const s of sistemas) {
    if (!s.vivo) continue;
    ctx.save(); ctx.translate(s.x, s.y);
    if (s.flash > 0) ctx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 35);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = (i / 6) * TAU; ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * s.r, Math.sin(a) * s.r); }
    ctx.closePath();
    ctx.fillStyle = mezcla(s.col, TINTA, 0.35); ctx.fill();
    ctx.strokeStyle = s.col; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
    const bw = s.r * 2, bh = 4, bx = s.x - bw / 2, by = s.y - s.r - 12;
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    ctx.fillStyle = s.col; ctx.fillRect(bx, by, bw * (s.hp / s.hpMax), bh);
    ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "700 9px " + F; ctx.globalAlpha = 0.7;
    ctx.fillText(s.nombre, s.x, by - 8); ctx.globalAlpha = 1;
  }
}

// Si pones PNG de enemigos en cualquiera de las carpetas, se recogen solos.

//  Retrasar la petición con un `setTimeout` NO basta: con la conexión
//  saturada, el navegador reparte el ancho de banda entre todo lo que
//  ya ha pedido sin respetar el orden, así que una petición 60 ms más
//  tarde sigue robándole bytes por segundo al power-up que la sigue
//  esperando. Medido: con el retraso, el mismo caso seguía tardando
//  más de 14 s. La única forma de que la expansión no le quite ni un
//  byte a M1-M10 es que la partida NUNCA la pida — bajo demanda, como
//  ya hacen los fondos (`asegurarFondo`) y las naves (`asegurarSprites`):
//  `spawnEnemy`, `spawnHazard` y `spawnMiniboss` piden su propio sprite
//  la primera vez que hace falta, y ninguna misión M1-M10 llama a esas
//  funciones con un tipo de la expansión, así que en una partida
//  normal esta carga no se dispara NUNCA.
function asegurarSpriteEnemigo(tipo) {
  const d = ENEMIGOS[tipo];
  if (!d || d.interno || SPRITES["e_" + tipo]) return;
  cargarSprite("e_" + tipo, buscar("enemigos", tipo + ".png"));
}
function asegurarSpriteHazard(tipo) {
  const d = HAZARD_TIPOS[tipo];
  if (!d) return;
  const archivo = { asteroide: "asteroide", cristal: "cristal_hielo", tempano: "tempano",
    trafico: "trafico_a", mina_bio: "mina_bio", fragmento: "fragmento" }[tipo];
  if (archivo && !SPRITES["hz_" + tipo]) cargarSprite("hz_" + tipo, buscar("hazards", archivo + ".png"));
  // `asteroide` y `trafico` alternan entre dos dibujos (`h.alt`) para no
  // leerse como un patrón repetido. El segundo va con el mismo pedido.
  if (tipo === "asteroide" && !SPRITES.hz_asteroide2) cargarSprite("hz_asteroide2", buscar("hazards", "asteroide2.png"));
  if (tipo === "trafico" && !SPRITES.hz_trafico2) cargarSprite("hz_trafico2", buscar("hazards", "trafico_b.png"));
}
function asegurarSpriteJefe(tipo) {
  if (!JEFES[tipo] || SPRITES["bs_" + tipo]) return;
  cargarSprite("bs_" + tipo, buscar("bosses", tipo + ".png"));
}

// ── Persistencia ─────────────────────────────────────────
//  El sistema vive en js/save.js. Aquí solo quedan la carga inicial y
//  los atajos que usa el juego. Si el archivo faltara, `hayGuardado` es
//  false y todo lo demás sigue funcionando sin recordar nada.
const hayGuardado = typeof SAVE !== "undefined";

// `misionIdx` es la misión ELEGIDA. `misionMax` es la máxima
// DESBLOQUEADA. Antes eran la misma variable, y por eso rejugar la M1
// con diez desbloqueadas volvía a bloquear de la M5 a la M10: al
// terminarla se guardaba misionIdx+1 = 1 como progreso.
let misionMax = 0;

function guardarOpciones() {
  if (hayGuardado) SAVE.set("opciones", OPCIONES, "ajustes");
  aplicarVolumenes();
}
// Se guarda el ID y no el índice: las naves que carga el jugador se
// añaden al final de NAVES y mueven los índices de todo lo demás.
// ── Cuántas misiones ha completado este jugador ────────────
//
//  `misionMax` no sirve para responder esto: es el ÍNDICE de la última
//  misión abierta y está topado en la última que existe, así que
//  terminar la campaña deja un 9 idéntico al que deja tenerla abierta
//  sin haberla ganado.
//
//  Y `MISIONES.length` tampoco, que es el error que este bloque viene a
//  cerrar: significa "todo lo que hay AHORA". Usarlo para traducir
//  "terminó su campaña" convierte a cualquiera que se pasó las diez
//  misiones en alguien que se ha pasado las veinte, y le regala todo lo
//  que la expansión pida por progreso sin haberlo jugado. Contenido
//  regalado no se puede retirar.
//
//  Así que se responde por hitos, cada uno contra su propia constante:
//  la campaña base vale MISIONES_BASE, la expansión vale el total, y
//  quien no ha terminado ninguna vale lo que tenga abierto.
function misionesCompletadas() {
  if (!hayGuardado) return misionMax;
  if (SAVE.get("campana.completadaExp", false)) return MISIONES.length;
  if (SAVE.get("campana.completadaBase", false)) return Math.max(MISIONES_BASE, misionMax);
  return misionMax;
}

function guardarNave() {
  if (hayGuardado && NAVES[naveSel]) SAVE.set("naves.seleccionada", NAVES[naveSel].id, "nave");
}

// Carga inicial
{
  // `base` es cuántas misiones son la campaña BASE. SAVE lo necesita
  // para abrirle la expansión a quien ya la terminó, y se le pasa en vez
  // de que lo deduzca: deducirlo de la tabla es justo el error que se
  // está cerrando.
  const s = hayGuardado ? SAVE.init({ opciones: OPCIONES, base: MISIONES_BASE }) : null;
  aplicarGuardado(s);
  // ADMIN cambia la CLAVE de guardado, no el juego: cuando lo hace, hay
  // que releer y reaplicar exactamente igual que en el arranque. Se le
  // entrega esta misma función para que no tenga que saber nada de
  // `best`, `misionMax`, `NAVES` ni `OPCIONES`.
  if (typeof ADMIN !== "undefined") ADMIN.conectar(aplicarGuardado);
}

// Aplica un save YA CARGADO al estado del juego. Se llama al arrancar y
// cada vez que se entra o se sale de Admin.
function aplicarGuardado(s) {
  if (s) {
    best = s.perfil.record;
    T = TEMAS.find(t => t.id === s.campana.temaId) || TEMAS[0];

    // ── Nave equipada ──
    //  El id guardado puede ser antiguo ("kali", "yoli"…). Se traduce al
    //  chasis con la tabla de alias, y SIN reescribir el save: el id
    //  nuevo se graba solo la próxima vez que el jugador cambie de nave.
    //  Así un save viejo sigue siendo válido y se puede volver atrás.
    const guardada = s.naves.seleccionada;
    const equipada = SHIPS.resolver(guardada) || "chassis_01";
    // CONCESIÓN RETROACTIVA. Quien ya se pasó la M8 no puede encontrarse
    // con tres chasis bloqueados por haber actualizado el juego. Se
    // concede en silencio —cuatro avisos de golpe al abrir serían ruido,
    // no recompensa— e incluye SIEMPRE la que llevara equipada.
    misionMax = Math.min(s.campana.misionMax, MISIONES.length - 1);
    SHIPS.otorgarPorProgreso(misionesCompletadas(), equipada, false);
    SHIPS.otorgarSkinsPorProgreso(misionesCompletadas(), false);
    SHIPS.otorgarEmblemasPorProgreso(misionesCompletadas(), false);
    NAVES = SHIPS.construir(equipada, SAVE.get("naves.desbloqueadas", []));
    // Si la que llevaba está bloqueada (no debería pasar hoy, pero un
    // save manipulado o un chasis que cambie de requisito sí podría), se
    // cae al primero disponible en vez de dejar al jugador con una nave
    // que el juego considera que no tiene.
    let ni = NAVES.findIndex(n => n.id === equipada && !n.bloqueada);
    if (ni < 0) ni = NAVES.findIndex(n => !n.bloqueada);
    naveSel = ni >= 0 ? ni : 0;
    nvIdx = -1; trIdx = -1; spIdx = -1;                   // la tabla es nueva: la caché ya no vale

    // La tabla puede haber cambiado —entrar o salir de Admin la rehace—,
    // así que se piden los sprites que falten. Es idempotente.
    asegurarSprites(NAVES);

    misionMax = Math.min(s.campana.misionMax, MISIONES.length - 1);
    misionIdx = Math.min(s.campana.misionIdx, misionMax);
    campaignCompleted = s.campana.completada;
    campaignStats = s.campana.stats;
    campaignCompletedExp = s.campana.completadaExp;
    campaignStatsExp = s.campana.statsExp;
    for (const k of Object.keys(OPCIONES)) {
      if (s.opciones[k] !== undefined) OPCIONES[k] = s.opciones[k];
    }
  } else {
    T = TEMAS[0];
    NAVES = SHIPS.construir("chassis_01", []);
    naveSel = 0; nvIdx = -1; trIdx = -1; spIdx = -1;
  }
  // Un guardado corrupto no puede dejar el juego mudo sin que se note:
  // los volúmenes se acotan a [0,1] y, si el general o el de efectos
  // llegan a cero, se levantan al valor de fábrica. Bajarlos a mano
  // desde AJUSTES sí funciona — eso es una decisión del jugador, y se
  // guarda después de esta comprobación.
  OPCIONES.volMaster = clamp(Number(OPCIONES.volMaster) || 0, 0, 1);
  OPCIONES.volSfx    = clamp(Number(OPCIONES.volSfx)    || 0, 0, 1);
  OPCIONES.volMusica = clamp(Number(OPCIONES.volMusica) || 0, 0, 1);
  if (OPCIONES.volMaster <= 0) OPCIONES.volMaster = 0.9;
  if (OPCIONES.volSfx <= 0) OPCIONES.volSfx = 0.9;
  if (OPCIONES.calidad !== "auto") Q = CALIDADES[OPCIONES.calidad] || CALIDADES.alta;
  resolverDificultad();
}

function spawnFormacion(tipo, n, patron, marca, olaGen) {
  const fn = FORMACIONES[patron] || FORMACIONES.linea;
  const poss = fn(n);
  for (const p of poss) {
    spawnQueue.push({ tipo, x: p.x, y: p.y, at: elapsed + p.d, marca, olaGen });
  }

// ════════════════════════════════════════════════════════════
//  BONUS EVENTS — eventos cortos reutilizables
// ════════════════════════════════════════════════════════════
//  No son una misión aparte: son un paréntesis de 9-16 s dentro de la
//  que ya se está jugando. Uno cada vez, con banner, objetivo y reloj
//  visibles, y un final claro -LOGRADO o FALLIDO-, nunca ambiguo. El
//  RHYTHM DIRECTOR los dispara cuando ve que se acerca un hueco (ver
//  `rhythmDirectorTick()`); una misión también puede pedirlos a mano
//  con `procesarEvento({ fn: "bonus", tipo: "..." })`.
const BONUS_EVENTOS = {
  bonus_wave:  { nombre: "BONUS WAVE",        duracion: 14, objetivo: 8, premio: 900,  color: "#ffd700", escapeFalla: false },
  convoy:      { nombre: "TREASURE CONVOY",   duracion: 16, objetivo: 5, premio: 1200, color: "#7effc4", escapeFalla: true  },
  dorado:      { nombre: "GOLDEN TARGET",     duracion: 9,  objetivo: 1, premio: 1500, color: "#ffb800", escapeFalla: true  },
  formacion:   { nombre: "PERFECT FORMATION", duracion: 12, objetivo: 0, premio: 1100, color: "#7df9ff", escapeFalla: true  },
  riesgo:      { nombre: "RISK GATE",         duracion: 10, objetivo: 0, premio: 1600, color: "#ff5c8a", escapeFalla: false },
};
let bonusEvento = null;
let bonusEventoGen = 0;

function iniciarBonusEvento(tipo, opciones) {
  if (bonusEvento && bonusEvento.estado === "activo") return null;   // uno cada vez: no se solapan
  const d = BONUS_EVENTOS[tipo];
  if (!d || state !== "play") return null;
  opciones = opciones || {};
  bonusEventoGen++;
  bonusEvento = {
    tipo, nombre: d.nombre, color: d.color, premio: d.premio, escapeFalla: d.escapeFalla,
    gen: bonusEventoGen, t: 0, duracion: d.duracion,
    objetivo: opciones.objetivo != null ? opciones.objetivo : d.objetivo,
    progreso: 0, estado: "activo", finT: 0,
  };
  UI.desbloqueo({ tipo: "bonus", titulo: d.nombre, desc: opciones.desc || "", color: d.color });
  sfx("aviso");
  RHYTHM.marcar();

  if (tipo === "bonus_wave") {
    spawnFormacion(opciones.enemigo || "veloz", bonusEvento.objetivo, opciones.patron || "ola", bonusEventoGen);
  } else if (tipo === "convoy") {
    const n = bonusEvento.objetivo;
    for (let i = 0; i < n; i++) {
      const e = spawnEnemy("tanque", W * (0.2 + 0.6 * i / Math.max(1, n - 1)));
      e.esConvoy = true; e.bonusGen = bonusEventoGen;
    }
  } else if (tipo === "dorado") {
    const e = spawnEnemy(opciones.enemigo || "kamikaze", W / 2);
    e.dorado = true; e.bonusGen = bonusEventoGen;
  } else if (tipo === "formacion") {
    const n = opciones.n || 6;
    bonusEvento.objetivo = n;
    spawnFormacion(opciones.enemigo || "normal", n, opciones.patron || "V", bonusEventoGen);
  } else if (tipo === "riesgo") {
    bonusEvento.hazardPrevio = hazardEnabled;
    hazardEnabled = true;
  }
  return bonusEvento;
}

// Un enemigo marcado (`e.bonusGen`) ha muerto: cuenta para el evento
// activo si sigue siendo el mismo (un evento viejo no puede sumarle
// progreso a uno nuevo que ya empezó).
function bonusEventoMuerte(e) {
  if (!bonusEvento || bonusEvento.estado !== "activo" || e.bonusGen !== bonusEvento.gen) return;
  bonusEvento.progreso++;
  if (bonusEvento.progreso >= bonusEvento.objetivo) finalizarBonusEvento(true);
}
// Un enemigo marcado se ha ido de pantalla vivo: para los tipos donde
// escapar es fallo (convoy, dorado, formación), se acabó ahí mismo.
function bonusEventoEscape(e) {
  if (!bonusEvento || bonusEvento.estado !== "activo" || e.bonusGen !== bonusEvento.gen) return;
  if (bonusEvento.escapeFalla) finalizarBonusEvento(false);
}
function finalizarBonusEvento(exito) {
  if (!bonusEvento || bonusEvento.estado !== "activo") return;
  bonusEvento.estado = exito ? "exito" : "fallo";
  bonusEvento.finT = 1.8;
  if (bonusEvento.tipo === "riesgo" && hazardEnabled && !bonusEvento.hazardPrevio) hazardEnabled = false;
  if (exito) {
    const premio = Math.round(bonusEvento.premio * DIF.scoreMul);
    score += premio;
    texto(W / 2, H * 0.4, bonusEvento.nombre + " ¡LOGRADO! +" + premio, bonusEvento.color, 18, { prioridad: 2 });
    onda(W / 2, H * 0.4, bonusEvento.color, 140, 0.5);
    sfx("combo", { tono: 1.3 });
    cargarOverdrive(15);
    // PERFECT FORMATION es el disparador de jackpot que pide el encargo
    // -las otras cuatro ya tienen su propio premio arriba y no lo necesitan-.
    if (bonusEvento.tipo === "formacion") jackpot(W / 2, H * 0.34);
  } else {
    texto(W / 2, H * 0.4, bonusEvento.nombre + " FALLIDO", "#8a8a9a", 15, { prioridad: 1 });
    sfx("ui_no");
  }
  RHYTHM.marcar();
}
// Tick del propio evento: caducidad, cierre de RISK GATE por tiempo
// cumplido (aquí SÍ es éxito: sobrevivir la ventana es el objetivo) y
// limpieza del banner una vez mostrado el resultado.
function actualizarBonusEvento(dt) {
  if (!bonusEvento || state !== "play" || paused) return;
  bonusEvento.t += dt;
  if (bonusEvento.estado === "activo") {
    if (bonusEvento.tipo === "riesgo" && bonusEvento.t >= bonusEvento.duracion) finalizarBonusEvento(true);
    else if (bonusEvento.t >= bonusEvento.duracion) finalizarBonusEvento(false);
  } else if (bonusEvento.finT > 0) {
    bonusEvento.finT -= dt;
    if (bonusEvento.finT <= 0) bonusEvento = null;
  }
}

// ── El Director en vivo ────────────────────────────────────
//  No decide el guión de la misión: lo vigila. Si el hueco actual ya
//  lleva el 70 % del umbral de RHYTHM y la pantalla está VACÍA de
//  verdad -sin enemigos, sin nada en camino, sin jefe- interviene ANTES
//  de que el hueco se note, con un Bonus Event al azar. Un enfriamiento
//  largo evita que dos salgan pegados: eso seguiría siendo relleno, no
//  ritmo.
let rhythmDirectorCooldownT = 0;
// Ventana que una misión puede abrir con `{ fn: "descansoOn" }` cuando el
// guión deja un silencio LARGO A PROPÓSITO antes de un aviso de jefe -hay
// siete en la campaña, ver AUDITORIA-BLOQUE6.md-. Sin esto, el Director
// rellenaría exactamente el silencio que el guión quiso dejar. No hace

// bloquea al Director por su cuenta.
let descansoDeliberado = false;
function rhythmDirectorTick(dt) {

  if (rhythmDirectorCooldownT > 0) rhythmDirectorCooldownT -= dt;
  if (bonusEvento || miniboss || rhythmDirectorCooldownT > 0 || descansoDeliberado) return;
  if (elapsed < 8 || enemies.length > 0 || spawnQueue.length > 0) return;
  const hueco = elapsed - RHYTHM.ultimo;
  if (hueco <= RHYTHM.UMBRAL * 0.7) return;
  const tipos = Object.keys(BONUS_EVENTOS);
  const tipo = tipos[(Math.random() * tipos.length) | 0];
  if (iniciarBonusEvento(tipo)) rhythmDirectorCooldownT = 45;
}

// ════════════════════════════════════════════════════════════
//  SKILL EVENTS — reconocer que has hecho algo bien
// ════════════════════════════════════════════════════════════
//  Cinco, no más: CLOSE CALL, PERFECT WAVE, CHAIN KILL, FAST BREAK,
//  NO HIT BOSS. Cada uno da score, cuenta para el combo/Overdrive
//  (Overdrive llega en 6F; el contador ya vive aquí para que ese
//  bloque no tenga que tocar este) y feedback audiovisual — nunca
//  ELOI directo grande, según el encargo del bloque.
const SKILL_EVENTOS = {
  cierre:       { nombre: "CLOSE CALL",   premio: 60,  color: "#7effc4" },
  ola_perfecta: { nombre: "PERFECT WAVE", premio: 250, color: "#7df9ff" },
  cadena:       { nombre: "CHAIN KILL",   premio: 150, color: "#ffd700" },
  fulminante:   { nombre: "FAST BREAK",   premio: 200, color: "#ff8a1f" },
  sin_golpe:    { nombre: "NO HIT BOSS",  premio: 800, color: "#ffcf5c" },
};
let skillEventos = { cierre: 0, ola_perfecta: 0, cadena: 0, fulminante: 0, sin_golpe: 0 };
// CLOSE CALL: anillo alrededor del radio real de impacto. 1 = tocar,
// así que esto es "pasar a un pelo" sin llegar a rozar.
const CERCA_MULT = 1.8;
function skillEvent(tipo, x, y) {
  const d = SKILL_EVENTOS[tipo];
  if (!d) return;
  skillEventos[tipo] = (skillEventos[tipo] || 0) + 1;
  const premio = Math.round(d.premio * DIF.scoreMul);
  score += premio;
  const px = x != null ? x : player.x, py = y != null ? y : player.y - 40;
  texto(px, py, d.nombre, d.color, 15, { prioridad: 2 });
  onda(px, py, d.color, 60, 0.3);
  sfx("combo", { tono: 1.15 });
  RHYTHM.marcar();
  cargarOverdrive(10);
  return skillEventos[tipo];
}

// ── CHAIN KILL / cadena de élites ──────────────────────────
//  Ventanas móviles de timestamps: si N muertes caen dentro de la
//  ventana, se dispara. Vive aquí, no en `alMatar()`, para que ese
//  embudo siga siendo solo score/combo y esto sea un consumidor más.
const CADENA_VENTANA = 1.0, CADENA_OBJETIVO = 4;
let cadenaTiempos = [];
const ELITE_CADENA_VENTANA = 4.0;
let eliteChainT = -99;

// ── FAST BREAK / PERFECT WAVE: seguimiento de oleadas ──────
//  Cada `{ fn:"ola" }` del guión (procesarEvento) abre una entrada
//  aquí con cuántos enemigos trae y cuándo nació el primero. matar()
//  y la fuga por abajo de pantalla la cierran. Si se cierra sola —sin
//  que nadie escapara— y rápido, FAST BREAK; si se cierra sin que el
//  jugador recibiera un golpe mientras tanto, PERFECT WAVE. Las dos
//  cosas a la vez cuentan como FAST BREAK, que es la más exigente.
const FAST_BREAK_UMBRAL = 6;
const OLAS_MAX = 30;   // tope defensivo: nunca debería hacer falta, pero no crece sin límite
let olaGenSeq = 0;
let olas = new Map();
function abrirOla(n) {
  const gen = ++olaGenSeq;
  olas.set(gen, { restantes: n, t0: elapsed, sinDanio: true, escapo: false });
  if (olas.size > OLAS_MAX) olas.delete(olas.keys().next().value);
  return gen;
}
function cerrarOla(gen, x, y, escapo) {
  const w = olas.get(gen);
  if (!w) return;
  w.restantes--;
  // Basta con que UNO de la ola escape para que ninguno de los dos
  // eventos cuente, aunque el que cierra la ola a cero sea otro que sí
  // se mató: `w.escapo` recuerda toda la vida de la ola, no solo esta
  // llamada.
  if (escapo) w.escapo = true;
  if (w.restantes > 0) return;
  olas.delete(gen);
  if (w.escapo) return;
  const dur = elapsed - w.t0;
  if (dur <= FAST_BREAK_UMBRAL) skillEvent("fulminante", x, y);
  else if (w.sinDanio) skillEvent("ola_perfecta", x, y);
}

// ════════════════════════════════════════════════════════════
//  JACKPOT
// ════════════════════════════════════════════════════════════
//  Momentos raros: hito de combo alto, PERFECT FORMATION, cadena de
//  élites, romper una pieza de jefe. No relleno — "no abusar" es
//  literal en el encargo, así que cada disparador vive donde ya
//  ocurre su condición, no en un temporizador propio.
function jackpot(x, y) {
  jackpotsCount++;

  onda(x, y, "#ffd700", 160, 0.6);

// ════════════════════════════════════════════════════════════
//  DROPS FÍSICOS — shards
// ════════════════════════════════════════════════════════════
//  Distintos de PREMIOS (power-ups, elección estratégica, raros):
//  los shards son la lluvia visible de recompensa, pooled y con tope
//  duro propio -PREMIOS no lo tenía y no hacía falta con su volumen;
//  aquí sí, porque un jefe puede soltar veinte de golpe-. El imán
//  reutiliza el mismo alcance/velocidad que ya usan los premios.
const SHARDS_MAX = 60;
let shards = [];
let shardsLibres = [];
function soltarShard(x, y, tipo) {
  if (shards.length >= SHARDS_MAX) return;
  const s = shardsLibres.pop() || {};
  if (shards.indexOf(s) < 0) shards.push(s);
  s.x = x + rand(-14, 14); s.y = y + rand(-10, 10);
  s.vx = rand(-40, 40); s.vy = rand(-90, -30);
  s.tipo = tipo; s.t = 0; s.vida = 3.2; s.r = tipo === "energia" ? 5 : 4;
}
// Jerarquía de la lluvia: cuántos shards y de qué tipo según lo que ha
// muerto. `energia` está reservado para Overdrive (6F) — hoy ya
// premia con score, así que soltarlos desde ya no espera a ese bloque.
const LLUVIA_SHARDS = {
  normal:   [2, 0],
  elite:    [4, 1],
  miniboss: [10, 3],
  boss:     [22, 8],
};
function lluviaShards(x, y, nivel) {
  const [nScore, nEnergia] = LLUVIA_SHARDS[nivel] || LLUVIA_SHARDS.normal;
  for (let i = 0; i < nScore; i++) soltarShard(x, y, "score");
  for (let i = 0; i < nEnergia; i++) soltarShard(x, y, "energia");
}
function cogerShard(s) {
  const premio = Math.round((s.tipo === "energia" ? 8 : 6) * DIF.scoreMul);
  score += premio;
  sfx("pickup", { vol: 0.5 });
  vfx("chispa", s.x, s.y, 30, 0.18);
}
function actualizarShards(dt) {
  if (state !== "play" || paused || upgradesOfrecidos) return;
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.t += dt;
    const dx = player.x - s.x, dy = player.y - s.y;
    const d = Math.hypot(dx, dy) || 1;
    const magnetUp = upgradesJugador.magnet_field || 0;
    const alcance = imanT > 0 ? 520 : 140 + magnetUp * 80;
    if (d < alcance) {
      const vel = imanT > 0 ? 500 : (300 + magnetUp * 80);
      s.x += (dx / d) * vel * dt; s.y += (dy / d) * vel * dt;
    } else {
      s.vy += 220 * dt; s.vx *= Math.max(0, 1 - dt * 1.5);
      s.x += s.vx * dt; s.y += s.vy * dt;
    }
    if (d < 20) { cogerShard(s); shardsLibres.push(s); shards.splice(i, 1); continue; }
    if (s.t >= s.vida || s.y > H + 30) { shardsLibres.push(s); shards.splice(i, 1); }
  }
}
function dibujarShards() {
  for (const s of shards) {
    const col = s.tipo === "energia" ? "#5cc8ff" : "#ffd700";
    const alfa = Math.min(1, (s.vida - s.t) * 2);
    ctx.save();
    ctx.globalAlpha = alfa;
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════
//  OVERDRIVE
// ════════════════════════════════════════════════════════════
//  Se carga con kills, combo, skill events, élites, boss break y
//  bonus events -todo pasa por `cargarOverdrive()`, un único sitio,
//  igual que el resto del bloque-. El daño recibido la reduce: en
//  carga, de golpe; ya activa, le recorta segundos en vez de matarla
//  del todo, porque cortar en seco un momento que el jugador acaba de
//  activar a mano se siente peor que acortarlo.

//  NO es invencibilidad: las balas enemigas siguen matando igual que
//  siempre (nada aquí toca `golpe()` ni `hitR()`) y se siguen viendo
//  igual de claras -el aura de la nave no las tapa, ver dibujarJugador()-.
const OVERDRIVE_MAX = 100;

function cargarOverdrive(cantidad) {
  if (overdriveActivo > 0 || state !== "play") return;
  const antes = overdrive;
  // OVERDRIVE BOOST: +25%/nivel a TODA carga, del origen que sea.

function activarOverdrive() {
  if (overdrive < OVERDRIVE_MAX || overdriveActivo > 0 || state !== "play") return false;
  overdrive = 0;
  overdrivesActivados++;
  // OVERDRIVE BOOST: +2s de duración por nivel.
  overdriveDuracionActual = OVERDRIVE_DURACION + (upgradesJugador.overdrive_boost || 0) * 2;
  overdriveActivo = overdriveDuracionActual;
  sacudir("medium"); hitstop(0.06);
  onda(player.x, player.y, "#ff2fbd", 130, 0.5);
  texto(player.x, player.y - 55, "¡OVERDRIVE!", "#ff2fbd", 22, { prioridad: 2 });
  sfx("ultimate", { tono: 1.2 });
  RHYTHM.marcar();

}
// Ganchos de ADMIN/depuración -mismo nombre que pide el encargo-, para
// probar el bloque sin tener que ganárselo jugando cada vez.
function fillOverdrive() { overdrive = OVERDRIVE_MAX; }
function activateOverdrive() { return activarOverdrive(); }

// ════════════════════════════════════════════════════════════
//  UPGRADES DURANTE PARTIDA
// ════════════════════════════════════════════════════════════
//  Build TEMPORAL: vive en `upgradesJugador` (id -> nivel), no en el
//  save — se pierde al terminar la misión, a propósito, es la misma
//  razón por la que un roguelite funciona. Cada upgrade es un dato,
//  no una clase: `efecto` se lee en el puñado de chokepoints que ya
//  existían (disparar(), nuevaBala(), golpe(), alMatar()...) en vez de
//  inventar un sistema de proyectiles nuevo por cada uno.
const UPGRADES = {
  triple_shot:     { nombre: "TRIPLE SHOT",     desc: "+2 disparos laterales.",              rareza: "comun", maxNivel: 2, tags: ["ofensivo", "lateral"],  peso: 10 },
  rapid_core:      { nombre: "RAPID CORE",      desc: "Cadencia bastante más rápida.",       rareza: "comun", maxNivel: 2, tags: ["ofensivo"],             peso: 10 },
  heavy_core:      { nombre: "HEAVY CORE",      desc: "Más daño por disparo.",                rareza: "comun", maxNivel: 2, tags: ["ofensivo"],             peso: 10 },
  chain_lightning: { nombre: "CHAIN LIGHTNING", desc: "El disparo salta a otro enemigo.",     rareza: "raro",  maxNivel: 2, tags: ["ofensivo", "cadena"],   peso: 7 },
  missile_swarm:   { nombre: "MISSILE SWARM",   desc: "6 misiles cada 8 s.",                  rareza: "raro",  maxNivel: 2, tags: ["ofensivo", "autonomo"], peso: 7 },
  plasma_burst:    { nombre: "PLASMA BURST",    desc: "Explosión al matar.",                  rareza: "raro",  maxNivel: 2, tags: ["ofensivo", "area"],     peso: 6 },
  shield_reactor:  { nombre: "SHIELD REACTOR",  desc: "El escudo se regenera solo.",          rareza: "raro",  maxNivel: 2, tags: ["defensivo"],            peso: 8 },
  magnet_field:    { nombre: "MAGNET FIELD",    desc: "Imán permanente, más alcance.",        rareza: "comun", maxNivel: 2, tags: ["utilidad"],             peso: 9 },
  overdrive_boost: { nombre: "OVERDRIVE BOOST", desc: "Overdrive carga más rápido y dura más.", rareza: "raro", maxNivel: 2, tags: ["overdrive"],            peso: 7 },

// Incompatibilidades declaradas y vacías a propósito: en la primera
// versión CUALQUIER par puede convivir -hace falta que puedan, para
// que 6H (evoluciones) tenga con qué fundir-. El campo se deja puesto
// para cuando el balance de una fase futura pida lo contrario.
for (const k in UPGRADES) UPGRADES[k].incompatibles = UPGRADES[k].incompatibles || [];

let upgradesJugador = {};      // id -> nivel actual
let upgradesOfrecidos = null;  // { opciones: [id,id,id] } mientras hay tarjetas en pantalla
let upgradesElegidos = 0;      // cuántas veces ha elegido YA esta partida
// Hitos por muertes acumuladas: el primero cae pronto a propósito -el
// encargo es explícito, una partida cuyo primer upgrade llega a los 4
// minutos ha fallado- y el resto reparte 2-4 elecciones en una misión
// larga sin convertirlo en una cada 20s.
const UPGRADE_HITOS = [8, 24, 45, 70];

function upgradesDisponibles() {
  return Object.keys(UPGRADES).filter(id => (upgradesJugador[id] || 0) < UPGRADES[id].maxNivel);
}

  const pool = upgradesDisponibles().map(id => ({ id, peso: UPGRADES[id].peso }));
  const elegidos = [];
  while (elegidos.length < 3 && pool.length) {
    const total = pool.reduce((a, o) => a + o.peso, 0);
    let r = Math.random() * total, idx = 0;
    for (; idx < pool.length; idx++) { r -= pool[idx].peso; if (r <= 0) break; }
    elegidos.push(pool[idx].id);

}

  if (upgradesElegidos >= UPGRADE_HITOS.length) return;
  if (enemiesKilled < UPGRADE_HITOS[upgradesElegidos]) return;

  sfx("aviso", { tono: 1.2 });
  RHYTHM.marcar();
}

  upgradesElegidos++;
  upgradesOfrecidos = null;
  const d = UPGRADES[id];
  texto(player.x, player.y - 50, d.nombre + " ×" + upgradesJugador[id], "#7df9ff", 15, { prioridad: 2 });
  sfx("mejora"); flash = Math.max(flash, 0.18);
  // Si esta elección completa una pareja de nivel II declarada en
  // EVOLUCIONES, se funde en un arma nueva aquí mismo.

}
const RAREZA_COLOR = { comun: "#7df9ff", raro: "#ffd700" };
function dibujarUpgrades() {
  if (!upgradesOfrecidos) return;
  botones.length = 0;
  ctx.fillStyle = "rgba(3,4,10,0.88)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 " + Math.round(clamp(W * 0.055, 18, 24)) + "px " + F;
  ctx.fillStyle = "#ff2fbd";
  letras("UPGRADE READY", W / 2, SAFE_TOP + 70, 2.4, "center");

  const opciones = upgradesOfrecidos.opciones;
  const anchoP = Math.min(W - 48, 340);
  const cH = 108, sep = 16;
  const totalH = opciones.length * cH + (opciones.length - 1) * sep;
  let y0 = Math.max(SAFE_TOP + 110, (H - totalH) / 2);
  const x0 = (W - anchoP) / 2;
  for (const id of opciones) {
    const d = UPGRADES[id];
    const col = RAREZA_COLOR[d.rareza] || "#fff";
    panel(x0, y0, anchoP, cH, 16, 0.82);
    filo(x0, y0, anchoP, cH, 16, col, 0.55);
    ctx.textAlign = "left";
    ctx.font = "800 14px " + F; ctx.fillStyle = col;

    ctx.font = "700 12px " + F; ctx.fillStyle = "#fff"; ctx.globalAlpha = 0.85;
    letras(d.desc, x0 + 20, y0 + 78, 0.4);
    ctx.globalAlpha = 1;
    botones.push({ x: x0, y: y0, w: anchoP, h: cH, fn: () => elegirUpgrade(id) });

// ════════════════════════════════════════════════════════════
//  EVOLUTIONS / SYNERGIES
// ════════════════════════════════════════════════════════════
//  Fundir DOS upgrades de nivel II en un arma nueva. 4 -dentro de las

//  propósito -ya se combina con TODO por su cuenta vía la barra- en
//  vez de forzar un quinto par que no aportara nada nuevo.
//
//  El efecto de cada una es un timer propio que reutiliza funciones
//  que YA EXISTÍAN -danioArea(), cadenaElectrica()/rayos, el propio
//  MISSILE SWARM, el propio SHIELD REACTOR- para que "fundirse" se
//  note MÁS fuerte, no distinto de cero. Ninguna borra un jefe sola:
//  todas están calibradas para pesar menos que un jugador que apunta.
const EVOLUCIONES = [
  { id: "supernova_cannon", nombre: "SUPERNOVA CANNON", requiere: ["triple_shot", "plasma_burst"],

}
let evoNovaT = 0, evoRayoT = 0, evoPulsoT = 0;

    evoNovaT += dt;
    if (evoNovaT >= 2.5) {

      // -encontrado con una prueba, no a ojo-.
