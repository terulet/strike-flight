<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PLAYZONE MAX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0410">
<title>PLAYZONE MAX</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    min-height:100%; background:#0a0410; color:#fff;
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior-y:none;
  }
  body {
    min-height:100vh; min-height:100dvh;
    padding:calc(20px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));
    background:
      radial-gradient(1000px 560px at 50% -10%, #5a1030 0%, transparent 60%),
      radial-gradient(720px 500px at 92% 100%, #3a1a00 0%, transparent 58%),
      #0a0410;
  }
  .marco { max-width:1000px; margin:0 auto; }

  .volver {
    display:inline-block; text-decoration:none; padding:9px 15px 9px 12px;
    border-radius:999px; border:1px solid rgba(255,255,255,.15);
    font-size:11.5px; font-weight:700; letter-spacing:.14em; color:#cbd0f0;
    background:rgba(255,255,255,.045);
  }
  .volver:active { transform:scale(.96); }

  h1 {
    margin-top:26px;
    font-size:clamp(29px, 8.4vw, 76px); font-weight:900; letter-spacing:.01em;
    line-height:1.05; text-align:center; white-space:nowrap;
    background:linear-gradient(100deg, #ff2ea6 0%, #ffd166 52%, #00f5ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 28px rgba(255,46,166,.4));
  }
  .lema {
    text-align:center; margin-top:10px; font-size:13px; font-weight:600;
    letter-spacing:.2em; text-transform:uppercase; color:#a08fb4;
  }

  h2 {
    margin:42px 0 16px; font-size:12px; font-weight:700;
    letter-spacing:.24em; text-transform:uppercase; color:#a3819c;
    display:flex; align-items:center; gap:14px;
  }
  h2::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, #55284a, transparent); }

  .lista { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }

  .carta {
    display:flex; flex-direction:column; gap:10px;
    text-decoration:none; color:inherit;
    border-radius:22px; padding:24px 22px; min-height:210px;
    background:linear-gradient(158deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.12);
    position:relative; overflow:hidden;
    transition:transform .12s ease;
  }
  .carta::before {
    content:""; position:absolute; inset:-45% -25% auto -25%; height:190px;
    background:radial-gradient(closest-side, var(--tinte), transparent 70%);
    opacity:.34; pointer-events:none;
  }
  .carta:active { transform:scale(.98); }
  .carta .icono { font-size:38px; line-height:1; color:var(--tinte); }
  .carta .nombre { font-size:23px; font-weight:900; letter-spacing:.03em; }
  .carta .desc { font-size:13.5px; line-height:1.5; color:#c0b9d6; }
  .carta .rasgos {
    margin-top:auto; display:flex; flex-wrap:wrap; gap:7px; padding-top:12px;
  }
  .carta .rasgos span {
    font-size:10.5px; font-weight:700; letter-spacing:.1em;
    padding:5px 10px; border-radius:999px;
    background:rgba(255,255,255,.075); border:1px solid rgba(255,255,255,.1);
    color:#ded8ef;
  }

  .carta.pronto {
    background:none; border-style:dashed; border-color:rgba(255,255,255,.14);
    opacity:.42; cursor:default; justify-content:flex-end;
  }
  .carta.pronto::before { display:none; }
  .carta.pronto .etiqueta { font-size:10px; font-weight:800; letter-spacing:.18em; color:#a3819c; }

  footer { margin-top:40px; text-align:center; font-size:11.5px; line-height:1.7; color:#6d5f7d; }

  @media (prefers-reduced-motion: no-preference) {
    .carta { animation:entra .34s ease both; }
    @keyframes entra { from { opacity:0; transform:translateY(10px); } }
  }
</style>
</head>
<body>
<div class="marco">
  <a class="volver" href="../index.html">‹ &nbsp;PLAYZONE</a>

  <h1>PLAYZONE MAX</h1>
  <p class="lema">Los juegos grandes</p>

  <h2>Catálogo</h2>
  <div class="lista" id="lista"></div>

  <footer>
    Partidas largas, con mundos, progresión y jefes.<br>
    Los juegos de partida corta están en PLAYZONE.
  </footer>
</div>

<script>
"use strict";

// ════════════════════════════════════════════════════════════
//  LOS JUEGOS GRANDES
//  Aquí solo los juegos con recorrido: mundos, niveles, jefes.
//  Los cortos van en la portada de PLAYZONE, un nivel más arriba.
//
//    ruta   → siempre terminando en index.html, que si no
//             no funciona al abrir con doble clic
//    listo  → false lo deja en gris como "EN OBRAS"
// ════════════════════════════════════════════════════════════
const JUEGOS = [
  { nombre:"001 · STRIKE FLIGHT", icono:"✦", color:"#5ce1ff", listo:true,
    desc:"Matamarcianos vertical. Se arrastra el dedo y dispara sola.",
    rasgos:["4 MUNDOS", "6 ARMAS", "NAVES PROPIAS"],
    ruta:"001-flight-strike/index.html" },

  // El hueco del siguiente. Cámbialo o bórralo.
  { nombre:"", icono:"", color:"#ffd166", listo:false, desc:"", rasgos:[], ruta:"" },
];

// ════════════════════════════════════════════════════════════
//  A partir de aquí es la maquinaria.
// ════════════════════════════════════════════════════════════

const lista = document.getElementById("lista");

JUEGOS.forEach((j, i) => {
  const carta = document.createElement(j.listo ? "a" : "div");
  carta.className = "carta" + (j.listo ? "" : " pronto");
  carta.style.setProperty("--tinte", j.color || "#ff2ea6");
  carta.style.animationDelay = (i * 45) + "ms";

  if (j.listo) {
    carta.href = j.ruta;
    carta.innerHTML =
      '<div class="icono"></div>' +
      '<div class="nombre"></div>' +
      '<div class="desc"></div>' +
      '<div class="rasgos"></div>';
    carta.querySelector(".icono").textContent  = j.icono;
    carta.querySelector(".nombre").textContent = j.nombre;
    carta.querySelector(".desc").textContent   = j.desc;
    const cajaRasgos = carta.querySelector(".rasgos");
    (j.rasgos || []).forEach(r => {
      const s = document.createElement("span");
      s.textContent = r;
      cajaRasgos.appendChild(s);
    });
  } else {
    carta.innerHTML = '<div class="etiqueta">EN OBRAS</div>';
  }

  lista.appendChild(carta);
});
</script>
</body>
</html>
