<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Esquiva">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04070f">
<title>ESQUIVA — PLAYZONE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#04070f;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  body { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }
  #volver {
    position:absolute; z-index:2;
    top:calc(12px + env(safe-area-inset-top)); left:calc(12px + env(safe-area-inset-left));
    padding:9px 15px 9px 12px; border-radius:999px;
    border:1px solid rgba(255,255,255,.16); background:rgba(8,12,26,.6);
    color:#cbd0f0; text-decoration:none;
    font:700 11.5px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing:.14em;
  }
  #volver:active { transform:scale(.96); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="volver" href="../../index.html">‹ &nbsp;PLAYZONE</a>
<script>
"use strict";

// ════════════════════════════════════════════════════════════
//  AJUSTES — cambia los números, guarda y recarga.
// ════════════════════════════════════════════════════════════
const CONFIG = {
  velocidadInicial: 275,    // px por segundo a los que bajan los muros
  aceleracion:      8,      // cuánto acelera por cada segundo jugado
  velocidadMaxima:  660,
  separacion:       250,    // px de distancia entre un muro y el siguiente
  huecoInicial:     0.34,   // ancho del hueco, en proporción de la pantalla
  huecoMinimo:      0.16,   // por debajo de esto ya no se cierra más
  encogeHueco:      0.0055, // cuánto se cierra el hueco cada segundo
  grosorMuro:       26,
  radioJugador:     15,
  pegada:           17,     // qué pegado va el punto al dedo
  probPremio:       0.45,   // cada cuánto sale una chispa (0 a 1)
  puntosPremio:     5,
  sonido:           true,
};

// Los colores. Cambiarlos aquí lo cambia todo.
const COLOR = {
  fondoA:   "#04070f",
  fondoB:   "#0d1030",
  rejilla:  "#1b2a63",
  jugador:  "#00f5ff",
  estela:   "#00f5ff",
  muro:     "#ff2ea6",
  muroBorde:"#ffa8dc",
  premio:   "#ffe066",
  texto:    "#ffffff",
};

// ════════════════════════════════════════════════════════════
//  A partir de aquí es la maquinaria.
// ════════════════════════════════════════════════════════════

const c = document.getElementById("c");
const ctx = c.getContext("2d");
const botonVolver = document.getElementById("volver");
const F = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
let W = 0, H = 0;

// El iPad tapa la franja de arriba con la barra de estado. Esto la mide,
// para que el marcador no quede debajo.
const medidor = document.createElement("div");
medidor.style.cssText = "position:absolute;top:0;left:0;width:0;height:0;"
                      + "padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none";
document.body.appendChild(medidor);
function margenArriba() { return parseFloat(getComputedStyle(medidor).paddingTop) || 0; }

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  c.style.width = W + "px"; c.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ── Sonido, sintetizado: cero archivos ────────────────────
let audio = null;
function despertarAudio() {
  if (!CONFIG.sonido || audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) audio = new AC();
}
function tono(f1, f2, dur, tipo, vol) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f1, audio.currentTime);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, audio.currentTime + dur);
  g.gain.setValueAtTime(vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur);
}
function ruido(dur, vol) {
  if (!audio) return;
  const n = Math.floor(audio.sampleRate * dur);
  const buf = audio.createBuffer(1, n, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = audio.createBufferSource(), g = audio.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(audio.destination); s.start();
}
const sonPasa   = () => tono(620, 880, 0.07, "square",   0.05);
const sonPremio = () => tono(980, 1560, 0.13, "triangle", 0.09);
const sonChoque = () => { ruido(0.4, 0.22); tono(180, 40, 0.45, "sawtooth", 0.16); };

// ── Récord ────────────────────────────────────────────────
const CLAVE = "pz_esquiva_record";
function leerRecord() {
  try { return Number(localStorage.getItem(CLAVE) || 0); } catch (_) { return 0; }
}
function guardarRecord(v) {
  try { localStorage.setItem(CLAVE, String(v)); } catch (_) {}
}

// ── Estado ────────────────────────────────────────────────
let estado = "menu";           // menu · juega · fin
let muros, chispas, estela, jugadorX, destinoX, transcurrido;
let puntos, record = leerRecord(), sacudida, destello, finAt;

function empezar() {
  muros = []; chispas = []; estela = [];
  jugadorX = destinoX = W / 2;
  transcurrido = 0; puntos = 0; sacudida = 0; destello = 0;
  nuevoMuro(-60);
  estado = "juega";
  botonVolver.style.display = "none";
}

function jugadorY() { return H * 0.76; }
function velocidad() {
  return Math.min(CONFIG.velocidadMaxima,
                  CONFIG.velocidadInicial + transcurrido * CONFIG.aceleracion);
}
function anchoHueco() {
  return Math.max(CONFIG.huecoMinimo,
                  CONFIG.huecoInicial - transcurrido * CONFIG.encogeHueco) * W;
}

function nuevoMuro(y) {
  const hueco = anchoHueco();
  const margen = hueco / 2 + 14;
  const centro = margen + Math.random() * Math.max(1, W - margen * 2);
  const m = { y, centro, hueco, pasado: false, premio: null };
  if (Math.random() < CONFIG.probPremio) {
    const lado = Math.random() < 0.5 ? -1 : 1;
    m.premio = { x: centro + lado * hueco * 0.28, dy: 84, cogido: false };
  }
  muros.push(m);
}

function particulas(x, y, n, color, fuerza) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * fuerza;
    chispas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   vida: 0.4 + Math.random() * 0.5, t: 0, color });
  }
}

function morir() {
  estado = "fin"; finAt = 0;
  sacudida = 0.55; destello = 0.5;
  particulas(jugadorX, jugadorY(), 46, COLOR.jugador, 330);
  sonChoque();
  if (puntos > record) { record = puntos; guardarRecord(record); }
  botonVolver.style.display = "";
}

// ── Control: se arrastra el dedo por donde sea ────────────
function pos(e) {
  const t = e.touches ? e.touches[0] : e;
  return t.clientX;
}
function abajo(e) {
  e.preventDefault();
  despertarAudio();
  if (estado === "menu") { empezar(); destinoX = pos(e); return; }
  if (estado === "fin") { if (finAt > 0.45) empezar(); return; }
  destinoX = pos(e);
}
function mueve(e) {
  if (estado !== "juega") return;
  e.preventDefault();
  destinoX = pos(e);
}
c.addEventListener("pointerdown", abajo, { passive: false });
c.addEventListener("pointermove", mueve, { passive: false });

// ── Actualizar ────────────────────────────────────────────
function actualizar(dt) {
  if (sacudida > 0) sacudida = Math.max(0, sacudida - dt * 1.6);
  if (destello > 0) destello = Math.max(0, destello - dt * 2.2);
  for (let i = chispas.length - 1; i >= 0; i--) {
    const p = chispas[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt;
    if (p.t >= p.vida) chispas.splice(i, 1);
  }
  if (estado === "fin") { finAt += dt; return; }
  if (estado !== "juega") return;

  transcurrido += dt;

  const py = jugadorY();
  const r = CONFIG.radioJugador;
  jugadorX += (Math.max(r, Math.min(W - r, destinoX)) - jugadorX) * Math.min(1, CONFIG.pegada * dt);

  estela.unshift(jugadorX);
  if (estela.length > 16) estela.pop();

  const v = velocidad();
  const ultimo = muros[muros.length - 1];
  if (!ultimo || ultimo.y > CONFIG.separacion) nuevoMuro(ultimo ? ultimo.y - CONFIG.separacion : -40);

  for (let i = muros.length - 1; i >= 0; i--) {
    const m = muros[i];
    m.y += v * dt;

    const izq = m.centro - m.hueco / 2, der = m.centro + m.hueco / 2;
    const zonaImpacto = r * 0.7;

    // El muro y el jugador se solapan en vertical
    if (py + zonaImpacto > m.y && py - zonaImpacto < m.y + CONFIG.grosorMuro) {
      if (jugadorX - zonaImpacto < izq || jugadorX + zonaImpacto > der) { morir(); return; }
    }

    if (m.premio && !m.premio.cogido) {
      const px = m.premio.x, ppy = m.y + m.premio.dy;
      if (Math.hypot(px - jugadorX, ppy - py) < r + 11) {
        m.premio.cogido = true;
        puntos += CONFIG.puntosPremio;
        particulas(px, ppy, 12, COLOR.premio, 170);
        sonPremio();
      }
    }

    if (!m.pasado && m.y > py + zonaImpacto) {
      m.pasado = true; puntos += 1; sonPasa();
    }
    if (m.y > H + 60) muros.splice(i, 1);
  }
}

// ── Dibujar ───────────────────────────────────────────────
function fondo() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, COLOR.fondoA); g.addColorStop(1, COLOR.fondoB);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = COLOR.rejilla; ctx.lineWidth = 1; ctx.globalAlpha = 0.55;
  const paso = 64, desfase = (transcurrido || 0) * (estado === "juega" ? velocidad() : 60) % paso;
  ctx.beginPath();
  for (let y = -paso + desfase; y < H; y += paso) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  for (let x = 0; x <= W; x += paso) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function dibujarMuros() {
  muros.forEach(m => {
    const izq = m.centro - m.hueco / 2, der = m.centro + m.hueco / 2;
    ctx.fillStyle = COLOR.muro;
    ctx.shadowColor = COLOR.muro; ctx.shadowBlur = 18;
    ctx.fillRect(0, m.y, izq, CONFIG.grosorMuro);
    ctx.fillRect(der, m.y, W - der, CONFIG.grosorMuro);
    ctx.shadowBlur = 0;
    ctx.fillStyle = COLOR.muroBorde;
    ctx.fillRect(izq - 4, m.y, 4, CONFIG.grosorMuro);
    ctx.fillRect(der, m.y, 4, CONFIG.grosorMuro);

    if (m.premio && !m.premio.cogido) {
      const px = m.premio.x, py = m.y + m.premio.dy;
      const pulso = 8 + Math.sin(m.y * 0.06) * 2;
      ctx.fillStyle = COLOR.premio;
      ctx.shadowColor = COLOR.premio; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(px, py, pulso, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  });
}

function dibujarJugador() {
  const py = jugadorY(), r = CONFIG.radioJugador;
  for (let i = estela.length - 1; i > 0; i--) {
    ctx.globalAlpha = (1 - i / estela.length) * 0.32;
    ctx.fillStyle = COLOR.estela;
    ctx.beginPath(); ctx.arc(estela[i], py + i * 2.2, r * (1 - i / estela.length) * 0.9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = COLOR.jugador;
  ctx.shadowColor = COLOR.jugador; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(jugadorX, py, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(jugadorX, py, r * 0.42, 0, Math.PI * 2); ctx.fill();
}

function dibujarChispas() {
  chispas.forEach(p => {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.vida);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  });
  ctx.globalAlpha = 1;
}

function textoCentrado(txt, y, tam, peso, alfa) {
  ctx.globalAlpha = alfa === undefined ? 1 : alfa;
  ctx.fillStyle = COLOR.texto;
  ctx.font = peso + " " + tam + "px " + F;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(txt, W / 2, y);
  ctx.globalAlpha = 1;
}

function hud() {
  const y0 = margenArriba();
  textoCentrado(String(puntos), y0 + 46, Math.min(52, W * 0.13), "900");
  if (record > 0) textoCentrado("RÉCORD  " + record, y0 + 86, 12, "700", 0.42);
}

function pantallaMenu() {
  textoCentrado("ESQUIVA", H * 0.36, Math.min(56, W * 0.15), "900");
  textoCentrado("Cruza los muros por el hueco.", H * 0.36 + 46, 15, "600", 0.7);
  textoCentrado("Un roce y se acabó.", H * 0.36 + 70, 15, "600", 0.7);
  if (record > 0) textoCentrado("RÉCORD  " + record, H * 0.36 + 112, 13, "700", 0.45);
  const pulso = 0.55 + Math.sin(Date.now() / 320) * 0.25;
  textoCentrado("TOCA PARA EMPEZAR", H * 0.62, 15, "800", pulso);
}

function pantallaFin() {
  ctx.fillStyle = "rgba(4,7,15,.72)"; ctx.fillRect(0, 0, W, H);
  textoCentrado(puntos === record && puntos > 0 ? "¡RÉCORD!" : "CHOCASTE", H * 0.38, Math.min(40, W * 0.11), "900");
  textoCentrado(String(puntos), H * 0.38 + 62, Math.min(64, W * 0.17), "900");
  textoCentrado("RÉCORD  " + record, H * 0.38 + 108, 13, "700", 0.5);
  if (finAt > 0.45) {
    const pulso = 0.55 + Math.sin(Date.now() / 320) * 0.25;
    textoCentrado("TOCA PARA OTRA", H * 0.66, 15, "800", pulso);
  }
}

function dibujar() {
  ctx.save();
  if (sacudida > 0) {
    const m = sacudida * 16;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }
  fondo();
  if (estado !== "menu") { dibujarMuros(); }
  if (estado === "juega") dibujarJugador();
  dibujarChispas();
  ctx.restore();

  if (destello > 0) {
    ctx.fillStyle = "rgba(255,255,255," + (destello * 0.5) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (estado === "menu") pantallaMenu();
  else if (estado === "juega") hud();
  else pantallaFin();
}

// ── Bucle ─────────────────────────────────────────────────
muros = []; chispas = []; estela = [];
jugadorX = destinoX = W / 2; transcurrido = 0; puntos = 0; sacudida = 0; destello = 0;

let anterior = performance.now();
function bucle(ahora) {
  const dt = Math.min(0.033, (ahora - anterior) / 1000);
  anterior = ahora;
  actualizar(dt);
  dibujar();
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);
</script>
</body>
</html>
